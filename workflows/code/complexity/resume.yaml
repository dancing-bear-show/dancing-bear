name: complexity-reduce-resume
version: "1.0"
description: >
  Reduce qlty file-complexity for the 7 flagged files in
  src/resume/ (total complexity 587).

  GENERATED by workflows/code/complexity-fanout-generate.yaml on 2026-08-06.
  Edit targets/resume.json rather than this wrapper; regenerating overwrites both.

  Targets:
    | src/resume/keyword_match.py | 94 | reduce-in-place |
    | src/resume/parsing_experience_docx.py | 92 | reduce-in-place |
    | src/resume/docx_sidebar_sections.py | 84 | reduce-in-place |
    | src/resume/docx_sections_skills.py | 83 | reduce-in-place |
    | src/resume/cli/main.py | 82 | reduce-in-place |
    | src/resume/parsing_experience_text.py | 82 | reduce-in-place |
    | src/resume/docx_renderers.py | 70 | reduce-in-place |

  Strategy rationale: qlty file-complexity is the SUM of per-function
  complexity, so splitting redistributes rather than reduces it. Default is
  reduce-in-place; see the fragment for technique order.

metadata:
  author: dancing-bear
  created: "2026-08-06"
  generated_by: complexity-fanout-generate

trigger:
  source: manual
  params:
    group: "resume"
    targets_file: "workflows/code/complexity/targets/resume.json"
    complexity_floor: "50"

workspace_dir: "{work_dir}/complexity-reduce-resume"

stages:
  - name: load-targets
    kind: gather
    depends_on: []
    description: >
      Read {targets_file} and confirm every listed path still exists and still
      carries the recorded complexity score.

      Read the floor from the targets file's own "complexity_floor" field, NOT
      from the {complexity_floor} trigger param — the targets file is the
      single source of truth for the plan that was approved.

      For each entry, verify the path exists. Rescore it with:
        ./bin/qlty-assistant scan --smells-only --rule file-complexity \
          --format csv <path>

      The CSV has a header row plus one row per finding; the "value" column is
      the file-complexity score and "file" is the path.

      Use the EXIT CODE, not the row count, to tell failure from success:
        exit 0, a score row     — file still flagged; compare to the floor
        exit 0, header row only — no finding; the file is genuinely cleared
        nonzero exit            — the scan itself failed; this is an ERROR
      A header-only CSV at exit 0 is a real result, NOT a tool failure. The
      old JSON pipeline could not tell these apart; this one can, so do not
      classify an empty result as ERROR.

      Classify each entry into exactly one of three outcomes:
        keep  — file exists and scores at or above the floor
        drop  — file is gone, scores below the floor, or is no longer
                flagged at all (header-only CSV at exit 0)
        ERROR — the scan exited nonzero, or returned unparseable output
      An ERROR is NOT a drop. Record ERROR entries with their stderr text,
      keep them in the file list, and flag them.

      Write {workspace}/outputs/targets.json with the surviving file list,
      each entry keeping path, complexity (rescored), line_count,
      top_level_symbols, strategy, justification, proposed_siblings, plus
      "rescore_status" and "rescore_error". Include top-level
      "complexity_floor", "dropped", and "errors".
    agent:
      role: researcher
      model: sonnet
      tools: [Bash, Read, Write]
      access: read-only
    validates_output:
      - path: outputs/targets.json
        checks: [is_json, is_dict, has_key:files]
    required: true
    writes_to:
      - outputs/targets.json

include:
  - path: workflows/shared/complexity-reduce.yaml
    prefix: cx
    depends_on: [load-targets]
    reads_from: [load-targets]
