name: decompose-sweep
version: "1.0"
description: >
  Sweep the codebase for oversized Python source files, group them by domain,
  fan out parallel code-writer agents to split each into smaller focused modules
  with backward-compatible re-exports, verify tests pass, validate no broken
  imports, apply corrections if needed, recheck, then present a human gate.

  Never touches bin/* public entry points or renames existing public CLI-facing
  modules. Only splits large files into siblings within the same domain directory.
  Original files become thin re-export layers so external imports never break.

  Seeds a telemetry record at {workspace}/telemetry/run-metrics.json for a
  future calibration pass.

  Stage dependency graph:

    discover-candidates
          |
    plan-splits  [human gate]
          |
    decompose-domains × N  (parallel fan-out per domain group)
          |
    verify-tests
          |
    validate-imports
          |
    apply-corrections (optional)
          |
    recheck
          |
    human-gate

metadata:
  author: dancing-bear
  created: "2026-07-28"

trigger:
  source: manual
  params:
    source_threshold: "600"    # lines — source files at or above this are candidates
    test_threshold: "500"      # lines — test files at or above this are candidates
    domains: "*"               # comma-list of domains to include, or "*" for all
    pr_title: "refactor: decompose oversized Python modules into focused siblings"

workspace_dir: "{work_dir}/decompose-sweep"

stages:

  # ===========================================================================
  # G0: Discover candidate files — read-only scan of the codebase
  # ===========================================================================

  - name: discover-candidates
    kind: gather
    depends_on: []
    description: >
      Scan the codebase for Python source files at or above the configured
      line thresholds. Group results by domain.

      Step 1 — identify domain directories.
        The relevant source domains are:
          mail  calendars  schedule  resume  phone  whatsapp  desk
          maker  charts  diagrams  workflow  core  wifi
          apple_music  telemetry  worker
        Never include bin/ — those are public entry-point wrappers.
        If {domains} is not "*", restrict to the comma-separated list provided.

      Step 2 — find oversized source files.
        For each domain directory <d>/:
          find <d> -name "*.py" -not -path "*/__pycache__/*"
          For each .py file, count lines: wc -l <file>
          Collect files where line_count >= {source_threshold}.

      Step 3 — find oversized test files.
        For each domain <d>, test files live under tests/<d>_tests/ or
        tests/<d>/ (both may exist; check with ls).
        Also check tests/test_<d>*.py flat files at the top level.
          find tests/ -name "*.py" -not -path "*/__pycache__/*"
          For each .py file, count lines: wc -l <file>
          Collect files where line_count >= {test_threshold}.

      Step 4 — gather per-file responsibility hints.
        For each candidate source file, run:
          grep -n "^class \|^def " <file> | head -40
        Record the first 40 top-level class/function names to help plan-splits
        identify responsibility clusters.

      Step 5 — write {workspace}/analysis/candidates.json:
        {
          "source_threshold": {source_threshold},
          "test_threshold": {test_threshold},
          "scanned_at": "<ISO-8601 timestamp>",
          "source_candidates": [
            {
              "path": "mail/cli/main.py",
              "domain": "mail",
              "line_count": 1041,
              "top_level_symbols": ["class MailCLI", "def build_parser", ...]
            }
          ],
          "test_candidates": [
            {
              "path": "tests/metals_tests/costs/test_metals_gmail_costs.py",
              "domain": "metals",
              "line_count": 1084
            }
          ],
          "total_lines_over_threshold": <sum of (line_count - threshold) for all candidates>
        }

      If no candidates are found: write candidates.json with empty lists and a
      note "no files exceed thresholds — nothing to decompose".
    agent:
      role: researcher
      model: sonnet
      tools: [Bash, Read, Write]
      access: read-only
    outputs:
      - name: candidates
        mode: generate
        description: >
          candidates.json written to {workspace}/analysis/ with source_candidates
          and test_candidates arrays plus summary counts.
    required: true
    writes_to:
      - analysis/candidates.json

  # ===========================================================================
  # G1: Plan splits — decide strategy per file, group by domain, risk-assess
  # ===========================================================================

  - name: plan-splits
    kind: propose
    depends_on: [discover-candidates]
    reads_from: [discover-candidates]
    description: >
      Read analysis/candidates.json. For each candidate file decide a split
      strategy, group candidates into domain batches, and write the execution
      plan plus a telemetry seed. Present the plan for human approval before
      any files are modified.

      Split strategies (apply the first that fits):

        extract-submodules
          — 3+ distinguishable responsibility clusters visible in top-level
            symbols (e.g. a CLI file with separate data, formatting, and
            dispatch logic). Extract each cluster to a sibling module.
            Original file becomes a thin re-export layer.

        extract-package
          — File is large enough that extract-submodules would produce 4+
            siblings, OR the module is already referenced as a package
            boundary in other imports. Convert the file into a package
            directory: create <module>/__init__.py with re-exports and
            move split modules inside.

        split-tests-by-class
          — Test file: each TestCase class goes to its own file. Shared
            setUp / fixtures move to <domain>_tests/shared_fixtures.py
            (or are added to tests/fixtures.py if they are truly global).
            This repo uses unittest, not pytest — do not use conftest.py
            naming; shared_fixtures.py is imported explicitly, not
            auto-discovered.

        extract-helpers
          — Test file: large factories, fixtures, or setUp helpers that are
            not test methods. Extract to <domain>_tests/helpers.py.
            Keep test methods in the original file.

        DEFER
          — Cannot cleanly split now. Valid reasons:
              - Single monolithic function > 200-300 lines that requires
                complexity reduction before splitting is meaningful.
              - Tight coupling through shared mutable state across functions
                that would require broad refactoring to untangle.
              - File is a generated artifact (e.g. migration, auto-gen).
            Record the reason; do not attempt the split.

      Backward-compat rule (always applies):
        The original file must remain as a thin re-export shim:
          from .submodule import X, Y  # noqa: F401
        Never rename classes or functions — only move them.
        Do not split so granularly that modules become trivially small
        (< ~100 lines after splitting is a warning sign).

      Domain grouping:
        Collect all non-DEFER files into domain buckets. Each bucket becomes
        one fan-out slot for decompose-domains. Files in the same domain are
        handled by the same agent to avoid import conflicts.

      Write {workspace}/design/plan.md:

        ## Decompose Sweep Plan
        Candidates: <total source> source files, <total test> test files

        ### Files to Split
        | File | Domain | Lines | Strategy | Proposed Siblings |
        |------|--------|-------|----------|-------------------|
        | mail/cli/main.py | mail | 1041 | extract-submodules | cli_dispatch.py, cli_format.py |
        ...

        ### Deferred Files
        | File | Lines | Reason |
        |------|-------|--------|

        ### Risk Notes
        Any files that touch public CLI surfaces, exported module names, or
        are imported from many call sites — flag these for extra import
        validation attention.

      Write {workspace}/design/domain-groups.json:
        {
          "items": [
            {
              "domain": "mail",
              "files": [
                {
                  "path": "mail/cli/main.py",
                  "line_count": 1041,
                  "strategy": "extract-submodules",
                  "proposed_siblings": ["mail/cli/dispatch.py", "mail/cli/formatting.py"],
                  "kind": "source"
                }
              ]
            },
            ...
          ]
        }
        The "items" key at the top level is required — it is the fan_out
        source for decompose-domains.

      Write {workspace}/telemetry/run-metrics.json (seed — fields completed
      by later stages):
        {
          "source_threshold": {source_threshold},
          "test_threshold": {test_threshold},
          "candidates_discovered": <total count>,
          "total_lines_over_threshold": <from candidates.json>,
          "by_domain": {
            "<domain>": {
              "candidates": N,
              "deferred": N
            }
          },
          "deferred": [
            { "path": "...", "reason": "..." }
          ],
          "splits_completed": null,
          "splits_failed": null,
          "avg_lines_before": null,
          "avg_lines_after": null,
          "start_time": "<ISO-8601 timestamp>",
          "end_time": null
        }

      Present the plan. Ask the user:
        A) Approve — proceed with decompose-domains fan-out
        B) Adjust — specify files to exclude or strategy overrides
        C) Abort — stop without modifying anything
    agent:
      role: doc-writer
      model: sonnet
      tools: [Read, Write]
      access: read-write
    human_gate: true
    required: true
    writes_to:
      - design/plan.md
      - design/domain-groups.json
      - telemetry/run-metrics.json

  # ===========================================================================
  # G2: Decompose domains — parallel fan-out, one code-writer per domain group
  # ===========================================================================

  - name: decompose-domains
    kind: execute
    depends_on: [plan-splits]
    reads_from: [plan-splits]
    description: >
      Fan out: spawn one code-writer agent per domain listed in
      {workspace}/design/domain-groups.json. All domain agents run in parallel.

      Each agent handles all files for its assigned {domain}.

      Step 1 — read the approved plan:
        Read {workspace}/design/plan.md for the domain's section.
        Read {workspace}/design/domain-groups.json for the file list and
        strategies for this domain.

      Step 2 — for each file in this domain's "files" list:

        a. Read the file in full.
        b. Identify the responsibility clusters that match the chosen strategy.

        For extract-submodules:
          - Create sibling files in the same directory as the original file.
          - Move each cluster's classes/functions to the appropriate sibling.
          - Rewrite the original file as a thin re-export shim:
              from .<sibling> import ClassName, function_name  # noqa: F401
            Do NOT rename anything. Do NOT change function signatures.
          - Preserve all module-level docstrings and __all__ declarations.

        For extract-package:
          - A directory and a file of the same name cannot coexist, so the
            original file must be removed as part of this conversion (this is
            the one strategy that does not keep the original filename as a
            sibling shim — parent-package imports are preserved instead).
          - Create package directory <module>/ (same name as the original
            file, minus .py) in place of the original file.
          - Move the original file's content into <module>/__init__.py,
            then split out submodules inside <module>/ per the proposed
            siblings.
          - Delete the original <module>.py file.
          - <module>/__init__.py re-exports every symbol the original file
            exposed: from .<sibling> import ClassName, function_name  # noqa: F401
            This makes `from <parent_package>.<module> import X` continue to
            resolve exactly as it did before, since <module> is now a package.

        For split-tests-by-class:
          - Create one test file per TestCase class in the same test directory
            (the domain's actual test directory — see Step 1 note below).
          - Move shared setUp / class-level fixtures to
            <test_dir>/shared_fixtures.py and import from there explicitly
            (this repo uses unittest, not pytest — no conftest.py autodiscovery).
          - Keep the original test file but replace its body with imports of
            all the split classes so `python3 -m unittest <original>` still works.

        For extract-helpers:
          - Extract non-test helper functions and fixtures to
            <test_dir>/helpers.py (the domain's actual test directory).
          - Add `from .helpers import *` at the top of the original test file.

        After splitting each file:
          c. Run a quick import smoke-check:
               python3 -c "import <module_path>" 2>&1
             (Derive module_path from the file path: replace / with . and
             strip .py. For nested packages prefix with the package name.)
             If the import fails, fix the re-export shim before moving on.

      Step 3 — write per-domain split summary to
        {workspace}/outputs/<domain>-splits.md:
          ## <domain> Splits
          | Original File | Strategy | Siblings Created | Import Check |
          |---------------|----------|-----------------|--------------|
          | mail/cli/main.py | extract-submodules | cli/dispatch.py, cli/formatting.py | PASS |
          ...
    agent:
      role: code-writer
      model: sonnet
      tools: [Read, Write, Edit, Bash]
      access: read-write
    required: true
    fan_out:
      source: plan-splits
      field: items
      key: domain
      mode: agent
    outputs:
      - name: domain_splits
        mode: generate
        description: >
          Per-domain split summary written to {workspace}/outputs/<domain>-splits.md.
          Contains the list of files split, siblings created, and import check status.
    writes_to:
      - outputs/{domain}-splits.md

  # ===========================================================================
  # G3: Verify tests — run test suite per touched domain, fix failures up to 3 cycles
  # ===========================================================================

  - name: verify-tests
    kind: validate
    depends_on: [decompose-domains]
    reads_from: [decompose-domains]
    description: >
      Run the test suite for every domain that was touched in decompose-domains
      and confirm all tests still pass after the splits.

      Step 1 — identify touched domains:
        Read all files matching {workspace}/outputs/*-splits.md.
        Extract domain names from filenames (e.g., mail-splits.md -> mail).

      Step 2 — per-domain test run:
        For each touched domain, determine the test directory (record it —
        later stages reuse this exact path, do not re-derive it differently):
          - Check if tests/<domain>_tests/ exists: ls tests/<domain>_tests/
          - If not, check tests/<domain>/
          - If neither, check for tests/test_<domain>*.py at the top level.
          - If no test directory or files found, skip and note "no tests for <domain>".

        Run per-domain discovery using the test directory found above
        (substitute the actual resolved path, e.g. tests/<domain>/ or the
        flat top-level file glob — do NOT assume tests/<domain>_tests/):
          python3 -m unittest discover -s <resolved_test_dir> -t . -p "test_*.py" -q 2>&1

        Fix failures up to 3 cycles per domain:
          - Import error: the re-export shim is missing an import or has a
            wrong path. Fix the shim, re-run.
          - AttributeError / NameError: a symbol was moved but not re-exported.
            Add it to the shim's import list.
          - Other failures: read the relevant source and test files to diagnose.
          - After each fix: re-run the per-domain test command.
          - If still failing after 3 fix cycles: mark domain as FAIL and
            document the blocker — do not abort other domains.

      Step 3 — run the full suite to catch cross-domain regressions:
        python3 -m unittest discover -q 2>&1 | tail -10

      Step 4 — write {workspace}/validation/test-results.md:
        | Domain | Test Dir | Tests Run | Status | Notes |
        |--------|----------|-----------|--------|-------|
        | mail | tests/mail_tests/ | 47 | PASS | |
        | phone | tests/phone_tests/ | 23 | FAIL | ImportError: cannot import DialerCLI |
        ...
        Full suite: PASS|FAIL
    agent:
      role: code-writer
      model: sonnet
      tools: [Read, Edit, Bash]
      access: read-write
    validation:
      strategy: deliverable
      criteria:
        - python3 -m unittest discover exits 0 (full suite)
        - All per-domain test runs pass or failures are documented with blockers
        - No new import errors introduced by splits
      max_revisions: 3
    required: true
    writes_to:
      - validation/test-results.md

  # ===========================================================================
  # G4: Validate imports — confirm all split modules importable, no broken imports
  # ===========================================================================

  - name: validate-imports
    kind: validate
    depends_on: [verify-tests]
    reads_from: [verify-tests, decompose-domains]
    description: >
      Confirm that every new sibling module and every rewritten re-export shim
      is importable, and that no existing importer of the original module is
      broken.

      Step 1 — collect all split artifacts:
        Read {workspace}/outputs/*-splits.md to enumerate every file that was
        created or modified.
        Also read {workspace}/design/domain-groups.json for the full list of
        original files and their proposed siblings.

      Step 2 — smoke-import each new module:
        For each new sibling file created:
          python3 -c "import <module_path>" 2>&1
        For each rewritten re-export shim, verify full export parity — do NOT
        rely on plan.md's top-level symbol list, since discover-candidates
        only captured the first 40 class/def names as a planning hint, not a
        complete export inventory:
          a. Get the complete pre-split symbol set from git history (the
             original file content before decompose-domains touched it):
               git show HEAD:<module_path> | grep -n "^class \|^def "
             This lists every top-level class/function, not just the first 40.
          b. Get the shim's actual exported symbols:
               python3 -c "import <module_path>; print([n for n in dir(<module_path>) if not n.startswith('_')])"
          c. Diff the two sets. Any pre-split symbol missing from the shim's
             dir() output is a broken export — fix the shim's import list.

      Step 2b — also verify __all__ if the original file declared one:
        If the pre-split file defined __all__, confirm the shim's __all__
        (or its transitively re-exported __all__) contains the same names.

      Step 3 — check downstream importers:
        For each original file that was split, grep the codebase for existing
        import statements:
          grep -rn "from <module_path> import\|import <module_path>" \
            --include="*.py" \
            --exclude-dir=.venv \
            --exclude-dir=.claude \
            --exclude-dir=personal_assistants.egg-info
        For each found importer: confirm it still resolves correctly by
        running:
          python3 -c "from <module_path> import <SymbolName>" 2>&1

      Step 4 — run qlty on all modified files:
        ~/.qlty/bin/qlty check <list of modified .py files>
        Note any new issues introduced by the splits.

      Step 5 — write {workspace}/validation/import-check.json:
        {
          "new_modules": [
            { "path": "mail/cli/dispatch.py", "importable": true, "issues": [] }
          ],
          "shims": [
            {
              "path": "mail/cli/main.py",
              "importable": true,
              "symbols_exported": ["MailCLI", "build_parser"],
              "symbols_expected": ["MailCLI", "build_parser"],
              "match": true
            }
          ],
          "downstream_importers": [
            {
              "importer": "bin/mail-assistant",
              "imports": "from mail.cli.main import MailCLI",
              "resolves": true
            }
          ],
          "qlty_issues": [],
          "overall": "PASS|ISSUES"
        }
    agent:
      role: unit-validator
      model: sonnet
      tools: [Bash, Read, Write]
      access: read-only
    validation:
      strategy: unit
      criteria:
        - All new sibling modules import without error
        - All re-export shims export the same symbol set as the original files
        - All downstream importers of original module paths still resolve
        - No critical qlty issues on modified files
      max_revisions: 1
    required: true
    writes_to:
      - validation/import-check.json

  # ===========================================================================
  # G5: Apply corrections — fix remaining test/import failures, update telemetry
  # ===========================================================================

  - name: apply-corrections
    kind: execute
    depends_on: [validate-imports]
    reads_from: [validate-imports, verify-tests]
    description: >
      Fix any remaining failures surfaced by validate-imports or verify-tests
      that were not already resolved. Then update the telemetry seed.

      Step 1 — check if corrections are needed:
        Read {workspace}/validation/import-check.json.
        Read {workspace}/validation/test-results.md.
        If import-check.json overall == "PASS" and test-results.md shows no
        FAIL domains: write "no corrections needed" to
        {workspace}/validation/corrections-applied.md and exit.

      Step 2 — fix import issues:
        For each entry in import-check.json where importable == false or
        match == false:
          - Read the shim file and the sibling it should re-export from.
          - Fix the import statement.
          - Re-run: python3 -c "import <module_path>" 2>&1
          - Confirm green before moving on.

      Step 3 — fix test failures:
        For each domain marked FAIL in test-results.md:
          - Read the failure output and the relevant source/test files.
          - Apply the minimal fix (usually a missing re-export or wrong import path).
          - Re-run using the "Test Dir" column recorded for this domain in
            test-results.md (do NOT assume tests/<domain>_tests/ — reuse the
            exact path verify-tests resolved, e.g. tests/<domain>/ or a flat
            top-level file glob):
              python3 -m unittest discover -s <test_dir_from_table> -t . -q 2>&1
          - Up to 2 additional fix cycles per domain.

      Step 4 — update telemetry:
        Read {workspace}/telemetry/run-metrics.json.
        Compute:
          splits_completed: count of domains with all files split and import checks passing
          splits_failed: count of domains still failing after corrections
          avg_lines_before: average line_count across all non-DEFER candidates
          avg_lines_after: average line_count of all created sibling files
          (compute avg_lines_after by running wc -l on each sibling created)
        Update end_time to current ISO-8601 timestamp.
        Write the updated telemetry back to {workspace}/telemetry/run-metrics.json.

      Step 5 — write {workspace}/validation/corrections-applied.md:
        ## Corrections Applied
        | Issue | File | Fix | Result |
        |-------|------|-----|--------|

        ## Telemetry Updated
        splits_completed: N  splits_failed: N
        avg_lines_before: N  avg_lines_after: N
    agent:
      role: code-writer
      model: sonnet
      tools: [Read, Edit, Bash, Write]
      access: read-write
    required: false
    outputs:
      - name: corrections
        mode: generate
        description: >
          Corrections applied (or "no corrections needed") written to
          {workspace}/validation/corrections-applied.md. Telemetry record
          updated at {workspace}/telemetry/run-metrics.json.
    writes_to:
      - validation/corrections-applied.md
      - telemetry/run-metrics.json

  # ===========================================================================
  # G6: Recheck — final lint + test green-light before human gate
  # ===========================================================================

  - name: recheck
    kind: validate
    depends_on: [apply-corrections]
    reads_from: [apply-corrections]
    description: >
      Run the full test suite and qlty lint on all modified files one final
      time. Escalate to code-writer-opus if either check is still failing.

      Step 1 — full test suite:
        python3 -m unittest discover -q 2>&1

        If exit != 0:
          Record failure output to {workspace}/validation/recheck-test-failure.txt.
          Attempt one targeted fix: read the failure output, identify the failing
          test, fix the underlying import or re-export issue.
          Re-run once. If still failing: set test_status "FAIL" and document
          the blocker. The human gate will decide whether to proceed.

      Step 2 — qlty lint on all files touched by decompose-domains:
        Enumerate modified files by reading {workspace}/outputs/*-splits.md
        for all sibling paths and original shim paths.
        ~/.qlty/bin/qlty check <space-separated list of .py files>

        If qlty reports critical issues: attempt auto-fix:
          ~/.qlty/bin/qlty check --fix <file>
        Re-run to confirm clean.

      Step 3 — write {workspace}/validation/recheck.json:
        {
          "test_exit": 0,
          "test_status": "PASS|FAIL",
          "qlty_exit": 0,
          "qlty_status": "PASS|ISSUES",
          "qlty_issues": [],
          "unresolved_failures": [],
          "ready_for_commit": true|false
        }
    agent:
      role: unit-validator
      model: sonnet
      tools: [Bash, Read, Write, Edit]
      access: read-write
    validation:
      strategy: unit
      criteria:
        - python3 -m unittest discover exits 0
        - qlty check exits 0 on all modified files
        - No unresolved import errors remain
      max_revisions: 1
    required: true
    writes_to:
      - validation/recheck.json

  # ===========================================================================
  # G7: Human gate — present results and ask to commit / open PR
  # ===========================================================================

  - name: human-gate
    kind: validate
    human_gate: true
    depends_on: [recheck]
    reads_from: [recheck, plan-splits, apply-corrections]
    description: >
      Present the full decompose-sweep results to the user and ask how to proceed.

      Read and display:
        {workspace}/design/plan.md                         — approved split plan
        {workspace}/validation/test-results.md             — per-domain test outcomes
        {workspace}/validation/import-check.json           — import validation
        {workspace}/validation/corrections-applied.md      — what was fixed
        {workspace}/validation/recheck.json                — final lint + test status
        {workspace}/telemetry/run-metrics.json             — run metrics

      Surface:
        - Domains split successfully vs. failed
        - Files deferred (with reasons from plan.md)
        - Test status: PASS / FAIL with blocker details
        - Lint status: PASS / ISSUES
        - Telemetry: splits_completed, avg_lines_before, avg_lines_after

      Ask the user:
        A) Commit and open PR — stage all modified files and run /open-pr
        B) Fix a specific failure — describe which domain/file needs attention
        C) Abandon — revert changes (the user must run git checkout manually)

      Write {workspace}/validation/human-gate-decision.md with the decision.
    agent:
      role: doc-writer
      model: sonnet
      tools: [Read, Write]
      access: read-only
    required: true
    writes_to:
      - validation/human-gate-decision.md
