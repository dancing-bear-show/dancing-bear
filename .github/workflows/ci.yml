name: ci
on:
  push:
  pull_request:

jobs:
  qlty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: qltysh/qlty-action/install@main
      - name: Run qlty check
        run: qlty check --no-progress

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install -U pip
          # [tui] pulls textual so the telemetry TUI modules are importable and
          # actually measured; without it they silently report 0% coverage.
          python -m pip install -e ".[tui]"
          python -m pip install coverage
      - name: Verify imports resolve to this checkout
        run: |
          python -c "import pathlib, sys, core; \
          src = pathlib.Path('src').resolve(); \
          got = pathlib.Path(core.__file__).resolve(); \
          sys.exit(0) if src in got.parents else (print(f'ERROR: core resolves to {got}, expected under {src}'), sys.exit(1))"
      - name: Verify every test directory is discoverable
        # `unittest discover` skips a directory with no __init__.py without
        # warning, so its tests silently never run here. A gitignored
        # __init__.py fails the same way: green locally, absent in CI.
        run: python bin/check_test_discovery.py
      - name: Run tests with coverage
        run: |
          coverage run -m unittest discover
          mkdir -p reports
          coverage lcov -o reports/lcov.info
      - name: Upload coverage to qlty
        uses: qltysh/qlty-action/coverage@main
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: reports/lcov.info
