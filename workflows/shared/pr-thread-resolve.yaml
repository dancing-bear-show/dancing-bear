# Shared workflow fragment — not runnable standalone.
# Include via:
#   include:
#     - path: workflows/shared/pr-thread-resolve.yaml
#       prefix: ""
#       depends_on: [verify-fixes]
#       reads_from: [verify-fixes, fetch-threads]
#
# Stage injected: {prefix}-resolve-threads  (bare when prefix is "")
#
# Caller must set trigger.params: pr_number
# Caller must provide {workspace}/outputs/resolve-plan.json — see Step 0.
#
# Output: {workspace}/outputs/resolution.json
#
# Why this fragment exists: replying to a review thread and resolving it were
# implemented twice, and the two copies disagreed on every safety property that
# matters. review-fix-threads.yaml checks for an existing reply before posting,
# orders reply-before-resolve, and verifies thread.isResolved because a failed
# GraphQL mutation still exits 0. review-and-fix.yaml did none of those: it
# resolved threads with no reply at all, and trusted the exit code. A thread
# resolved on an unverified fix costs a human far more than one left open, so
# the careful implementation is the one that survives here and callers include
# it rather than re-deriving.
fragment: true
name: pr-thread-resolve
version: "1.0"
description: >
  Shared PR review-thread reply-and-resolve fragment. Posts one reply into each
  thread and resolves only those whose fix was verified, with idempotency
  against a partial previous run and a post-run re-fetch that reports the PR's
  observed state rather than the intended one.

  Mutating. This is the only fragment in the shared set that writes to GitHub.

  Params consumed from trigger.params: {pr_number}.

stages:

  - name: resolve-threads
    kind: publish
    depends_on: []      # overridden by include.depends_on
    reads_from: []      # overridden by include.reads_from
    description: >
      Reply to and resolve the review threads on PR {pr_number} that the caller
      has marked safe to close.

      Prefix every gh command with `GITHUB_TOKEN=` (a stale token env var
      silently breaks auth). Resolve owner/repo first, never hardcode:
        NWO=$(GITHUB_TOKEN= gh repo view --json nameWithOwner -q .nameWithOwner)
        OWNER=${NWO%%/*}; REPO=${NWO##*/}

      Step 0a — abort gate. The caller names its verification artifact in
      resolve-plan.json as "verify_file" (see Step 0b). Read that path,
      relative to {workspace}, and abort unless it parses AND contains
      all_green exactly true. A missing file, a parse error, an unexpected
      shape, or an absent all_green key all count as NOT green — fail closed.
      The gate protects an irreversible action, so "I could not tell" must
      behave identically to "it is red".

      Do NOT guess the path. Callers put it in different places —
      review-fix-threads writes validation/verify-results.json while
      review-and-fix writes outputs/fix/verify-results.json — so a hardcoded
      path silently finds nothing for one of them, and a gate that never
      fires is worse than no gate: it reads as protection while allowing
      every resolve through.

      If resolve-plan.json omits "verify_file" entirely, the caller is
      asserting it has no separate verification artifact. Proceed, and record
      "verify_file": null in resolution.json so the report shows the gate did
      not run. An absent key is a deliberate caller choice; a present key
      pointing at an unreadable file is a failure.

      On abort: post NO replies, resolve NO threads, write resolution.json
      with status "blocked" and the reason, then exit non-zero. Resolving a
      thread asserts the concern was handled; asserting that on a red tree is
      a false claim posted under the author's name.

      Do not assume the tree is green because you were reached. A stage's
      status is self-reported against a template that pre-fills "success", so
      being scheduled proves nothing about what ran upstream. Re-check here.

      Step 0b — read the caller's plan from
      {workspace}/outputs/resolve-plan.json. The caller owns the decision about
      what deserves closing; this fragment owns doing it safely. Schema:

        {
          "verify_file": "validation/verify-results.json",
          "threads": [
            {
              "thread_id": "PRRT_kwDO...",
              "action": "reply-and-resolve|reply-only|skip",
              "reply": "the text to post",
              "reason": "why, for the skip case"
            }
          ]
        }

      Per-action behaviour, exhaustively. Every entry falls in exactly one row
      and nothing is left to inference:

        action               posts a reply   resolves   recorded in
        ------------------   -------------   --------   ------------------
        reply-and-resolve    yes             yes        replied + resolved
        reply-only           yes             NO         replied
        skip                 NO              NO         skipped (+ reason)

      A "skip" entry is never posted to, even when it carries a "reply" field
      — a leftover reply on a skipped entry is caller data, not an
      instruction. An action outside these three values is treated as "skip"
      and recorded in "failed" with the unrecognised value, rather than
      guessed at: this stage mutates a PR, so an unknown instruction must do
      nothing rather than something plausible.

      A thread with no thread_id (review bodies, issue comments, unlinked
      overview findings) cannot be resolved — resolveReviewThread fails on
      them. Treat any such entry as "skip" with reason "not resolvable"
      regardless of what the plan says.

      Step 1 — idempotency. Reply and resolve are two API calls and are not
      atomic: a run that died between them leaves a thread replied-to but
      unresolved, and a re-run that does not check posts a second
      near-identical reply.

      Re-fetch each planned thread's current comments before posting. Skip the
      reply when the thread's latest comment was written by the authenticated
      actor (GITHUB_TOKEN= gh api user -q .login) at or after the plan's
      baseline — take the baseline as the earliest created_at among the
      threads this plan names, or the PR head SHA's commit time if the plan
      records one. Record those as "already_replied" so the report
      distinguishes them from fresh posts.

      Do NOT test this by comparing the reply text. A re-run composes its
      reply fresh, so a semantically identical reply is textually different
      and a text-equality check never fires — which is precisely the
      duplicate-reply case this step exists to prevent. Authorship plus
      recency is reproducible; string equality is not.

      Step 2 — post the reply INTO the thread, not as a new top-level PR
      comment. A detached comment does not appear where the reviewer raised
      the concern:

        GITHUB_TOKEN= gh api graphql -f query='
        mutation($threadId:ID!,$body:String!){
          addPullRequestReviewThreadReply(
            input:{pullRequestReviewThreadId:$threadId, body:$body}
          ){ comment{ id url } }
        }' -F threadId="<thread_id>" -F body="<reply text>"

      Pass the body via -F, never interpolated into the query string: reply
      text contains backticks and quotes that would break the GraphQL document.

      Step 3 — resolve, but only for action "reply-and-resolve" AND only when
      that thread's reply posted successfully.

      Order matters: reply first, resolve second. A resolve that lands without
      its reply leaves a silently closed thread, which is the outcome this
      fragment exists to prevent. If a reply fails, skip the resolve for that
      thread and record it.

        GITHUB_TOKEN= gh api graphql -f query='
        mutation($threadId:ID!){
          resolveReviewThread(input:{threadId:$threadId}){
            thread{ id isResolved }
          }
        }' -F threadId="<thread_id>"

      Verify the response: check thread.isResolved is true rather than trusting
      exit code 0. A GraphQL error returns HTTP 200 with an errors array, so
      `gh` exits 0 on a failed mutation. An unverified resolve recorded as a
      success is indistinguishable from a real one.

      Step 4 — write {workspace}/outputs/resolution.json.

      Status is "partial", never "ok", whenever anything was left undone: a
      non-empty "failed" or "skipped" list, an unverified resolve, or a
      caller-supplied "incomplete_input" flag in resolve-plan.json (set by a
      caller that knows its input was missing something — for example a
      non-empty cited_not_found from the overview reconciliation). A run that
      acted on incomplete input must not terminate in a green artifact.

        {
          "status": "ok|partial|blocked",
          "verify_file": "validation/verify-results.json",
          "all_green": true,
          "replied": [{"thread_id": "...", "comment_url": "..."}],
          "already_replied": ["PRRT_..."],
          "resolved": ["PRRT_..."],
          "skipped": [{"thread_id": "...", "reason": "..."}],
          "failed": [{"thread_id": "...", "error": "..."}],
          "unresolved_after": 3
        }

      Step 5 — re-fetch to confirm the PR's actual state, paging the query:

        GITHUB_TOKEN= gh api graphql -f query='
        query($owner:String!,$name:String!,$pr:Int!,$after:String){
          repository(owner:$owner,name:$name){
            pullRequest(number:$pr){
              reviewThreads(first:100, after:$after){
                pageInfo{ hasNextPage endCursor }
                nodes{ id isResolved }
              }
            }
          }
        }' -F owner="$OWNER" -F name="$REPO" -F pr={pr_number}

      A truncated re-fetch reports fewer unresolved threads than exist and
      makes a partial run look complete. If you cannot complete the pagination,
      set "unresolved_after": null and record the reason rather than writing a
      number you did not verify.

      Report the observed state, not the intended one.
    agent:
      role: code-writer
      model: sonnet
      tools: [Bash, Read, Write]
      access: read-write
    required: true
    writes_to:
      - resolution.json
