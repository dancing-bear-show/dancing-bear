services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.103.1
    environment:
      - CENTRAL_OTLP_ENDPOINT=${CENTRAL_OTLP_ENDPOINT:-https://otlp.telemetry.devel.cpdev.cloud:4318}
    ports:
      # Defaults (4327/4328) avoid colliding with other local collectors on
      # the standard 4317/4318 OTLP ports. Override via OTEL_GRPC_PORT /
      # OTEL_HTTP_PORT if these also collide — keep OTEL_EXPORTER_OTLP_ENDPOINT
      # (see src/telemetry/otel/health.py's setup message) in sync with
      # whatever OTEL_GRPC_PORT resolves to.
      - "${OTEL_GRPC_PORT:-4327}:4317"   # OTLP gRPC
      - "${OTEL_HTTP_PORT:-4328}:4318"   # OTLP HTTP
    volumes:
      - ./configs/otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml
      - otel-data:/data
    restart: unless-stopped

volumes:
  otel-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${OTEL_DATA_DIR:-${HOME}/.config/otel}
