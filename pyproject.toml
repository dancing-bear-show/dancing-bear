[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-assistants"
version = "0.1.0"
description = "Reconstituted personal assistants (mail, resume, schedule)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "click==8.4.2",
  "cryptography==50.0.0",
  "rich==15.0.0",
  "PyYAML==6.0.3",
  "python-docx==1.2.0",
  "google-api-python-client==2.198.0",
  "google-auth==2.56.3",
  "google-auth-httplib2==0.4.1",
  "google-auth-oauthlib==1.4.0",
  "httplib2==0.32.0",
  "matplotlib>=3.8",
  "msal==1.37.0",
  "numpy==2.4.6",
  "pdfminer.six==20260107",
  "premailer==3.10.0",
  "requests==2.34.2",
  "shapely==2.1.2",
  "trimesh==5.0.0",
  "urllib3==2.7.0",
]

[project.optional-dependencies]
# Textual is only needed by `telemetry live` (src/telemetry/tui/_app.py and
# _widgets.py). Kept optional so the core CLIs stay dependency-light, but
# included in `dev` so tests import and cover it rather than silently skipping.
tui = [
  "textual==8.2.8",
]
# python-pptx (and its transitive lxml dep) plus Pillow for image sizing, used
# by the slides domain (src/slides/). Kept optional so the core CLIs stay
# dependency-light; mmdc (mermaid-cli) is a separate npm-installed binary, not
# a pip dependency, and is not listed here.
slides = [
  "python-pptx>=1.0.0",
  "Pillow>=10.0.0",
]
dev = [
  "pytest==9.1.1",
  "vulture==2.16",
  # Self-reference so the textual pin lives only in [tui].
  "personal-assistants[tui]",
  # Self-reference so the slides extra is installed wherever coverage runs —
  # an undeclared optional dep reports 0% coverage indistinguishably from
  # untested code (the [tui] extra hit this trap once; see CLAUDE.md).
  "personal-assistants[slides]",
]
# Note: pdfplumber depends on pdfminer.six==20251107 (vulnerable version)
# Keep as optional but not recommended for security-sensitive use
pdf = [
  "pdfplumber>=0.11.0",
]

[project.scripts]
assistant = "core.assistant_cli:main"
mail-assistant = "mail.__main__:main"
calendar = "calendars.__main__:main"
calendar-assistant = "calendars.__main__:main"
schedule-assistant = "schedule.__main__:main"
phone = "phone.__main__:main"
phone-assistant = "phone.__main__:main"
whatsapp = "whatsapp.__main__:main"
resume-assistant = "resume.cli.main:main"
apple-music-assistant = "apple_music.__main__:main"
apple-music-user-token = "apple_music.user_token_cli:main"
wifi-assistant = "wifi.__main__:main"
wifi = "wifi.__main__:main"
slides = "slides.__main__:main"

[tool.vulture]
paths = [
  "bin", "tests",
  "src/apple_music", "src/calendars", "src/charts", "src/core", "src/desk",
  "src/diagrams", "src/mail", "src/metals", "src/phone", "src/resume",
  "src/schedule", "src/telemetry", "src/whatsapp", "src/wifi", "src/worker",
  "src/workflow",
]
min_confidence = 60
exclude = [
  # Pure dataclass/enum schema modules populated by parsers via
  # dict-unpacking or Enum(value_str) construction: every field reads as
  # "unused" to vulture even though the schema is fully consumed at
  # runtime. Field-level false positives here vastly outnumber any real
  # dead code, so these files are reviewed by hand instead.
  "src/workflow/models.py", "src/telemetry/otel/models.py",
]
ignore_decorators = [
  # Click CLI dispatch: framework invokes by registry, not direct call.
  "@*.command", "@*.group",
]
ignore_names = [
  # argparse/registry CLI dispatch: called via set_defaults(func=...) or an
  # assistant registry, never invoked directly by name.
  "cmd_*", "register",
  # Textual TUI framework callbacks/attrs: dispatched via reflection by the
  # Textual runtime, not called directly in this codebase.
  "compose", "on_mount", "action_*", "on_*_selected", "cursor_type",
  "display", "BINDINGS", "CSS", "TITLE",
  # http.server.BaseHTTPRequestHandler overrides: invoked by the base
  # class's request-handling loop, not called directly.
  "do_GET", "do_POST", "log_message",
  # python-docx property setters: assignment triggers the docx library's
  # XML serialization; the "read" happens inside the library, not here.
  "left_indent", "right_indent", "first_line_indent", "hanging_indent",
  "space_before", "space_after", "bottom_margin", "top_margin",
  "left_margin", "right_margin", "autofit",
  # Generic type aliases (Name = RequestConsumer[SomeRequest]): vulture does
  # not resolve assignment-style aliases, so each reads as an unused variable
  # even though other modules import it by name.
  "*RequestConsumer",
  # @patch decorator parameters: unittest.mock injects one positional arg per
  # decorator regardless of whether the test asserts on it. Tests that patch
  # purely to suppress a side effect (time.sleep, network, disk writes) never
  # reference the binding, but it cannot be deleted without breaking the
  # signature. Removing these would break tests, not remove dead code.
  "mock_*",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "telemetry*",
  "core*",
  "mail*",
  "resume*",
  "schedule*",
  "calendars*",
  "phone*",
  "whatsapp*",
  "apple_music*",
  "wifi*",
  "charts*",
  "diagrams*",
  "workflow*",
  "metals*",
  "worker*",
  "maker*",
  "desk*",
  "slides*",
]
