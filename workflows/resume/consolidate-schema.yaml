# Consolidate the resume data model into one typed schema, then add PDF export.
#
# Two problems, one workflow, in dependency order.
#
# PROBLEM 1 — model drift. src/resume/model.py formally defined 5 sections
# (name/summary/skills/experience/education). The dict path actually carries
# 22, as measured by the audit-sections stage: priority.py:67 filters
# technologies, interests, presentations, languages, coursework, summary,
# teaching, certifications; docx_sidebar_sections.py renders presentations;
# projects and coursework appear in templates. Those extra sections have no
# type, no validation, and no documented shape — they exist only as string keys
# spread across renderers. A typo in a renderer key is currently a silent no-op
# that renders an empty section.
#
# PROBLEM 2 — PDF export exists only as a separate `export-pdf` subcommand
# (cli/main.py:645-677) that converts an already-rendered .docx via
# LibreOffice; `render --out x.pdf` still rejects the request outright
# (cli/main.py:371-372: "render writes .docx only; use 'resume export-pdf
# --docx <path>' to convert."). This workflow's PDF work is about the
# render-time path, not about adding conversion capability that already
# exists.
#
# DEFERRED AT THE HUMAN GATE — multi-role experience. Earlier revisions of this
# workflow treated "a promotion at one employer needs `roles: list[Role]`
# nesting" as PROBLEM 2 and scoped the whole run around it. The design-schema
# gate deliberately dropped it: no current production data contains a
# promotion, so the abstraction would ship unexercised. `ExperienceEntry` stays
# FLAT — no `roles:` nesting, no `group_id` marker. The additive follow-up,
# when real promotion data appears, is a `group_id` field on the flat entry,
# which is backward-compatible; retrofitting nesting after migrate-callsites
# would not have been. This was a decision, not an oversight, and downstream
# stages must not reintroduce it on their own initiative. A stage that
# encounters real promotion data should STOP and report rather than design for
# it mid-run.
#
# Schema lands BEFORE PDF on purpose: PDF converts documents built from the
# model, so changing the model afterwards would invalidate the conversion
# fixtures.
#
# MIGRATION DEPTH — full migration, decided up front, not at the gate.
# Renderers and filters consume dataclasses; from_dict/to_dict sit at the I/O
# boundary so the on-disk JSON/YAML format never changes. Attribute access
# replaces .get(), so a mistyped field raises AttributeError instead of
# silently returning None.
#
# Be honest about the size: no production file imports the dataclasses today
# (only CandidateData, which is `dict[str, Any]`), so this introduces types
# into the runtime path for the first time — 13 source files, ~62 call sites,
# ~8 test files. The narrower alternative (validate at the boundary, leave
# renderers on dicts) was considered and rejected in favour of the stronger
# guarantee.
#
# The ~62 figure is the audited one and supersedes the ~55 earlier revisions
# recorded. ~55 counted only call sites on a `data`-named variable; the audit
# found 7 more on a `candidate`-named parameter (keyword_match.py, aligner.py)
# that the original grep missed. Because ~62 is too many for one edit, the gate
# carried forward a constraint: migrate-callsites is SPLIT BY FILE GROUP —
# parsers, then renderers, then filters/aligner/keyword_match.
#
# NON-GOALS. This workflow does not adopt pydantic (the repo is
# dependency-light and currently has near-zero runtime deps), does not port
# reactive-resume's 15 templates, does not change any public CLI flag, and
# does not change the on-disk JSON/YAML format.
#
# DAG:
#   init
#     |
#   audit-sections ──────────┐  (gather — ground truth: which keys are real)
#     |                      |
#   design-schema            |  (propose, human_gate — shape review before code)
#     |                      |
#   impl-schema              |  (execute — dataclasses + emitter)
#     |                      |
#   test-schema              |  (execute — unit tests, sad-path majority)
#     |                      |
#   migrate-callsites <──────┘  (execute — renderers/filters use the schema)
#     |
#   test-e2e-data               (execute — round-trip real data end to end)
#     |
#   merge-worktrees             (execute — land isolated commits; without this
#     |                          every verification below measures unchanged code)
#     |
#   cov-* [fragment]            (expand-coverage — close gaps to {min_coverage})
#     |
#   cr-validate-code [fragment] (review against concerns/ guides)
#     |
#   verify-schema               (validate — suite + lint + coverage + ratio)
#     |
#   impl-pdf                    (execute — docx -> pdf, optional dep)
#     |
#   test-pdf                    (execute — tests w/ injected runner, no binary)
#     |
#   verify-pdf-fidelity         (validate, human_gate — LOOK at the PDFs)
#     |
#   report                      (publish — what changed, what is still open)

name: consolidate-resume-schema
version: "1.0"
description: >
  Consolidates src/resume's data model into a single typed schema covering all
  22 real sections, emits a JSON Schema, then adds the render-time DOCX->PDF
  path behind an optional dependency (conversion itself already exists via the
  separate `export-pdf` subcommand — see PROBLEM 2 in the header comment).
  Multi-role-per-company support was deferred at the design-schema gate — see
  the DEFERRED note in the header comment.

  Two rules are load-bearing. First, the on-disk JSON/YAML format never
  changes: from_dict/to_dict sit at the I/O boundary, so every existing profile
  and plan file keeps working while the runtime path becomes typed end to end.
  Second, tests must be majority sad-path: a schema whose tests only feed it
  well-formed input has verified nothing, because the entire point of the
  schema is catching malformed input. Note that validation is ADVISORY (gate
  decision 3): from_dict warns and never raises, so a sad-path test asserts
  graceful tolerance, not an exception.

  This is a full migration — renderers and filters take dataclasses, not dicts.
  It touches 13 source files and ~62 call sites, and it is the first time these
  types enter the runtime path at all. migrate-callsites is sequenced
  boundary-first, split by file group, and tested group-by-group for that
  reason.

  The PDF half is deliberately cheap (subprocess to LibreOffice, ~80 LOC)
  rather than a renderer. Its risk is not code, it is fidelity: the sidebar
  layout is a borderless shaded table, which is exactly what DOCX->PDF
  converters render worst. That is why the final gate makes a human look at
  the output instead of trusting an exit code.

metadata:
  author: dancing-bear
  created: "2026-08-26"

trigger:
  source: manual
  params:
    out_dir: "~/.local/share/dancing-bear/resume/schema-consolidation"  # outside checkout; fixtures may carry PII
    sample_resume: ""        # OPTIONAL: a real resume DOCX/PDF for the e2e stage
    min_sad_path_ratio: "0.5"   # >=50% of new tests must exercise failure modes
    skip_pdf: "false"        # "true" runs the schema half only
    # --- consumed by the shared fragments below ---
    source_root: "src/resume/"
    test_path: "tests/resume_tests/"
    min_coverage: "80"
    extra_checks: >
      Resume-specific review rules, beyond the shared guides:
        - No re-export facades or compatibility shims. Call sites are updated
          directly (project rule).
        - No public CLI flag or subcommand changed; no dict wire-format key
          renamed.
        - No new runtime dependency. Stdlib only; optional deps lazily imported.
        - Every subprocess call carries an argv list (never a shell string) and
          a `# nosec` comment stating intent.
        - No bare `except Exception: pass/continue` without a `# nosec B110/B112`
          comment explaining the intent.
        - No test whose only assertion is that a module imports.
        - PII: no real resume data written under tests/ or any tracked path.

workspace_dir: "{out_dir}"

include:
  # Coverage expansion on the schema half — closes gaps rather than only
  # asserting them. Runs after the e2e test lands so it sees the true picture.
  # Injects: cov-identify-gaps -> cov-expand-coverage-files -> cov-verify-coverage
  # Depends on merge-worktrees, NOT test-e2e-data: these stages are not
  # isolated, so before the merge they would measure the unmodified parent tree.
  - path: workflows/shared/expand-coverage.yaml
    prefix: cov
    depends_on: [merge-worktrees]
    reads_from: [merge-worktrees, test-e2e-data, test-schema]

  # Single-pass code review against the canonical guides in concerns/.
  # Chosen over code-review-swarm deliberately: the swarm needs a pr_number and
  # a PR diff, and this workflow reviews a worktree before any PR exists.
  # Scope here (~4-8 changed files) is what validate-code is built for.
  # Injects: cr-validate-code
  - path: workflows/shared/validate-code.yaml
    prefix: cr
    depends_on: [cov-verify-coverage]
    reads_from: [migrate-callsites, impl-schema, test-schema, test-e2e-data]

stages:

  # ==========================================================================
  # Stage 1: init — workspace + baseline health
  # ==========================================================================
  - name: init
    kind: gather
    description: >
      Create the workspace:

        mkdir -p {workspace}

      Confirm PII placement is safe. The workspace must be OUTSIDE the repo
      checkout. Run:

        python3 -c "
        import os, subprocess, sys
        ws = os.path.realpath('{workspace}')
        root = subprocess.check_output(['git', 'rev-parse', '--show-toplevel'], text=True).strip()
        root = os.path.realpath(root)
        if ws.startswith(root + os.sep) or ws == root:
            print('UNSAFE: workspace is inside the repo checkout', file=sys.stderr)
            sys.exit(1)
        print('OK: workspace is outside the repo checkout')
        "

      If the check fails, STOP. Resume fixtures carry names, phone numbers, and
      emails; writing them inside the checkout risks accidental git exposure.

      Then establish baseline health BEFORE touching anything. Run and record:

        make check-env          # imports must resolve to THIS checkout
        make test               # full suite, record pass/fail counts

      Write {workspace}/baseline.md with the test counts and current coverage
      for src/resume/.

      CRITICAL: use `make test`, never bare `python3 -m unittest`. An inherited
      PYTHONPATH silently resolves `resume` to the MAIN checkout and produces a
      false green that is indistinguishable from a real one. If `make check-env`
      fails, STOP and report it — every downstream verification would be
      meaningless.

      Also record whether a DOCX->PDF converter exists:

        which soffice libreoffice pandoc 2>/dev/null || echo "NONE"

      None is expected and is not a failure; impl-pdf handles absence. Record
      it so verify-pdf-fidelity knows whether it can actually render.
    agent:
      role: researcher
      model: haiku
      tools: [Bash, Write]
      access: read-write
    required: true
    writes_to:
      - "{workspace}/baseline.md"

  # ==========================================================================
  # Stage 2: audit-sections — ground truth on which keys are real
  # ==========================================================================
  - name: audit-sections
    kind: gather
    depends_on: [init]
    description: >
      Establish the ACTUAL set of section keys the code reads and writes. Do
      not guess from model.py — it is known incomplete. Grep the source.

      (This stage runs BEFORE impl-schema, so src/resume/model.py is still the
      pre-migration file here. impl-schema replaces it with schema.py.)

      Known starting points (verify each, find the rest):
        - src/resume/model.py            — the 5 formally typed sections
        - src/resume/priority.py:67      — filters 8 keys incl. teaching,
                                           certifications, coursework
        - src/resume/docx_sidebar_sections.py:331 — renderer dispatch table
        - src/resume/docx_renderers.py, docx_sections_*.py
        - src/resume/templating.py       — DEFAULT_TEMPLATE section list
        - src/resume/config/*.yaml       — real template files
        - src/resume/skills_filter.py, experience_filter.py

      For EVERY section key found, record in {workspace}/sections.md:
        - the key name
        - every file:line that reads or writes it
        - its observed item shape (field names, types, required vs optional)
        - whether it is a list of strings, list of dicts, or a scalar
        - any key read under two different shapes in different files —
          these are latent bugs and the schema must reconcile them

      Also record every field of the experience item, and specifically how a
      promotion within one company is represented today (it is not — confirm
      that and note what callers would need). Record it as a FINDING only:
      multi-role support is deferred (see the header), so do not let this
      observation expand the design. If you find real production data that
      actually contains a promotion, STOP and report — that fact would reopen
      a gate decision and is not yours to design around.

      Count call sites explicitly, and do not anchor on a `data`-named
      variable: several files reach the same section keys through a parameter
      named `candidate` (keyword_match.py, aligner.py). Report the total, not
      just the `data.get(` subset.

      Be exhaustive. A key missed here becomes an untyped key that survives the
      whole consolidation, which defeats the point.
    agent:
      role: researcher
      model: sonnet
      tools: [Bash, Read, Write, Grep]
      access: read-write
    required: true
    writes_to:
      - "{workspace}/sections.md"

  # ==========================================================================
  # Stage 3: design-schema — shape review BEFORE any code
  # ==========================================================================
  - name: design-schema
    kind: propose
    human_gate: true
    depends_on: [audit-sections]
    reads_from: [audit-sections]
    description: >
      Propose the schema shape and STOP for human review. Changing dataclass
      field names after the renderers are migrated is expensive; changing them
      now is free.

      Write {workspace}/schema-design.md containing:

        1. Every section as a proposed dataclass, with field names, types, and
           defaults. Flag each field required vs optional.
        2. The experience design. `ExperienceEntry` is FLAT — title, company,
           start, end, location, priority, bullets. Do NOT propose a
           `roles: list[Role]` nesting or a `group_id` marker: multi-role was
           deferred at this gate because no production data exercises it. Note
           the deferral and the additive `group_id` follow-up so the reader
           knows it was decided, then move on.
        3. The reconciliation decision for any key found with two shapes.
           Note that three keys are deliberately left UNTYPED and that is the
           approved outcome, not a gap: `skills` (list[str]), `teaching`
           (heterogeneous str-or-dict), and `contact` (overlays.py copies its
           nested fields to the top level but does not remove the `contact`
           key, and docx_base._identity_fields still falls back to the nested
           dict when a top-level field is missing — so `contact` remains a
           live, dual-path field, not one fully flattened before it reaches
           Resume). Record the reason for each; a later stage must not
           silently type them without saying so.
        4. The JSON Schema emitter approach (~150 LOC, stdlib only — walk
           dataclass fields via dataclasses.fields() and map types).
        5. BACKWARD COMPATIBILITY: exactly how existing dict data keeps working.
           JSON/YAML on disk stays dict-shaped — from_dict/to_dict at the I/O
           boundary is what preserves every existing profile, plan, and
           alignment file. State which functions gain validation. Validation is
           ADVISORY: from_dict warns via `logging` and never raises, every field
           carries a default so nothing is strictly required, and there is no
           date validation. Enforcing mode is an opt-in follow-up once
           migrate-callsites has fully landed — enforcing now could raise
           mid-render on real data, and a resume that will not render is a worse
           failure than one that renders with a warning.
        6. THE MIGRATION DEPTH IS ALREADY DECIDED: full migration. Renderers
           and filters consume DATACLASSES, not dicts. Do not re-open this at
           the gate; design to it. Concretely that means:
             - from_dict() at every read boundary (read_yaml_or_json callers)
             - to_dict() at every write boundary (write_yaml_or_json callers)
             - the 13 modules listed in sections.md's call-site inventory take
               typed objects as parameters, not dict[str, Any] — ~62 call
               sites, migrated in file groups, not one edit
             - merge_profiles (parsing_experience_text.py:345) returns a typed
               Resume rather than a merged dict
           Attribute access replaces .get(), so a mistyped field becomes an
           AttributeError at import/call time instead of a silent None — that
           is the entire point of choosing this depth.
        7. What this does NOT do: no pydantic, no CLI flag changes, no change
           to the on-disk JSON/YAML format.

      Ask the human to confirm: field naming, the multi-role deferral, and
      advisory validation.

      OUT OF SCOPE, do not fold into this design:
        - The keyword_match.py str() coercions are already fixed and merged
          (PR #271, e6791cc). Do not re-fix them; design the item type to match
          what keyword_normalize.item_text / item_match_text already expect.

      Do NOT write implementation code in this stage.
    agent:
      role: reviewer
      model: sonnet
      tools: [Read, Write, Bash]
      access: read-write
    required: true
    writes_to:
      - "{workspace}/schema-design.md"

  # ==========================================================================
  # Stage 4: impl-schema — dataclasses + JSON Schema emitter
  # ==========================================================================
  - name: impl-schema
    kind: execute
    depends_on: [design-schema]
    reads_from: [design-schema, audit-sections]
    description: >
      Implement the approved design from {workspace}/schema-design.md.

      Replace src/resume/model.py with two new modules. model.py is DELETED,
      not left behind as a re-export facade — the no-facade rule is a hard
      project rule, so every importer is updated directly in the same change.

        src/resume/schema.py       — the dataclasses
        src/resume/schema_emit.py  — the JSON Schema emitter

      schema.py contains:
        - a dataclass per section key from sections.md (22 keys; 17 typed, and
          `skills`/`teaching`/`contact` deliberately left untyped per the
          approved design — do not type them without saying so)
        - a FLAT ExperienceEntry (title, company, start, end, location,
          priority, bullets). No Role type, no `roles:` nesting, no `group_id`:
          multi-role was deferred at the gate. Do not add it back.
        - a Resume aggregate covering all sections
        - from_dict()/to_dict() round-trip helpers preserving unknown keys
          (dropping unknown keys would silently discard user data)

      schema_emit.py contains the to_json_schema() emitter, stdlib only.

      VALIDATION IS ADVISORY. from_dict reports shape violations through
      `logging.getLogger(__name__).warning` and NEVER raises. Every field has a
      default, so no field is required; there is no date validation. A
      malformed input must still yield a usable object.

      Two round-trip details that are easy to get wrong and are part of the
      contract:
        - Preserve input key ORDER on to_dict(). Emitting declaration order
          round-trips every key and value correctly but reorders the document,
          which turns a no-op save into a whole-file diff.
        - Do not coerce a value that was legitimately another type.
          `presentations[].year` is an `int` in real data and must stay an int;
          the renderers stringify it at display time. Track which declared
          fields were actually present so absent stays absent and defaults are
          never invented on output.

      Constraints, all enforced by project rules:
        - Python 3.11, stdlib only. No pydantic, no new runtime deps.
        - No re-export facades. Update call sites directly.
        - Do not change any public CLI flag or subcommand.
        - Do not rename existing dict keys — the wire format is frozen.
        - Lazy-import anything optional.

      Do NOT migrate call sites yet — that is migrate-callsites. This stage
      only adds the schema layer, so the suite must stay green without it
      being used.

      Run `make test` before finishing. A red suite here means the schema
      addition broke something, and that must be fixed before proceeding.

      COMMIT BEFORE FINISHING. You run in your own git worktree; `git merge` moves commits, not uncommitted files. If you edit files and return without committing, the downstream merge-worktrees stage finds an empty branch and the run halts. Stage your files by name (never `git add -A`) and commit with a conventional message.
    agent:
      role: code-writer
      model: inherit
      tools: [Read, Write, Edit, Bash]
      access: read-write
      isolation: worktree
    required: true
    writes_to:
      # Workspace-relative only. The real edit lands in the agent's own worktree
      # and is merged back by merge-worktrees; a `src/...` entry here would
      # resolve under {workspace}/outputs/ and never match the repo file.
      - "outputs/impl-schema-summary.md"

  # ==========================================================================
  # Stage 5: test-schema — unit tests, majority sad-path
  # ==========================================================================
  - name: test-schema
    kind: execute
    depends_on: [impl-schema]
    reads_from: [impl-schema, design-schema]
    description: >
      Write unit tests for the new schema under tests/resume_tests/model/.

      MANDATORY RATIO: at least {min_sad_path_ratio} of new test methods must
      be sad-path. A schema tested only on well-formed input has verified
      nothing — catching malformed input is its entire purpose.

      NAMING CONTRACT — this is what makes the ratio checkable rather than a
      matter of opinion. Every sad-path test method MUST be named
      `test_rejects_*` or `test_invalid_*`. Every happy-path method MUST NOT
      use either prefix. verify-schema counts with grep against exactly these
      prefixes, so a sad-path test named anything else is counted as happy-path
      and drags the measured ratio down. Do not rename a happy-path test to
      game the count.

      READ THIS BEFORE WRITING A SINGLE SAD-PATH TEST. Validation is ADVISORY.
      from_dict warns via `logging` and never raises; every field has a default,
      so no field is required and there is no date validation. "Rejects" in the
      `test_rejects_*` prefix therefore means "handles the rejected shape
      GRACEFULLY" — it does not mean an exception is raised. The prefix is a
      counting contract, kept because a later stage greps for it; it is not a
      claim about control flow.

      Concretely: an `assertRaises` test here would PASS only if the advisory
      policy had been broken. Do not write one. For every malformed input,
      assert instead:
        - from_dict does NOT raise
        - the returned object is still usable (attribute access works, the
          other sections are intact)
        - the documented fallback occurred (the default value, or the value
          preserved verbatim)
        - a warning was emitted, captured with `assertLogs` on the schema
          module's logger

      HAPPY PATH (the minority):
        - each section round-trips dict -> dataclass -> dict unchanged
        - round-trip preserves input KEY ORDER, not declaration order
        - a flat experience entry round-trips with all fields intact
        - `presentations[].year` given as an int stays an int (it is an int in
          real data and is deliberately not coerced to str)
        - a field absent from the input stays absent on output rather than
          being materialised from its default
        - to_json_schema() emits valid JSON Schema for every section
        - unknown keys survive the round trip, at the top level and inside
          nested experience, bullet and skills-group items

      SAD PATH (the majority) — for each, assert the specific graceful outcome
      per the four bullets above, never just "it did not crash":
        - a declared field absent entirely (its default applies, no raise)
        - wrong type per field (str where list expected, dict where str, None)
        - empty list where items expected
        - a non-dict where an item dict was expected (coerced, with a warning)
        - a non-list where a section list was expected (ignored, with a warning)
        - a key present under BOTH observed shapes from sections.md
        - an untyped section (`skills`, `teaching`, `contact`) carrying an
          unexpected shape — it must pass through without loss
        - unicode and RTL text in name/company fields
        - very long strings (a 10k-char bullet)
        - null bytes and control characters in text fields
        - empty resume (every section absent)
        - a section present but set to null

      Do NOT write tests for these — the schema does not implement them, so
      they would encode a contract that was explicitly not built:
        - an end date before a start date (no date validation exists)
        - malformed date strings ("2024-13-45", "yesterday")
        - anything reaching through `experience -> roles` (multi-role was
          deferred; there is no `roles` field)

      Use the existing tests/resume_tests/fixtures.py helpers rather than
      hand-rolling fixtures. Follow the file layout already in
      tests/resume_tests/.

      Every test must assert BEHAVIOUR. Do not write import-only tests to
      inflate coverage — project rules forbid it.

      Verify with `make test`. Never bare python3 -m unittest.

      COMMIT BEFORE FINISHING. You run in your own git worktree; `git merge` moves commits, not uncommitted files. If you edit files and return without committing, the downstream merge-worktrees stage finds an empty branch and the run halts. Stage your files by name (never `git add -A`) and commit with a conventional message.
    agent:
      role: tester
      model: sonnet
      tools: [Read, Write, Edit, Bash]
      access: read-write
      isolation: worktree
    required: true
    writes_to:
      - "outputs/test-schema-summary.md"

  # ==========================================================================
  # Stage 6: migrate-callsites — renderers/filters read through the schema
  # ==========================================================================
  - name: migrate-callsites
    kind: execute
    depends_on: [test-schema]
    reads_from: [audit-sections, impl-schema]
    description: >
      FULL MIGRATION — renderers and filters consume dataclasses, not dicts.
      This is the largest stage in the workflow. Scope it honestly before
      starting.

      MEASURED SCOPE (verify against {workspace}/sections.md; these numbers are
      the audited ones):
        - 42 .py files under src/resume/
        - 13 of them read section keys off dicts, via ~62 call sites:
            cli/main.py, docx_base.py, docx_sections_exp.py,
            docx_sections_simple.py, docx_sections_skills.py,
            docx_sidebar_sections.py, docx_standard.py, docx_writer.py,
            experience_filter.py, experience_summary.py, overlays.py,
            skills_filter.py, summarizer.py
        - ~8 test files exercise those paths
        - 26 read_yaml_or_json/write_yaml_or_json call sites are the I/O
          boundary where from_dict/to_dict must sit

      The ~62 breaks down as ~55 `data.get(` calls plus 7 more reached
      through a parameter named `candidate` — keyword_match.py and aligner.py.
      Earlier revisions of this workflow recorded only the ~55 subset. Grepping
      for `data\.get(` alone will therefore UNDERCOUNT the work by about a
      tenth and make a partial migration look complete.

      SPLIT BY FILE GROUP — carried forward as a constraint from the gate.
      ~62 sites is too many for one edit. Migrate parsers first, then
      renderers, then filters/aligner/keyword_match, committing and running
      `make test` between groups.

      This is NOT a mechanical rename. Before this workflow, NO production file
      imported the Resume/Experience/Education dataclasses — only CandidateData,
      which is just `dict[str, Any]`. The runtime path is entirely dicts today,
      so this stage introduces these types into it for the first time.

      Work in this order, running `make test` after EACH group. Do not batch —
      a break is far cheaper to localise when three files changed than thirty:

        1. Boundary first. from_dict() at every read_yaml_or_json caller,
           to_dict() at every write_yaml_or_json caller, and make
           merge_profiles (parsing_experience_text.py:345) return a typed
           Resume. Nothing downstream can be typed until its input is.
        2. priority.py's hardcoded 8-key tuple becomes a schema-derived list.
           This is the clearest drift site in the codebase.
        3. Filters: skills_filter.py, experience_filter.py, overlays.py,
           summarizer.py, experience_summary.py.
        4. Renderers: docx_writer.py, docx_standard.py, docx_base.py,
           docx_sections_*.py, docx_sidebar_sections.py. Largest group; expect
           the most churn here.
        5. keyword_match.py and aligner.py — the 7 sites reached through a
           `candidate`-named parameter rather than `data`. These are the ones a
           `data\.get(` grep does not see; skipping them leaves the migration
           silently partial. Change only the parameter typing here: the str()
           coercions in keyword_match.py are already fixed (PR #271).
        6. cli/main.py last — it wires the others together, so it should be the
           final signature change.

      Rules:
        - Update ALL call sites atomically per group. No compatibility shims,
          no re-export facades, no dict/dataclass union parameters — project
          rules forbid the first two and the third defeats the migration.
        - Attribute access replaces .get(). A field name mistyped IN CODE must
          raise AttributeError rather than silently returning None. That
          failure mode is the entire justification for choosing full migration.
          This is orthogonal to from_dict's advisory policy: bad DATA warns and
          never raises, while a bad attribute name in source is a hard error.
        - Rendering output must stay byte-identical where behaviour is
          unchanged. Verify by rendering a fixture before and after and
          diffing the extracted text — this is a representation change, not a
          formatting change.
        - Experience is FLAT. There is no `roles` list and no `group_id` to
          render — multi-role was deferred at the gate. Do not add renderer
          branches for a shape the schema does not have.
        - Update test files in the same commit as the source they cover. A test
          still passing a dict to a now-typed function is a false green.
        - If a call site depends on an untyped key the schema missed, STOP and
          report it. Do NOT add an `Any` field to keep moving — that
          reintroduces exactly the drift this workflow exists to remove.
          `skills`, `teaching` and `contact` are the three EXPECTED untyped
          keys — they are deliberate, so pass them through rather than
          reporting them as misses.
        - Do NOT re-fix the keyword_match.py str() coercions. They already
          landed in PR #271 (e6791cc); keyword_normalize.item_text and
          item_match_text are the current helpers and the schema's item type is
          built to match what they expect.

      If the group-by-group test runs show the change is materially larger than
      the numbers above, STOP and report rather than pushing through. A partial
      migration that leaves half the renderers on dicts is worse than either
      end state.

      COMMIT BEFORE FINISHING. You run in your own git worktree; `git merge` moves commits, not uncommitted files. If you edit files and return without committing, the downstream merge-worktrees stage finds an empty branch and the run halts. Stage your files by name (never `git add -A`) and commit with a conventional message.
    agent:
      role: code-writer
      model: inherit
      tools: [Read, Write, Edit, Bash, Grep]
      access: read-write
      isolation: worktree
    required: true
    writes_to:
      - "outputs/migrate-callsites-summary.md"

  # ==========================================================================
  # Stage 7: test-e2e-data — real data, all the way through
  # ==========================================================================
  - name: test-e2e-data
    kind: execute
    depends_on: [migrate-callsites]
    reads_from: [migrate-callsites, design-schema]
    description: >
      Prove the schema survives a full real pipeline, not just unit tests.
      Unit tests pass on data shaped the way the author imagined; this stage
      uses data shaped the way it actually is.

      Build an e2e test at tests/resume_tests/test_e2e_schema_roundtrip.py that
      walks the REAL pipeline:

        extract -> validate -> align -> filter -> render -> re-extract -> compare

      Concretely:
        1. Start from a resume. If {sample_resume} is set, use it. Otherwise
           build a synthetic-but-realistic fixture exercising EVERY one of the
           22 sections from sections.md. Experience entries are FLAT — do not
           construct a multi-role promotion; that shape does not exist. Two
           entries at the same company is the closest real data gets, and it is
           represented as two independent flat entries.
        2. Run `./bin/assistant resume extract` -> candidate JSON.
        3. Load through the schema; assert every section survived with the
           right type.
        4. Run `align` against a job YAML; assert alignment output is
           structurally valid.
        5. Run the FilterPipeline (overlays, skill filter, experience filter,
           priority threshold); assert no section is silently dropped.
        6. Render to DOCX.
        7. Re-extract text from the rendered DOCX and assert every section that
           went in comes out. This is the load-bearing assertion: it catches a
           section that types cleanly but renders to nothing.

      SAD PATH e2e cases (required, not optional). Validation is ADVISORY, so
      these assert that the pipeline degrades gracefully, NOT that it raises:
        - a resume with an empty section -> renders without crashing, does not
          emit a stray empty heading
        - a resume where every optional section is absent -> minimal doc
        - a corrupted candidate.json (truncated mid-object) -> a CLEAR error,
          not a traceback. This one IS an error path, but it belongs to the
          JSON parser, not to schema validation.
        - an experience entry missing its title -> still renders, with the
          documented fallback, and a warning is logged
        - a section key present with the wrong shape -> from_dict does not
          raise, the section falls back to its default, a warning naming the
          offending key is emitted, and the rest of the document still renders

      If {sample_resume} is set, it is PII: write derived artifacts only under
      {workspace}, never into tests/. Any committed fixture must be synthetic.

      Verify with `make test`.
    agent:
      role: tester
      model: sonnet
      tools: [Read, Write, Edit, Bash]
      access: read-write
      isolation: worktree
    required: true
    writes_to:
      - "outputs/e2e-summary.md"

  # ==========================================================================
  # Stage 7b: merge-worktrees — land the isolated agents' commits
  # ==========================================================================
  #
  # Without this stage every verification below is meaningless. impl-schema,
  # test-schema, migrate-callsites and test-e2e-data all run with
  # `isolation: worktree`; their edits live on ephemeral worktree branches and
  # do NOT merge back automatically. verify-schema would then run make
  # test/cov/lint against a parent tree still holding the ORIGINAL model.py
  # (which impl-schema deletes and replaces with schema.py/schema_emit.py) —
  # and pass, because nothing broke, because nothing changed. That false green
  # is indistinguishable from a real one, which is what makes it dangerous.
  - name: merge-worktrees
    kind: execute
    depends_on: [test-e2e-data]
    reads_from: [impl-schema, test-schema, migrate-callsites, test-e2e-data]
    description: >
      Land the isolated stages' commits onto this workflow's working branch,
      then prove they actually landed.

      Per .claude/skills/workflow/SKILL.md rule 7, `git merge` moves COMMITS,
      not uncommitted files. An isolated agent that edited its worktree without
      committing leaves nothing to merge, and the merge silently succeeds
      against an empty branch — reporting success while no code lands. So
      verify emptiness first, and treat it as a failure, not a no-op.

      For each isolated stage branch (worktree-agent-*) belonging to
      impl-schema, test-schema, migrate-callsites and test-e2e-data:

        git log --oneline <target-branch>..worktree-agent-<id>

      If that output is EMPTY for a stage that was supposed to write code,
      STOP and report which stage produced no commit. Do not merge, and do not
      let the run continue to verification.

      Otherwise merge each in dependency order:

        git merge --no-ff worktree-agent-<id> -m "merge stage <stage_name>"

      Resolve conflicts in favour of the later stage in DAG order
      (migrate-callsites over impl-schema), since it was written against the
      earlier stage's output.

      Then PROVE the code is present in the working tree — do not assume the
      merge did what its exit code implies. Check, and record each result in
      {workspace}/merge-report.md:

        - src/resume/schema.py contains the new dataclasses (grep for the new
          section class names from schema-design.md) and
          src/resume/schema_emit.py contains the JSON Schema emitter
        - src/resume/model.py is GONE. impl-schema deletes it rather than
          leaving a re-export facade, so a model.py still present after the
          merge means the migration is half-landed, not that it succeeded.
        - tests/resume_tests/model/ exists and is non-empty
        - tests/resume_tests/test_e2e_schema_roundtrip.py exists
        - git status is clean (no unmerged paths)
        - git log --oneline shows one merge commit per isolated stage

      If any check fails, STOP. verify-schema measuring an unmerged tree is the
      single worst outcome available to this workflow: it reports a green that
      describes code nobody wrote.
    agent:
      role: code-writer
      model: inherit
      tools: [Bash, Read, Write]
      access: read-write
    required: true
    writes_to:
      - "{workspace}/merge-report.md"

  # ==========================================================================
  # Stage 8: verify-schema — suite, lint, coverage, ratio
  # ==========================================================================
  - name: verify-schema
    kind: validate
    depends_on: [cr-validate-code]
    reads_from: [init, test-schema, test-e2e-data, cov-verify-coverage, cr-validate-code]
    description: >
      Verify the schema half before any PDF work begins. Report measured
      numbers, never impressions.

      First, consume the fragment outputs rather than re-deriving them:
        - {workspace}/validation/code-review-findings.json from cr-validate-code
          — every "critical" finding is a STOP. Report each one and halt.
          "minor" findings are reported but do not block.
        - the cov-verify-coverage result for measured per-file coverage.

      Run and record each:

        make check-env      # MUST pass — otherwise every result below is void
        make test           # compare against {workspace}/baseline.md
        make cov            # coverage for src/resume/
        make lint           # ruff via the qlty-pinned build

      Checks, each pass/fail:
        - test count >= baseline (no test silently deleted)
        - zero failures, zero errors
        - coverage on new/changed files >= {min_coverage}% (cross-check the
          cov-verify-coverage result; report the measured number, and if the
          two disagree, trust `make cov` and say so)
        - zero "critical" entries in code-review-findings.json
        - lint clean
        - sad-path ratio in new tests >= {min_sad_path_ratio}. Count
          MECHANICALLY, do not judge by reading; and do not trust the prior
          stage's self-report:
            sad   = grep -rc "def test_rejects_\|def test_invalid_" <new test files>
            total = grep -rc "def test_" <new test files>
          Report both raw numbers and the quotient. If the quotient is below
          the threshold, that is a FAIL — say so with the numbers rather than
          rationalising the shortfall.
        - all 22 section keys from sections.md are accounted for on Resume:
          17 typed, plus `skills`, `teaching` and `contact` deliberately left
          untyped with reasons recorded in schema-design.md §1. Those three are
          a PASS, not a gap. If a stage typed one of them anyway without saying
          so, that is a finding — report it.
        - src/resume/model.py no longer exists and nothing imports it
        - priority.py no longer hardcodes a section-key tuple. Note that
          priority.py already filters `teaching` (line 67's min-priority
          tuple includes it) — this is existing, correct behaviour, not a gap
          to close or a bug to fix here.
        - FULL MIGRATION IS COMPLETE, not partial. Compare the remaining call
          sites against the ~62 recorded in sections.md — NOT against ~55.
          ~55 counts only the `data`-named subset; 7 further sites reach the
          same section keys through a parameter named `candidate`
          (keyword_match.py, aligner.py). Grepping `data\.get(` alone would
          measure a migration of ~55 as complete while roughly a tenth of the
          real call sites are untouched, so this check must cover both:
            grep -rn "data\.get(" src/resume/ | wc -l
            grep -rn "candidate\.get(" src/resume/ | wc -l
          Report both numbers and their sum. A handful may legitimately survive
          at the I/O boundary (inside from_dict, or reading a raw parse result
          before it is typed) — name each survivor and justify it. A large
          residue means renderers are still on dicts, which is the half-migrated
          state the plan explicitly rejects: report it as a FAIL, not as
          progress.
        - no function signature accepts a dict-or-dataclass union
        - `grep -rn "presentations\|coursework\|technologies" src/resume/`
          shows no remaining bare string-key dispatch

      TRAP — qlty in this worktree. .qlty/qlty.toml excludes **/.claude/**, so
      `qlty check` inside .claude/worktrees/ scans ZERO files and prints
      "No issues". That is exclusion, not cleanliness. Use `make lint`. If you
      run qlty at all, run it from the main checkout, and treat a suspiciously
      empty result as a broken environment.

      Write {workspace}/verify-schema.md with every number. If any check fails,
      report the specific failure and STOP — do not proceed to PDF on a red
      schema.
    agent:
      role: reviewer
      model: sonnet
      tools: [Bash, Read, Write]
      access: read-write
    required: true
    writes_to:
      - "{workspace}/verify-schema.md"

  # ==========================================================================
  # Stage 9: impl-pdf — DOCX -> PDF behind an optional dependency
  # ==========================================================================
  - name: impl-pdf
    kind: execute
    when: '"{skip_pdf}" does not contain "true"'
    depends_on: [verify-schema]
    reads_from: [verify-schema, init]
    description: >
      Implement PDF export by converting the rendered DOCX. Do NOT write a PDF
      renderer — reactive-resume's equivalent is 21,062 LOC, and conversion
      gets most of the value for ~80.

      Replace the branch at src/resume/cli/main.py:312-313, which currently
      raises "PDF rendering planned for future; use .docx output."

      Add src/resume/pdf_convert.py:
        - convert_docx_to_pdf(src, dst, *, run_func=None) -> None
        - follow the injectable-runner pattern already used in
          src/core/gh_cli.py, so tests run WITHOUT the binary installed
        - resolve the converter lazily: soffice, then libreoffice, then pandoc
        - subprocess call needs a `# nosec` comment explaining intent, per
          project rules on bandit
        - never pass user input as a shell string; use an argv list

      Wire into render: write DOCX to a temp path, convert, clean up. On
      success the user gets only the PDF unless they asked for both.

      ERROR HANDLING — this is most of the value here:
        - no converter found -> a CLIError naming the three binaries tried and
          how to install one. NOT a traceback, NOT a silent DOCX fallback.
          Silently producing a DOCX when the user asked for a PDF is exactly
          the kind of silent failure project rules forbid.
        - converter present but exits non-zero -> surface its stderr
        - converter hangs -> timeout, then a clear message
        - converter exits 0 but produces no file (LibreOffice does this) ->
          detect and fail loudly

      Keep it optional: the repo is dependency-light and LibreOffice is ~700MB.
      Nothing about the DOCX path may start requiring it.
    agent:
      role: code-writer
      model: inherit
      tools: [Read, Write, Edit, Bash]
      access: read-write
      isolation: worktree
    required: true
    writes_to:
      - "outputs/impl-pdf-summary.md"

  # ==========================================================================
  # Stage 10: test-pdf — tests that pass without the binary
  # ==========================================================================
  - name: test-pdf
    kind: execute
    when: '"{skip_pdf}" does not contain "true"'
    depends_on: [impl-pdf]
    reads_from: [impl-pdf]
    description: >
      Write tests at tests/resume_tests/test_pdf_convert.py. They MUST pass on
      a machine with no converter installed — CI has none. Inject a fake
      run_func; never shell out for real.

      Same ratio rule and the same naming contract as test-schema: sad-path
      methods are named `test_rejects_*` or `test_invalid_*` so verify can
      count them with grep. Error handling is nearly the whole surface here, so
      this should land well above the {min_sad_path_ratio} floor.

      HAPPY PATH:
        - a fake runner reporting success and producing a file -> PDF at dst
        - converter resolution prefers soffice, falls back in documented order
        - argv is a list, never a shell string (assert on the call args)

      SAD PATH:
        - no converter on PATH -> CLIError naming all three binaries, with
          install guidance; assert the message content, not just the type
        - converter exits non-zero -> stderr surfaced in the error
        - converter exits 0 but writes NO output file -> loud failure
        - converter times out -> clear message, no hang
        - output path unwritable (permissions) -> clear error
        - source DOCX missing -> clear error before the converter is invoked
        - a path containing spaces/quotes/unicode -> passed safely, no shell
          injection (this is why argv-not-string matters)
        - dst exists already -> documented behaviour, asserted

      Also assert the CLI contract: `render --out x.pdf` no longer raises the
      old "planned for future" message.

      Verify with `make test`.
    agent:
      role: tester
      model: sonnet
      tools: [Read, Write, Edit, Bash]
      access: read-write
      isolation: worktree
    required: true
    writes_to:
      - "outputs/test-pdf-summary.md"

  # ==========================================================================
  # Stage 11: verify-pdf-fidelity — a human LOOKS at the output
  # ==========================================================================
  - name: verify-pdf-fidelity
    kind: validate
    when: '"{skip_pdf}" does not contain "true"'
    human_gate: true
    depends_on: [test-pdf]
    reads_from: [impl-pdf, init]
    description: >
      A green test suite proves the plumbing works. It does NOT prove the PDF
      looks right, and fidelity is the actual risk here.

      Per {workspace}/baseline.md, this machine may have no converter. If none
      is installed, report that plainly, mark fidelity UNVERIFIED, and tell the
      human what to install. Do NOT claim the feature works.

      If a converter IS available, render both layouts to PDF:
        - the standard layout (expected to convert cleanly)
        - the SIDEBAR layout — the real risk. src/resume/docx_sidebar.py builds
          two columns as a borderless table with cell shading, and borderless
          table edges, cell shading, and repeating headers are precisely what
          DOCX->PDF converters render worst.

      Write both PDFs under {workspace} and report, per layout:
        - page count matches the DOCX
        - the sidebar column is present, correctly positioned and shaded
        - no visible table borders where the DOCX had none
        - fonts substituted or preserved
        - no text clipped at column or page boundaries
        - links still clickable
        - experience entries render sensibly, including two flat entries at the
          same company (multi-role nesting was deferred; there is no promoted
          role shape to check)

      Then STOP and present findings. Ask the human to decide:
        (a) fidelity acceptable — ship it
        (b) standard layout only; sidebar gated behind a warning
        (c) fidelity inadequate — keep DOCX-only and reopen the renderer question

      Do not resolve this yourself. "The exit code was 0" is not evidence a
      resume looks right, and a subtly broken resume is worse than none.
    agent:
      role: reviewer
      model: sonnet
      tools: [Bash, Read, Write]
      access: read-write
    required: true
    writes_to:
      - "{workspace}/pdf-fidelity.md"

  # ==========================================================================
  # Stage 12: report — what changed, what is still open
  # ==========================================================================
  - name: report
    kind: publish
    depends_on: [verify-pdf-fidelity]
    reads_from: [verify-schema, verify-pdf-fidelity, audit-sections, init, cr-validate-code]
    description: >
      Write {workspace}/report.md summarizing the run. Measured numbers only —
      pull them from verify-schema.md and pdf-fidelity.md rather than
      restating stage intentions.

      Include:
        - sections typed: before (5) -> after (N of 22), and the three
          deliberately untyped (`skills`, `teaching`, `contact`) with reasons
        - multi-role experience: DEFERRED at the design-schema gate, with the
          rationale (no production data exercises it) and the additive
          `group_id` follow-up. Report it as a recorded decision, not a gap.
        - call sites migrated, by file, against the audited ~62 total
        - tests added, with the measured sad-path ratio
        - coverage before -> after on src/resume/
        - code-review findings: critical (must be 0) and minor, with what was
          done about each minor
        - PDF: implemented / skipped / fidelity-blocked, and for which layouts
        - JSON Schema: emitted, and where it lands

      Then state honestly what is NOT done:
        - any section key still untyped BEYOND the three deliberate ones
        - any call site left on bare string keys (check both `data.get(` and
          `candidate.get(`; the latter is where a partial migration hides)
        - the one known out-of-scope item, so the next person does not assume
          it was handled: enforcing validation remains an opt-in follow-up
        - whether PDF fidelity was actually verified or only assumed
        - whether the sidebar layout survived conversion
        - anything deferred, and why

      Be specific about gaps. A report claiming completeness the run did not
      achieve is worse than one listing three known gaps — the next person
      acts on this document.
    agent:
      role: doc-writer
      model: sonnet
      tools: [Read, Write, Bash]
      access: read-write
    required: true
    writes_to:
      - "{workspace}/report.md"
