name: qwen-job-type
version: "1.0"
description: >
  Minimal worked example of adding a HANDLER-BACKED job type to the worker
  queue — the pattern workflows/code/qwen-local-handler.yaml uses at full
  scale. Copy this file as the starting point for a new job type.

  The two existing demos cover a different thing: worker-queue-stage.yaml and
  worker-queue-fanout.yaml show how a workflow STAGE is dispatched to the
  queue (executor: worker_queue), which runs shell commands through the
  existing workflow_stage handler. Neither shows how to register a NEW entry
  in worker/handlers.py's REGISTRY so `./bin/worker enqueue --type <yours>`
  becomes a thing at all. That is what this demo is for.

  What you get by registering a handler, rather than rebuilding any of it:
  priority ordering, not_before scheduling, attempts/backoff, the
  deferred-/terminal- outcome protocol, max_inflight clamping, stale-job
  reaping, and the whole `worker list/status/show/retry/purge` CLI. The
  `--type` choices in `worker enqueue --help` derive from HANDLERS.keys(), so
  a registered handler appears in the CLI automatically.

  Stage dependency graph:

    read-the-seam                (G0 — record the real handler contract)
        |
    write-handler                (G1 — isolated; implement + COMMIT)
        |
    verify-landed  [human gate]  (G2 — READ-ONLY: verify the merge landed,
        |                              confirm the CLI sees the type, and
        |                              propose exactly what will be enqueued)
        |
    drive-the-queue              (G3 — publish; the ONLY stage that mutates
                                       the real queue, released only after
                                       the gate above is approved)

  FOUR THINGS THIS DEMO EXISTS TO TEACH, each of which is a defect that has
  actually shipped in this repo:

  1. An `isolation: worktree` stage MUST instruct its agent to commit.
     `git merge` moves commits, not uncommitted files — an agent that edits
     and returns without committing leaves nothing to merge, the merge
     succeeds against an empty branch, and the stage reports success while
     the code is silently lost. See write-handler's description.

  2. A stage whose contract lives in `description` must NOT be
     `kind: validate`. dispatch.py's `_validate()` builds its prompt from
     `validation.criteria` alone and never reads the description, so a
     validate stage carrying a real contract ships one no agent ever sees —
     and `./bin/workflow lint` stays green. No stage here is
     `kind: validate` for that reason.

  3. A `human_gate` fires AFTER its stage completes, so it CANNOT protect a
     side effect that happens INSIDE that stage. This is the subtlest thing
     this demo teaches, because the broken shape looks correct and reads as
     a safeguard.

     The engine's own check is `stage.spec.human_gate and
     group_results[name].status == StageStatus.success`
     (src/workflow/orchestrator.py:228): it inspects the RESULT of a stage
     that has already run, then sets status `awaiting_human`.
     .claude/skills/workflow/SKILL.md Step 3 says the same in prose — "when
     a stage has `human_gate: true` and completed successfully". Compiling
     confirms it: `_compute_parallel_groups` isolates a gated stage into its
     own group so the run can PAUSE AFTER it, not before it.

     So an earlier revision of this file put `human_gate: true` on a single
     `land-and-verify` stage that both checked the merge and enqueued four
     real jobs. By the time the user was asked anything, all four jobs were
     already in their queue and drained. The prompt was a notification
     wearing a safeguard's clothes — worse than no gate, because a reader
     copying the shape would believe the mutation was guarded.

     THE FIX IS STRUCTURAL, NOT A FLAG: split the stage on the read/write
     seam. The read-only half carries the gate and its job is to PROPOSE —
     it must state precisely what is about to happen (how many jobs, of what
     type, what cannot be undone). The mutating half is a separate
     `kind: publish` stage that `depends_on` the gated one, so the engine
     cannot release it until a person approves. That is why this demo has
     `verify-landed` (gather, gated) and `drive-the-queue` (publish,
     ungated) rather than one stage carrying both keywords. A gate is only
     as good as the work that has NOT yet happened when it fires.

     On the `publish` half specifically: `publish` and `human_gate` answer
     different questions — `publish` tells the ENGINE an external side
     effect is permitted, while `human_gate` asks the PERSON. The workflow
     skill's convention authorizes external side effects only from publish
     stages, and the prompt generated for an execute stage tells the agent
     there are none — so an execute stage that touches the real queue both
     forbids and requires its own actions. `drive-the-queue` enqueues and
     drains real jobs, which is why it is publish; `read-the-seam`,
     `write-handler` and `verify-landed` stay gather/execute/gather because
     they only read source, or write inside their own worktree.

  4. A handler speaks the retry protocol through its RETURN STRING, not
     through exceptions. `terminal-` means never retry; `deferred-` means
     re-queue without consuming an attempt; anything else retries with
     backoff until max_attempts. Misclassifying a permanent failure as a
     plain one makes the daemon retry it forever.

  Run it through the /workflow SKILL, not the CLI:

    /workflow --workflow workflows/demo/qwen-job-type.yaml --execute

  `./bin/workflow run --execute` is NOT the execution path for a workflow
  whose stages need agents. It writes the dispatch files, returns a run in
  status=pending, and exits — it never spawns the agents, so nothing creates
  the handler and nothing drives the queue. Every stage here is agent-backed,
  so the CLI form stops before any of the work happens while reporting a
  successful invocation. That failure mode is quiet, which is why this demo
  names the skill instead. Use the CLI for `parse`, `compile`, `lint` and
  `list`, which are genuinely CLI operations.

metadata:
  author: dancing-bear
  created: "2026-09-22"

trigger:
  source: manual
  params:
    job_type: "demo_echo"
    handler_module: "src/worker/demo_echo.py"

workspace_dir: "{work_dir}/qwen-job-type-demo"

stages:
  # ===========================================================================
  # G0: Read the seam — record the real contract instead of assuming it
  # ===========================================================================
  - name: read-the-seam
    kind: gather
    depends_on: []
    reads_from: []
    description: >
      Record the handler contract from source, so the next stage implements
      against what the code does rather than what this file says about it.

      File access rules: use the Read tool (not cat/head/tail) and Glob (not
      find/ls). Bash is for CLI probes only.

      STEP 0 — VALIDATE THE CALLER-OVERRIDABLE PARAMS FOR THE WHOLE RUN.
      Both `{handler_module}` and `{job_type}` come from --params, and
      write-handler creates a file at the path `{handler_module}` names. This
      check lives HERE, in the first stage, and not in write-handler, for a
      reason that is structural rather than stylistic — do not "simplify" it
      back down there:

        write-handler is `isolation: worktree`. Per
        .claude/skills/workflow/SKILL.md rule 7a the isolation boundary
        applies in BOTH directions: an isolated agent cannot read
        {workspace}. What the orchestrator copies into `<its-cwd>/inputs/` is
        every declared output of every upstream stage plus each upstream
        stage's result JSON — and manifest.json is neither. It sits at the
        workspace root and is no stage's declared output, so a
        {workspace}/manifest.json read from inside write-handler cannot
        resolve, and the params would reach the Create step unvalidated.

      Read both from the file the ENGINE wrote, so neither ever becomes shell
      source (a heredoc does not help: probe-disproven, since a newline plus
      the delimiter closes it and runs the remainder while the regex then
      passes on the remnant). This stage is NOT isolated, so
      {workspace}/manifest.json is readable here:

        ./bin/workflow check-params {workspace}/manifest.json \
          --check 'handler_module=src/worker/[a-z][a-z0-9_]{2,40}\.py' \
          --check 'job_type=[a-z][a-z0-9_]{2,40}'

      One call covers both params and exits non-zero if either fails. The
      check lives in src/workflow/param_guard.py and is covered by
      tests/workflow_tests/test_param_guard.py, including the heredoc-escape
      payload above — so a future edit here cannot silently gut it.

      Branch on the EXIT STATUS, not on echoed text. If it fails, ABORT the
      whole run here — write seam.json with {"aborted": true, "reason":
      "handler_module or job_type failed validation"} and report the stage
      FAILED, so write-handler is never scheduled and nothing is ever written
      to the rejected path. Do not sanitize or auto-correct a rejected value:
      an override naming production code is a caller error to report.

      Then apply the check the regex cannot make: THE MODULE MUST NOT ALREADY
      EXIST. The pattern above still matches real production files —
      `src/worker/handlers.py`, `queue_ops.py`, `job_runtime.py`. This
      workflow creates a NEW module, so an existing path is always wrong, and
      overwriting shared worker code would be merged into the branch by the
      orchestrator. Record the result as `handler_module_exists` in seam.json
      and ABORT on true, exactly as above.

      Read and record:
        1. src/worker/handlers.py — the HandlerFn type alias, the exact
           (bool, object) return contract, and how REGISTRY is populated at
           the bottom of the file. Note the `# nosec` convention on any
           subprocess call site.
        2. src/worker/job_runtime.py — `_handle_outcome`. Record verbatim how
           a returned string starting "deferred-" and "terminal-" is treated
           differently from any other failure string, and where attempts and
           max_attempts are read.
        3. src/worker/cli.py — the `enqueue` command, showing that --type's
           choices come from HANDLERS.keys().
        4. src/worker/queue_ops.py — the Job dataclass fields.

      Then probe the CLI as it exists today:
        ./bin/worker enqueue --help
      and record the current --type choices. "{job_type}" must NOT be among
      them yet; if it already is, say so and set
      `job_type_already_registered` true.

      That flag is a STOP signal, not a note — and this stage acts on it.
      Because `{job_type}` is caller-overridable, an existing key such as
      `run_cli` would make write-handler's REGISTRY line REPLACE a built-in
      handler for every job of that type, which the orchestrator would then
      merge. So on true, ABORT here the same way as STEP 0: write seam.json
      with {"aborted": true, ...} and report the stage FAILED. Record the
      flag accurately either way — write-handler re-checks it from its copied
      input as a second line of defence, and a false negative here disables
      both guards.

      Write {workspace}/outputs/analysis/seam.json:
        {
          "handler_signature": "...",
          "return_contract": "...",
          "registry_pattern": "...",
          "retry_protocol": {"terminal_prefix": "...", "deferred_prefix": "...", "plain_failure": "..."},
          "job_fields": ["..."],
          "current_types": ["..."],
          "job_type_already_registered": true|false,
          "params_validated": true,
          "handler_module_exists": true|false
        }
    agent:
      role: researcher
      model: sonnet
      tools: [Read, Glob, Grep, Bash, Write]
      access: read-only
    required: true
    outputs:
      - name: seam
        mode: generate
        description: >
          seam.json recording the handler signature, return contract, registry
          pattern and retry prefixes read from source.
    # A writes_to entry not already rooted under outputs/ validation/ stages/
    # or dispatch/ is resolved to {workspace}/outputs/<entry> by
    # src/workflow/dispatch.py's _write_paths (_WORKSPACE_SUBDIRS). Declare
    # the entry with the outputs/ prefix already on it, matching the
    # description above, so the declared path and the resolved path are the
    # same string — copy this pattern rather than a bare relative path.
    writes_to:
      - outputs/analysis/seam.json
    validates_output:
      - path: outputs/analysis/seam.json
        checks: [is_json, has_key:handler_signature, has_key:retry_protocol]

  # ===========================================================================
  # G1: Write the handler — isolated worktree, and it MUST commit
  # ===========================================================================
  - name: write-handler
    kind: execute
    depends_on: [read-the-seam]
    reads_from: [read-the-seam]
    description: >
      STEP 0 — RE-CHECK THE GUARDS BEFORE YOU WRITE ANYTHING. This stage
      creates a file at the path `{handler_module}` names, so every check
      must run before the Create step; a check placed later — next to the
      `git add` line, say — runs after the Write has already happened, which
      protects the wrong thing.

      WHERE THE PARAM VALIDATION LIVES, AND WHY IT IS NOT HERE. Both
      `{handler_module}` and `{job_type}` are caller-overridable via --params
      and are validated by read-the-seam's STEP 0, against
      {workspace}/manifest.json — the file the ENGINE wrote, so neither value
      ever becomes shell source. That check CANNOT be moved into this stage,
      and moving it here would silently disable it:

        this stage is `isolation: worktree`, and per
        .claude/skills/workflow/SKILL.md rule 7a the isolation boundary
        applies in BOTH directions — an isolated agent cannot read
        {workspace}. The orchestrator copies in every declared output of
        every upstream stage plus each upstream stage's result JSON, and
        manifest.json is neither: it sits at the workspace root and is no
        stage's declared output. So a {workspace}/manifest.json read from
        here cannot resolve, and a validation written here would not run at
        all. read-the-seam is not isolated, runs first, and aborts the run on
        a bad param — so a rejected value never reaches this stage.

      What you must still do here, from your COPIED INPUTS only — read
      `<your-cwd>/inputs/outputs/analysis/seam.json`:

        1. CONFIRM THE PARAMS WERE VALIDATED. seam.json records
           `params_validated`. If it is absent or not true, read-the-seam did
           not complete its guard; ABORT rather than assuming the path is
           safe.

        2. THE MODULE MUST NOT ALREADY EXIST. read-the-seam records
           `handler_module_exists`, but re-check it directly with the Read or
           Glob tool against `{handler_module}` — an upstream stage's view is
           a snapshot, and this is the last moment before the Write. The
           validated pattern still matches real production files —
           `src/worker/handlers.py`, `queue_ops.py`, `job_runtime.py`. This
           stage creates a NEW module, so an existing path is always wrong,
           and overwriting shared worker code here would be merged into the
           branch by the orchestrator. If the file exists, ABORT; do not
           overwrite and do not pick a different name.

        3. THE JOB TYPE MUST NOT ALREADY BE REGISTERED. seam.json records
           `job_type_already_registered`. If it is true, the key names an
           existing handler — `run_cli` and `run_shell` both match the
           validated pattern — and writing the REGISTRY line would REPLACE a
           built-in handler for every job of that type. ABORT.

      On any of these, write handler.json with {"aborted": true, "reason":
      "..."} and report the stage FAILED. Do not sanitize a rejected value:
      an override that names production code is a caller error to report.

      Implement a minimal "{job_type}" handler against the contract recorded
      in read-the-seam's output.

      THIS STAGE IS ISOLATED (`isolation: worktree`): you run in your own
      worktree, not in the shared {workspace}. Per .claude/skills/workflow/SKILL.md
      rule 7a, the orchestrator copies every upstream output into
      `<your-cwd>/inputs/`, preserving its relative path — it does NOT put
      anything under {workspace}, which you cannot reach from here. So
      read-the-seam's `outputs/analysis/seam.json` arrives at
      `<your-cwd>/inputs/outputs/analysis/seam.json`, NOT at
      `{workspace}/outputs/analysis/seam.json` and NOT at a bare
      `outputs/analysis/seam.json` relative to some other directory. Read it
      from `<your-cwd>/inputs/outputs/analysis/seam.json`. This is the general
      rule for every isolated stage, not a one-off: an isolated agent's inputs
      always land under `inputs/<the upstream stage's own writes_to path>`
      relative to its own cwd, because rule 7a copies inputs in rather than
      giving the agent access to the shared tree.

      Deliberately trivial behaviour, so the demo teaches the WIRING rather
      than the payload: the handler echoes back the payload's "message" key.

      Create {handler_module}:
        - A `handle_demo_echo(job: dict[str, object]) -> tuple[bool, object]`
          matching the HandlerFn signature from seam.json.
        - EXTRACT THE PAYLOAD FIRST. A HandlerFn receives the COMPLETE JOB
          RECORD, not a payload: the signature is
          `(job: dict[str, object]) -> tuple[bool, object]`, and every real
          handler starts with `payload = dict(job.get("payload") or {})`
          (see src/worker/handlers.py:179). There is no `payload` variable
          in scope until you make one. Skipping this line leaves `payload`
          undefined, so the handler raises NameError — which the daemon
          classifies as a RETRYABLE failure, burning every attempt on the
          very case this demo teaches as terminal.
        - Then read `message = payload.get("message")`. On success return
          (True, {"echoed": message, "length": len(message)}).
        - Demonstrate ALL THREE retry classes, since this is the part authors
          get wrong:
            * missing, empty, or NOT A STRING -> return
              (False, "terminal-no-message")
              — a malformed payload will never become valid on retry, so
              retrying it burns attempts for nothing.

              Check the TYPE, not just presence: `isinstance(message, str)`.
              A payload is JSON from an untrusted enqueuer, so `{"message":
              123}` is as reachable as a missing key. Without the type check
              it reaches `len(message)`, raises TypeError out of the handler,
              and the daemon classifies an uncaught exception as a RETRYABLE
              failure — so the one case this demo exists to teach as terminal
              is the one it would get wrong, and it would burn every attempt
              re-raising the identical error. Validate before you measure.
            * payload sets "defer": true -> return (False, "deferred-demo")
              — re-queued without consuming an attempt.
            * payload sets "fail": true -> return (False, "transient failure")
              — a plain string, which retries with backoff.
          Use the EXACT prefixes from seam.json's retry_protocol; a misspelled
          prefix silently degrades to a plain retry.
        - Full type annotations. A new file is not grandfathered by the mypy
          baseline, so it must be clean.

      Then register it in src/worker/handlers.py, following the existing
      pattern at the bottom of that file — an import plus a REGISTRY entry
      keyed "{job_type}". Touch nothing else in that file.

      COMMIT BEFORE FINISHING — this is the single most important instruction
      in this demo. You run in your own git worktree on a `worktree-agent-*`
      branch. The orchestrator merges your work with `git merge`, which moves
      COMMITS, not uncommitted files. If you return with edits uncommitted,
      the merge succeeds against an empty branch, this stage reports success,
      and everything you wrote is silently lost. So as your final action:
      Both params were validated by read-the-seam before this stage was ever
      scheduled, and STEP 0 above re-checks the remaining guards before the
      Create step. That ordering is the point: a check placed down here would
      run after the agent had already written to whatever path
      `{handler_module}` names.

        git add {handler_module} src/worker/handlers.py
        git commit -m "feat(worker): add the demo handler"
      Stage the files by name — never `git add -A`, which would sweep up
      other agents' work in a shared tree. Confirm with `git log --oneline -1`
      and record the SHA below.

      Write handler.json to `<your-cwd>/outputs/handler.json` — NOT to
      `{workspace}/outputs/handler.json`, which is unreachable from here for
      the same reason your inputs are not there. Per rule 7b, the
      orchestrator copies this stage's declared `writes_to` files from your
      cwd into `{workspace}` as part of completing this stage, before any
      dependent stage is released. Writing to a literal `{workspace}` path
      instead would write into the shared tree from inside your isolated
      worktree filesystem view — at best a no-op, at worst a file the
      orchestrator's copy-back step never looks for and downstream stages
      never see.
        {"files_created": [...], "files_modified": [...], "registry_key": "{job_type}", "commit_sha": "...", "retry_cases": ["terminal", "deferred", "plain"]}
    agent:
      role: code-writer
      model: sonnet
      tools: [Read, Write, Edit, Bash, Glob, Grep]
      access: read-write
      isolation: worktree
    required: true
    outputs:
      - name: handler
        mode: generate
        description: >
          The handler module and its REGISTRY entry, committed to the agent's
          worktree branch; handler.json records the files and the commit SHA.
    writes_to:
      - outputs/handler.json
    validates_output:
      - path: outputs/handler.json
        checks: [is_json, has_key:commit_sha, has_key:registry_key]

  # ===========================================================================
  # G2: Land it and drive it through the real CLI
  # ===========================================================================
  - name: verify-landed
    # gather, NOT publish: every action in this stage READS. It inspects git
    # history and the working tree, and probes `worker enqueue --help`, which
    # prints usage and touches no queue state. Nothing here changes anything
    # outside the workspace, so it needs no publish authorization.
    kind: gather
    # THE GATE LIVES HERE, ON THE READ-ONLY HALF, AND THAT PLACEMENT IS THE
    # ENTIRE POINT — see teaching point 3 in the header.
    #
    # A human_gate fires AFTER its stage completes
    # (src/workflow/orchestrator.py:228 tests human_gate against an
    # already-successful StageResult). Putting it on a stage that enqueues
    # jobs would ask the user for permission AFTER the jobs were already in
    # their queue — which is what an earlier revision of this file did.
    #
    # Because this stage only reads, "after it completes" is a moment when
    # NOTHING has been mutated yet. The mutation lives in drive-the-queue,
    # which depends_on this stage and therefore cannot be released until the
    # gate is approved. The gate protects the side effect by standing between
    # the proposal and the publish, not by sitting on top of the publish.
    #
    # This is the general rule for gating any irreversible action: gate a
    # read-only proposal stage, and make the mutation a separate downstream
    # stage. Copy the SHAPE, not just the keyword.
    human_gate: true
    depends_on: [write-handler]
    reads_from: [write-handler, read-the-seam]
    description: >
      VERIFY that write-handler's commit landed and that the CLI now offers
      the new type, then PROPOSE the queue operations the next stage will
      perform. This stage must not enqueue, drain, or otherwise touch queue
      state — it exists so a person can approve the mutation before it
      happens.

      Step 1 — verify it landed. Do NOT merge anything here — that is the
      whole point of this step. .claude/skills/workflow/SKILL.md rule 7
      assigns copy-back and the branch merge to the ORCHESTRATOR, as part of
      write-handler's own completion, before this stage is ever released. By
      the time verify-landed runs, worktree-agent-<id> is already merged,
      so `git log <this-branch>..worktree-agent-<id>` is EMPTY on a correct
      run — that is what a successful merge looks like, not the silent-loss
      case. An earlier draft of this stage ran `git merge` itself and treated
      that empty range as the failure to detect, which would fail a run
      exactly when everything went right. (The same defect was found and
      fixed in workflows/code/qwen-local-handler.yaml's merge-impl stage;
      this step mirrors that stage's reasoning.)

      Read outputs/handler.json for commit_sha. If it is null or absent, the
      agent never committed and its work is gone: FAIL this stage and say so
      plainly.

      VALIDATE IT BEFORE IT REACHES A COMMAND LINE. handler.json is written
      by an agent, so commit_sha is not trustworthy input merely because a
      stage of ours produced it — a confused or compromised agent can put
      anything in that field, and it goes straight into a git invocation
      below. Require a full 40-character hex SHA and nothing else:

        ./bin/workflow check-params {workspace}/outputs/handler.json --top-level \
          --check 'commit_sha=[0-9a-f]{40}'

      `--top-level` reads the field from the document root, because
      handler.json is a stage output rather than the engine's manifest. A null
      or absent commit_sha fails the check, so the "agent never committed"
      case is caught by the same call. The check lives in
      src/workflow/param_guard.py, covered by
      tests/workflow_tests/test_param_guard.py.

      Branch on the EXIT STATUS. A short SHA, a ref name, or anything with a
      space or shell metacharacter FAILS this stage — do not resolve it, do
      not truncate it, do not retry with a rev-parse. Only the interpolated
      PATH below is engine-controlled; the value itself must be proven inert
      before it appears anywhere.

      Then confirm the commit actually landed:
        git merge-base --is-ancestor <the validated commit_sha> HEAD
      A non-zero exit means the orchestrator did not merge that branch —
      report it as unmerged; do not merge it yourself. Then confirm
      {handler_module} and src/worker/handlers.py exist in the working tree
      and are tracked by git (`git ls-files --error-unmatch <path>`) — a file
      present but untracked did not come from a merge.

      Step 2 — confirm the CLI sees it:
        ./bin/worker enqueue --help
      "{job_type}" must now appear in --type's choices. If not, the REGISTRY
      entry did not land — stop and report. `enqueue --help` prints usage and
      exits; it enqueues nothing, which is why it belongs in this read-only
      stage.

      Step 3 — STATE THE PROPOSAL. This is what the human gate will show the
      user, and it is the only thing standing between them and a real
      mutation of their queue, so be specific and do not soften it. Record in
      proposal.json, and say plainly in your stage report, that the NEXT
      stage (drive-the-queue) will:

        - Enqueue up to FOUR real jobs of type "{job_type}" into the shared
          worker queue at `~/Library/Application Support/dancing-bear/queue`.
          That path is a hardcoded constant
          (src/worker/_helpers.py's `get_worker_state_dir`) with no CLI flag
          or env var to redirect it, so there is no isolated queue to use
          instead and nothing to tear down afterwards.
        - Drain them through `./bin/worker run-once`, which EXECUTES real
          jobs — the queue head, not necessarily ours (see drive-the-queue's
          contention guard).
        - Leave records behind PERMANENTLY. `worker` has no delete-by-id:
          `show` and `retry` are the only id-scoped commands and neither
          deletes, while `purge` filters by age (`--older-than`) and folder
          (`--folders`) only, so it cannot target these four jobs and would
          delete every job type's history if run.
        - On a QUIET queue, leave one deferred job (case c) PENDING
          indefinitely, because the deferred- protocol restores attempts on
          every requeue and nothing drains it to a terminal state. Under a
          LOADED daemon that case is skipped entirely rather than left to
          cycle forever.

      Report the daemon's current state too, since it decides case (c):
        launchctl list | grep -F com.dancing-bear.worker
      Record `daemon_loaded` true/false. This is a read-only query.

      Write {workspace}/outputs/analysis/proposal.json:
        {
          "landed": {"commit_sha": "...", "is_ancestor_of_head": true|false, "files_tracked": true|false},
          "type_in_cli": true|false,
          "daemon_loaded": true|false,
          "planned_jobs": [
            {"case": "success",  "payload": {"message": "hello"}},
            {"case": "terminal", "payload": {}},
            {"case": "plain",    "payload": {"message": "x", "fail": true}},
            {"case": "deferred", "payload": {"message": "x", "defer": true}, "will_run": true|false, "skip_reason": "daemon active — a deferred job would cycle indefinitely" | null}
          ],
          "irreversible": true,
          "irreversible_reason": "no id-scoped delete and no queue-root override; see stage description",
          "safe_to_proceed": true|false
        }

      `safe_to_proceed` is true only if the commit is an ancestor of HEAD,
      the files are tracked, and the type appeared in the CLI. If it is
      false, say so prominently — approving the gate would then enqueue jobs
      for a handler that did not actually land.
    agent:
      role: researcher
      model: sonnet
      tools: [Read, Glob, Grep, Bash, Write]
      access: read-only
    required: true
    outputs:
      - name: proposal
        mode: generate
        description: >
          proposal.json recording the ancestry and tracked-file checks, the
          CLI registration check, the daemon's state, and the exact queue
          mutations drive-the-queue will perform once the gate is approved.
    writes_to:
      - outputs/analysis/proposal.json
    validates_output:
      - path: outputs/analysis/proposal.json
        checks: [is_json, has_key:landed, has_key:planned_jobs, has_key:safe_to_proceed]

  # ===========================================================================
  # G3: Drive the real queue — the only stage that mutates external state,
  #     released only after verify-landed's human gate is approved
  # ===========================================================================
  - name: drive-the-queue
    # publish, not execute: this stage enqueues and drains REAL jobs in the
    # user's queue, which is an external state change. The skill's convention
    # authorizes those only from a publish stage, and the generated execute
    # prompt tells the agent there are none — so declaring execute would both
    # forbid and require the same queue operations. Copy this reasoning, not
    # just the keyword, when adapting this demo.
    kind: publish
    # NOTE THE ABSENCE OF `human_gate` HERE, WHICH IS DELIBERATE. Adding one
    # would not add protection: it would fire after this stage had already
    # enqueued and drained everything. The protection comes from depends_on
    # below — the engine cannot release this stage until verify-landed's gate
    # is approved, and verify-landed mutates nothing. Gating the proposal is
    # what makes the approval meaningful; gating the mutation would only
    # announce it after the fact.
    depends_on: [verify-landed]
    reads_from: [verify-landed, write-handler, read-the-seam]
    description: >
      The human gate on verify-landed has been approved, so its proposal
      stands: drive the registration through the real CLI — not by importing
      the handler directly in Python, which would skip the wiring this demo
      is about.

      Read `{workspace}/outputs/analysis/proposal.json` first. If
      `safe_to_proceed` is not true, STOP and fail this stage without
      enqueuing anything: the approval was for a proposal whose preconditions
      held, and enqueuing jobs for a handler that did not land is not what was
      approved. Honour `planned_jobs[].will_run` for the deferred case rather
      than re-deciding it — the user approved that specific plan.

      Exercise all FOUR retry classes through the queue: success,
      terminal, deferred, and plain failure. For each, enqueue and capture
      the returned job id, then drain with `./bin/worker run-once --max 1`.

      `run-once --max 1` processes the QUEUE HEAD, not the job you just
      enqueued — enqueue/run-once has no --id scoping, and list_pending sorts
      globally by (priority, enqueued_at) with no type filter.

      THE PRE-DRAIN COUNT CHECK IS A FILTER, NOT A GUARANTEE — and it cannot
      be made one from here. This mirrors workflows/code/qwen-local-handler.yaml's
      Check E, which hit the identical problem; follow that stage's resolution
      rather than inventing another.

      `./bin/worker list` followed by `./bin/worker run-once` is NOT atomic.
      Another producer can enqueue in the gap between the two commands; the
      launchd daemon can claim work in that same gap; and `run-once` has no
      id or type selector, so it claims the QUEUE HEAD whatever that turns out
      to be. "Pending count is 1" therefore narrows the odds — it is worth
      doing, because it cheaply rules out the common contended case — but it
      is NOT proof of ownership, and this stage must never report it as such.

      So treat the count check as necessary-but-not-sufficient, and VERIFY
      AFTER THE FACT:

        a. READ YOUR JOB BACK BY ID FIRST, before any run-once. If the daemon
           already handled it, that is a valid drain — PREFER IT and skip
           run-once entirely. The daemon takes the real queue lock, so this
           path involves no racy claim at all. Record which path handled the
           job (run-once vs daemon).
        b. Otherwise run `./bin/worker list`. Drain with
           `./bin/worker run-once --max 1` ONLY when your job is
           unambiguously the only pending entry.
        c. If anything else is pending, do NOT drain. Wait briefly and
           re-check whether the daemon took yours, or record this case as
           "not-verified — queue contended, N other jobs pending" and move
           on. A case skipped for a stated reason is a fine demo result.
        d. AFTER any drain, read the job back with `./bin/worker show <id>`
           and confirm it carries the id you enqueued, comparing
           job_type/payload rather than accepting "something drained". If it
           does not match, you drained someone else's job: record this case
           as INVALID, say which id you actually saw, and do NOT present its
           outcome as evidence of anything about the retry protocol. An
           after-the-fact mismatch is recoverable as a reporting problem;
           presenting a contaminated drain as proof is not.

      Do not describe this as eliminating the race — it does not. What the
      guard buys is that a contended drain is DETECTED and reported honestly
      instead of being silently attributed to our own job. The residual risk
      is real: on a busy queue this demo can still execute one of the user's
      jobs and consume one of its attempts, which is not undoable. That is
      the cost of driving a shared queue with a CLI that has no id-scoped
      drain, and it is stated in verify-landed's proposal so the gate is
      approved with it in view.

      RUN THE CASES IN THIS ORDER: a) success, b) terminal, d) plain failure,
      then c) deferred LAST. Case (c) is the only one that ends with a job
      still pending, so running it earlier makes the pending count permanently
      greater than 1 and the filter above then blocks every later case — the
      plain-failure case would never drain at all. Ordering deferred last
      keeps the filter satisfiable for the cases that precede it. (The letters
      keep their original meaning below; only the execution order changes.)

        a) Success:
             ./bin/worker enqueue --type "{job_type}" --payload-json '{"message": "hello"}'
           Expect: job in done/, result carries echoed + length.
        b) Terminal:
             ./bin/worker enqueue --type "{job_type}" --payload-json '{}'
           Expect: job in error/ after ONE attempt. This is the important
           one — confirm attempts did not climb to max_attempts, which is
           what proves the terminal- prefix was honoured rather than the
           failure being treated as retryable.
        c) Deferred:
             ./bin/worker enqueue --type "{job_type}" --payload-json '{"message": "x", "defer": true}'
           Expect: job back in pending/ with attempts UNCHANGED from before
           this drain (not incremented, not reset to 0 — the same number it
           had going in). The unchanged count is the entire point of the
           deferred- protocol: job_runtime's _handle_outcome calls
           _undo_retry_attempt to restore the pre-drain attempts after a
           deferred- requeue, precisely so a defer never consumes a retry.
           Asserting only "it did not complete" would also pass for a plain
           retry, which increments attempts — record the before/after
           attempts count for this case to prove it did NOT change.
        d) Plain failure:
             ./bin/worker enqueue --type "{job_type}" --payload-json '{"message": "x", "fail": true}'
           Expect: attempts incremented and the job re-queued to pending
           with a future not_before, not moved to error/ on the first try.

      Step 4 — leave the four jobs where they are; do not attempt to remove
      them. This demo writes real jobs into the real, shared queue at
      `~/Library/Application Support/dancing-bear/queue` — `worker`'s queue
      root is a hardcoded constant (`src/worker/_helpers.py`'s
      `get_worker_state_dir`) with no CLI flag or env var to point it
      elsewhere for this run, so there is no isolated queue to tear down
      after. Deleting by id is equally not available: `worker show <id>` and
      `worker retry <id>` are the only id-scoped commands, and neither
      deletes; `worker purge` deletes by age (`--older-than`) and folder
      (`--folders`) only, with no id or job-type filter, so running it here
      would delete every job type's history, not just this demo's four jobs.
      TWO OF THE FOUR ARE NOT INERT, and that is the part worth stating
      plainly rather than filing under "accepted cost". Cases (c) and (d)
      end in PENDING, not done/ or error/:
        - (d) plain failure retries with backoff until max_attempts, then
          lands in error/ — bounded, self-limiting, fine.
        - (c) deferred is NOT bounded. The deferred- protocol restores
          attempts on every requeue (that is its whole point), so if the
          launchd daemon is running it will pick this job up every poll,
          defer it, requeue it, and repeat — indefinitely, at the daemon's
          interval, for as long as the machine is up. A demo must not leave
          a perpetual background workload in a user's queue.

      So before finishing, deal with case (c) explicitly. That decision was
      ALREADY MADE AND APPROVED at the gate: verify-landed recorded
      `daemon_loaded` and set `planned_jobs[].will_run` for the deferred case
      accordingly, and the user approved that specific plan. Honour it rather
      than re-deciding it here — re-running the `launchctl` probe and
      reaching a different answer would execute something the gate did not
      approve. The two branches the plan chooses between are:
        - `will_run: false` (daemon loaded): do not run case (c) against the
          live queue at all. Record it as "not-run — daemon active, deferred
          job would cycle indefinitely" and note that its behaviour is
          covered by the handler's unit tests instead. A skipped case with a
          stated reason is an honest demo result.
        - `will_run: true` (no daemon running): run it ONCE to observe the
          deferral, then leave it pending and say so.

          Do NOT try to drain it to a terminal state. An earlier revision of
          this file said to run `run-once` repeatedly "until its attempts
          exhaust and it lands in error/", which cannot happen: the
          `deferred-` branch in job_runtime.py:155-158 calls
          `_undo_retry_attempt` after every requeue, restoring the attempt
          count by design. The job would defer forever and the loop would
          never terminate — the instruction was a dead end, and following it
          literally is worse than leaving the job pending.

          Since `worker` has no delete-by-id, the honest options are to leave
          one pending job behind (recording it, so the reader can remove it)
          or to skip the case. Prefer the skip above whenever the daemon is
          loaded; this branch exists only for a quiet queue, where a single
          pending job cycles nothing because nothing is polling.

      Record in verified.json which path you took for (c), and that the
      remaining "{job_type}" jobs sit in done/ and error/ as inert records —
      a known cost of running this demo against the real queue. Those two are
      genuinely harmless: nothing re-runs a job in done/ or error/.

      Write {workspace}/validation/verified.json:
        {
          "landed": {"commit_sha": "...", "is_ancestor_of_head": true|false, "files_tracked": true|false},
          "type_in_cli": true|false,
          "cases": [
            {"case": "success",  "job_id": "...", "drained_by": "run-once|daemon", "id_confirmed": true|false, "final_state": "done",    "attempts_before": N, "attempts_after": N, "as_expected": true|false},
            {"case": "terminal", "job_id": "...", "drained_by": "run-once|daemon", "id_confirmed": true|false, "final_state": "error",   "attempts_before": N, "attempts_after": N, "as_expected": true|false},
            {"case": "deferred", "disposition": "not-run-daemon-active|observed-left-pending", "job_id": "..." | null, "drained_by": "run-once|daemon|null", "id_confirmed": true|false|null, "final_state": "not-run|pending", "attempts_before": N|null, "attempts_after": N|null, "as_expected": true|false},
            {"case": "plain",    "job_id": "...", "drained_by": "run-once|daemon", "id_confirmed": true|false, "final_state": "pending", "attempts_before": N, "attempts_after": N, "as_expected": true|false}
          ],
          "cleanup": {"jobs_left_in_queue": ["<success_id>", "<terminal_id>", "<plain_id>", "<deferred_id if observed-left-pending>"], "deferred_job_disposition": "not-run-daemon-active|observed-left-pending", "reason": "no id-scoped delete or queue-root override exists; see stage description. Under a LOADED daemon the deferred case is not run at all, because a deferred job would cycle forever. On a quiet queue it is observed once and left pending, which cycles nothing because nothing is polling — record its id above so the reader can remove it."},
          "verified": true|false
        }

      COPY `landed` and `type_in_cli` FORWARD from verify-landed's
      proposal.json rather than re-deriving them. Those checks belong to the
      read-only stage that ran before the gate, and re-running git or the CLI
      probe here could report a different answer than the one the user
      approved — verified.json must describe the run that was authorized.

      verified is true only if proposal.json's `landed` showed the commit is
      an ancestor of HEAD, `type_in_cli` was true, and every case that RAN
      behaved as expected — in particular, only if the terminal case stopped
      after one attempt.

      A case whose `id_confirmed` is false is INVALID, not failed: it means
      the drain hit a job that was not ours, so it says nothing about the
      retry protocol either way. Record `as_expected: false` with a reason
      naming the id actually seen, and set `verified` false — a run that
      cannot tell whose job it drained has not demonstrated the protocol.

      The deferred case is conditional, so its predicate is conditional too:
        - disposition "observed-left-pending" (quiet queue): attempts_after
          must equal attempts_before. That equality is the whole point of the
          deferred- protocol and is the only thing that distinguishes it from
          an ordinary retry.
        - disposition "not-run-daemon-active": the case was deliberately
          skipped, attempts_before and attempts_after are both null, and
          verified is NOT failed for it. Record as_expected true with the
          skip reason.

      Do not require an equality between two nulls, and do not report a
      skipped case as verified behaviour. A run that skips the deferred case
      on a live queue and says so is a truthful, successful run; one that
      claims to have proven the attempt-restoration without executing it is
      not.
    agent:
      role: code-writer
      model: sonnet
      tools: [Bash, Read, Write, Edit]
      access: read-write
    required: true
    outputs:
      - name: verified
        mode: generate
        description: >
          verified.json recording the ancestry check, the CLI registration
          check, and one id-scoped drained job per retry class (success,
          terminal, deferred, plain) with its attempt count before and after.
    writes_to:
      - validation/verified.json
    validates_output:
      - path: validation/verified.json
        checks: [is_json, has_key:cases, has_key:verified]
