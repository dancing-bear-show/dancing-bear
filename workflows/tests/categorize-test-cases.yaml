name: categorize-test-cases
version: "1.0"
description: >
  Sweep every test_* method across tests/ and classify each as happy-path,
  sad-path (error/edge), or unassigned (ambiguous intent). Then map methods
  back to the source symbols they exercise and emit a gap matrix identifying
  symbols that have happy-path coverage but no sad-path coverage. The output
  matrix (sad-path-gaps.json) is the fan_out source for fill-sad-path-gaps.yaml.

  Static analysis only — no coverage tool and no test execution.

trigger:
  source: manual

stages:
  # ===========================================================================
  # 1. Inventory every test method across the whole suite.
  # ===========================================================================
  - name: gather-test-methods
    kind: gather
    description: >
      Produce a flat inventory of every test method in the repo.

      Steps:
        1. Run: find tests -name "test_*.py" -not -name "__init__.py"
        2. For each file, extract every "def test_*" method name with its line
           number. Track the enclosing "class Test*" name where present.
        3. Aggregate into a JSON object with a top-level "methods" list. Each
           entry has:
             - file    (repo-relative path, e.g. tests/test_charts_cli.py)
             - cls     (enclosing class name, or null if module-level)
             - method  (the test method name)
             - line    (1-indexed line of the def)
        4. Do not read method bodies in this stage; names and locations only.

      Write the result to {workspace}/outputs/test-methods.json.
    agent:
      role: researcher
      model: haiku
      tools: [Read, Bash, Grep]
      access: read-only
    outputs:
      - name: test-methods
        mode: generate
        description: >
          JSON object with key "methods": flat list of
          {{file, cls, method, line}} for every test_* method.
    writes_to:
      - outputs/test-methods.json

  # ===========================================================================
  # 2. Classify each method happy / sad / unassigned. Fan out per test file so
  #    the classifier reads real method bodies, not just names.
  # ===========================================================================
  - name: partition-files
    kind: gather
    depends_on: [gather-test-methods]
    reads_from: [gather-test-methods]
    description: >
      Read {workspace}/outputs/test-methods.json and produce the fan_out work
      list: one item per distinct test file that contains at least one method.

      Write {workspace}/outputs/file-list.json with a top-level "items" array.
      Each item has:
        - file  (repo-relative path)
        - slug  (the file path with "/" and "." replaced by "_", used as the
                 shard filename, e.g. tests_test_charts_cli_py)

      Only include files that appear in test-methods.json. The top-level array
      MUST be named "items" so downstream fan_out `field: items` resolves.
    agent:
      role: researcher
      model: haiku
      tools: [Read, Write]
      access: read-only
    outputs:
      - name: file-list
        mode: generate
        description: >
          JSON object with key "items": list of {{file, slug}} — one per
          test file to classify.
    writes_to:
      - outputs/file-list.json

  - name: classify-methods
    kind: execute
    depends_on: [partition-files]
    reads_from: [gather-test-methods, partition-files]
    description: >
      Classify every test method in one test file ({file}).

      Read the file at {file}. For each test_* method in it, read the method
      body and assign exactly one category:

        happy       The method exercises the normal/expected path: valid input
                    producing a correct result. Assertions confirm a success
                    value, correct transformation, or expected state.

        sad         The method exercises an error, failure, or edge path:
                    asserts an exception is raised (assertRaises / pytest.raises),
                    asserts a non-zero exit / error message, feeds invalid,
                    empty, malformed, boundary, or missing input, or verifies
                    a rejection/validation-failure. Names commonly contain:
                    invalid, missing, empty, raises, error, fails, exits,
                    rejects, malformed, none, bad, not_found, out_of_range.

        unassigned  Intent is genuinely ambiguous from name AND body — e.g.
                    idempotency/round-trip/config-plumbing tests that neither
                    assert success semantics nor an error, or a method whose
                    body is too thin (pass / bare smoke import) to tell.
                    Do NOT use unassigned as a dumping ground: only when a
                    method truly does not fit happy or sad.

      Also record which source symbol(s) the method most likely exercises:
        - Read the file's imports to see what module/symbols it pulls in.
        - Infer the target symbol from the method name and the call(s) under
          assertion (e.g. test_parse_row_invalid -> parse_row).
        - Record a best-effort list "targets" of {{module, symbol}} — module is
          the imported source module path (e.g. src/charts/renderer.py or
          charts.renderer), symbol is the function/class/method under test.
          Empty list if it cannot be determined.

      Write per-file findings to {workspace}/outputs/shards/{slug}.json:
        {
          "file": "{file}",
          "methods": [
            {
              "cls": "TestFoo" | null,
              "method": "test_parse_row_invalid",
              "line": 42,
              "category": "sad",
              "reason": "asserts SystemExit on malformed JSON",
              "targets": [{"module": "src/charts/cli.py", "symbol": "parse_row"}]
            }
          ]
        }

      Every method in the file must appear exactly once with a category.
    agent:
      role: reviewer
      model: sonnet
      tools: [Read, Write, Grep]
      access: read-only
    required: true
    fan_out:
      source: partition-files
      field: items
      key: file
      mode: agent
    writes_to:
      - outputs/shards/{slug}.json

  # ===========================================================================
  # 3. Consolidate shards into the classification report + the sad-path gap
  #    matrix that drives the fix workflow.
  # ===========================================================================
  - name: build-matrix
    kind: propose
    human_gate: true
    depends_on: [classify-methods]
    reads_from: [classify-methods, gather-test-methods]
    description: >
      Consolidate every per-file shard into two artifacts.

      Read all files matching {workspace}/outputs/shards/*.json.

      Artifact A — {workspace}/outputs/classification.json:
        {
          "totals": {"happy": N, "sad": N, "unassigned": N, "methods": N,
                     "files": N},
          "by_file": [
            {"file": "...", "happy": N, "sad": N, "unassigned": N}
          ],
          "unassigned": [
            {"file": "...", "cls": "...", "method": "...", "line": N,
             "reason": "..."}
          ]
        }
        The "unassigned" list contains every method categorized unassigned,
        so a human can eyeball ambiguous tests during the gate.

      Artifact B — {workspace}/outputs/sad-path-gaps.json:
        Aggregate method targets into a per-symbol coverage matrix, then keep
        only the gaps.

        For each distinct (module, symbol) seen across all shards' targets:
          - happy_tests: list of {{file, method}} where a method targeting that
            symbol was categorized happy
          - sad_tests:   same, for sad
          - A symbol is a GAP if len(happy_tests) >= 1 AND len(sad_tests) == 0.
            (It has a working happy path but no error/edge coverage.)

        Emit ONLY gap symbols, most-covered-happy first (proxy for importance),
        into a top-level "items" array so fill-sad-path-gaps.yaml can fan out:
        {
          "items": [
            {
              "module": "src/charts/cli.py",
              "symbol": "parse_row",
              "test_file": "tests/test_charts_cli.py",
              "happy_test_count": 3,
              "happy_examples": ["test_valid_row_returns_dict"],
              "suggested_sad_cases": [
                "malformed input raises/exits",
                "missing required field",
                "empty / boundary input"
              ]
            }
          ],
          "gap_count": N
        }

        test_file is the file that already tests the symbol's happy path (new
        sad tests should be added there to keep coverage colocated). If happy
        tests span multiple files, pick the one with the most happy methods.
        Symbols categorized only unassigned (no happy, no sad) are NOT gaps —
        list their count in a "skipped_unassigned_only" integer field for
        visibility, but do not add them to items.

      Present a short summary at the human gate: totals, top 10 gap symbols,
      and count of unassigned methods needing human triage.
    agent:
      role: reviewer
      model: sonnet
      tools: [Read, Write, Bash]
      access: read-only
    required: true
    outputs:
      - name: classification
        mode: generate
        description: >
          JSON coverage/classification report with totals, per-file counts,
          and the full unassigned list.
      - name: sad-path-gaps
        mode: generate
        description: >
          JSON object with key "items": per-symbol gap list (happy coverage,
          no sad coverage) that drives fill-sad-path-gaps.yaml.
    writes_to:
      - outputs/classification.json
      - outputs/sad-path-gaps.json
