  # It is untracked, so it never reaches CI, but a local scan still walks it and
  # reports its placeholder stubs as F821/S905 — 8 phantom findings that look
  # like real undefined names. Excluded so local and CI scans agree.
  "**/.claire/**",
  "**/.venv/**",
  "**/.cache/**",
  "**/out/**",
  "**/_out/**",
  "**/backups/**",
  "**/maker/**",
  "**/_disasm/**",
  "**/personal_assistants.egg-info/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
  # A single-file AST analyser that the facade-elimination workflow shells out
  # to by path. Production consumers run it as a script, never as an imported
  # module; tests/test_detect_facades.py does load it, via
  # importlib.util.spec_from_file_location, to exercise its helpers directly.
  #
  # file_complexity sums to 172 against a threshold of 100 (see
  # [smells.file_complexity] below), but the excess is inherent to the shape:
  # 27 small helpers, none of which trips function_complexity individually,
  # which have to live in one file because the workflow invokes one path.
  # Splitting it into a package to satisfy a file-level sum would add
  # indirection to a script with exactly one caller. Excluded by path rather
  # than by raising the global threshold, which was deliberately tuned to 100
  # and would stop catching genuinely runaway modules.
  #
  # ---- ACCEPTED GAP: this is broader than the finding it silences ----
  #
  # exclude_patterns is a TOP-LEVEL exclusion, so it drops this file from
  # `qlty check` as well as `qlty smells` — ruff, bandit, and every other
  # configured plugin included. CI runs `qlty check --no-progress`
  # (.github/workflows/ci.yml), so this file is unlinted and unscanned there.
  # Verified empirically: an injected `eval()` and unused import in this file
  # produce NO qlty finding, while the identical code in a sibling file is
  # flagged ruff:F401 + bandit:B307.
  #
  # This gap is accepted rather than worked around because per-smell and
  # per-plugin exclusion do not exist in qlty: `[[exclude]]` with
  # `plugins = [...]` is parsed without complaint and suppresses nothing, and
  # `[[smells.exclude]]` warns "not part of the supported configuration and
  # will be ignored". exclude_patterns is the only mechanism that works.
  #
  # COMPENSATING CONTROL: `make lint` runs the qlty-pinned ruff directly over
  # src/, tests/, and bin/ — it does not read exclude_patterns, but it also
  # does not cover workflows/. Lint this file explicitly when editing it:
  #     bin/ruff-resolve.sh check workflows/code/scripts/detect_facades.py
  # (verified clean as of this commit). Behaviour is covered by
  # tests/test_detect_facades.py, which loads the module and exercises its
  # helpers, so functional regressions still fail CI via the tests job.
  "workflows/code/scripts/detect_facades.py",
  # --- BEGIN GENERATED WRAPPER SYMLINKS (bin/_gen_wrappers.py) ---
  # Every bin/<name> below is a SYMLINK to bin/_router.py, which is the single
  # real file behind all generated wrappers. qlty follows each symlink and reads
  # the same 115 lines once per name, then reports them as N clones of each
  # other -- one identical-code finding per wrapper, all pointing at the one
  # file. That is an artifact of symlink traversal, not duplicated source: git
  # stores these as mode 120000 pointing at a single blob.
  #
  # Only the symlink NAMES are excluded. bin/_router.py itself is deliberately
  # absent from this list and stays fully covered -- verified empirically: an
  # injected unused import and eval() in _router.py still report ruff:F401,
  # ruff:E402, and bandit:B307 with these exclusions active. This is unlike the
  # workflows/code/scripts/detect_facades.py entry above, where the excluded
  # path IS the real file and linting is genuinely lost.
  #
  # Generated from bin/_wrappers.yaml -- run `make bin-wrappers` to refresh.
  # `make bin-wrappers-check` (CI) fails if this block drifts from the config.
  "bin/apple-music-assistant",
  "bin/apple-music-user-token",
  "bin/assistant",
  "bin/calendar",
  "bin/calendar-assistant",
  "bin/charts",
  "bin/diagrams",
