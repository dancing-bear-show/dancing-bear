name: qwen-job-type
version: "1.0"
description: >
  Minimal worked example of adding a HANDLER-BACKED job type to the worker
  queue — the pattern workflows/code/qwen-local-handler.yaml uses at full
  scale. Copy this file as the starting point for a new job type.

  The two existing demos cover a different thing: worker-queue-stage.yaml and
  worker-queue-fanout.yaml show how a workflow STAGE is dispatched to the
  queue (executor: worker_queue), which runs shell commands through the
  existing workflow_stage handler. Neither shows how to register a NEW entry
  in worker/handlers.py's REGISTRY so `./bin/worker enqueue --type <yours>`
  becomes a thing at all. That is what this demo is for.

  What you get by registering a handler, rather than rebuilding any of it:
  priority ordering, not_before scheduling, attempts/backoff, the
  deferred-/terminal- outcome protocol, max_inflight clamping, stale-job
  reaping, and the whole `worker list/status/show/retry/purge` CLI. The
  `--type` choices in `worker enqueue --help` derive from HANDLERS.keys(), so
  a registered handler appears in the CLI automatically.

  Stage dependency graph:

    read-the-seam                (G0 — record the real handler contract)
        |
    write-handler                (G1 — isolated; implement + COMMIT)
        |
    land-and-verify              (G2 — verify the merge landed, drive the CLI)

  THREE THINGS THIS DEMO EXISTS TO TEACH, each of which is a defect that has
  actually shipped in this repo:

  1. An `isolation: worktree` stage MUST instruct its agent to commit.
     `git merge` moves commits, not uncommitted files — an agent that edits
     and returns without committing leaves nothing to merge, the merge
     succeeds against an empty branch, and the stage reports success while
     the code is silently lost. See write-handler's description.

  2. A stage whose contract lives in `description` must NOT be
     `kind: validate`. dispatch.py's `_validate()` builds its prompt from
     `validation.criteria` alone and never reads the description, so a
     validate stage carrying a real contract ships one no agent ever sees —
     and `./bin/workflow lint` stays green. Every stage here is
     `kind: gather` or `kind: execute` for that reason.

  3. A handler speaks the retry protocol through its RETURN STRING, not
     through exceptions. `terminal-` means never retry; `deferred-` means
     re-queue without consuming an attempt; anything else retries with
     backoff until max_attempts. Misclassifying a permanent failure as a
     plain one makes the daemon retry it forever.

  Run it:
    ./bin/workflow run workflows/demo/qwen-job-type.yaml --execute

metadata:
  author: dancing-bear
  created: "2026-09-22"

trigger:
  source: manual
  params:
    job_type: "demo_echo"
    handler_module: "src/worker/demo_echo.py"

workspace_dir: "{work_dir}/qwen-job-type-demo"

stages:
  # ===========================================================================
  # G0: Read the seam — record the real contract instead of assuming it
  # ===========================================================================
  - name: read-the-seam
    kind: gather
    depends_on: []
    reads_from: []
    description: >
      Record the handler contract from source, so the next stage implements
      against what the code does rather than what this file says about it.

      File access rules: use the Read tool (not cat/head/tail) and Glob (not
      find/ls). Bash is for CLI probes only.

      Read and record:
        1. src/worker/handlers.py — the HandlerFn type alias, the exact
           (bool, object) return contract, and how REGISTRY is populated at
           the bottom of the file. Note the `# nosec` convention on any
           subprocess call site.
        2. src/worker/job_runtime.py — `_handle_outcome`. Record verbatim how
           a returned string starting "deferred-" and "terminal-" is treated
           differently from any other failure string, and where attempts and
           max_attempts are read.
        3. src/worker/cli.py — the `enqueue` command, showing that --type's
           choices come from HANDLERS.keys().
        4. src/worker/queue_ops.py — the Job dataclass fields.

      Then probe the CLI as it exists today:
        ./bin/worker enqueue --help
      and record the current --type choices. "{job_type}" must NOT be among
      them yet; if it already is, this demo has been run before — say so.

      Write {workspace}/outputs/analysis/seam.json:
        {
          "handler_signature": "...",
          "return_contract": "...",
          "registry_pattern": "...",
          "retry_protocol": {"terminal_prefix": "...", "deferred_prefix": "...", "plain_failure": "..."},
          "job_fields": ["..."],
          "current_types": ["..."],
          "job_type_already_registered": true|false
        }
    agent:
      role: researcher
      model: sonnet
      tools: [Read, Glob, Grep, Bash, Write]
      access: read-only
    required: true
    outputs:
      - name: seam
        mode: generate
        description: >
          seam.json recording the handler signature, return contract, registry
          pattern and retry prefixes read from source.
    # A writes_to entry not already rooted under outputs/ validation/ stages/
    # or dispatch/ is resolved to {workspace}/outputs/<entry> by
    # src/workflow/dispatch.py's _write_paths (_WORKSPACE_SUBDIRS). Declare
    # the entry with the outputs/ prefix already on it, matching the
    # description above, so the declared path and the resolved path are the
    # same string — copy this pattern rather than a bare relative path.
    writes_to:
      - outputs/analysis/seam.json
    validates_output:
      - path: outputs/analysis/seam.json
        checks: [is_json, has_key:handler_signature, has_key:retry_protocol]

  # ===========================================================================
  # G1: Write the handler — isolated worktree, and it MUST commit
  # ===========================================================================
  - name: write-handler
    kind: execute
    depends_on: [read-the-seam]
    reads_from: [read-the-seam]
    description: >
      Implement a minimal "{job_type}" handler against the contract recorded
      in read-the-seam's output.

      THIS STAGE IS ISOLATED (`isolation: worktree`): you run in your own
      worktree, not in the shared {workspace}. Per .claude/skills/workflow/SKILL.md
      rule 7a, the orchestrator copies every upstream output into
      `<your-cwd>/inputs/`, preserving its relative path — it does NOT put
      anything under {workspace}, which you cannot reach from here. So
      read-the-seam's `outputs/analysis/seam.json` arrives at
      `<your-cwd>/inputs/outputs/analysis/seam.json`, NOT at
      `{workspace}/outputs/analysis/seam.json` and NOT at a bare
      `outputs/analysis/seam.json` relative to some other directory. Read it
      from `<your-cwd>/inputs/outputs/analysis/seam.json`. This is the general
      rule for every isolated stage, not a one-off: an isolated agent's inputs
      always land under `inputs/<the upstream stage's own writes_to path>`
      relative to its own cwd, because rule 7a copies inputs in rather than
      giving the agent access to the shared tree.

      Deliberately trivial behaviour, so the demo teaches the WIRING rather
      than the payload: the handler echoes back the payload's "message" key.

      Create {handler_module}:
        - A `handle_demo_echo(job: dict[str, object]) -> tuple[bool, object]`
          matching the HandlerFn signature from seam.json.
        - Read `payload["message"]`. On success return
          (True, {"echoed": message, "length": len(message)}).
        - Demonstrate ALL THREE retry classes, since this is the part authors
          get wrong:
            * missing/empty "message" -> return (False, "terminal-no-message")
              — a malformed payload will never become valid on retry, so
              retrying it burns attempts for nothing.
            * payload sets "defer": true -> return (False, "deferred-demo")
              — re-queued without consuming an attempt.
            * payload sets "fail": true -> return (False, "transient failure")
              — a plain string, which retries with backoff.
          Use the EXACT prefixes from seam.json's retry_protocol; a misspelled
          prefix silently degrades to a plain retry.
        - Full type annotations. A new file is not grandfathered by the mypy
          baseline, so it must be clean.

      Then register it in src/worker/handlers.py, following the existing
      pattern at the bottom of that file — an import plus a REGISTRY entry
      keyed "{job_type}". Touch nothing else in that file.

      COMMIT BEFORE FINISHING — this is the single most important instruction
      in this demo. You run in your own git worktree on a `worktree-agent-*`
      branch. The orchestrator merges your work with `git merge`, which moves
      COMMITS, not uncommitted files. If you return with edits uncommitted,
      the merge succeeds against an empty branch, this stage reports success,
      and everything you wrote is silently lost. So as your final action:
        git add {handler_module} src/worker/handlers.py
        git commit -m "feat(worker): add {job_type} demo handler"
      Stage the files by name — never `git add -A`, which would sweep up
      other agents' work in a shared tree. Confirm with `git log --oneline -1`
      and record the SHA below.

      Write handler.json to `<your-cwd>/outputs/handler.json` — NOT to
      `{workspace}/outputs/handler.json`, which is unreachable from here for
      the same reason your inputs are not there. Per rule 7b, the
      orchestrator copies this stage's declared `writes_to` files from your
      cwd into `{workspace}` as part of completing this stage, before any
      dependent stage is released. Writing to a literal `{workspace}` path
      instead would write into the shared tree from inside your isolated
      worktree filesystem view — at best a no-op, at worst a file the
      orchestrator's copy-back step never looks for and downstream stages
      never see.
        {"files_created": [...], "files_modified": [...], "registry_key": "{job_type}", "commit_sha": "...", "retry_cases": ["terminal", "deferred", "plain"]}
    agent:
      role: code-writer
      model: sonnet
      tools: [Read, Write, Edit, Bash, Glob, Grep]
      access: read-write
      isolation: worktree
    required: true
    outputs:
      - name: handler
        mode: generate
        description: >
          The handler module and its REGISTRY entry, committed to the agent's
          worktree branch; handler.json records the files and the commit SHA.
    writes_to:
      - outputs/handler.json
    validates_output:
      - path: outputs/handler.json
        checks: [is_json, has_key:commit_sha, has_key:registry_key]

  # ===========================================================================
  # G2: Land it and drive it through the real CLI
  # ===========================================================================
  - name: land-and-verify
    # publish, not execute: this stage enqueues and drains REAL jobs in the
    # user's queue, which is an external state change. The skill's convention
    # authorizes those only from a publish stage, and the generated execute
    # prompt tells the agent there are none — so declaring execute would both
    # forbid and require the same queue operations. Copy this reasoning, not
    # just the keyword, when adapting this demo.
    kind: publish
    depends_on: [write-handler]
    reads_from: [write-handler, read-the-seam]
    description: >
      VERIFY that write-handler's commit landed, then prove the registration
      works by driving the real CLI — not by importing the handler directly
      in Python, which would skip the wiring this demo is about.

      Step 1 — verify it landed. Do NOT merge anything here — that is the
      whole point of this step. .claude/skills/workflow/SKILL.md rule 7
      assigns copy-back and the branch merge to the ORCHESTRATOR, as part of
      write-handler's own completion, before this stage is ever released. By
      the time land-and-verify runs, worktree-agent-<id> is already merged,
      so `git log <this-branch>..worktree-agent-<id>` is EMPTY on a correct
      run — that is what a successful merge looks like, not the silent-loss
      case. An earlier draft of this stage ran `git merge` itself and treated
      that empty range as the failure to detect, which would fail a run
      exactly when everything went right. (The same defect was found and
      fixed in workflows/code/qwen-local-handler.yaml's merge-impl stage;
      this step mirrors that stage's reasoning.)

      Read outputs/handler.json for commit_sha. If it is null or absent, the
      agent never committed and its work is gone: FAIL this stage and say so
      plainly. Otherwise confirm the commit actually landed:
        git merge-base --is-ancestor <commit_sha> HEAD
      A non-zero exit means the orchestrator did not merge that branch —
      report it as unmerged; do not merge it yourself. Then confirm
      {handler_module} and src/worker/handlers.py exist in the working tree
      and are tracked by git (`git ls-files --error-unmatch <path>`) — a file
      present but untracked did not come from a merge.

      Step 2 — confirm the CLI sees it:
        ./bin/worker enqueue --help
      "{job_type}" must now appear in --type's choices. If not, the REGISTRY
      entry did not land — stop and report.

      Step 3 — exercise all FOUR retry classes through the queue: success,
      terminal, deferred, and plain failure. For each, enqueue and capture
      the returned job id, then drain with `./bin/worker run-once --max 1`.

      `run-once --max 1` processes the QUEUE HEAD, not the job you just
      enqueued — enqueue/run-once has no --id scoping, and list_pending sorts
      globally by (priority, enqueued_at) with no type filter.

      CHECK BEFORE YOU DRAIN, NOT ONLY AFTER. Reading the job back afterwards
      catches a WRONG REPORT, but by then you have already executed a real job
      of the user's and consumed one of its attempts — the damage is done and
      is not undoable. This is a demo run against the live queue, so it must
      not burn a stranger's work to prove a point. Before each drain:

        ./bin/worker list

      If the pending count is 1, your job is unambiguously the head and
      `./bin/worker run-once --max 1` is safe — run it. If anything else is
      pending, do NOT run run-once: either wait briefly and re-check whether
      the daemon took yours, or record this case as
      "not-verified — queue contended, N other jobs pending" and continue to
      the next one. A case skipped for a stated reason is a fine demo result;
      draining someone else's job is not.

      After any drain, still read your job back by id with
      `./bin/worker show <id>` and confirm it is the one you enqueued (compare
      job_type/payload, not just "something drained").

      Note if the launchd daemon is running it polls the same queue every 5s
      and may claim your job before run-once does. Check the job by id first;
      if `./bin/worker show <id>` already shows it done/errored/re-queued,
      that is a valid drain via the daemon, not a failure of this step —
      record which path (run-once vs daemon) actually handled it.

        a) Success: --payload-json '{"message": "hello"}'
           Expect: job in done/, result carries echoed + length.
        b) Terminal: --payload-json '{}'
           Expect: job in error/ after ONE attempt. This is the important
           one — confirm attempts did not climb to max_attempts, which is
           what proves the terminal- prefix was honoured rather than the
           failure being treated as retryable.
        c) Deferred: --payload-json '{"message": "x", "defer": true}'
           Expect: job back in pending/ with attempts UNCHANGED from before
           this drain (not incremented, not reset to 0 — the same number it
           had going in). The unchanged count is the entire point of the
           deferred- protocol: job_runtime's _handle_outcome calls
           _undo_retry_attempt to restore the pre-drain attempts after a
           deferred- requeue, precisely so a defer never consumes a retry.
           Asserting only "it did not complete" would also pass for a plain
           retry, which increments attempts — record the before/after
           attempts count for this case to prove it did NOT change.
        d) Plain failure: --payload-json '{"message": "x", "fail": true}'
           Expect: attempts incremented and the job re-queued to pending
           with a future not_before, not moved to error/ on the first try.

      Step 4 — leave the four jobs where they are; do not attempt to remove
      them. This demo writes real jobs into the real, shared queue at
      `~/Library/Application Support/dancing-bear/queue` — `worker`'s queue
      root is a hardcoded constant (`src/worker/_helpers.py`'s
      `get_worker_state_dir`) with no CLI flag or env var to point it
      elsewhere for this run, so there is no isolated queue to tear down
      after. Deleting by id is equally not available: `worker show <id>` and
      `worker retry <id>` are the only id-scoped commands, and neither
      deletes; `worker purge` deletes by age (`--older-than`) and folder
      (`--folders`) only, with no id or job-type filter, so running it here
      would delete every job type's history, not just this demo's four jobs.
      Record in verified.json that the four "{job_type}" jobs (one per retry
      class) remain in done/error/pending as a known, accepted cost of
      running this demo against the real queue. If you want them gone later,
      run this manually, understanding it prunes ALL job types older than the
      window, not just these:
        ./bin/worker purge --older-than 0d --folders done,error

      Write {workspace}/validation/verified.json:
        {
          "landed": {"commit_sha": "...", "is_ancestor_of_head": true|false, "files_tracked": true|false},
          "type_in_cli": true|false,
          "cases": [
            {"case": "success",  "job_id": "...", "final_state": "done",    "attempts_before": N, "attempts_after": N, "as_expected": true|false},
            {"case": "terminal", "job_id": "...", "final_state": "error",   "attempts_before": N, "attempts_after": N, "as_expected": true|false},
            {"case": "deferred", "job_id": "...", "final_state": "pending", "attempts_before": N, "attempts_after": N, "as_expected": true|false},
            {"case": "plain",    "job_id": "...", "final_state": "pending", "attempts_before": N, "attempts_after": N, "as_expected": true|false}
          ],
          "cleanup": {"jobs_left_in_queue": ["<success_id>", "<terminal_id>", "<deferred_id>", "<plain_id>"], "reason": "no id-scoped delete or queue-root override exists; see stage description"},
          "verified": true|false
        }

      verified is true only if the commit is an ancestor of HEAD, the type
      appeared in the CLI, and all four cases behaved as expected — in
      particular, only if the terminal case stopped after one attempt AND the
      deferred case's attempts_after equals its attempts_before.
    agent:
      role: code-writer
      model: sonnet
      tools: [Bash, Read, Write, Edit]
      access: read-write
    required: true
    outputs:
      - name: verified
        mode: generate
        description: >
          verified.json recording the ancestry check, the CLI registration
          check, and one id-scoped drained job per retry class (success,
          terminal, deferred, plain) with its attempt count before and after.
    writes_to:
      - validation/verified.json
    validates_output:
      - path: validation/verified.json
        checks: [is_json, has_key:cases, has_key:verified]
