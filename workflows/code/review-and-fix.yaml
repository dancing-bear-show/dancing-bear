# Adversarial swarm review followed by automated fix of all findings.
#
# Phase 1 — Review (via shared/code-review-swarm.yaml fragment):
#   init
#       |
#   fetch-pr-context → concern-sweep → enumerate-targets
#       → validate-concerns + cross-unit-check → consolidate
#       → fact-check-findings → human-gate → post-comments
#
# Phase 2 — Fix (depends on post-comments):
#   triage-findings
#       |
#   fix-code ─── fix-tests ─── fix-qlty  (parallel)
#       \              |              /
#              verify-fixes
#                    |
#            plan-thread-resolution -> resolve-threads (shared fragment)
#                    |
#          human-gate-fixes

name: review-and-fix
version: "1.0"
description: >
  Adversarial swarm code review followed by automated parallel fix of all
  confirmed findings. Phase 1 runs the full review swarm (diff fetch,
  concern sweep, per-file validation, consolidation, fact-check, human gate,
  inline comment posting). Phase 2 triages findings by fix type, fans out
  code, test, and qlty fixes in parallel, verifies everything is still
  green, resolves posted threads, and presents a final summary for human
  approval.

  Set skip_review: "true" to jump directly to Phase 2 if the swarm review
  already ran and findings are present in {workspace}/outputs/.

metadata:
  author: dancing-bear
  created: "2026-05-29"

trigger:
  source: manual
  params:
    # Explicit: a non-code-review caller of code-review-swarm.yaml, which
    # documents that such callers take the LARGE fan-out path. The fragment
    # defaults to "small", so leaving this undeclared would silently switch
    # this workflow to the single consolidated reviewer.
    pr_size: "large"
    pr_number: ""          # PR number (required; auto-detected from branch if blank)
    test_cmd: ""           # e.g. "pytest tests/grafana/ -x -q"
    source_root: ""        # e.g. "grafana/"
    test_path: ""          # e.g. "tests/grafana/"
    min_coverage: "80"     # coverage threshold (percent, no % sign)
    auth_domains: "github"
    skip_review: "false"   # set "true" to bypass Phase 1 if review already ran

workspace_dir: "{work_dir}/review-and-fix-{pr_number}"

stages:

  # ===========================================================================
  # Phase 1 entry: bootstrap workspace directories
  # ===========================================================================

  - name: init
    kind: gather
    description: >
      Bootstrap the workspace. Use the Bash tool to create the directory
      structure needed by downstream stages:
        mkdir -p {workspace}/outputs/diffs
        mkdir -p {workspace}/outputs/findings
        mkdir -p {workspace}/outputs/fix
        mkdir -p {workspace}/validation
      Exit 0 immediately. All substantive work begins in fetch-pr-context.

      If skip_review is "true", also write a sentinel file so Phase 2 stages
      know the swarm output already exists:
        echo "skip_review=true" > {workspace}/outputs/skip-review.txt
    agent:
      role: researcher
      model: sonnet
      tools: [Bash]
      access: read-only
    required: true
    writes_to: []

  # ===========================================================================
  # Phase 2: Triage findings by fix type
  # ===========================================================================

  - name: triage-findings
    kind: gather
    depends_on: [post-comments]
    reads_from: [post-comments, fetch-pr-context, consolidate]
    description: >
      Read the confirmed findings and current qlty issues. Group them
      into a fix manifest by fix type so parallel fix agents can self-select.

      Step 1 — read consolidated findings:
        Use the Read tool on {workspace}/outputs/consolidated.json.
        If the file is absent (skip_review was "true" and swarm never ran),
        fail with an explicit error: "consolidated.json not found — run without
        skip_review=true or supply prior swarm output".

      Step 2 — read post-comments results:
        Use the Read tool on {workspace}/outputs/post-results.json.
        Extract comment_urls so plan-thread-resolution can match findings to threads.

      Step 3 — fetch current qlty issues:
        Bash tool: ~/.qlty/bin/qlty check --format json
        Write raw output to {workspace}/outputs/fix/qlty-issues.json.

      Step 4 — classify each finding into one of four types:
        "code"       — logic bugs, type errors, incorrect control flow,
                       style issues in source files (not test files)
        "test"       — missing coverage, broken assertions, weak test patterns
        "docs"       — outdated docstrings, missing PATTERNS.md entries,
                       incorrect CLI help text
        "qlty"       — issues present in qlty-issues.json (new-code only)

      Classification rules:
        - If finding file path is under tests/, classify as "test"
        - If finding concern_id is "docstring-*" or "patterns-*", classify as "docs"
        - Otherwise classify as "code"
        - All qlty issues from Step 3 go into the "qlty" bucket

      Step 5 — write fix manifest:
        Use the Write tool to create {workspace}/outputs/fix-manifest.json:
          {
            "pr_number": "{pr_number}",
            "code": [
              {
                "finding_id": "0",
                "file": "foo.py",
                "line": 42,
                "concern_id": "silent-failure",
                "severity": "critical",
                "summary": "one-sentence description of what to fix",
                "comment_url": "https://github.com/..."
              }
            ],
            "test": [...],
            "docs": [...],
            "qlty": [
              {
                "key": "AY...",
                "file": "foo.py",
                "line": 55,
                "message": "qlty issue message",
                "severity": "MAJOR"
              }
            ]
          }

      Write a brief summary to {workspace}/outputs/fix/triage-summary.md:
        - Total findings by type
        - Files affected per type
        - Any findings with no fix type (manual review needed)
    agent:
      role: researcher
      model: sonnet
      tools: [Read, Bash, Write]
      access: read-write
    required: true
    writes_to:
      - outputs/fix-manifest.json
      - outputs/fix/triage-summary.md
      - outputs/fix/qlty-issues.json

  # ===========================================================================
  # Phase 2: Fix code issues (parallel with fix-tests and fix-qlty)
  # ===========================================================================

  - name: fix-code
    kind: execute
    depends_on: [triage-findings]
    # `consolidate` is required, not decorative: under isolation only the
    # outputs of declared upstream stages are staged into inputs/, and this
    # stage resolves item["finding_id"] against consolidated.json.
    reads_from: [triage-findings, fetch-pr-context, consolidate]
    description: >
      ISOLATED STAGE — you run in your OWN git worktree on a
      `worktree-agent-*` branch, not in the shared tree.

        - Read inputs from `<your-cwd>/inputs/`, NOT from {workspace}. The
          orchestrator stages every upstream output there before spawning you;
          the manifest below arrives as
          `<your-cwd>/inputs/outputs/fix-manifest.json`.
        - Write outputs to absolute paths under `<your-cwd>/outputs/`. Never
          write to {workspace} and never use a bare relative path — it would
          resolve against the orchestrator's cwd, outside your worktree.
        - COMMIT your code edits on your worktree branch before you finish.
          The parent transfers them with `git merge`, which moves COMMITS, not
          uncommitted files: an uncommitted edit is invisible to the merge and
          will silently not land, while this stage still reports success.
          Stage files by name (never `git add -A`), then commit.

      Fix each item in the "code" group of the fix manifest.

      For each item in fix-manifest.json["code"]:

        1. Use the Read tool on the file at item["file"].
        2. Locate the issue at item["line"] using the summary in item["summary"]
           and the original finding detail in consolidated.json (staged at
           `<your-cwd>/inputs/outputs/consolidated.json`, read by index
           item["finding_id"]).
        3. Apply the fix using the Edit tool. Keep the change minimal — fix only
           what the finding identifies; do not refactor surrounding code.
        4. After editing, run ruff on the changed file:
             Bash tool: bin/ruff-resolve.sh check --fix <the file from item["file"]>
           Substitute the actual path — this is not a workflow parameter.
           If ruff reports new errors unrelated to the fix, leave them — do not
           introduce scope creep.
        5. If item["finding_id"] maps to a test file in inputs/outputs/changed-files.txt,
           run the test suite. Pin PYTHONPATH to THIS worktree — a bare
           `python3 -m unittest` can resolve imports from an inherited
           main-checkout PYTHONPATH and pass without ever executing your code:
             Bash tool: PYTHONPATH="$PWD/src" {test_cmd}
           Confirm the `Ran N tests` line; an exit code alone is not evidence
           the suite ran. Record pass/fail.
        6. Commit your edits on the worktree branch (see the isolation note
           above), then record which branch they are on. merge-fix-worktrees
           identifies your branch from these fields and refuses to guess from
           a `worktree-agent-*` wildcard, since those refs persist between
           runs:
             Bash tool: git rev-parse --abbrev-ref HEAD   -> "branch"
             Bash tool: git rev-parse HEAD                -> "head_commit"
           Record both even when you made no edits; "fixed": [] with an empty
           branch is a legitimate no-op, and the merge stage distinguishes
           that from edits that were never committed.

      Write <your-cwd>/outputs/fix/fix-code-results.json:
        {
          "branch": "worktree-agent-...",
          "head_commit": "<sha from git rev-parse HEAD>",
          "fixed": [
            {
              "finding_id": "0",
              "file": "foo.py",
              "line": 42,
              "action": "patched",
              "test_result": "pass|fail|skipped"
            }
          ],
          "skipped": [
            {
              "finding_id": "1",
              "reason": "file not found or finding no longer present"
            }
          ],
          "errors": []
        }
    agent:
      role: code-writer
      model: sonnet
      tools: [Read, Edit, Bash]
      access: read-write
      # Runs concurrently with fix-tests and fix-qlty, and overlaps them by
      # file: a qlty finding and a code finding routinely land in the same
      # source file. Sharing one tree lets those edits interleave.
      isolation: worktree
    required: true
    writes_to:
      - outputs/fix/fix-code-results.json

  # ===========================================================================
  # Phase 2: Fix test issues (parallel with fix-code and fix-qlty)
  # ===========================================================================

  - name: fix-tests
    kind: execute
    depends_on: [triage-findings]
    reads_from: [triage-findings, fetch-pr-context]
    description: >
      ISOLATED STAGE — you run in your OWN git worktree on a
      `worktree-agent-*` branch, not in the shared tree.

        - Read inputs from `<your-cwd>/inputs/`, NOT from {workspace}. The
          manifest below arrives as
          `<your-cwd>/inputs/outputs/fix-manifest.json`.
        - Write outputs to absolute paths under `<your-cwd>/outputs/`. Never
          write to {workspace} and never use a bare relative path.
        - COMMIT your test edits on your worktree branch before you finish.
          `git merge` moves COMMITS, not uncommitted files: an uncommitted edit
          is invisible to the merge and will silently not land while this stage
          still reports success. Stage files by name (never `git add -A`).

      Fix each item in the "test" group of the fix manifest.

      For each item in fix-manifest.json["test"]:

        1. Use the Read tool on item["file"] for existing test context.
        2. Read the source file being tested (derive from test file path by
           replacing "tests/" with "" and removing the "test_"
           prefix from the filename).
        3. Apply the fix: add missing assertions, replace weak assertTrue() with
           specific assertEqual/assertIn, or add a new test function if coverage
           is missing entirely. Use the Edit tool for modifications; use the
           Write tool only when creating a new test file.
        4. After each edit, run the test to confirm it is green. Pin PYTHONPATH
           to THIS worktree — a bare `python3 -m unittest` can resolve imports
           from an inherited main-checkout PYTHONPATH and pass against code you
           did not change, which is indistinguishable from a real pass:
             Bash tool: PYTHONPATH="$PWD/src" python3 -m unittest <item["file"]> -f -q
           Confirm the `Ran N tests` line rather than trusting the exit code.
           If the test fails, re-read and fix before moving on.
        5. Commit your edits on the worktree branch (see the isolation note
           above), then record which branch they are on so
           merge-fix-worktrees can identify it without guessing from a
           `worktree-agent-*` wildcard:
             Bash tool: git rev-parse --abbrev-ref HEAD   -> "branch"
             Bash tool: git rev-parse HEAD                -> "head_commit"
           Record both even when you made no edits.

      Write <your-cwd>/outputs/fix/fix-tests-results.json:
        {
          "branch": "worktree-agent-...",
          "head_commit": "<sha from git rev-parse HEAD>",
          "fixed": [
            {
              "finding_id": "2",
              "file": "tests/foo/test_bar.py",
              "action": "assertion-strengthened|test-added",
              "test_result": "pass"
            }
          ],
          "skipped": [],
          "errors": []
        }
    agent:
      role: tester
      model: sonnet
      tools: [Read, Edit, Write, Bash]
      access: read-write
      # Concurrent with fix-code and fix-qlty; needs its own tree so test
      # edits cannot interleave with source edits mid-run.
      isolation: worktree
    required: true
    writes_to:
      - outputs/fix/fix-tests-results.json

  # ===========================================================================
  # Phase 2: Fix qlty issues (parallel with fix-code and fix-tests)
  # ===========================================================================

  - name: fix-qlty
    kind: execute
    depends_on: [triage-findings]
    # `fetch-pr-context` is required, not decorative: under isolation only the
    # outputs of declared upstream stages are staged into inputs/, and the
    # new-code scope filter below reads changed-files.txt from that stage.
    # Without it the filter silently degrades and pre-existing issues get
    # "fixed" outside the PR's scope.
    reads_from: [triage-findings, fetch-pr-context]
    description: >
      ISOLATED STAGE — you run in your OWN git worktree on a
      `worktree-agent-*` branch, not in the shared tree.

        - Read inputs from `<your-cwd>/inputs/`, NOT from {workspace}. The
          manifest arrives as `<your-cwd>/inputs/outputs/fix-manifest.json`
          and the issue list as
          `<your-cwd>/inputs/outputs/fix/qlty-issues.json`.
        - Write outputs to absolute paths under `<your-cwd>/outputs/`. Never
          write to {workspace} and never use a bare relative path.
        - COMMIT your edits on your worktree branch before you finish.
          `git merge` moves COMMITS, not uncommitted files: an uncommitted edit
          is invisible to the merge and will silently not land while this stage
          still reports success. Stage files by name (never `git add -A`).

      Fix new-code qlty issues from the fix manifest's ["qlty"] group. Only
      address issues in files changed by this PR (new-code scope — do not touch
      pre-existing issues).

      Step 1 — load issues:
        Use the Read tool on <your-cwd>/inputs/outputs/fix/qlty-issues.json.
        Filter to items where the file appears in
        <your-cwd>/inputs/outputs/changed-files.txt.

      Step 2 — fix each issue:
        For each issue:
          - Use the Read tool on issue["file"].
          - Apply the fix at issue["line"] per issue["message"].
            Common patterns:
              S1172 (unused param): add noqa with justification or remove param
              S3776 (cognitive complexity): extract a helper function
              S125 (commented-out code): remove stale comments
              S1481 (unused variable): remove or use it
          - Use the Edit tool for each change.

      Step 3 — verify qlty gate (run from YOUR worktree so it scans your edits):
        Bash tool: ~/.qlty/bin/qlty check {source_root} --format json
        Write result to <your-cwd>/outputs/fix/qlty-post-fix.json.

      Step 4 — commit your edits on the worktree branch (see the isolation note
        above), then record which branch they are on so merge-fix-worktrees
        can identify it without guessing from a `worktree-agent-*` wildcard:
          Bash tool: git rev-parse --abbrev-ref HEAD   -> "branch"
          Bash tool: git rev-parse HEAD                -> "head_commit"
        Record both even when you made no edits — an empty qlty bucket is
        common and is treated as a no-op, not a failure.

      Write <your-cwd>/outputs/fix/fix-sq-results.json:
        {
          "branch": "worktree-agent-...",
          "head_commit": "<sha from git rev-parse HEAD>",
          "fixed": [
            {
              "key": "AY...",
              "file": "foo.py",
              "line": 55,
              "message": "...",
              "action": "removed|extracted|annotated"
            }
          ],
          "skipped": [],
          "gate_status": "OK|ERROR|pending"
        }
    agent:
      role: code-writer
      model: sonnet
      tools: [Read, Edit, Bash, Write]
      access: read-write
      # Concurrent with fix-code, which edits the same source files.
      isolation: worktree
    required: true
    writes_to:
      - outputs/fix/fix-sq-results.json
      - outputs/fix/qlty-post-fix.json

  # ===========================================================================
  # Phase 2: Verify all fixes are green
  # ===========================================================================

  - name: merge-fix-worktrees
    kind: execute
    executor: inline
    depends_on: [fix-code, fix-tests, fix-qlty]
    # `fetch-pr-context` is required, not decorative: this stage commits to
    # whatever checkout runs the workflow, and pr-context.json is the only
    # record of which branch that is supposed to be.
    reads_from: [fix-code, fix-tests, fix-qlty, fetch-pr-context]
    description: >
      Land the isolated fix stages' commits on the PR branch before anything
      verifies them.

      fix-code, fix-tests and fix-qlty each run in their own git worktree, so
      their edits live on `worktree-agent-*` branches and are NOT present in
      the shared tree. Without this stage verify-fixes runs against an
      unchanged checkout and can report success while no fix landed — a green
      result that means nothing.

      Step 0a — confirm this checkout is the PR's head branch, BEFORE any
      merge. This stage writes commits to whatever branch is checked out, and
      nothing upstream guarantees that is the right one: `pr_number` can be
      passed explicitly, so the workflow may be reviewing one PR while the
      working tree sits on another branch entirely. Landing a fixer's commits
      on an unrelated branch is silent and hard to unpick.

        Use the Read tool on inputs/outputs/pr-context.json and take
        `headRefName`.
        Bash tool: git branch --show-current

        If they differ, STOP: write merge-results.json with "all_merged":
        false and a "wrong_branch" entry naming both refs, and fail this
        stage. Do not check out the correct branch here — switching branches
        under a running workflow is a bigger surprise than halting.

      Step 0b — capture the pre-merge ref, before touching anything:
        Bash tool: git rev-parse HEAD
        Call this PRE_FIX_SHA. It is the immutable baseline for both the
        ancestry checks and the final diff. Do not substitute a branch name:
        a branch moves as merges land, so a diff against it under-reports.

      For each of the three fix stages, in a deterministic order
      (fix-code, then fix-qlty, then fix-tests):

        1. Identify the stage's worktree branch from its result JSON, NOT by
           globbing `worktree-agent-*`. Those refs persist across runs, so a
           wildcard can match a stale or foreign branch and merge commits that
           have nothing to do with this run.

           Each fixer records `branch` and `head_commit` in its result file
           (see the schema in each fix stage). If a result file is missing
           either field, fail this stage for that fixer rather than guessing:
           an unidentifiable branch is not safe to merge.

           Verify the branch belongs to this run before merging it:
             Bash tool: git merge-base --is-ancestor <PRE_FIX_SHA> <branch>
           A branch that does not descend from PRE_FIX_SHA predates this run.
           Record it and fail — do not merge it.

        2. Decide whether there is anything to merge:
             Bash tool: git log --oneline <PRE_FIX_SHA>..<branch>

           An empty branch is a legitimate outcome: a bucket with no findings
           produces no edits, and the fixer prompts explicitly allow that.
           Record it as a no-op, skip the merge, and CONTINUE.

           It is a failure only when the fixer's result JSON lists entries
           under "fixed" while its branch has no commits — that means edits
           were made and never committed, so they would silently not land.
           Record the discrepancy and fail this stage.

        3. Merge (skip when step 2 found no commits):
             Bash tool: git merge --no-ff <branch> -m "merge fix stage <name>"
           On a conflict, abort the merge (`git merge --abort`), record the
           conflicting paths, and fail this stage. Do NOT resolve conflicts
           here — a conflict means two fixers changed the same lines and a
           human needs to see that.

        4. After all merges, confirm the expected files actually changed:
             Bash tool: git diff --name-only <PRE_FIX_SHA>..HEAD

      Write {workspace}/outputs/fix/merge-results.json:
        {
          "pre_fix_sha": "<PRE_FIX_SHA>",
          "merged": [
            {"stage": "fix-code", "branch": "worktree-agent-...",
             "commits": 2, "files": ["src/foo.py"]}
          ],
          "no_op": [
            {"stage": "fix-qlty", "branch": "worktree-agent-...",
             "detail": "bucket had no findings; branch empty as expected"}
          ],
          "uncommitted": [
            {"stage": "fix-tests", "reported_fixed": 3,
             "detail": "result lists fixes but branch has no commits"}
          ],
          "unidentifiable": [],
          "conflicts": [],
          "wrong_branch": null,
          "all_merged": true
        }

      "no_op" is a normal outcome and does NOT affect "all_merged".

      Set "all_merged" false only when something was actually lost or unsafe:
      a "wrong_branch" value (checkout is not the PR's head branch, so nothing
      was merged at all), an entry in "uncommitted" (fixes reported but not
      committed), in "unidentifiable" (result JSON missing branch/head_commit,
      or the branch does not descend from PRE_FIX_SHA), or in "conflicts".
      verify-fixes reads this field and refuses to run on false.

      "wrong_branch", when set, is
      {"expected": "<headRefName>", "actual": "<current branch>"}.
    agent:
      role: code-writer
      model: sonnet
      tools: [Bash, Read, Write]
      access: read-write
    required: true
    writes_to:
      - outputs/fix/merge-results.json

  # ===========================================================================
  # Phase 2: Verify all fixes are green
  # ===========================================================================

  - name: verify-fixes
    # kind: execute, NOT validate. A validate stage's description is dropped —
    # the engine renders only validation.criteria plus a generic "return a
    # JSON findings array" block — so the commands, the Step 0 merge gate, and
    # the {all_green: ...} schema below never reached the agent. It wrote a
    # findings ARRAY to verify-results.json, and the shared resolve gate, which
    # reads all_green from that file, blocked every run. review-fix-threads'
    # verify-fixes is kind: execute for the same reason.
    kind: execute
    depends_on: [merge-fix-worktrees]
    reads_from: [fix-code, fix-tests, fix-qlty, merge-fix-worktrees]
    description: >
      Confirm all fix rounds left the codebase in a green state. This stage
      does not apply fixes — it only reads and runs.

      Step 0 — confirm the fixes are actually present in this tree:
        Use the Read tool on {workspace}/outputs/fix/merge-results.json.
        If "all_merged" is false, or the file is missing or unparseable, STOP
        and report this stage failed. Every check below would otherwise run
        against a tree that does not contain the fixes, and pass.

      Step 1 — linting:
        Bash tool: bin/ruff-resolve.sh check {source_root}
        Record pass/fail and any new violations (violations that are not in the
        pre-fix diff are regressions from fix-code or fix-qlty).

      Step 2 — tests:
        Bash tool: {test_cmd}
        Record pass/fail. If test_cmd is blank, run, with PYTHONPATH pinned to
        this checkout so an inherited one cannot resolve imports to a different
        tree and pass without exercising these fixes:
          PYTHONPATH="$PWD/src" python3 -m unittest {test_path} -f -q
        If test_path is also blank, skip and mark as "no test_cmd provided".
        Confirm the `Ran N tests` line in the output — unittest writes it to
        stderr, and an exit code of 0 from a suite that executed nothing is
        indistinguishable from a real pass.

      Step 3 — qlty gate:
        Bash tool: ~/.qlty/bin/qlty check {source_root} --format json
        Parse any new issues on changed files.

      Step 4 — read fix result files:
        Use the Read tool on:
          {workspace}/outputs/fix/fix-code-results.json
          {workspace}/outputs/fix/fix-tests-results.json
          {workspace}/outputs/fix/fix-sq-results.json
        Count total fixed, skipped, and errors across all three.

      Write {workspace}/outputs/fix/verify-results.json:
        {
          "ruff": "pass|fail",
          "ruff_new_violations": [],
          "tests": "pass|fail|skipped",
          "qlty_new_issues": [],
          "fix_summary": {
            "code_fixed": N,
            "test_fixed": N,
            "sq_fixed": N,
            "total_skipped": N,
            "total_errors": N
          },
          "all_green": true|false
        }
    agent:
      role: unit-validator
      model: sonnet
      tools: [Read, Bash, Write]
      access: read-write
    # No validation: block. On a kind: execute stage it is never rendered and
    # triggers no correction pass (dispatch.py gates both on kind: validate),
    # so it would only imply a check that does not run. The contract lives in
    # the description above, which execute stages DO render.
    required: true
    writes_to:
      - outputs/fix/verify-results.json

  # ===========================================================================
  # Phase 2: Resolve posted PR threads for fixed findings
  # ===========================================================================

  - name: plan-thread-resolution
    kind: propose
    depends_on: [verify-fixes]
    reads_from: [verify-fixes, triage-findings, post-comments]
    description: >
      Decide which review threads this run has earned the right to close, and
      write the plan. The mutations themselves are done by the shared
      pr-thread-resolve fragment — this stage makes the judgement, not the
      API calls.

      Step 0 — gate on verification before planning anything. Read
      {workspace}/outputs/fix/verify-results.json and require all_green
      exactly true. A missing file, a parse error, an unexpected shape, or an
      absent all_green key all count as NOT green: write an empty plan with
      "blocked_reason" set and exit non-zero.

      Do not rely on the shared fragment's gate alone. A stage's status is
      self-reported and the completion template pre-fills "success", so
      verify-fixes reporting success is not evidence the tree is green. Check
      here as well, so a red tree never even produces a mutating plan.

      Step 1 — build the fixed finding set:
        Use the Read tool on {workspace}/outputs/fix/fix-code-results.json.
        Use the Read tool on {workspace}/outputs/fix/fix-tests-results.json.
        Collect all finding_ids with a "fixed" disposition and action !=
        "skipped".

      Step 2 — map each fixed finding to its thread.
        Use the Read tool on {workspace}/outputs/fix-manifest.json and extract
        each entry's comment_url.

        The github CLI scrubs a stale GITHUB_TOKEN automatically — no
        `GITHUB_TOKEN=` prefix or owner/repo preamble needed. Do not
        re-implement this fetch with raw gh or inline GraphQL.

        A comment_url does not carry the GraphQL thread id needed to resolve,
        so fetch the threads with their comment database ids. `./bin/github
        threads fetch` paginates BOTH thread and comment levels and verifies
        the count — the old raw GraphQL approach capped at 100 threads with no
        pagination check:
          ./bin/github threads fetch --pr {pr_number} \
            --out {workspace}/outputs/fix/threads-for-resolve.json

        If it exits non-zero, STOP: do not build resolve-plan.json from the
        file. A count mismatch still writes it (with `truncated: true`) for
        inspection, but a plan built from a partial fetch silently omits
        fixed threads, which then never get a reply or a resolve.

        The trailing numeric id in a comment_url is the comment databaseId.
        Match it against the databaseIds of ALL comments in each thread, not
        just the first: a finding posted as a reply inside an existing thread
        is not that thread's opening comment, and matching only the first
        comment would fail to find it.

      Step 3 — write {workspace}/outputs/resolve-plan.json in the schema the
      pr-thread-resolve fragment consumes:

        {
          "run_id": "<read from {workspace}/manifest.json \"run_id\">",
          "verify_file": "outputs/fix/verify-results.json",
          "triaged_count": 12,
          "planned_count": 12,
          "threads": [
            {"thread_id": "PRRT_...", "action": "reply-and-resolve",
             "reply": "Fixed in <sha>: <one line on what changed>."},
            {"thread_id": "PRRT_...", "action": "skip",
             "reason": "skipped — finding no longer present"}
          ]
        }

      "run_id" is the ORIGINAL run id from {workspace}/manifest.json — read it
      from that file, do not use the current invocation's id. Resuming a
      workflow mints a fresh `<name>-resumed-<hex>` id while manifest.json
      keeps the original, so a retry using the live id writes a different
      idempotency marker and posts duplicate replies. Fail rather than
      guessing if the key is missing.

      "verify_file" must be the exact path this workflow's verify-fixes stage
      writes — outputs/fix/verify-results.json. The fragment fails closed on
      it, so a wrong path blocks every resolve rather than allowing one
      through, but it must be right for the stage to do anything at all.

      Every thread gets a reply, including the ones being resolved. A thread
      closed with no explanation makes the reviewer re-derive what happened.

      The `<sha>` and `<one line on what changed>` above are PLACEHOLDERS to
      substitute, not text to post. Take the SHA from the actual pushed head
      commit and the summary from that thread's own fix result. The shared
      fragment posts the "reply" value verbatim, so a placeholder left in the
      plan is published to the reviewer as-is and the thread is then resolved
      on it.

      Before writing the plan, reject any reply still containing "<" followed
      by ">" and fail the stage rather than posting it.

      Never plan a sweep over every thread on the PR. A thread whose finding
      was skipped, or that a human opened about something else, must stay open
      — resolving it asserts a concern was handled when it was not. Anything
      not in the fixed set is action "skip" with the reason recorded.

      That is about which threads get RESOLVED, not which appear in the plan.
      Every finding in fix-manifest.json gets an entry, including skipped and
      rejected ones — a finding omitted from the plan is never replied to, so
      the reviewer sees an open thread with no answer and cannot distinguish
      that from the work not being done. Record "triaged_count" and
      "planned_count" and fail rather than writing a plan where they differ.

      Also write {workspace}/outputs/fix/thread-resolution.json for the human
      gate, recording the plan (not its outcome — the fragment reports that):
        {
          "resolved_finding_ids": ["0", "2"],
          "unresolved_finding_ids": ["1"],
          "unresolved_reason": {"1": "skipped — finding no longer present"},
          "plan_status": "ok|error"
        }
    agent:
      role: code-writer
      model: sonnet
      tools: [Read, Bash, Write]
      access: read-write
    required: true
    writes_to:
      - outputs/resolve-plan.json
      - outputs/fix/thread-resolution.json

  # ===========================================================================
  # Phase 2: Human gate — present fix summary
  # ===========================================================================

  - name: human-gate-fixes
    kind: propose
    depends_on: [verify-fixes, resolve-threads]
    reads_from: [verify-fixes, resolve-threads, plan-thread-resolution, triage-findings]
    human_gate: true
    description: >
      Present a full fix-round summary and ask the operator whether to approve
      or request another round.

      Read and summarise each Phase 2 artifact:

        Triage summary:
          Read {workspace}/outputs/fix/triage-summary.md.
          Show counts by fix type and files affected.

        Fix results:
          Read fix-code-results.json → count fixed / skipped / errors.
          Read fix-tests-results.json → count fixed / skipped / errors.
          Read fix-sq-results.json → count fixed / skipped.

        Verification:
          Read verify-results.json → ruff status, test status, qlty new issues, all_green.

        Thread resolution:
          Read resolution.json — the OUTCOME — for status, replied,
          already_replied, forged_marker, resolved, skipped, failed, and
          unresolved_after. Put any forged_marker entry at the TOP of the
          summary: someone other than this workflow's account posted this
          run's idempotency marker, which may be an attempt to suppress a
          reply. This gate is the workflow's only human checkpoint, so a
          signal left out here reaches no one.
          Read thread-resolution.json only for what was planned.

          Report the outcome, and name any gap between the two. A plan is an
          intention; resolution.json is what GitHub actually accepted. Showing
          the operator the plan alone reports successes that may not have
          happened — the precise failure this workflow's gate exists to catch.

      Present the summary to the operator, then ask:
        "Fix round complete. Approve for merge? (yes / request another round)"

      If the operator requests another round:
        Re-trigger by calling:
          Write the current PR body to a temp file, then:
            ./bin/github pr edit --pr {pr_number} --body-file <tmp-file>
          `./bin/github pr edit` reads the PR back after writing and exits 1 if
          GitHub does not reflect what was sent — do not re-implement this with
          raw gh.
        Then loop back to triage-findings.

      Write the operator decision to
      {workspace}/validation/human-gate-fixes-decision.md.
    agent:
      role: doc-writer
      model: sonnet
      tools: [Read, Bash]
      access: read-only
    required: true
    writes_to:
      - validation/human-gate-fixes-decision.md

include:
  # Phase 1: Full adversarial review swarm.
  # Injects: fetch-pr-context → concern-sweep → enumerate-targets
  #   → validate-concerns + cross-unit-check → consolidate
  #   → fact-check-findings → human-gate → post-comments
  # No prefix — top-level workflow keeps original stage names from the fragment.
  - path: workflows/shared/code-review-swarm.yaml
    prefix: ""
    depends_on: [init]
    reads_from: []

  # Reply-and-resolve, with idempotency against a partial previous run and a
  # verified post-run re-fetch. Consumes outputs/resolve-plan.json.
  # Injects: resolve-threads
  - path: workflows/shared/pr-thread-resolve.yaml
    prefix: ""
    depends_on: [plan-thread-resolution]
    reads_from: [plan-thread-resolution, verify-fixes]
