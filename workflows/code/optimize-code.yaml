name: optimize-code
version: "1.0"
description: >
  Post-implementation code optimization workflow. Runs 5 quality scans in
  parallel (reuse, complexity, coverage, security via shared fragment; plus
  architecture inline), collates findings, applies corrections, and rechecks.

  Scope is set by the {scope} param:
    changed (default) — only .py files differing from origin/main, or from
                        {pr_number} when set. Use after implementing a change.
    domain            — every .py file under {source_root} and {test_path},
                        ignoring git entirely. Use to sweep a whole domain,
                        including code nobody touched this branch.

  Replaces running /optimize-code, /optimize-code-complexity,
  /optimize-code-coverage, /optimize-code-reuse, and
  /optimize-code-security manually in sequence.

  Stage dependency graph:

    scan-changed-files
        |
    mps-scan-reuse ─ mps-scan-complexity ─ mps-scan-coverage ─ mps-scan-security ─ scan-arch  (parallel G2 — first 4 via fragment)
        \──────────────────────────────────────────────────────────────────────────/
                                             |
                              mps-collate-findings   scan-arch
                                             \───────────/
                                                   |
                                         apply-corrections (optional)
                                                   |
                                            recheck-lint
                                                   |
                                            human-gate

metadata:
  author: dancing-bear
  created: "2026-05-02"

trigger:
  source: manual
  params:
    source_root: ""     # e.g. "workflow/"
    test_path: ""       # e.g. "tests/workflow/"
    scope: "changed"    # changed = files differing from origin/main (or {pr_number});
                        # domain  = every .py under {source_root} + {test_path}
    domain_slug: ""     # required: {source_root} with "/" replaced by "-" (e.g. "src-mail").
                        # Keeps workspaces isolated per domain — see workspace_dir below.
    pr_number: ""       # optional — only valid with scope=changed; scope=domain + pr_number
                        # is rejected by scan-changed-files rather than silently ignored
    skip_checks: ""     # optional — comma-separated: reuse,complexity,coverage,security,arch
    auth_domains: "github"

# {source_root} is NOT interpolated here: it contains a "/" (e.g. "src/mail"), which
# would split the workspace into a spurious nested directory rather than one flat run
# directory. {domain_slug} carries the same identity in a path-safe form — without it,
# two runs sharing a --run-id but targeting different source roots resolve to the same
# workspace and overwrite each other's findings.
workspace_dir: "{work_dir}/optimize-code-{scope}-{domain_slug}-{pr_number}"

stages:

  # ===========================================================================
  # Group 1: Identify changed files to scan
  # ===========================================================================

  - name: scan-changed-files
    kind: gather
    depends_on: []
    description: >
      Identify the set of files to check. Honour {scope}.

      If {scope} is "domain":
        List every .py file under {source_root} AND under {test_path}:
          find {source_root} {test_path} -name '*.py'
        Skip {test_path} if it is empty/unset. Do NOT consult git — a domain
        sweep covers the whole domain regardless of what changed.
        Note in the output that tests are in scope, so downstream scans know to
        apply the test-quality checks (shared fixtures, parametrization,
        byte-identical duplicate test methods) and not only the src checks.

      If {scope} is "changed" (the default):
        If {pr_number} is set:
          gh pr diff {pr_number} --name-only
          (Raw gh is intentional here — ./bin/github has no pr-diff subcommand. This is the
          only approved use of raw gh in this workflow.)
          Filter the output to .py files under {source_root} or {test_path}.
        Otherwise:
          git diff origin/main...HEAD --name-only
          Filter to .py files under {source_root} or {test_path}.

      If {scope} is neither "changed" nor "domain", fail the stage with a clear
      message naming the two valid values — do not silently fall back.

      If {scope} is "domain" AND {pr_number} is set, FAIL the stage. The two
      express contradictory intent (whole domain vs one PR's diff), and
      silently honouring scope while ignoring pr_number produces a materially
      different file set than the caller asked for. Say which two params
      conflict and that pr_number requires scope=changed.

      If {domain_slug} is empty, FAIL the stage: without it, concurrent runs
      sharing a --run-id collide in one workspace. State that it should be
      {source_root} with "/" replaced by "-".

      If no files found: for scope=changed write an empty list and note
      "no changed files in {source_root} — nothing to optimize". For
      scope=domain an empty result means {source_root} is wrong or empty —
      fail loudly rather than reporting a clean sweep of nothing.

      Write {workspace}/context/changed-files.json (filename kept for
      compatibility with downstream stages; under scope=domain it holds the
      full domain file set):
        { "scope": "{scope}", "source_root": "{source_root}",
          "test_path": "{test_path}", "tests_in_scope": true|false,
          "files": ["path/to/file.py", ...] }
    agent:
      role: researcher
      model: sonnet
      tools: [Bash, Read]
      access: read-only
    required: true
    writes_to:
      - context/changed-files.json

  # ===========================================================================
  # Group 2: Architecture scan (inline — optimize-code-specific)
  # Runs in parallel with the mps fragment scans.
  # ===========================================================================

  - name: scan-arch
    kind: validate
    when: '"{skip_checks}" does not contain "arch"'
    depends_on: [scan-changed-files]
    reads_from: [scan-changed-files]
    description: >
      Read context/changed-files.json. For each file listed (the full domain
      when scope=domain, only the diff when scope=changed):

      Step 7 — Dead code:
        Flag unused imports (importable but never referenced).
        Flag unreachable branches (after return/raise with no guard).
        Flag functions defined but never called within the module.

      Step 8 — Architecture compliance:
        CLI output: grep for json.dumps or print( in cli.py files — should use emit_rows/emit_one.
        Argument declarations: grep for parser.add_argument('--format' — should use add_format_argument.
        Layer separation: data classes should not import from CLI layer.

      Step 9 — Dataclasses over dicts + type hints:
        Flag functions returning plain dict where a frozen dataclass would be clearer.
        Flag public function signatures missing type hints.
        Flag legacy typing imports: from typing import Optional, List, Dict, Union.
        Flag parameters with None default missing | None in the type hint.

      Write {workspace}/validation/scan-arch.json.
    agent:
      role: reviewer
      model: sonnet
      tools: [Read, Bash, Grep]
      access: read-only
    validation:
      strategy: unit
      criteria:
        - Frozen dataclasses for structured data — no plain dict returns across layer boundaries
        - PEP 585/604 type hints on all public signatures
        - No dead code (unused imports, unreachable branches)
        - CLI output through emit_rows/emit_one — never manual json.dumps or print
      max_revisions: 1
    required: true
    writes_to:
      - validation/scan-arch.json

  # ===========================================================================
  # Group 3: Apply corrections — reads from fragment collation + arch scan
  # ===========================================================================

  - name: apply-corrections
    kind: execute
    depends_on: [mps-collate-findings, scan-arch]
    reads_from: [mps-collate-findings, scan-arch]
    description: >
      Read {workspace}/analysis/collated-findings.json (from mps-collate-findings)
      and {workspace}/validation/scan-arch.json.
      Merge arch findings with the collated set for a complete picture.
      If no critical or minor findings across all sources: write "no corrections needed" and exit.

      Fix ALL critical findings. Fix minor findings that do not require a design decision.
      After each file edit: run bin/ruff-resolve.sh check <file> and fix any lint errors.
      (Bare `ruff` is not on PATH here; CI lints via qlty's pinned ruff and the
      resolver script selects that same build. Do not pip install ruff.)
      Do not add comments explaining WHAT (only WHY if non-obvious).

      Write {workspace}/validation/corrections-applied.md:
        | Finding | File:Line | Fix Applied |
        |---------|-----------|-------------|
    agent:
      role: code-writer
      model: sonnet
      tools: [Read, Edit, Bash]
      access: read-write
    required: false
    writes_to:
      - validation/corrections-applied.md

  # ===========================================================================
  # Group 4: Recheck lint + tests
  # ===========================================================================

  - name: recheck-lint
    kind: validate
    depends_on: [apply-corrections]
    reads_from: [apply-corrections]
    description: >
      Run with the Bash tool, in this order:
        bin/ruff-resolve.sh check {source_root} {test_path}
        make test

      Use `make test`, not a bare `python3 -m unittest` and not pytest: this
      repo has no pytest, and a bare unittest run in a worktree resolves
      imports against the main checkout via an inherited PYTHONPATH, producing
      a false green. `make test` pins PYTHONPATH to this checkout.
      (An earlier revision called `./bin/test-quality`, which does not exist in
      this repo — every run failed with command-not-found instead of validating.)

      Confirm all previously-critical findings are resolved.
      Write {workspace}/validation/recheck.json: { "lint_exit": 0, "test_exit": 0, "unresolved": [] }
    agent:
      role: unit-validator
      model: haiku
      tools: [Bash, Read]
      access: read-only
    validation:
      strategy: unit
      criteria:
        - bin/ruff-resolve.sh check {source_root} {test_path} exits 0
        - make test exits 0
        - No new issues introduced by corrections
      max_revisions: 1
    required: true
    writes_to:
      - validation/recheck.json

  # ===========================================================================
  # Group 5: Human gate
  # ===========================================================================

  - name: human-gate
    kind: validate
    human_gate: true
    depends_on: [recheck-lint]
    description: >
      Present analysis/findings-summary.md + corrections-applied.md + recheck.json status.
      Ask: "Optimize pass complete. Ready to commit and open PR? (yes / request another scan round)"
      Write {workspace}/validation/human-gate-decision.md with decision.
    agent:
      role: doc-writer
      model: sonnet
      tools: [Read]
      access: read-only
    required: true
    writes_to:
      - validation/human-gate-decision.md

include:
  # Group 2: Parallel quality scans — reuse, complexity, coverage, security.
  # Collated output lands in {workspace}/analysis/collated-findings.json.
  # scan-arch runs inline in parallel with these.
  - path: workflows/shared/multi-parallel-scans.yaml
    prefix: mps
    depends_on: [scan-changed-files]
    reads_from: [scan-changed-files]
