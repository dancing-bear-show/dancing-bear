services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.103.1
    environment:
      - CENTRAL_OTLP_ENDPOINT=${CENTRAL_OTLP_ENDPOINT:-https://otlp.telemetry.devel.cpdev.cloud:4318}
    ports:
      - "4327:4317"   # OTLP gRPC (host 4327 avoids collision with other local collectors on 4317)
      - "4328:4318"   # OTLP HTTP (host 4328 avoids collision with other local collectors on 4318)
    volumes:
      - ./configs/otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml
      - otel-data:/data
    restart: unless-stopped

volumes:
  otel-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${OTEL_DATA_DIR:-${HOME}/.config/otel}
