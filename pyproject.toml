[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-assistants"
version = "0.1.0"
description = "Reconstituted personal assistants (mail, resume, schedule)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "click==8.4.2",
  "cryptography==50.0.0",
  "rich==15.0.0",
  "PyYAML==6.0.3",
  "python-docx==1.2.0",
  "google-api-python-client==2.199.0",
  "google-auth==2.56.3",
  "google-auth-httplib2==0.4.1",
  "google-auth-oauthlib==1.4.0",
  "httplib2==0.32.0",
  "matplotlib>=3.8",
  "msal==1.37.0",
  "numpy==2.4.6",
  "openpyxl==3.1.5",
  "pdfminer.six==20260107",
  "premailer==3.10.0",
  "requests==2.34.2",
  "shapely==2.1.2",
  "trimesh==5.0.0",
  "urllib3==2.7.0",
]

[project.optional-dependencies]
# Textual is only needed by `telemetry live` (src/telemetry/tui/_app.py and
# _widgets.py). Kept optional so the core CLIs stay dependency-light, but
# included in `dev` so tests import and cover it rather than silently skipping.
tui = [
  "textual==8.2.8",
]
# python-pptx (and its transitive lxml dep) plus Pillow for image sizing, used
# by the slides domain (src/slides/). Kept optional so the core CLIs stay
# dependency-light; mmdc (mermaid-cli) is a separate npm-installed binary, not
# a pip dependency, and is not listed here.
slides = [
  "python-pptx>=1.0.0",
  "Pillow>=10.0.0",
]
# rumps backs the macOS menubar app (src/telemetry/_menubar_app*.py), which
# raised RuntimeError on a clean install because the dep was never declared.
# macOS-only (PyObjC), hence the sys_platform marker so ubuntu CI installs cleanly.
menubar = [
  "rumps==0.4.0; sys_platform == 'darwin'",
]
# BeautifulSoup powers the richer HTML parsing path in the Richmond Hill
# schedule parser (src/calendars/importer/web_parser_vendors_rh.py). parse()
# try/excepts the import and silently falls back to a regex parser, so with bs4
# absent the entire _parse_with_bs4 branch is unreachable — 49 of that file's 50
# uncovered lines. Declared so the branch actually runs and can be tested.
calendars = [
  "beautifulsoup4==4.15.0",
]
dev = [
  "pytest==9.1.1",
  "vulture==2.16",
  # Self-reference so the textual pin lives only in [tui].
  "personal-assistants[tui]",
  # Self-reference so the bs4 parsing branch is exercised and measured wherever
  # coverage runs. This IS the [tui]/[slides] 0%-coverage trap: without it the
  # branch reports as untested code when it is really unreachable code.
  "personal-assistants[calendars]",
  # Self-reference so `telemetry menubar` is runnable in a dev install on macOS.
  # Unlike [tui]/[slides], this is NOT a coverage fix: _menubar_app.py guards the
  # import and falls back to rumps = None, so the mixins import (and report their
  # real, low coverage) with or without it. Their gap is missing tests, not a
  # missing dep.
  "personal-assistants[menubar]",
  # Self-reference so the slides extra is installed wherever coverage runs —
  # an undeclared optional dep reports 0% coverage indistinguishably from
  # untested code (the [tui] extra hit this trap once; see CLAUDE.md).
  "personal-assistants[slides]",
]
# Note: pdfplumber depends on pdfminer.six==20251107 (vulnerable version)
# Keep as optional but not recommended for security-sensitive use
pdf = [
  "pdfplumber>=0.11.0",
]

[project.scripts]
assistant = "core.assistant_cli:main"
mail-assistant = "mail.__main__:main"
calendar = "calendars.__main__:main"
calendar-assistant = "calendars.__main__:main"
schedule-assistant = "schedule.__main__:main"
phone = "phone.__main__:main"
phone-assistant = "phone.__main__:main"
whatsapp = "whatsapp.__main__:main"
resume-assistant = "resume.cli.main:main"
apple-music-assistant = "apple_music.__main__:main"
apple-music-user-token = "apple_music.user_token_cli:main"
wifi-assistant = "wifi.__main__:main"
wifi = "wifi.__main__:main"
slides = "slides.__main__:main"

[tool.vulture]
# Scan src/ wholesale rather than enumerating packages. An enumerated list
# silently skips any newly added package: slides, sheets, maker, and qlty all
# drifted out of coverage this way. src/personal_assistants.egg-info contains
# no .py files, so a directory-wide scan adds no build-metadata noise.
paths = ["bin", "tests", "src"]
min_confidence = 60
exclude = [
  # Pure dataclass/enum schema modules populated by parsers via
  # dict-unpacking or Enum(value_str) construction: every field reads as
  # "unused" to vulture even though the schema is fully consumed at
  # runtime. Field-level false positives here vastly outnumber any real
  # dead code, so these files are reviewed by hand instead.
  "src/workflow/models.py", "src/telemetry/otel/models.py",
]
ignore_decorators = [
  # Click CLI dispatch: framework invokes by registry, not direct call.
  "@*.command", "@*.group",
]
ignore_names = [
  # argparse/registry CLI dispatch: called via set_defaults(func=...) or an
  # assistant registry, never invoked directly by name.
  "cmd_*", "register",
  # Textual TUI framework callbacks/attrs: dispatched via reflection by the
  # Textual runtime, not called directly in this codebase.
  "compose", "on_mount", "action_*", "on_*_selected", "cursor_type",
  "display", "BINDINGS", "CSS", "TITLE",
  # http.server.BaseHTTPRequestHandler overrides: invoked by the base
  # class's request-handling loop, not called directly.
  "do_GET", "do_POST", "log_message",
  # python-docx property setters: assignment triggers the docx library's
  # XML serialization; the "read" happens inside the library, not here.
  "left_indent", "right_indent", "first_line_indent", "hanging_indent",
  "space_before", "space_after", "bottom_margin", "top_margin",
  "left_margin", "right_margin", "autofit",
  # Generic type aliases (Name = RequestConsumer[SomeRequest]): vulture does
  # not resolve assignment-style aliases, so each reads as an unused variable
  # even though other modules import it by name.
  "*RequestConsumer",
  # @patch decorator parameters: unittest.mock injects one positional arg per
  # decorator regardless of whether the test asserts on it. Tests that patch
  # purely to suppress a side effect (time.sleep, network, disk writes) never
  # reference the binding, but it cannot be deleted without breaking the
  # signature. Removing these would break tests, not remove dead code.
  "mock_*",
  # OutlookRulesPlanConsumer: imported at commands.py:19 and dispatched via
  # the literal string 'OutlookRulesPlanConsumer' in the registry at
  # commands.py:87; vulture cannot trace string-keyed dispatch.
  "OutlookRulesPlanConsumer",
  # Dataclass fields consumed via .get("field") dict access in other modules.
  # vulture sees only attribute reads (obj.field), not dict-key reads
  # (.get("field")), so fields read exclusively through the latter look dead.
  # old_from: constructed at processors_sweep.py:218,255; read via attribute
  #   access inside the same file — vulture misidentifies it as unused because
  #   the class is built inside a nested scope it cannot resolve.
  "old_from",
  # Dataclass fields on Job (src/worker/queue_ops.py) and ScheduledItem
  # (src/mail/scheduler.py) that are written by name but read back only via
  # .get("field") dict access — job_runtime.py, queue_metrics.py, commands.py,
  # and commands_reply.py all consume them that way. Suppressed by name rather
  # than excluding the whole module, which would blind vulture to real dead
  # code in those files.
  "due_at", "raw_b64", "timeout_sec", "enqueued_at",
  # result_size_bytes: read as string key "tool_result_size_bytes" in
  #   src/telemetry/otel/menubar_parsers.py:213.
  "result_size_bytes",
  # Library/protocol attributes consumed by external frameworks, not by calls
  # within this codebase:
  # _month_map: class-level calendar dict consumed by the pipeline at runtime.
  "_month_map",
  # row_factory: sqlite3 connection protocol attribute set so the DB layer
  #   returns named-column rows; the sqlite3 library reads it internally.
  "row_factory",
  # idpattern: string.Template protocol attribute; overridden in a subclass
  #   to restrict placeholder syntax — Template reads it internally.
  "idpattern",
  # no_color: CLIOutput protocol attribute read by the Rich console
  #   integration; not called directly in this codebase.
  "no_color",
  # __getattr__: PEP 562 module-level __getattr__ for lazy attribute access;
  #   the import system calls it, not any code in this repo.
  "__getattr__",
  # python-pptx object protocol attributes set on Mock/stub objects in tests.
  # The code under test reads these via the python-pptx object model; setting
  # them on MagicMock satisfies the attribute lookup at test time.
  "slide_layouts", "slide_masters", "slide_width", "has_notes_slide",
  "rId", "_runs", "element",
  # Context-manager protocol attributes (__enter__, __exit__) set on Mock
  # objects so that `with mock_obj:` works in the code under test.
  "__enter__", "__exit__",
  # Sequence-protocol __len__ set on Mock objects used as slide/shape
  # collections; python-pptx checks len() to iterate safely.
  "__len__",
  # matplotlib pyplot attribute on mock objects; the chart renderer accesses
  # .pyplot on the module mock to capture figure/axes references.
  "pyplot",
  # __self__: Python function protocol attribute (bound-method back-reference);
  #   set on a mock to satisfy isinstance/identity checks in test assertions.
  "__self__",
  # Stub/stand-in parameters in method overrides where the parameter name
  # must match the real method signature (callers pass it by keyword), but
  # the stub body is intentionally a no-op.
  "inherit_style", "keep_body",
  # Stand-in keyword parameter matching the Google API camelCase interface;
  # the mock must accept it so the stub signature is compatible.
  "userId",
  # Stand-in keyword parameter passed by functools.partial at call sites;
  # the stub must declare it so partial binding works even though the body
  # raises unconditionally.
  "api_key",
  # Shared test-fixture library (tests/fixtures.py, tests/phone_tests/fixtures.py).
  # These are a deliberate public helper API for the suite — siblings such as
  # write_csv_content are imported across test modules — so an individual helper
  # having no current caller is spare capacity in a library, not a leftover.
  # Genuinely uncalled private helpers were deleted rather than listed here.
  "repo_path", "write_csv", "temp_csv", "temp_json_file", "temp_module_path",
  "make_mock_layout_export",
  # FakeOutlookClient (tests/fakes/outlook.py) is a duck-typed stand-in for the
  # real Outlook client. Its module header declares that the fake must match the
  # real interface signatures, and list_rules/list_categories read the rules and
  # categories fields the fake is constructed with. Dropping them would let the
  # fake silently diverge from the client it substitutes for.
  "update_event", "list_rules", "list_categories",
  # Unused test-module constants: defined for readability/documentation but not
  # referenced in any test assertion (60% confidence — vulture cannot see that
  # a constant named SECOND or MESSAGES_DATE_ISO may appear in comments or
  # string comparisons that were refactored away; too low confidence to delete).
  "SECOND", "MESSAGES_DATE_ISO", "EMPTY_FOLDER",
  # Private test helpers with no current caller. These are utility functions
  # used in the test module they live in — locally scoped and not part of a
  # shared fixture API. Kept at 60% confidence; deletion would require verifying
  # no parametric or indirect invocation path exists, which is not possible
  # without running the suite with instrumentation.
  "_always_fail", "_make_failing_dispatcher",
  "_get_mock_get_all_costs", "_write_src_file", "_make_slide_without_body",
  "_make_mock_prs", "_raw_spec_two_series", "_matplotlib_ctx",
  # Fake Outlook client methods defined on the test double for API completeness.
  # Not yet exercised by any test but kept so the fake stays faithful to the
  # real OutlookClient interface; deleting them would make future tests that
  # call these methods fail with AttributeError on the fake.
  "update_event", "list_rules", "list_categories",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "telemetry*",
  "core*",
  "mail*",
  "resume*",
  "schedule*",
  "calendars*",
  "phone*",
  "whatsapp*",
  "apple_music*",
  "wifi*",
  "charts*",
  "diagrams*",
  "workflow*",
  "worker*",
  "maker*",
  "desk*",
  "slides*",
  "sheets*",
]
