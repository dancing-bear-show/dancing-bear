# Scannable template — visual hierarchy that survives Word light AND dark mode.
#
# Solves two problems the default template has:
#   1. "Wall of text": 60+ uniformly-weighted bullets with no visual anchors.
#   2. Dark mode: hardcoded accent colors become unreadable when Word inverts
#      the page.
#
# HIERARCHY
#   Heading 1 (14pt) + light band  -> section
#   Heading 2 (13pt)               -> role / job title
#   dark band + white run color    -> skill group
#   default body (10pt)            -> bullets
# Roles as Heading 2 also populate Word's Navigation pane and PDF bookmarks.
#
# ---------------------------------------------------------------------------
# DARK-MODE RULES — these are load-bearing; changing them breaks readability.
# ---------------------------------------------------------------------------
#
# Word dark mode inverts the page background but NOT shading fills or explicit
# run colors. Three rules follow, each learned from a real failure:
#
# 1. SECTION-HEADING FILLS MUST BE LIGHT.
#    The renderer applies `h1_color` to the Heading 1 *style*, and Word's theme
#    overrides it with themeColor — the heading keeps Word's blue (#365F91)
#    whatever you ask for. A dark navy fill therefore produced #365F91 on
#    #44618C: contrast 1.04, blue on blue, effectively invisible.
#    Setting `h1_color` here does nothing. Do not add it back.
#
# 2. GROUP-TITLE FILLS MAY BE DARK.
#    Different code path: `add_group_title` sets the color on the RUN, so
#    `group_title_color` does stick. White on #44618C = 6.3:1.
#
# 3. BODY TEXT SETS NO EXPLICIT COLOR.
#    Word inverts default text automatically; a hardcoded accent defeats that.
#    #2E5090 scores 7.9 on white but 2.1 on a dark page. No single accent
#    color clears 4.5 on both backgrounds — that is arithmetic, not tuning.
#    This is why item_color and location_color are absent below.
#
# Verified on the rendered DOCX (resolving each paragraph's real color,
# including style fallback, against its actual fill): 16/16 headers pass in
# both modes. Greyscale printing works — the fills differ in luminance.

page:
  h1_bg: "#E8EDF3"        # light steel; Word's heading blue reads 5.6:1 on it
  body_pt: 10
  h1_pt: 12
  margins_in: 0.6

  # --- Document metadata -------------------------------------------------
  # Core properties survive PDF export, are read by ATS, and are visible to
  # anyone who opens File > Properties.
  metadata_pii: false             # keep phone/email out of title + keywords;
                                  # the contact line in the body already has them
  metadata_include_locations: false   # past-role cities signal old jobs
  metadata_comments: ""           # clears python-docx's "generated by python-docx"
  metadata_stamp_dates: true      # else created/modified read 2013 (library default)
  # metadata_title and metadata_keywords are per-application — set them in the
  # data file's own template copy, not here.

sections:
  - key: summary
    title: Profile
    bulleted: true
    max_sentences: 4

  - key: skills
    title: Core Abilities
    bullets: true
    plain_bullets: true
    compact: true
    show_desc: false        # descriptions are what turn this into a paragraph
    max_groups: 5
    max_items_per_group: 5
    separator: " • "
    group_title_bg: "#44618C"
    group_title_color: "#FFFFFF"
    group_title_bold: true

  - key: technologies
    title: Technical Stack
    bullets: true
    plain_bullets: true
    compact: true
    show_desc: false
    separator: " • "
    group_title_bg: "#44618C"
    group_title_color: "#FFFFFF"
    group_title_bold: true

  - key: experience
    title: Professional Experience
    max_items: 5
    inline_dates: true
    role_style: Heading 2   # 4.0 light / 4.1 dark; also gives nav-pane entries

  - key: education
    title: Education

  - key: presentations
    title: Speaking & Publications
