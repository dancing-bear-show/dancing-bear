name: complexity-reduce-calendars
version: "1.0"
description: >
  Reduce qlty file-complexity for the 6 flagged files in
  src/calendars/ (total complexity 372).

  GENERATED by workflows/code/complexity-fanout-generate.yaml on 2026-08-06.
  Edit targets/calendars.json rather than this wrapper; regenerating overwrites both.

  Targets:
    | src/calendars/gmail_pipelines.py | 76 | split-by-responsibility |
    | src/calendars/outlook_pipelines/remove.py | 75 | reduce-in-place |
    | src/calendars/outlook/commands.py | 53 | split-by-responsibility |
    | src/calendars/outlook_pipelines/settings.py | 53 | reduce-in-place |
    | src/calendars/importer/web_parser_vendors_rh.py | 61 | reduce-in-place |
    | src/calendars/location_sync.py | 54 | reduce-in-place |

  Strategy rationale: qlty file-complexity is the SUM of per-function
  complexity, so splitting redistributes rather than reduces it. Default is
  reduce-in-place; see the fragment for technique order.

metadata:
  author: dancing-bear
  created: "2026-08-06"
  generated_by: complexity-fanout-generate

trigger:
  source: manual
  params:
    group: "calendars"
    targets_file: "workflows/code/complexity/targets/calendars.json"
    complexity_floor: "50"

workspace_dir: "{work_dir}/complexity-reduce-calendars"

stages:
  - name: load-targets
    kind: gather
    depends_on: []
    description: >
      Read {targets_file} and confirm every listed path still exists and still
      carries the recorded complexity score.

      Read the floor from the targets file's own "complexity_floor" field, NOT
      from the {complexity_floor} trigger param — the targets file is the
      single source of truth for the plan that was approved.

      For each entry, verify the path exists. Rescore it, keeping stderr so a
      tool failure is visible:
        ~/.qlty/bin/qlty smells <path> --json 2>/tmp/qlty-err.txt | python3 -c "import json,sys; d=json.load(sys.stdin); [print(i['value']) for i in d if i['ruleKey']=='file-complexity']"
                      # stderr goes to a SEPARATE file, never merged into stdout:
                      # qlty writes progress spinners ("[0/3] Analyzing...") to stderr,
                      # and merging them corrupts the JSON stream so EVERY file fails to
                      # parse. On a parse failure or empty output, read /tmp/qlty-err.txt
                      # for the real error and classify the entry as ERROR (never "drop").

      Classify each entry into exactly one of three outcomes:
        keep  — file exists and scores at or above the floor
        drop  — file is gone, or genuinely scores below the floor
        ERROR — qlty failed, returned unparseable output, or emitted no
                file-complexity entry for a file that still exists
      An ERROR is NOT a drop. Record ERROR entries with their stderr text,
      keep them in the file list, and flag them.

      Write {workspace}/outputs/targets.json with the surviving file list,
      each entry keeping path, complexity (rescored), line_count,
      top_level_symbols, strategy, justification, proposed_siblings, plus
      "rescore_status" and "rescore_error". Include top-level
      "complexity_floor", "dropped", and "errors".
    agent:
      role: researcher
      model: sonnet
      tools: [Bash, Read, Write]
      access: read-only
    validates_output:
      - path: outputs/targets.json
        checks: [is_json, is_dict, has_key:files]
    required: true
    writes_to:
      - outputs/targets.json

include:
  - path: workflows/shared/complexity-reduce.yaml
    prefix: cx
    depends_on: [load-targets]
    reads_from: [load-targets]
