# Generate a job-tailored resume from a job description.
#
# Reorders and reweights existing experience to match a posting. Never invents
# experience: unsupported keywords are reported as gaps for the human to decide
# on, not silently written into the resume.
#
# DAG:
#   init
#     |
#   parse-posting (agent — job description text -> job YAML)
#     |
#   extract-baseline (execute — resume DOCX -> candidate JSON)
#     |
#   score-alignment (execute — align candidate against job YAML)
#     |
#   draft-tailored (agent — reweight bullets, write data YAML)
#     |
#   check-copy (execute — enforce RESUME_WRITING_GUIDE + report coverage)
#     |
#   gap-report (propose, human_gate — surface gaps, get a decision)
#     |
#   render (execute — DOCX)
#     |
#   verify-render (execute — extract text, confirm sections landed)
#
# check-copy and verify-render are kind: execute deliberately, not validate.
# The validate prompt builder ignores `description` (dispatch.py:238); see the
# banner comment above each stage.

name: tailor-resume
version: "1.0"
description: >
  Produces a job-tailored resume DOCX from a job description plus a baseline
  resume. Encodes the posting as a job YAML, scores the candidate against it,
  reweights bullets toward what the posting rewards, enforces
  .claude/RESUME_WRITING_GUIDE.md, and reports measured keyword coverage.

  The human gate is load-bearing. Tailoring means reordering and reweighting
  TRUE experience — never adding experience the candidate does not have. Any
  posting keyword unsupported by the baseline resume is reported as a gap for a
  human decision rather than written into the document. A fabricated metric is
  the one resume defect that survives review and fails a reference check.

  Outputs (all under {workspace}/outputs/, which should be a gitignored _data/
  path because resumes are PII — note writes_to entries carry no {workspace}
  prefix, because the engine resolves bare entries under {workspace}/outputs/
  and does NOT substitute params into writes_to paths):
    - job.yaml              the posting, encoded
    - candidate.json        baseline extracted from the source resume
    - alignment.json        per-keyword and per-role scores
    - data-tailored.yaml    render input
    - coverage.md           keyword coverage + guide violations + gaps
    - coverage-findings.json  machine-readable summary for the gate
    - resume-tailored.docx  the tailored resume

metadata:
  author: dancing-bear
  created: "2026-08-06"

trigger:
  source: manual
  params:
    posting_file: ""        # REQUIRED: path to a file holding the job description text
    resume_file: ""         # REQUIRED: baseline resume DOCX/PDF to tailor from
    company: "company"      # short slug used in output filenames, e.g. "okta"
    out_dir: "src/resume/_data/tailored"   # gitignored per the PII policy
    template: "src/resume/config/template.brian.yaml"
    max_bullets: "5"        # max bullets per role in the tailored output

workspace_dir: "{out_dir}/{company}"

stages:

  # ==========================================================================
  # Stage 1: init — workspace
  # ==========================================================================
  - name: init
    kind: gather
    description: >
      Create the workspace:

        mkdir -p {workspace}

      Then confirm the PII placement is safe. Run:

        git check-ignore -v {workspace}

      If the path is NOT ignored, STOP and report it. Resumes carry a name,
      phone number, and email; writing them to a tracked path would commit PII.
      Do not proceed on an unignored path.

      Also verify both required params are set and the files exist:
      {posting_file} and {resume_file}. Fail loudly if either is missing.
    agent:
      role: researcher
      model: haiku
      tools: [Bash]
      access: read-write
    required: true
    writes_to: []

  # ==========================================================================
  # Stage 1b: load-guides — pull the writing standards into the workspace
  # ==========================================================================
  - name: load-guides
    kind: gather
    depends_on: [init]
    description: >
      Extract the copy rules that draft-tailored and check-copy must enforce,
      and write them to {workspace}/outputs/guides.md.

      Read these two files:
        - .claude/RESUME_WRITING_GUIDE.md   (the prescriptive standard)
        - concerns/resume-copy.md           (the enforceable checks)

      Write a single condensed sheet containing:
        1. VOICE + BULLET RULES from RESUME_WRITING_GUIDE.md — implied first
           person, strong-verb openers, the tense rule (both tenses are correct
           on a current role; only flag present tense on an ended role), the
           28-word ceiling, no terminal periods, the >=50% quantification
           target, and the "reorder and reweight, never fabricate" rule from
           the Tailoring section.
        2. THE BANNED PHRASE TABLE, verbatim — both columns. Downstream agents
           need the replacement, not just the prohibition.
        3. EVERY CONCERN ID from concerns/resume-copy.md with its severity and
           one-line check, including each scope exception and provenance rule.
           The exceptions matter as much as the checks: flagging valid copy is
           as bad as missing invalid copy.

      Copy the rules; do not paraphrase them into something looser. This file
      is the contract both downstream stages are held to, so drift here becomes
      drift in the resume.

      Exit non-zero if either source file is missing — running without the
      guides would silently produce unchecked copy.
    agent:
      role: researcher
      model: sonnet
      tools: [Read, Write, Bash]
      access: read-write
    required: true
    writes_to:
      - "guides.md"

  # ==========================================================================
  # Stage 2: parse-posting — job description text -> job YAML
  # ==========================================================================
  - name: parse-posting
    kind: execute
    depends_on: [init]
    description: >
      Read the job description at {posting_file} and encode it as a job YAML at
      {workspace}/outputs/job.yaml, following the schema in
      src/resume/config/job.rbc_sre.yaml and the "Job Posting YAML" section of
      src/resume/README.md.

      Required structure: title, company, keywords.required[], keywords.preferred[],
      keywords.soft_skills[], keywords.tech_skills[], keywords.technologies[],
      keywords.synonyms{}.

      Rules:
        - Weight 3 = named in a "Required" / "must have" list, or repeated
          throughout the posting. Weight 2 = named once in required, or in
          "nice to have". Weight 1 = mentioned in passing.
        - Put every technology named anywhere into tech_skills or technologies,
          even low-weight ones — ATS matching is literal.
        - Populate synonyms generously: recruiters and ATS match on exact
          strings, so map "k8s"->Kubernetes, "OTel"->OpenTelemetry, and any
          abbreviation the posting itself uses.
        - Add an `emphasis:` list (free text) capturing what the posting
          actually rewards, beyond the keyword list. Read the "About the Team"
          and "Responsibilities" prose, not just the bullet lists.

      Exit non-zero if the posting file is empty or unparseable.
    agent:
      role: researcher
      model: sonnet
      tools: [Read, Write, Bash]
      access: read-write
    required: true
    writes_to:
      - "job.yaml"

  # ==========================================================================
  # Stage 3: extract-baseline — source resume -> candidate JSON
  # ==========================================================================
  - name: extract-baseline
    kind: execute
    depends_on: [init]
    description: >
      Extract the baseline resume into structured data:

        ./bin/assistant resume extract --resume {resume_file} \
          --out {workspace}/outputs/candidate.json

      Then VALIDATE the extraction before continuing — this parser has produced
      silently wrong output before. Check:
        - role count is plausible (compare against the source document)
        - no role title starts with a bullet glyph (•, -, *)
        - each role has a non-empty company and at least one bullet

      If any check fails, report the specific defect and STOP. Downstream stages
      would tailor corrupted data into a document that looks correct.
    agent:
      role: researcher
      model: sonnet
      tools: [Bash, Read]
      access: read-write
    required: true
    writes_to:
      - "candidate.json"

  # ==========================================================================
  # Stage 4: score-alignment — candidate vs job
  # ==========================================================================
  - name: score-alignment
    kind: execute
    depends_on: [parse-posting, extract-baseline]
    reads_from: [parse-posting, extract-baseline]
    description: >
      Score the candidate against the posting:

        ./bin/assistant resume align \
          --data {workspace}/outputs/candidate.json \
          --job {workspace}/outputs/job.yaml \
          --out {workspace}/outputs/alignment.json \
          --tailored {workspace}/outputs/tailored-auto.json \
          --max-bullets {max_bullets}

      Report matched keywords, missing keywords, and per-role scores. The
      tailored-auto.json output is an input to the next stage, not the final
      answer — the drafting stage applies judgment the scorer cannot.
    agent:
      role: researcher
      model: sonnet
      tools: [Bash, Read]
      access: read-write
    required: true
    writes_to:
      - "alignment.json"
      - "tailored-auto.json"

  # ==========================================================================
  # Stage 5: draft-tailored — reweight into render-ready data
  # ==========================================================================
  - name: draft-tailored
    kind: execute
    depends_on: [score-alignment, load-guides]
    reads_from: [score-alignment, parse-posting, extract-baseline, load-guides]
    description: >
      Write {workspace}/outputs/data-tailored.yaml — the render input — by reweighting
      the baseline toward what the posting rewards.

      READ FIRST: {workspace}/outputs/guides.md. Every rule in it applies to every
      bullet you write. It is the condensed contract from
      .claude/RESUME_WRITING_GUIDE.md and concerns/resume-copy.md; check-copy
      enforces the same file, so anything violating it will come straight back.

      THE HARD RULE: reorder and reweight, never invent. Every bullet must trace
      to the baseline resume. If a posting keyword has no support in the
      baseline, it goes in the gap report — not in the resume. Do not stretch an
      adjacent skill to cover a named one (operating Kafka is not Flink
      experience; tuning a JVM is not Java application development).

      Tailoring moves that ARE legitimate:
        - reorder bullets so posting-relevant ones lead
        - reorder and retitle skill groups around the posting's vocabulary
        - promote a real accomplishment buried in a later role
        - rewrite a true bullet to use the posting's exact terminology
        - drop bullets irrelevant to this posting
        - set the headline to the target role's framing

      SCHEMA — the renderer is strict; these shapes are load-bearing:
        - skills_groups: a LIST of {title, items[{name, desc}]}. NOT wrapped in
          a `groups:` key — that shape is for overlay files and renders as an
          unlabelled flat list.
        - technologies: a FLAT list of {name, desc}. NOT grouped — a grouped
          value renders as a title with no items.
        - education: {degree, institution, year}. NOT school/start/end — those
          render with no dates.
        - experience: {title, company, location, start, end, bullets[]}

      Write the file, then confirm it parses with yaml.safe_load before exiting.
    agent:
      role: code-writer
      model: inherit
      tools: [Read, Write, Bash]
      access: read-write
    required: true
    writes_to:
      - "data-tailored.yaml"

  # ==========================================================================
  # Stage 6: check-copy — enforce the writing guide, measure coverage
  #
  # kind: execute, NOT validate. The validate prompt builder
  # (src/workflow/dispatch.py:238 `_validate`) constructs its prompt from
  # `validation.criteria` and `validation.domain_rules` only — it never calls
  # `_header`, so `description` is dropped entirely. This stage's contract is
  # long, prescriptive, and depends on exact wording (the whole-token number
  # rule and the "search the WHOLE baseline" rule especially), so flattening it
  # into a `criteria:` string list — `ValidationSpec.criteria` is a flat
  # tuple[str, ...] — would lose the parts that make the fabrication gate work.
  # kind: execute routes through `_action` -> `_header`, which includes
  # `description` verbatim. See `validate-kind-description-ignored` in
  # concerns/workflow-fanout.md. This stage still blocks: it exits non-zero.
  # ==========================================================================
  - name: check-copy
    kind: execute
    depends_on: [draft-tailored, load-guides]
    reads_from: [draft-tailored, parse-posting, score-alignment, load-guides]
    description: >
      Write {workspace}/outputs/coverage.md with three sections. Compute, do not estimate.

      Enforce {workspace}/outputs/guides.md — the same file draft-tailored wrote
      against. Apply its scope exceptions and provenance rules too, not only
      its checks: flagging valid copy wastes the human's attention at the gate
      as surely as missing invalid copy does.

      1. GUIDE COMPLIANCE — check every bullet in data-tailored.yaml against
         the concern IDs in guides.md:
           - resume-bullet-weak-opener (no "Responsible for", "Helped", "Worked
             on", "Participated in", articles, or gerunds as openers; do not
             flag tense on a role with end: Present)
           - resume-banned-phrase ("utilize", "leverage", "facilitate",
             "spearheaded", "results-driven", "various", ...)
           - resume-bullet-too-long (>28 words)
           - resume-bullet-terminal-period (bullets take no trailing period)
           - resume-first-person-pronoun (no "I"/"my" in resume bullets)
           - resume-bullet-unquantified (report per-role ratio; target >= 50%)
         Report every violation with role and bullet text.

      2. KEYWORD COVERAGE — for each keyword in job.yaml, check whether the
         tailored resume contains it directly or via a declared synonym. Report:
           - covered / total, and weighted covered / weighted total
           - a table of every MISS with its weight
         Use the synonyms map from job.yaml. Match case-insensitively.

      3. UNSUPPORTED CLAIMS — the integrity check, and the reason this stage
         can block. For every bullet in data-tailored.yaml, confirm it traces to
         candidate.json.

         Compare on MEANING, not string equality. Rewording a true bullet into
         the posting's vocabulary is the whole point of tailoring; only new
         substance is a defect. Classify each bullet as:
           - SUPPORTED: same claim as a baseline bullet, reworded or reordered
           - NEW METRIC: contains a number with no counterpart in the baseline
           - NEW CLAIM: asserts work absent from the baseline entirely

         Extract numbers as whole tokens ("$300K", "150+", "1 to 9"), not by
         splitting on punctuation — "$300K" and "$300" are the same figure and
         must not be reported as a mismatch. Search the WHOLE baseline
         (summary, skills, every role), not just the bullets of the role being
         checked: a metric may legitimately move between sections during
         tailoring.

         Report NEW METRIC and NEW CLAIM separately, each with the bullet text
         and the role. State plainly for each whether it is unverifiable from
         the baseline alone.

      BLOCK if section 3 reports any NEW METRIC or NEW CLAIM. These are not
      always fabrications — the candidate may be supplying something true that
      the baseline resume omits — but that is a human's call at the gate, never
      the drafting agent's. A fabricated metric survives review and fails in a
      reference check, so the default must be to stop.

      HOW TO BLOCK — follow this exactly; it is the only mechanism that works.
      Write coverage.md and coverage-findings.json FIRST, then write your stage
      result JSON with "status": "failed" and the blocked items in "errors". Do
      NOT report "status": "success" on a blocked run.

      A non-zero exit code alone does NOTHING. Agent stages route through
      SkillDispatcher.dispatch (src/workflow/dispatchers.py), which runs no
      subprocess and returns "pending" — there is no exit code for the engine to
      see. Stage status comes only from the result JSON this agent writes, and
      the template pre-fills "status": "success" (dispatch.py _RESULT_FMT);
      _any_required_failed trips only on "failed" (orchestrator.py). An agent
      that finds a fabricated metric, records it, and still reports success
      leaves required:true and depends_on satisfied and the run proceeds to
      render — shipping the document this stage exists to stop.

      Also write {workspace}/outputs/coverage-findings.json as a machine-readable
      summary, so gap-report can list the blocked items without re-parsing prose:

        {"guide_violations": <int>, "keywords_covered": <int>,
         "keywords_total": <int>, "weighted_covered": <int>,
         "weighted_total": <int>, "supported": <int>, "new_metric": <int>,
         "new_claim": <int>, "blocked": <true|false>,
         "misses": [{"keyword": "...", "weight": <int>}],
         "items": [{"role": "...", "bullet": "...",
                    "classification": "SUPPORTED|NEW METRIC|NEW CLAIM",
                    "unverifiable": <true|false>,
                    "guide_violations": ["..."]}]}

      Set `blocked` to true if new_metric or new_claim is non-zero. Write BOTH
      files BEFORE exiting non-zero — an exit that leaves no findings behind
      gives the human nothing to act on at the gate and makes the block look
      like a crash. Write them on the clean path too, with the counts at zero
      and `blocked` false.
    agent:
      role: reviewer
      model: sonnet
      tools: [Read, Write, Bash]
      access: read-write
    required: true
    writes_to:
      - "coverage.md"
      - "coverage-findings.json"

  # ==========================================================================
  # Stage 7: gap-report — human decision on the gaps
  # ==========================================================================
  - name: gap-report
    kind: propose
    human_gate: true
    depends_on: [check-copy]
    reads_from: [check-copy, score-alignment, parse-posting]
    description: >
      Present the decision, then STOP for the human.

      FIRST — re-read {workspace}/outputs/coverage-findings.json. If "blocked"
      is true, lead with the blocked items (every NEW METRIC and NEW CLAIM,
      verbatim, with its role) before any coverage number, and state plainly
      that the resume cannot be rendered until the human resolves each one.

      Do not assume check-copy already halted the run on a block. It cannot do
      that by itself: stage status comes only from the result JSON each agent
      writes and the template pre-fills "status": "success", so a check-copy
      agent that records fabrications and still reports success lets the DAG
      reach this gate. This re-read is what makes the human gate the real
      barrier rather than a formality.

      Show:
        - measured keyword coverage (raw and weighted)
        - every missed keyword with its weight, and one line on why it is
          missing — genuinely absent from the baseline, versus present but
          not yet surfaced
        - any guide violations from check-copy, and the NEW METRIC / NEW CLAIM
          items it blocked on, read from {workspace}/outputs/coverage.md and
          {workspace}/outputs/coverage-findings.json — these are the items that
          need a source or a deletion, so show them first
        - an honest fit assessment: what is strong, what is weak, and which
          objection the candidate should expect in a screen

      Ask the human to decide:
        (a) accept and render
        (b) supply missing experience that is real but absent from the baseline
            resume — the highest-leverage change available
        (c) abandon: the gaps are large enough that the application is not worth
            submitting

      Do NOT paper over a gap to raise the coverage number. Reporting 72% with
      an honest gap list is more useful than 95% built on stretched claims.
    agent:
      role: doc-writer
      model: sonnet
      tools: [Read, Bash]
      access: read-only
    required: true
    writes_to: []

  # ==========================================================================
  # Stage 8: render — DOCX
  # ==========================================================================
  - name: render
    kind: execute
    depends_on: [gap-report]
    reads_from: [draft-tailored]
    description: >
      Render the tailored resume:

        ./bin/assistant resume render \
          --data {workspace}/outputs/data-tailored.yaml \
          --template {template} \
          --out {workspace}/outputs/resume-tailored.docx

      The renderer exits non-zero and writes nothing on failure, so a stale file
      from an earlier run can survive a failed render. Delete any existing
      output first so a stale file cannot be mistaken for a fresh one, and treat
      a non-zero exit as fatal.
    agent:
      role: researcher
      model: haiku
      tools: [Bash]
      access: read-write
    required: true
    writes_to:
      - "resume-tailored.docx"

  # ==========================================================================
  # Stage 9: verify-render — confirm the document is actually right
  #
  # kind: execute for the same reason as check-copy: the validate builder
  # (src/workflow/dispatch.py:238 `_validate`) drops `description` entirely.
  # This stage's contract is a specific extraction procedure — the exact
  # python3 snippet, the argv[1] injection-safety rule, and a six-item
  # checklist — none of which survives flattening into `validation.criteria`.
  # Losing it would leave the stage "verifying" a DOCX with a generic
  # extract-claims prompt and no idea what to look for. See
  # `validate-kind-description-ignored` in concerns/workflow-fanout.md.
  # ==========================================================================
  - name: verify-render
    kind: execute
    depends_on: [render]
    reads_from: [render, draft-tailored]
    description: >
      A zero exit code does not prove the document is correct. Extract the text
      and check it:

        python3 -c '
        import html, re, sys, zipfile
        z = zipfile.ZipFile(sys.argv[1])
        x = z.read("word/document.xml").decode("utf-8")
        x = re.sub(r"</w:p>", "\n", x)
        x = re.sub(r"<[^>]+>", "", x)
        print(html.unescape(x))' "{workspace}/outputs/resume-tailored.docx"

      Pass the path as argv[1] as shown — never interpolate {company} or
      {workspace} into the Python source itself. Those values come from
      user-supplied params, so a quote character in either would break the
      literal and turn the snippet into an injection point.

      Confirm ALL of the following, and report any that fail:
        - the candidate name and headline appear
        - every skill group TITLE appears, not just its items (a missing title
          means skills_groups had the wrong shape and the groups silently
          flattened)
        - every role title, company, and date range appears
        - education shows institution AND year
        - no section heading is present with no content beneath it
        - bullet counts per role match data-tailored.yaml

      Report the output path and a one-line summary of what shipped.
    agent:
      role: reviewer
      model: sonnet
      tools: [Bash, Read]
      access: read-only
    required: true
    writes_to: []
