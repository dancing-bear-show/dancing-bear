# Shared workflow fragment — not runnable standalone.
# Include via:
#   include:
#     - path: workflows/shared/pr-review-threads.yaml
#       prefix: ""
#       depends_on: [init]
#       reads_from: []
#
# Stage injected: {prefix}-fetch-threads  (bare "fetch-threads" when prefix is "")
#
# Caller must set trigger.params: pr_number
#
# Output: {workspace}/outputs/threads.json, {workspace}/outputs/threads-summary.md
#
# Why this fragment exists: three separate call sites had three divergent,
# partly-wrong implementations of "get the review threads". bin/pr-assistant
# previously read only comments(first:1) and filtered to the Copilot bot, so a
# human reply inside a thread was invisible to it (it has since been ported onto
# the same core.github helper this fragment uses). update-review-concerns.yaml
# capped reviewThreads at 100 with no pagination check. Neither reconciled the
# two spellings GitHub uses for the same bot across its two APIs. This fragment
# is the single correct implementation via ./bin/github; callers include it
# rather than re-deriving.
fragment: true
name: pr-review-threads
version: "1.0"
description: >
  Shared PR review-thread fetch fragment. Collects every review comment on a
  pull request from all three surfaces GitHub exposes them on — GraphQL review
  threads (inline, threaded, with resolution state), REST review bodies
  (top-level review summaries that belong to no thread), and REST issue
  comments (PR-level conversation) — and normalises them into one thread list
  with stable IDs, full comment chains, and author classification.

  Read-only. Never resolves, replies to, or otherwise mutates a thread.

  Params consumed from trigger.params: {pr_number}.

stages:

  - name: fetch-threads
    kind: gather
    depends_on: []      # overridden by include.depends_on
    reads_from: []      # overridden by include.reads_from
    description: >
      Fetch and normalise every review thread on PR {pr_number}.

      Run:
        ./bin/github threads fetch --pr {pr_number} \
          --out {workspace}/outputs/threads.json \
          --raw {workspace}/outputs/threads-raw.json \
          --summary {workspace}/outputs/threads-summary.md

      ./bin/github handles GITHUB_TOKEN scrubbing internally. Do not
      re-implement this with raw gh. The command covers all three GitHub
      surfaces (GraphQL review threads paginated at BOTH levels, REST review
      bodies with --paginate, and REST issue comments with --paginate) and
      writes the threads.json contract documented below. Pagination at both
      levels is handled in code; the `truncated` field in threads.json is set
      true when a reported count did not match the fetched count.

      The schema and author-classification rules below document what the
      command guarantees and what downstream stages depend on — they are not
      a spec to re-implement.

      Author classification: the command handles BOTH spellings GitHub returns
      for the same account (GraphQL reports "copilot-pull-request-reviewer"
      while REST returns "copilot-pull-request-reviewer[bot]") and strips any
      trailing "[bot]" before comparing.

      Each thread's author_kind is classified as:
        "bot"   — the GraphQL author.__typename is "Bot", OR the login
                  (suffix-stripped) is copilot-pull-request-reviewer or
                  github-actions, OR the login ends in "[bot]"
        "human" — everything else

      Prefer __typename. It is GitHub's own answer and it covers accounts no
      login allowlist anticipates. A real case: github-code-quality posts
      review threads under a bare login with no "[bot]" suffix and matches
      none of the named logins, so a login-only rule classifies it human —
      on one PR that was 10 of 14 threads. GraphQL reports it as
      __typename: Bot.

      For REST surfaces (review bodies and issue comments), "type": "Bot" on
      the user object is used instead of __typename, with login rules as a
      fallback when neither field is present.

      The shape the command writes to {workspace}/outputs/threads.json
      ("unresolved", "resolved" and "outdated" count graphql-thread entries
      only — review bodies and issue comments have no resolution state):
        {
          "pr_number": "{pr_number}",
          "repo": "owner/name",
          "counts": {
            "total": N, "unresolved": N, "resolved": N,
            "outdated": N, "bot": N, "human": N
          },
          "truncated": false,
          "threads": [
            {
              "thread_id": "PRRT_kwDO...",   // GraphQL node id — required to resolve
              "source": "graphql-thread|review-body|issue-comment",
              "author_kind": "bot|human",
              "author": "copilot-pull-request-reviewer",
              "is_resolved": false,
              "is_outdated": false,
              "path": "src/foo.py",           // null for PR-level
              "line": 216,                    // null when outdated — see below
              "comments": [
                {"author": "...", "body": "...", "created_at": "...",
                 "url": "...", "database_id": 123}
              ],
              "opening_body": "the first comment's full text",
              "latest_author_kind": "bot|human"
            }
          ],
          "review_bodies": [
            {
              "review_id": 5285429513,
              "author": "copilot-pull-request-reviewer",
              "author_kind": "bot",
              "state": "COMMENTED",
              "submitted_at": "2026-09-23T00:12:35Z",
              "body": "the full review body, verbatim and unmodified"
            }
          ]
        }

      Keep "review_bodies" verbatim — do not strip HTML, collapse whitespace,
      or summarise. A Copilot overview body is structured data that
      pr-review-overview.yaml parses downstream, and a body that has been
      "tidied" is a body it cannot read. Include every review with a non-empty
      body, bot or human.

      Only graphql-thread entries carry a resolvable thread_id. Entries from
      review-body and issue-comment sources have thread_id null — they are
      context for triage and CANNOT be resolved via resolveReviewThread. Mark
      them source accordingly so a downstream stage never tries.

      ALWAYS FILL comments[].database_id, on every surface. For Step 1 it is
      the GraphQL comment's `databaseId`; for Step 2 (review bodies) it is the
      REST review's `id`; for Step 3 (issue comments) the REST comment's `id`.
      For a null-id entry this number is its ONLY stable identity:
      review-fix-threads looks such entries up by `comments[0].database_id`
      and halts rather than guessing when it is missing — so an entry left
      without one stops the whole run at dispatch. Never write null here; if
      a surface genuinely returned no id, say so in the summary instead of
      emitting the entry silently without one.

      A note that downstream triage depends on: GitHub returns line: null for
      any thread where isOutdated is true, because the anchored line no longer
      exists in the current diff. Do not drop these threads and do not invent a
      line number for them. Carry them through with line: null and
      is_outdated: true so triage can decide on the comment text alone.

      The command also writes a compact human-readable index to
      {workspace}/outputs/threads-summary.md (via --summary): one line per
      thread with thread_id (short), author_kind, resolution state, path:line,
      and the first 100 characters of the opening comment.

      If the PR has zero threads, threads.json is written with an empty threads
      list and correct zero counts. That is a valid outcome, not a failure.
      Exit 0 with an empty thread list is valid.
    agent:
      role: researcher
      model: sonnet
      tools: [Bash, Write, Read]
      access: read-write
    required: true
    writes_to:
      - threads.json
      - threads-raw.json
      - threads-summary.md
