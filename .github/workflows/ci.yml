name: ci
on:
  push:
  pull_request:

jobs:
  qlty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: qltysh/qlty-action/install@main
      - name: Run qlty check
        run: qlty check --no-progress

  # Separate from `tests` on purpose. This job needs the full history
  # (fetch-depth: 0) for a correct merge-base, which the test job does not, and
  # keeping them apart means a type regression and a coverage drop report as
  # distinct failures instead of masking each other. It also runs in parallel
  # with the other two rather than lengthening the critical path.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # REQUIRED. The changed-files gate diffs `origin/main...HEAD`, and a
          # shallow clone has no merge-base — the diff comes back empty or wrong
          # and the gate passes having checked nothing. bin/mypy_ratchet.py hard
          # fails when the base ref will not resolve, so a regression here is
          # loud rather than silent, but the fix is this setting.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Fetch main for the merge-base
        # On a PR the default checkout leaves no local `main`; the gate diffs
        # against origin/main, so make sure the ref is present.
        run: git fetch --no-tags --depth=0 origin main:refs/remotes/origin/main || true
      - name: Type-check changed files (blocking)
        # Fails on any NEW type error in a file this branch touched. Files that
        # already had errors are grandfathered via typecheck-baseline.json.
        run: python bin/mypy_ratchet.py changed --base origin/main
      - name: Type-check ratchet (blocking)
        # Fails only if a package's error count grew against the baseline.
        run: python bin/mypy_ratchet.py ratchet
      - name: Report the platform-native counts on failure
        # The baseline is generated on one OS and enforced on another; some
        # dependency stubs resolve differently. This prints what THIS runner
        # sees so a mismatch is diagnosable from the log alone.
        if: failure()
        run: python bin/mypy_ratchet.py update-baseline && cat typecheck-baseline.json

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # jq is what the .claude/hooks shell suites parse their payloads with, and
      # tests/infra/test_guard_hooks.py now FAILS rather than skips when it is absent
      # (a skip reports green while exercising none of the guards). ubuntu-latest
      # currently ships jq preinstalled, so this is belt-and-braces -- but an implicit
      # dependency on a runner image is exactly the kind of thing that disappears in a
      # version bump, and the failure would then look like a broken guard rather than a
      # missing tool. Declaring it keeps the hard failure honest.
      - name: Install jq (required by the guard-hook suites)
        run: |
          command -v jq >/dev/null 2>&1 || {
            sudo apt-get update && sudo apt-get install -y jq
          }
          jq --version
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install -U pip
          # [tui] pulls textual so the telemetry TUI modules are importable and
          # actually measured; without it they silently report 0% coverage.
          # [slides] pulls python-pptx for the same reason: tests/slides_tests
          # imports it at collection time, so omitting it fails the suite before
          # a single test runs.
          python -m pip install -e ".[tui,slides]"
          python -m pip install coverage
      - name: Verify imports resolve to this checkout
        run: |
          python -c "import pathlib, sys, core; \
          src = pathlib.Path('src').resolve(); \
          got = pathlib.Path(core.__file__).resolve(); \
          sys.exit(0) if src in got.parents else (print(f'ERROR: core resolves to {got}, expected under {src}'), sys.exit(1))"
      - name: Verify every test directory is discoverable
        # `unittest discover` skips a directory with no __init__.py without
        # warning, so its tests silently never run here. A gitignored
        # __init__.py fails the same way: green locally, absent in CI.
        run: python bin/check_test_discovery.py
      - name: Run tests with coverage
        run: |
          coverage run -m unittest discover
          mkdir -p reports
          coverage lcov -o reports/lcov.info
      - name: Upload coverage to qlty
        uses: qltysh/qlty-action/coverage@main
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: reports/lcov.info
