# Domain recommender — mine Claude Code session transcripts to surface new CLI
# subcommands, new domain candidates, and consolidation opportunities.
#
# Data flow:
#   [pm fragment: pm-index-sessions → pm-extract-prompts → pm-score-efficiency]
#       → map-to-domains          (parallel)
#       → extract-intent-sequences (parallel)
#   → gap-analysis
#   → generate-sketches
#   → review-backlog              (human gate)
#   → [vtr fragment: vtr-validate → vtr-render]
#   → [docs fragment: docs-detect-surface-changes → docs-approve-doc-plan (human gate)
#                     → docs-update-docs → docs-verify-docs]
#
# Advisory only. This workflow proposes and documents; it never implements.
# To build an approved sketch, hand it to a separate implementation run.

name: domain-recommender
version: "1.0"
description: >
  Mine Claude Code session transcripts to recommend new CLI subcommands, new
  domains where no CLI exists, and consolidation opportunities where 2+ CLI
  invocations consistently appear together. Produces a prioritized addition
  backlog with implementation sketches and a ranked domain-recommendations.md,
  then records the accepted backlog in the repo's documentation.

  Complements synthesize-workflow-from-telemetry.yaml, which proposes new
  *workflows* from the same telemetry. This one proposes new *CLI surface* —
  subcommands and domains. The two do not overlap.

metadata:
  author: dancing-bear
  created: "2026-08-26"

trigger:
  source: manual
  params:
    since: "30d"               # Time window to mine (e.g. 30d, 14d, 7d)
    min_prompts: "3"           # Minimum prompts per session to include
    min_pattern_freq: "3"      # Minimum sessions a pattern must appear in
    projects_dir: "~/.claude/projects"  # Root dir for Claude Code project transcripts
    primary_artifact: "sketches.json"
    report_artifact: "domain-recommendations.md"
    validation_criteria: "every non-null file_to_modify path exists and is under src/ — never bin/, whose wrappers are symlinks to a generated router (bin/charts:1-12) regenerated by make bin-wrappers, so an edit there would be lost; workflow-type sketches carry null and are exempt|proposed domain names are snake_case and not already a directory under src/|roi_score arithmetic is correct for every scored entry, and no workflow_candidates entry carries a roi_score field at all|no gap_id appears in more than one candidate list|every example_prompt quoted traces to prompt-corpus.json|every non-null existing_command in a workflow-type sketch names a real command — probe it by appending --help (or run the CLI root with --agentic), never by running it verbatim, since many subcommands require arguments and exit non-zero without them; a slash- or comma-joined string is a defect and a null with a note is valid|every source named in a workflow candidate's rationale appears in its sources array|no workflow-type sketch claims a src/ file to modify"
    docs_change_source: "sketches.json"
    docs_backlog_doc: "docs/cli-surface-backlog.md"

workspace_dir: "{work_dir}/domain-recommender"

include:
  # Stages injected: pm-index-sessions → pm-extract-prompts → pm-score-efficiency
  # Produces: sessions-index.json, agents-index.json, prompt-corpus.json,
  #           efficiency-scores.json
  - path: workflows/shared/prompt-mine-transcripts.yaml
    prefix: pm
    depends_on: []
    reads_from: []
  # Stages injected: vtr-validate → vtr-render
  - path: workflows/shared/validate-then-render.yaml
    prefix: vtr
    depends_on: [review-backlog]
    reads_from: [generate-sketches]
  # Stages injected: docs-detect-surface-changes → docs-approve-doc-plan
  #                  → docs-update-docs → docs-verify-docs
  # docs-approve-doc-plan is a human_gate standing between analysis and any
  # write to a tracked repo file — this workflow therefore has two gates
  # (review-backlog and this one), and no doc is written unreviewed.
  # depends_on is vtr-render so corrections are applied before docs are written,
  # but note vtr-render is required:false upstream — docs-detect-surface-changes
  # independently gates on vtr-findings.json/vtr-corrections.json (its Step 0) so
  # a skipped or failed render cannot silently produce docs from uncorrected data.
  - path: workflows/shared/sync-docs-on-land.yaml
    prefix: docs
    depends_on: [vtr-render]
    reads_from: [generate-sketches, vtr-validate, vtr-render]

stages:

  # ===========================================================================
  # Stage 4a (parallel): Map prompt clusters to existing CLI domains
  # ===========================================================================

  - name: map-to-domains
    kind: gather
    depends_on: [pm-score-efficiency]
    reads_from: [pm-extract-prompts, pm-score-efficiency]
    description: >
      Enumerate all existing domains and map prompt clusters to them.

      Step 1 — list existing domains from the tree, not from memory:
        Glob: src/*/
        Capture all directory names (skip __pycache__ and any *.py file).
        Also run: ls bin/ to get the flat wrapper list for cross-referencing.
        The keyword table in Step 2 is a starting hint, not the source of
        truth — if a domain exists on disk that the table omits, include it
        anyway and note the omission in the output's "notes" field.
        NOTE: "core" is a shared-library domain (src/core/) with no CLI; include it
        in the domains list with cli_bin null and has_agentic_schema false.

      Step 2 — read prompt-corpus.json. For each prompt in "prompts", apply a
      three-phase classification:

      PHASE A — NOISE EXCLUSION: remove conversational noise first.
        Single words or short phrases with no actionable task content
        (e.g., "yes", "no", "ok", "continue", "which pr?", "thanks").
        Record count under served_by_skill_or_workflow["noise"].
        These are NOT passed to phase B or C.

      PHASE B — DOMAIN KEYWORD MAPPING: apply to all non-noise prompts.
      Use WORD-BOUNDARY, CASE-INSENSITIVE matching with optional s/es plurals.
      Implement each pattern as r'\b<stem>(?:s|es)?\b' so that e.g. "calendars"
      and "schedules" match their respective domains. Boundary rules prevent
      false matches: e.g. "cv" must not match inside "cvs". Note: "plan" and
      "apply" are deliberately excluded from the keyword table as generic dev
      verbs — they route too many non-schedule prompts ("apply the fix",
      "make a plan") to the schedule domain. First domain whose regex matches
      wins. A prompt matched here goes into that domain's bucket regardless of
      whether it also contains meta-work keywords — domain signal takes priority.

        \bmail\b, \bgmail\b, \boutlook\b, \binbox(?:es)?\b, \blabels?\b, \bfilters?\b → mail
        \bcalendars?\b, \bevents?\b, \binvites?\b, \bmeetings?\b                       → calendars
        \bschedules?\b, \brecurring\b                                                   → schedule
        \bresumes?\b, \bcv\b, \bcover letters?\b, \boverlay\b                          → resume
        \bphones?\b, \bios\b, \blayouts?\b, \bhome screens?\b, \bdocks?\b             → phone
        \bwhatsapp\b, \bchats?\b, \bmessage search\b                                   → whatsapp
        \bcharts?\b, \bgraphs?\b, \bplots?\b, \btime series\b                         → charts
        \bdiagrams?\b, \bmermaid\b, \bflowcharts?\b, \bsequences?\b                   → diagrams
        \bslides?\b, \bdecks?\b, \bpowerpoint\b, \bpptx\b                             → slides
        \bsheets?\b, \bxlsx\b, \bspreadsheets?\b, \bworkbooks?\b                      → sheets
        \bworkflows?\b, \byaml\b, \bstages?\b, \bfragments?\b, \bdag\b               → workflow
        \btelemetry\b, \bcosts?\b, \btokens?\b, \bsessions?\b                         → telemetry
        \bworkers?\b, \benqueue\b, \bqueues?\b, \bdaemon\b, \bjobs?\b                 → worker
        \bqlty\b, \blints?\b, \bruff\b, \bbandit\b, \bcomplexity\b                    → qlty
        \bdesk\b, \bworkspaces?\b, \bdesktop\b                                         → desk
        \bwifi\b, \bnetworks?\b, \bssid\b                                              → wifi
        \bmusic\b, \bapple music\b, \bplaylists?\b, \btracks?\b                       → apple_music
        \bmaker\b, \bscaffolds?\b, \btemplates?\b                                      → maker
        \bcore\b, \bshared library\b, \butilities?\b                                   → core

      PHASE C — META-WORK EXCLUSION: applies ONLY to prompts that were NOT
      matched by phase B (i.e., no domain keyword fired).
        Classify as served_by_skill_or_workflow any prompt that:
        (i) is a slash command of the form <command-name>/X</command-name> where X names a
            skill under .claude/skills/ — enumerate that directory at run time
            (do NOT hardcode the list); these are always unambiguous and are
            classified even before phase B in practice, but checking here is fine
            since a slash command is unlikely to also trigger a domain keyword.
        (ii) matches one or more of these keywords (word-boundary, case-insensitive):
              pr, pull request, review, thread, copilot, ci, merge, rebase,
              branch, commit, github.com/.../pull/
        Record counts per skill/keyword under served_by_skill_or_workflow.
        These are NOT clustered and do NOT appear in unmapped_clusters.

      What remains after phases A, B, C is placed in the "to_cluster" bucket.

      ACCOUNTING CHECK — after all three phases, verify:
        mapped(B) + served_by(C) + noise(A) + to_cluster == total corpus entries
      served_by(C) is the COUNT OF DISTINCT PROMPTS classified in phase C, NOT
      the sum of keyword-bucket values (a prompt matching two keywords increments
      two buckets but is only one prompt). Track a unique set of prompt indices
      for phase C and take its len() as served_by(C) in the formula.
      Record this check in the "notes" field; flag a mismatch.

      Step 3 — cluster unmapped prompts by intent into UPPER_SNAKE labels using
      the agent's own judgment. For each cluster assign nearest_domain (an
      existing src/ domain name or null). Only null-nearest_domain clusters are
      new-domain signal. Collect up to 3 verbatim example prompts per cluster.
      Record cluster detail in domain-map.json under "cluster_detail":
        [
          {
            "cluster": "MONITOR",
            "prompt_count": N,
            "session_count": N,
            "nearest_domain": null,
            "new_domain_candidate": true,
            "rationale": "...",
            "examples": ["...", "...", "..."]
          }
        ]

      Step 4 — for each domain that has at least one cluster mapped, use the Glob
      tool to list Python modules under the domain's src path:
        Glob: src/<domain>/**/*.py
      Collect up to 5 example prompts per domain (verbatim, first 80 chars each)
      and include them as "example_prompts" in each domain entry.

      Step 5 — check whether each domain's bin CLI exposes an agentic schema:
        First, resolve the repo root by running `git rev-parse --show-toplevel`
        and store it as REPO_ROOT. All repo CLI calls in this step use the
        absolute path <REPO_ROOT>/bin/<cli> — never ./bin/<cli>, because the
        agent's working directory may not be the repo root.
        cli_bin is the full invocation relative to REPO_ROOT, including any
        dispatcher argument — so <REPO_ROOT>/<cli_bin> is always runnable as-is.
        For most apps it is "bin/<cli>" (e.g. "bin/mail", "bin/desk"). Three
        differ: apple-music is "bin/apple-music-assistant", qlty is
        "bin/qlty-assistant", and resume is "bin/assistant resume" (two tokens —
        "bin/assistant" alone would probe the dispatcher, not resume). Run
        <REPO_ROOT>/bin/llm inventory --stdout for the authoritative list rather
        than assuming bin/<cli>.
        Run: <REPO_ROOT>/<cli_bin> --agentic --agentic-format yaml --agentic-compact 2>/dev/null
        Set has_agentic_schema=true if exit code == 0.
        Every app supports --agentic, so a false here is a defect worth
        reporting, not an expected result.
        "core" has no CLI — always false.

      Write domain-map.json:
        {
          "domains": [
            {
              "domain": "mail",
              "src_path": "src/mail/",
              "cli_bin": "bin/mail",
              "clusters": ["MAIL"],
              "prompt_count": N,
              "module_count": N,
              "has_agentic_schema": true,
              "example_prompts": ["...", "..."]
            }
          ],
          "unmapped_clusters": ["MONITOR"],
          "cluster_detail": [
            {
              "cluster": "MONITOR",
              "prompt_count": N,
              "session_count": N,
              "nearest_domain": null,
              "new_domain_candidate": true,
              "rationale": "...",
              "examples": ["...", "..."]
            }
          ],
          "served_by_skill_or_workflow": {"review-fix-threads": 43, "pr": 28, "noise": 12},
          "total_prompts_mapped": N,
          "total_prompts_served_or_noise": N,
          "total_prompts_unmapped": N,
          "accounting_check": "mapped(B)(N) + served_by(C)(N) + noise(A)(N) + to_cluster(N) == total(N): OK",
          "notes": "..."
        }
    agent:
      role: researcher
      model: sonnet
      tools:
        - Bash
        - Read
        - Glob
        - Write
      access: read-write
    outputs:
      - name: domain-map
        mode: generate
        description: >
          Enumerate src/ domains, classify prompts with pre-pass exclusion and
          word-boundary keyword mapping, cluster unmapped prompts, collect
          example_prompts per domain, write domain-map.json with cluster_detail
          and accounting check.
    required: true
    writes_to:
      - domain-map.json

  # ===========================================================================
  # Stage 4b (parallel): Extract CLI co-occurrence sequences and intent signals
  # ===========================================================================

  - name: extract-intent-sequences
    kind: gather
    depends_on: [pm-score-efficiency]
    reads_from: [pm-extract-prompts]
    description: >
      Extract CLI co-invocation pairs from session transcripts (primary) and
      strong manual-workflow signals from prompt text (secondary).

      PRIMARY SOURCE: mine Bash tool_use calls from session transcripts.

      Users rarely name CLIs in prompt text; agents run them in Bash tool calls.
      Mining prompt text yields near-zero signal (5 of 674 prompts named a
      ./bin CLI in the baseline run). The real signal lives in tool_use records.

      Write and run a Python scratch script (python3 -I -S) to parse the
      transcripts. Write the script to a file in WORKSPACE (defined in step 2); keep
      all intermediate and output files there too. Run the script with the
      working directory set to the REPO ROOT (not the workspace), so git and
      other repo-relative operations behave as they would in the checkout. The
      cwd is NOT what makes repo CLIs resolve — every CLI call uses an absolute
      REPO_ROOT/bin/<name> path (step 3), never ./bin/. Concretely:
        1. Before writing the script, capture the repo root by running
           `git rev-parse --show-toplevel` in the current (repo-root) shell
           session. Store it in a variable (e.g. REPO_ROOT).
        2. Store the absolute <workspace>/outputs/ directory in a variable
           WORKSPACE — take it from the "Output Files" section of this prompt,
           not from cwd. The engine places every declared artifact there, this
           stage's and upstream stages' alike, so a file directly under
           <workspace>/ is in the wrong place. Never
           rely on cwd to resolve workspace files — once the script runs from
           REPO_ROOT, a bare relative filename resolves inside the checkout, not
           the workspace. Pass both REPO_ROOT and WORKSPACE as command-line
           arguments to the script, or embed them as literals when writing the file.
        3. Inside the script, invoke all repo CLIs via the absolute path
           REPO_ROOT/bin/<name> — never as ./bin/<name>, because the script
           may be called from the workspace directory by the agent.
        4. Inside the script, read and write ALL workspace files using the
           absolute path WORKSPACE/<filename> — never a bare filename or a
           path relative to cwd.
        5. The inventory call in step 3 below MUST use the absolute path and
           MUST fail loudly (sys.exit with a non-zero code and an informative
           message on stderr) if the call fails or returns empty output — do
           NOT proceed with an empty known-app set.
      Do NOT attempt to parse JSONL in-context with the Read tool
      — transcripts total hundreds of MB.

      Script logic:

      1. Read WORKSPACE/sessions-index.json (produced by pm-index-sessions). Use
         the absolute path only — a bare "sessions-index.json" would resolve
         inside the checkout, where the file does not exist.
         Deduplicate entries by session_id first — sessions-index.json may contain
         duplicate rows for the same session_id (the provider collects from both
         flat and subdir layouts and appends without cross-dedup). Build a dict
         keyed by session_id, keeping the last entry seen, before iterating.
         For each unique session_id, locate its transcript files using BOTH layouts:
           Expand {projects_dir} before constructing any glob:
             projects_dir = os.path.expandvars(os.path.expanduser("{projects_dir}"))
           If the expanded directory does not exist, print an error to stderr and
           exit non-zero (do NOT silently return an empty result — a missing
           directory means no transcripts were found and the signal is void).
           Flat layout (post-Apr 2026):
             Glob: <projects_dir>/**/<session_id>.jsonl
           Subdir layout (pre-Apr 2026):
             Glob: <projects_dir>/**/<session_id>/subagents/*.jsonl
         Collect ALL matching files across both globs. If the flat glob matches
         multiple files, take the largest (by byte size) from that set.
         Each located .jsonl file is an independent conversation stream — parse
         spans independently per file (never carry a span across a file boundary),
         then union the resulting pair/session identities at the session-aggregation
         step (step 5/6). Do not skip subdir-layout files when a flat file also
         exists; each subagents/*.jsonl is a separate stream that contributes its
         own spans to the union.

      2. Parse each .jsonl file line by line. Each line is a JSON record.
         Malformed-input handling (per line):
           - Wrap json.loads() in a try/except json.JSONDecodeError; on error,
             increment a skipped_lines counter and continue to the next line.
           - After parsing, verify the record is a dict; if not, skip and count.
           - Records without a dict "message" (e.g. mode, attachment, summary)
             are normal: ignore them WITHOUT counting them as malformed.
           - Do NOT require content to be a list for every record: a user
             record whose content is a STRING is a span opener (step 4). Check
             that content is a list only when extracting tool_use blocks from
             an assistant record; if an assistant record's content is not a
             list, skip it and count it.
         After processing all files, record the total skipped_lines count in the
         "notes" field of intent-sequences.json (e.g. "skipped_malformed_lines: N").
         Do NOT abort on a malformed line — continue processing the rest of the file.
         Focus on assistant records (type == "assistant").
         message.content is a LIST; iterate blocks.
         Extract Bash tool_use blocks: block["type"] == "tool_use" and
           block["name"] == "Bash" and "input" in block and "command" in block["input"].

      3. Extract CLI invocations from each command string using:
           Primary pattern: r'(?:^|[\s;&|(])(\.|/[^\s;&|()\'"]*?)/bin/([\w][\w-]*)'
             Group 2 is the CLI name. Group 1 is the prefix; keep the match
             ONLY if the prefix is "." (the ./bin/<name> form) or an absolute
             repo root — agents now run <REPO_ROOT>/bin/<name>, so matching
             ./bin/ alone would drop those calls. An absolute prefix is a repo
             root when it equals MAIN_ROOT, or MAIN_ROOT/.claude/worktrees/<one
             path segment>, where MAIN_ROOT is the parent directory of
             `git rev-parse --path-format=absolute --git-common-dir` (resolve it
             once at startup; REPO_ROOT alone misses sibling worktrees). Any
             other prefix (/usr/bin/git, <root>/.venv/bin/python, another repo)
             is not a repo CLI — discard it.
           Desk, module form (transcripts from before ./bin/desk existed): r'python3\s+(?:-[^\s]+\s+)*-m\s+desk'
         After capturing the CLI name, apply dispatcher normalisation:
           If the captured name is "assistant", discard "assistant" and take the
           NEXT shell token as a candidate app name. Accept it ONLY if it matches
           r'^[a-z][a-z_-]*$' AND appears in the known-app list from
           <REPO_ROOT>/bin/llm inventory --stdout (run once at script startup
           using the absolute REPO_ROOT path; exit non-zero with an error
           message on stderr if the call fails or returns empty output — do
           NOT proceed with an empty known-app set; cache the result as a
           set). If the next token is a flag (starts with '-'), a
           shell operator (&&, ;, |, ||), or is absent, or is not in the
           known-app set, DISCARD the entire invocation — do not count it as
           "assistant" or as anything else. Shift subcommand capture by one
           position for accepted invocations.
           The desk regex above is unchanged.
           (e.g. "./bin/assistant resume export" → "resume";
                "./bin/assistant --help" → discarded;
                "./bin/assistant && ls"  → discarded.)
         All downstream tallies (cli_usage, top_subcommands, pairs) use the
         normalised app name — "assistant" must never appear as a CLI name in
         any output field.
         Also capture up to two following tokens as subcommand hints, but ONLY
         if each token looks like a subcommand — not a flag, not a path segment:
           After the CLI name, match each candidate token with r'[a-z][a-z-]*'
           and skip it (stop capturing) if it:
             - starts with '-' (a flag), or
             - contains '/' (a path argument), or
             - contains '.' (a filename), or
             - is a known non-subcommand positional token for that CLI
           In practice: after the CLI name, consume whitespace, then check the
           next word; if it fails any of the stop conditions above, do not
           record it as a subcommand. Apply the same check to the second token.
         Use these for cli_usage and top_subcommands tallies.

      4. Group tool_use Bash blocks by prompt span — one file at a time.
         Process each .jsonl file independently. A span starts at each user record
         whose message.content is a non-empty STRING. (Tool-result user records
         have message.content as a LIST — they must NOT start a new span; they
         belong to the current span.) A span runs from its opening user record to
         the next string user record within the SAME file. Never carry a span
         across a file boundary.
         Define span identity explicitly as the triple
           (session_id, file_path, opening_line_number)
         where file_path is the absolute path of the .jsonl file being parsed and
         opening_line_number is the 0-based index of the user record that opened
         the span. Carry this triple through all downstream uses: pair counting
         (step 5), the secondary-source union, and any deduplication — two spans
         with the same session_id but different file_path are DISTINCT spans and
         must never be merged. The span set for each pair is therefore a set of
         these triples, not a set of (session_id, ordinal) pairs.
         Collect all CLIs invoked by assistant tool_use blocks within each span.

      5. Within each span, enumerate all unordered pairs of distinct CLIs.
         A pair is a frozenset of two CLI names.
         Count:
           - spans: number of prompt spans containing that pair
           - sessions: number of distinct session_ids containing that pair
           - For each pair, record the first 150 chars of the opening user
             message of the first matching span as "example". Apply the same
             redaction patterns used by pm-extract-prompts before storing:
               sk-[A-Za-z0-9_-]{16,}                                    -> [redacted]
               ghp_[A-Za-z0-9]{20,}  and  gho_[A-Za-z0-9]{20,}          -> [redacted]
               AKIA[0-9A-Z]{12,}                                        -> [redacted]
               eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+   -> [redacted]
               (?i)(api[_-]?key|token|password|secret|bearer)\s*[=:]\s*\S+  -> \1=[redacted]
             Also replace home-path user segments:
               /Users/<name>/  ->  /Users/[user]/
               /home/<name>/   ->  /home/[user]/
         Retain pairs with sessions >= {min_pattern_freq}.

      6. Aggregate cli_usage: for each CLI, count total sessions and total calls.
         Aggregate top_subcommands: for each (cli, subcommand) pair, count sessions
         and calls; report top-20 by calls.

      The script writes its output to WORKSPACE/intent-sequences-raw.json (absolute
      path — never a bare filename while cwd is REPO_ROOT). After running the script,
      read WORKSPACE/intent-sequences-raw.json and write WORKSPACE/intent-sequences.json.

      SECONDARY SOURCES (keep both; they complement tool-call mining):

      (a) Prompt-text regex — scan WORKSPACE/prompt-corpus.json "prompts" (use the
      absolute path — cwd is REPO_ROOT) for prompts whose text mentions repo CLIs (./bin/<name> or an absolute repo-root bin/<name>)
      directly. Apply the same regex AND the same full dispatcher normalisation
      pipeline as the primary source (steps 3–4 above): the primary regex, the
      desk special case, the assistant-dispatcher normalisation, and the known-app
      validation set built from REPO_ROOT/bin/llm inventory --stdout. Do NOT apply
      only the regex and skip normalisation — the secondary scan must produce the
      same CLI name set as the primary source would for the same text. Specifically:
        - "./bin/assistant resume export" must yield "resume", not "assistant"
        - "./bin/assistant" with no valid next token must be discarded
        - "assistant" must never appear in any prompt_text_pairs entry
        - the desk regex must still match PYTHONPATH=... python3 ... -m desk forms
      Treat these as a SEPARATE higher-intent signal — a prompt that names a CLI
      is higher-intent than one where only the agent ran it.
      Do NOT union these pairs into cli_sequences: span identity is
      (session_id, file_path, opening_line_number), but prompt-corpus.json
      carries only session_id and prompt_index, so the two sources cannot be
      unioned without double-counting or collapsing distinct spans. Instead,
      report them in a separate "prompt_text_pairs" list, counting sessions
      by session_id only (deduplicated). Include every pair whose session count
      meets the freq threshold, with:
        sequence: sorted list of the two CLI names
        sessions: count of distinct session_ids where this prompt-text pair appears
        example: the first matching prompt text (first 150 chars, redacted)
      Do NOT merge prompt_text_pairs entries into cli_sequences or modify
      cli_sequences counts based on this secondary source.

      (b) Manual-workflow signals — scan all prompt text for:
        Keywords: "every time", "keep having to", "always need to", "i always",
                  "we always", "repeatedly", "constantly", "have to run"
        For each match record session_id, the full prompt text (first 300 chars),
        and how many times similar phrasing appears across sessions.

      Write intent-sequences.json:
        {
          "cli_sequences": [
            {
              "sequence": ["qlty-assistant", "workflow"],
              "freq": N,
              "spans": N,
              "example": "first 150 chars of opening user message of first matching span"
            }
          ],
          "prompt_text_pairs": [
            {
              "sequence": ["mail", "workflow"],
              "sessions": N,
              "example": "first 150 chars of the first matching prompt text"
            }
          ],
          "cli_usage": [
            {"cli": "workflow", "sessions": N, "calls": N}
          ],
          "top_subcommands": [
            {"command": "workflow run", "sessions": N, "calls": N}
          ],
          "manual_workflow_signals": [
            {
              "text": "first 300 chars...",
              "session_id": "...",
              "keyword_matched": "every time",
              "freq": N
            }
          ],
          "sources_summary": {
            "sessions_with_bash_clis": N,
            "total_sessions_scanned": N,
            "prompt_text_cli_mentions": N
          }
        }
    agent:
      role: code-writer
      model: sonnet
      tools:
        - Bash
        - Read
        - Glob
        - Write
      access: read-write
    outputs:
      - name: intent-sequences
        mode: generate
        description: >
          Write and run a Python script that mines Bash tool_use CLI invocations
          from session transcripts, groups co-invocations by prompt span, counts
          pairs by distinct sessions, and writes intent-sequences.json with
          cli_sequences (freq >= {min_pattern_freq}), cli_usage, top_subcommands,
          and manual_workflow_signals from prompt text.
    required: true
    writes_to:
      - intent-sequences.json

  # ===========================================================================
  # Stage 5: Gap analysis — subcommand gaps, new domains, consolidation
  # ===========================================================================

  - name: gap-analysis
    kind: execute
    depends_on: [map-to-domains, extract-intent-sequences]
    reads_from: [map-to-domains, extract-intent-sequences, pm-extract-prompts, pm-score-efficiency]
    description: >
      Identify concrete gaps in the CLI surface and score each by ROI.

      Sources to read (all from WORKSPACE, the absolute <workspace>/outputs/
      directory named in this prompt's "Output Files" section — the engine
      places every declared artifact there, not directly under <workspace>/;
      never rely on cwd to resolve these):
        WORKSPACE/domain-map.json        — domain coverage and cluster assignments
        WORKSPACE/intent-sequences.json  — CLI co-occurrence (cli_sequences from Bash
                                 tool_use mining) and manual-workflow signals;
                                 also contains prompt_text_pairs (a separate
                                 higher-intent secondary signal: CLI pairs
                                 mentioned directly in prompt text, counted by
                                 session_id only — do NOT union with cli_sequences;
                                 Step 3 consumes it on its own path)
        WORKSPACE/prompt-corpus.json     — full prompt text for intent analysis
        WORKSPACE/efficiency-scores.json — per-session cache/cost metrics and the top-10
                                 expensive prompts. Context only; it does NOT
                                 carry a per-session avg_tool_calls_after field.
                                 ROI scoring reads tool_calls_after directly
                                 from prompt-corpus.json and averages it over
                                 the prompts belonging to each gap.

      Step 1 — subcommand gap detection:
        First, resolve the repo root by running `git rev-parse --show-toplevel`
        and store it as REPO_ROOT. Store the <workspace>/outputs/ directory
        (see above) as WORKSPACE. All repo CLI calls in this stage use
        <REPO_ROOT>/bin/<cli> — never ./bin/<cli>, because the agent's working
        directory may not be the repo root. All workspace file reads and writes
        in this stage use the absolute path WORKSPACE/<filename>; never rely on
        cwd to resolve workspace files.
        For each domain in WORKSPACE/domain-map.json with at least one mapped cluster:
          Skip any domain whose cli_bin is null (e.g. "core") — these are
          shared-library domains with no CLI entry point. Do not attempt to run
          <REPO_ROOT>/bin/<None> or invent a CLI path for them; move on to the next domain.
          cli_bin is the full invocation relative to the repo root, bin/ prefix
          and any dispatcher argument included (e.g. "bin/mail",
          "bin/assistant resume"), so the runnable command is
          <REPO_ROOT>/<cli_bin> — never <REPO_ROOT>/bin/<cli_bin>, which yields
          bin/bin/mail. Below, <cli> means cli_bin with "bin/" removed.
          Run: <REPO_ROOT>/<cli_bin> --agentic --agentic-format yaml --agentic-compact
          Parse the YAML output to extract existing subcommand names.
          If the CLI has no agentic schema, fall back to: <REPO_ROOT>/<cli_bin> --help
          Read the domain's example_prompts from domain-map.json:
            domain-map.json stores example_prompts at the DOMAIN level
            (domains[].example_prompts) — not per cluster. Clusters under a
            domain do NOT carry their own example_prompts in domain-map.json;
            use the domain-level list for gap analysis.
          Determine whether any example_prompt intent is NOT covered by an
          existing subcommand. Heuristic: if the prompt describes an action that
          matches no subcommand name (keyword overlap < 0.3), mark as a gap.
          Record: domain, proposed subcommand name (snake_case verb-noun),
          rationale (1–2 sentences), up to 3 example prompts, prompt_freq
          (cluster frequency from prompt-corpus.json group-by).

        MULTI-SOURCE TEST — apply to EVERY candidate subcommand before recording
        it. Ask: does the underlying intent span more than one data source?

        Read the example prompts literally. Phrases like "the usual places",
        "everywhere", "wherever they are", or a noun that naturally arrives from
        several channels (receipts, invoices, photos, documents, messages) mean
        the user is describing a SEARCH ACROSS SOURCES, not a command on one of
        them. A subcommand lives on exactly one CLI and can therefore only ever
        see that CLI's source — so it answers a single-source question while the
        user asked a multi-source one, and every additional source later becomes
        another parallel implementation of the same logic.

        When the intent spans sources, set type "workflow" instead of proposing a
        subcommand. Record:
          - the sources involved and, for each, the EXISTING command that already
            covers it (probe them: <REPO_ROOT>/bin/<cli> --agentic --agentic-format yaml
            --agentic-compact, or <REPO_ROOT>/bin/<cli> --help)
          - estimated_new_cli_code: how many lines of NEW CLI code are actually
            required, which is usually 0 when every source already has a command
          - a note that synthesize-workflow-from-telemetry.yaml is the right tool
            to author it
        Do NOT emit a subcommand sketch for these. A worked example from a real
        run: "i want to scan for new receipts in the usual places" was recorded
        as a 90-line `mail messages scan-receipts` subcommand, but receipts
        arrive from mail, WhatsApp, and the local filesystem. Mail and WhatsApp
        are already covered by four separate existing commands —
        `<REPO_ROOT>/bin/mail messages search`,
        `<REPO_ROOT>/bin/mail messages list-attachments`,
        `<REPO_ROOT>/bin/mail messages download-attachment`, and
        `<REPO_ROOT>/bin/whatsapp search` —
        and the filesystem needs only a directory scan, no CLI at all. So the
        correct deliverable was a workflow with 0 lines of new CLI code.
        Record each of those as its OWN sources entry; never collapse several
        commands into one slash-joined string (see the format rule in Step 4).

        This test must run here, on every Step 1 candidate. Step 3 carries a
        similar check but is driven by intent-sequences.json cli_sequences
        (sourced from Bash tool_use records, so it carries real signal) and
        prompt_text_pairs — so run the MULTI-SOURCE TEST in Step 3 as well;
        do not skip it under the assumption either list will be empty.

      Step 2 — new domain candidates:
        For each cluster in domain-map.json "cluster_detail" where
        new_domain_candidate is true (nearest_domain is null):
          Propose a domain name: snake_case, max 20 chars.
          Verify it does not already exist: ls src/<name> must fail.
          Propose a bin/ CLI name matching the domain name.
          List 2–3 candidate subcommands inferred from the example prompts
          (available in cluster_detail[].examples).
          Estimate prompt_freq as the cluster's prompt_count from cluster_detail.

      Step 3 — consolidation candidates:
        For each sequence in intent-sequences.json cli_sequences with freq >= 3:
          Propose a composite command name, or a workflow stage name if the
          sequence maps cleanly to a pipeline. If the right answer is a new
          workflow rather than new CLI surface, say so explicitly and note that
          synthesize-workflow-from-telemetry.yaml is the correct tool — do not
          propose CLI surface to cover a workflow-shaped need.
          Set impl_complexity = "medium" (new subcommand) or "high" (new domain).
          Record signal_source "tool_calls" and prompt_freq = the sequence's freq.

        Then, SEPARATELY, for each entry in intent-sequences.json
        prompt_text_pairs with sessions >= 3 — the higher-intent signal of a
        user naming both CLIs in one prompt. Never add its sessions to a
        cli_sequences freq; the two sources count different units (sessions vs
        spans) and cannot be summed:
          - If the same sorted sequence already produced a candidate above,
            do not create a second one. Annotate the existing entry with
            prompt_text_sessions = sessions, leaving its prompt_freq unchanged.
          - Otherwise create a candidate exactly as above (same workflow-vs-CLI
            judgement and MULTI-SOURCE TEST), with signal_source "prompt_text"
            and prompt_freq = sessions.

      Step 4 — ROI scoring.

        SCOPE — this step applies to subcommand_gaps, new_domain_candidates, and
        consolidation_candidates ONLY. workflow_candidates are NOT scored: they
        must omit roi_score entirely (not null, not 0 — the field is absent) and
        are ranked by prompt_freq instead. Adding a roi_score to a workflow
        candidate breaks the schema and skews the ranking, since the formula
        measures implementation cost against demand and a workflow candidate's
        cost is ~0 by definition. Everything below is about the three scored
        lists.

        Step 4a — corpus sanity check, before any scoring. Count how many
        prompts in prompt-corpus.json have tool_calls_after == 0. If that is
        more than half of all prompts, the extraction failed rather than the
        sessions being genuinely tool-free (a real session almost always makes
        tool calls). Do NOT score against it: set every entry's confidence to
        0.3 with "estimated": true, and record at the top of gap-analysis.json:
          "corpus_warning": "<n>/<total> prompts have tool_calls_after == 0 —
          effort_factor is unreliable; rankings reflect prompt_freq only."
        Say so plainly in the report rather than presenting the ranking as
        measured.

        Read this note before scoring. `avg_tool_calls_after` is an ambiguous
        signal, and the naive formula (freq * tool_calls * weight) gets it
        backwards. A high tool-call count can mean either:
          (a) the task is genuinely laborious and a CLI would collapse it into
              one call — real evidence FOR building something; or
          (b) the agent was flailing, retrying, and correcting itself — which
              telemetry-review.yaml classifies as WASTE, not value.
        Multiplying by the raw number cannot tell these apart, so it
        systematically ranks the noisiest sessions highest. Bound and discount
        it instead:

        For each gap entry:
          prompt_freq    = number of prompts matching this cluster/sequence.
                           This is the PRIMARY signal — recurrence across
                           distinct sessions is what justifies building.
          avg_tool_calls = avg tool_calls_after across those prompts
            (join prompt-corpus.json on session_id, then average tool_calls_after)

          effort_factor  = min(avg_tool_calls, 10) / 5.0
            Clamp at 10 before dividing, so one pathological 60-call session
            cannot outweigh a genuinely frequent pattern. Yields ~0.2–2.0.

          confidence:
            1.0  — avg_tool_calls computed from at least 3 real prompts
            0.6  — computed from 1–2 prompts (thin evidence)
            0.3  — unavailable; substitute effort_factor = 1.0 (neutral, NOT 5.0)
                   and set "estimated": true
            A missing measurement must never score higher than a real low one.
            The old 5.0 default did exactly that — it silently became the
            maximum effort_factor.

          impl_complexity:
            "low"    — new flag on existing subcommand
            "medium" — new subcommand on existing CLI
            "high"   — new domain + CLI
          complexity_weight: low=1.5, medium=1.0, high=0.5
            These weight CHEAPNESS, not size: a low-complexity change scores
            higher because it delivers the same relief for less work. This
            inverts the usual "story points" intuition — do not "fix" it.

          roi_score = prompt_freq * effort_factor * complexity_weight * confidence

          estimated_lines:
            low=10, medium=50, high=200

        Also record, for each entry, "friction_ambiguous": true when
        avg_tool_calls > 10 — the report must flag these as possible waste
        rather than demand, since the same signal appears in telemetry-review's
        token_waste bucket.

      Write gap-analysis.json:
        {
          "generated_at": "<ISO-8601>",
          "since": "{since}",
          "subcommand_gaps": [
            {
              "gap_id": "mail-find-stale-filters",
              "domain": "mail",
              "proposed_name": "find_stale",
              "rationale": "...",
              "example_prompts": ["...", "..."],
              "prompt_freq": N,
              "avg_tool_calls": F,
              "effort_factor": F,
              "confidence": F,
              "estimated": false,
              "friction_ambiguous": false,
              "impl_complexity": "medium",
              "roi_score": F,
              "estimated_lines": 50
            }
          ],
          "new_domain_candidates": [...],
          "consolidation_candidates": [...],
          "workflow_candidates": [
            {
              "gap_id": "scan-receipts-multi-source",
              "type": "workflow",
              "rationale": "intent spans mail + whatsapp + filesystem",
              "sources": [
                {"source": "mail", "existing_command": "<REPO_ROOT>/bin/mail messages search"},
                {"source": "mail", "existing_command": "<REPO_ROOT>/bin/mail messages list-attachments"},
                {"source": "mail", "existing_command": "<REPO_ROOT>/bin/mail messages download-attachment"},
                {"source": "whatsapp", "existing_command": "<REPO_ROOT>/bin/whatsapp search"},
                {"source": "filesystem", "existing_command": null, "note": "no CLI — plain directory scan of the usual download dirs"}
              ],
              "example_prompts": ["..."],
              "prompt_freq": N,
              "estimated_new_cli_code": 0,
              "authoring_tool": "workflows/code/synthesize-workflow-from-telemetry.yaml"
            }
          ]
        }
      Sort the first three lists by roi_score descending. workflow_candidates
      carry no roi_score — rank them by prompt_freq, since their cost is near
      zero when every source already has a command. Note the entry above has no
      roi_score key: that omission is deliberate, not an oversight in the
      example. Do not add the field back, and do not emit it as null or 0.

      existing_command FORMAT — one entry per real, individually runnable
      command. Never join several commands into one string with slashes or
      commas: the validation stage probes each existing_command by appending
      --help to it, and a joined string is not a command, so it cannot be probed
      and will fail. Probe with --help rather than running the command as
      written — many subcommands require arguments (<REPO_ROOT>/bin/mail messages
      list-attachments needs --id and exits 2 without it), so a verbatim run
      would report a real command as broken.
      Record every existing_command with the repo root EXPANDED to the literal
      absolute path you resolved (e.g. /abs/path/to/repo/bin/mail messages
      search) — never ./bin/<cli> and never the unexpanded <REPO_ROOT>
      placeholder. The validation stage may run each probe outside the repo
      root, so a relative ./bin/ path can fail there and falsely report a
      real command as missing.
      A source needing three commands gets three entries, all with the same
      "source" value. A source with no CLI at all (a plain filesystem scan) sets
      existing_command to null and explains in "note" — do not invent a command
      name to fill the field.

      "sources" must also cover every source named in "rationale". If the
      rationale says the intent spans mail, WhatsApp, and the filesystem, all
      three appear in sources — including any that has no CLI.

      A gap_id must appear in exactly one of the four lists. If a candidate
      could plausibly be either a subcommand or a new domain, classify it as a
      subcommand — extending an existing CLI is cheaper and reversible. But if
      it failed the MULTI-SOURCE TEST above, it belongs in workflow_candidates
      regardless of how naturally it reads as a subcommand.
    agent:
      role: code-writer
      model: sonnet
      tools:
        - Read
        - Bash
        - Write
      access: read-write
    outputs:
      - name: gap-analysis
        mode: generate
        description: >
          Detect subcommand gaps by comparing cluster prompts to existing CLI
          subcommands, propose new domains for unmapped clusters, route
          multi-source intents to workflow_candidates, ROI-score the three
          scored lists (workflow_candidates omit roi_score and rank by
          prompt_freq), and write gap-analysis.json.
    required: true
    writes_to:
      - gap-analysis.json

  # ===========================================================================
  # Stage 6: Generate sketches — implementation blueprints for top gaps
  # ===========================================================================

  - name: generate-sketches
    kind: execute
    depends_on: [gap-analysis]
    reads_from: [gap-analysis]
    description: >
      Produce concrete implementation sketches for the highest-ROI gaps.

      Step 1 — read .llm/PATTERNS.md to understand the CLIApp pattern, argparse
      conventions, and module layout used in this codebase. Also read
      src/core/cli_framework.py to confirm the current base-class contract
      rather than assuming it from the patterns doc.

      Step 2 — store the absolute <workspace>/outputs/ directory named in this
      prompt's "Output Files" section as WORKSPACE; the engine places every
      declared artifact there, not directly under <workspace>/, so take the path
      from the prompt rather than from cwd. Read WORKSPACE/gap-analysis.json
      (use the absolute path). Take:
        - Top 5 entries from subcommand_gaps by roi_score
        - Top 3 entries from new_domain_candidates by roi_score
        - ALL entries from workflow_candidates (there are usually few, and each
          costs ~0 lines of new code, so there is no reason to truncate them)

      Step 3 — for each subcommand gap:
        Identify the exact file to modify:
          Use Glob: src/<domain>/**/*.py to find the CLI class file.
          Prefer the file that already has the most subcommand definitions.
          Verify the path exists before writing it into the sketch — a sketch
          naming a file that does not exist is worse than no sketch.
        Produce:
          function_signature: the exact argparse subparser handler signature
            matching this repo's convention
          pseudocode: 3–5 lines describing core logic
          test_file: tests/<domain>_tests/test_<proposed_name>.py (or extend the
            nearest existing test file if one covers this CLI class)
          estimated_lines: realistic estimate for implementation + tests

      Step 4 — for each new domain candidate:
        Produce the directory structure:
          src/<domain>/
            __init__.py
            cli.py            (CLIApp subclass with 2 candidate subcommands)
            _<domain>_client.py  (API/data-access layer if applicable)
          tests/<domain>_tests/
            test_<domain>_cli.py
        The bin/ wrapper is NOT hand-written: bin/* entries are symlinks to a
        single generated router (see bin/charts:1-12). Add the domain to
        bin/_wrappers.yaml and run `make bin-wrappers` to generate bin/<domain>.
        Never list bin/<domain> as a file to author — an edit there would be
        overwritten on the next regeneration.
        Include the CLI class skeleton (class name, base class, build_parser stub,
        and the two candidate subcommand method stubs).
        Note whether the new domain produces output files; if so, state that it
        must use core.paths.output_dir("<domain>") rather than a relative path.

      Step 5 — for each workflow candidate, produce a workflow sketch instead of
      a code sketch. Set type "workflow", file_to_modify null,
      function_signature null, and estimated_lines 0. In pseudocode, write the
      stage outline: the fan-out over each source naming the EXISTING command
      that covers it, then how results are joined, deduped, and organized.
      Verify each named command really exists before writing it — resolve the
      repo root first (`git rev-parse --show-toplevel`) and probe with
      <REPO_ROOT>/bin/<cli> --agentic --agentic-format yaml --agentic-compact
      or <REPO_ROOT>/bin/<cli> --help (see <REPO_ROOT>/bin/llm inventory
      --stdout for the three apps whose invocation differs).
      Write every command in the sketch with the repo root expanded to its
      literal absolute path, per the existing_command FORMAT rule in gap-analysis.
      Name workflows/code/synthesize-workflow-from-telemetry.yaml as the tool to
      author it. Do not invent a src/ path for these; there is no code to write.

      Write WORKSPACE/sketches.json (use the absolute path — never a bare filename):
        {
          "generated_at": "<ISO-8601>",
          "sketches": [
            {
              "gap_id": "mail-find-stale-filters",
              "type": "subcommand",
              "domain": "mail",
              "file_to_modify": "src/mail/cli.py",
              "function_signature": "def _find_stale(self, args: argparse.Namespace) -> int:",
              "pseudocode": "filters = self._client.list_filters()\nstale = [f for f in filters if f.last_matched_days > 90]\nemit_rows(stale, fmt=args.format)",
              "test_file": "tests/mail_tests/test_mail_cli.py",
              "estimated_lines": 55
            }
          ]
        }

      These are sketches, not implementations. Do not create, edit, or scaffold
      any file under src/, bin/, or tests/ — this workflow is advisory.
    agent:
      role: doc-writer
      model: sonnet
      tools:
        - Bash
        - Read
        - Glob
        - Write
      access: read-write
    outputs:
      - name: sketches
        mode: generate
        description: >
          Read .llm/PATTERNS.md, select top 5 subcommand gaps + top 3 new domains
          from gap-analysis.json, produce implementation sketches, write sketches.json.
    required: true
    writes_to:
      - sketches.json

  # ===========================================================================
  # Stage 7: Human gate — approve the backlog before it is documented
  # ===========================================================================

  - name: review-backlog
    kind: propose
    depends_on: [generate-sketches]
    reads_from: [gap-analysis, generate-sketches]
    description: >
      Present the recommendation backlog for human approval before it is
      validated, rendered, and written into the repo's documentation.

      Read gap-analysis.json and sketches.json. Present a compact summary:

        For each of the top 5 subcommand gaps and top 3 new domain candidates:
          - gap_id, domain, proposed name
          - roi_score and the prompt_freq / avg_tool_calls it derives from
          - whether avg_tool_calls was estimated (lower confidence)
          - file_to_modify (subcommands) or new directory tree (domains)
          - estimated_lines

        Then EVERY workflow candidate — these are approved or rejected here like
        any other entry, and must never reach the documentation stages without
        being shown. generate-sketches includes all of them rather than a top-N
        slice, so present all of them. For each:
          - gap_id and the sources the intent spans
          - the EXISTING command covering each source (or "no CLI" for a plain
            filesystem scan)
          - prompt_freq (these carry no roi_score — they are ranked by frequency
            because their cost is near zero when every source already has a
            command)
          - estimated_new_cli_code, which should be 0
        Say plainly that approving one authorizes recording a workflow proposal,
        not writing any CLI code.

        Then a short list of consolidation candidates, flagging any that would
        be better served by a new workflow than by new CLI surface.

      Then ask:
        "Review the backlog above and choose one:
          A) Approve all — record every entry in the backlog doc.
          B) Approve a subset — list the gap_ids to record.
          C) Reject all — record nothing."

      Entries the reviewer rejects must be dropped from sketches.json before
      the downstream stages read it — rewrite sketches.json with only the
      approved entries, and record the dropped gap_ids in a "rejected" array
      with the reviewer's stated reason.

      Write approved-backlog.json:
        {
          "decision": "approve_all|approve_subset|reject_all",
          "approved_gap_ids": ["..."],
          "rejected": [{"gap_id": "...", "reason": "..."}]
        }

      For decision "reject_all", write sketches.json with an empty "sketches"
      array. The docs fragment will then correctly detect a no-op and write
      nothing to the repo.

      Nothing downstream implements these. Approval here means "record this as
      a proposal", not "build this".
    agent:
      role: reviewer
      model: sonnet
      tools:
        - Read
        - Write
      access: read-write
    outputs:
      - name: approved-backlog
        mode: generate
        description: >
          Summarize the backlog for human approval, rewrite sketches.json to
          contain only approved entries, and record rejected gap_ids with reasons.
    human_gate: true
    required: true
    writes_to:
      - sketches.json
      - approved-backlog.json
