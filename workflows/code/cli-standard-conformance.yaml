name: cli-standard-conformance
version: "1.0"
description: >
  Bring every CLI in src/ to the standard defined in .llm/CLI_STANDARD.md, then
  prove conformance with a machine-checkable audit rather than a reviewer's
  opinion.

  The standard has four tiers: structure (CLIApp + AppMeta + real emit_func),
  agentic CLI surface (--agentic / --agentic-format / --agentic-compact / the
  optional -- separator), domain capsule builders (two legitimate shapes: full
  and minimal), and LLM dispatch modules. Each rule is proven by a shared
  contract mixin in tests/, never by per-app copy-paste.

  Why this workflow exists: the same behaviour was being asserted by hand in
  16 test files for one function and 9 for another, which meant coverage was
  whatever the last person copied. Contract mixins state each rule once; this
  workflow finds who has not adopted them and fixes it.

  The audit is a real script, not an LLM judgement. It EXECUTES each app
  (importing main() and capturing stdout) rather than reading source, because
  every interesting failure mode in this codebase is invisible to a reader:

    - core/assistant.py::maybe_emit_agentic wraps emit_func in a bare
      `except Exception`, prints a ~78-byte fallback banner, and returns 0. A
      totally broken capsule builder is indistinguishable from success by exit
      code, AND passes an `agentic: <app_id>` first-line assertion. Only a
      byte-count floor detects it. This has produced three separate defects.
    - core.agentic.cached_parser_loader swallows a failed parser import and
      returns None, degrading the capsule to a stub that still exits 0.

  Consequently every conformance check in this workflow asserts on CONTENT
  (byte counts, key sets, tree presence), never on exit codes alone.

  RETIRED EXEMPTION — telemetry is no longer Click-based.
    PR #341 ("port Click to argparse, completing CLI-standard conformance")
    landed the migration. Verified 2026-09-11: zero `@click` decorators, zero
    `click` imports and zero `CliRunner` uses remain anywhere in src/telemetry/
    or tests/telemetry_tests/.
    telemetry therefore has NO A3/A6 carve-out — hold it to the same rules as
    every other argparse app, and treat an A3/A6 gap there as a real defect.
    The G2b migration stream and its `migrate_click` param were removed with
    this note; there is nothing left to migrate.

  One shape that looks like a gap but is not, and must NOT be "fixed":
    - charts, diagrams, sheets, slides, worker, workflow, apple_music and
      telemetry define no build_domain_map by design (minimal tier). They are
      not unadopted — the opt-out (EXPECT_DOMAIN_MAP=False) asserts GENUINE
      ABSENCE in both directions, so it cannot mask a deleted function.

  Note on prior remediation: apple_music's capsule was a 72-byte fallback
  banner when this workflow was written and has since been FIXED (~1.2KB, with
  meta.py and agentic.py added). Treat that as history, not as a defect to
  rediscover — the audit measures the live tree, and Step 5 below deliberately
  checks SHAPE rather than fixed expected values for exactly this reason. That
  applies to the size quoted here too: it is an order of magnitude, not a
  target to reproduce.

  Stage dependency graph:

    audit-conformance
          |
    plan-remediation  [human gate]
          |
    +-----+-----+
    |     |     |                (parallel fan-out, disjoint file sets)
    fix-  fix-  fix-
    meta  con-  llm
          tracts
    |     |     |
    +-----+-----+
          |
    verify-conformance
          |
    verify-tests
          |
    human-gate

  Fan-out groups are partitioned by FILE, not by app, because the contract
  mixins in tests/ are shared files that two agents would otherwise both edit.

metadata:
  author: dancing-bear
  created: "2026-08-31"

trigger:
  source: manual
  params:
    apps: "*"                  # comma-list of apps to include, or "*" for all
    tiers: "0,1,2,3"           # which standard tiers to enforce
    fix_source: "true"         # "false" = audit + test adoption only, no src/ edits
    pr_title: "refactor(cli): bring all CLIs to the shared standard"
    # Declared here (not under include.params) because include.params is parsed
    # but NOT wired to substitution — see src/workflow/models.py IncludeSpec.params
    # ("reserved for future use"). Fragments share the parent's param namespace.
    plan_file: "design/plan.md"
    critic_focus: >
      Focus on whether the audit's conformance verdicts are trustworthy: does
      each check actually execute the app rather than read it, and would it
      survive the rc=0 fallback trap? Challenge any rule that asserts only an
      exit code or only a first line. Also challenge the remaining claimed
      exemption (minimal-tier domains) — is it genuine design variation, or an
      unadopted abstraction being excused? The telemetry/Click exemption was
      retired with #341 and must not be reintroduced.

workspace_dir: "{work_dir}/cli-standard-conformance"

stages:

  # ===========================================================================
  # G0: Audit — execute every app, score it against the standard
  # ===========================================================================

  - name: audit-conformance
    kind: gather
    depends_on: []
    description: >
      Score every app in src/ against .llm/CLI_STANDARD.md by RUNNING it.
      Do not modify any file in this stage.

      Step 1 — read the standard.
        Read .llm/CLI_STANDARD.md in full. It is the authority for every rule
        ID referenced below (S1-S4, A1-A7, B1-B4, L1-L3).

      Step 2 — write the audit script.
        Write {workspace}/validation/audit_cli_standard.py. It MUST import each
        app's main() and capture stdout — NOT parse source text. Reading source
        cannot detect a swallowed import or a fallback banner.

        For each app emit one JSON record:
          {{
            "app": "wifi",
            "app_id": "wifi",              # as ANNOUNCED, not the package name
            "parser": "argparse|click",
            "tier0": {{"cliapp": bool, "appmeta": bool, "real_emit_func": bool,
                       "main_returns_int": bool}},
            "tier1": {{"rc": 0, "capsule_bytes": 525, "json_keys": [...],
                       "compact_smaller": bool, "separator_equivalent": bool,
                       "no_subcommand_rc": 0}},
            "tier2": {{"has_agentic_module": bool, "shape": "full|minimal|none",
                       "has_domain_map": bool, "has_cli_tree": bool,
                       "emit_matches_builder": bool}},
            "tier3": {{"has_llm_cli": bool, "prog": "llm-wifi",
                       "doc_suffix": "WIFI"}},
            "contracts_adopted": ["AgenticCLIContractMixin", ...],
            "violations": [{{"rule": "A2", "detail": "<measured, e.g. capsule is N bytes>"}}]
          }}

        Emit ONE JSON DOCUMENT, not JSON Lines. Write a single top-level
        object: {{"apps": [<one record per app>], "duplication": [...],
        "summary": {{...}}}}. The first run of this workflow emitted one object
        per line, so json.load() raised "Extra data: line 2 column 1" and every
        downstream consumer had to special-case it. Also make sure nothing else
        writes to stdout — two apps print a usage banner when imported, which
        corrupts the stream; capture and discard it.

        EVERY tier0/tier2/tier3 field MUST be measured live. Do NOT build a
        static table of which apps have which files and read from it. The first
        run hardcoded `meta_module: None` for the apps lacking a meta.py at
        authoring time, so after those apps were fixed the audit still reported
        appmeta=false — a false negative that would fail verify-conformance's
        improvement gate against work that had actually landed. Derive each
        field by importing or globbing at run time:
          appmeta        -> importlib.import_module(f"{{pkg}}.meta").META exists
                            and produces a non-empty agentic_fallback
          cliapp         -> a CLIApp instance is reachable; CHECK BOTH
                            <pkg>.cli AND <pkg>.cli.main. Many packages define
                            it in <pkg>/cli.py with no cli/main.py at all —
                            measured 2026-09-11, eleven of them: apple_music,
                            charts, desk, diagrams, qlty, sheets, slides,
                            telemetry, wifi, worker, workflow. Do not trust
                            that list either; derive it
                            (`for d in src/*/; do [ -f "$d/cli.py" ] && [ ! -f
                            "$d/cli/main.py" ] && echo "$d"; done`). Checking
                            only <pkg>.cli.main would mis-measure every one.
          has_llm_cli    -> the module imports and exposes CONFIG
          has_domain_map -> hasattr(<pkg>.agentic, "build_domain_map")
        A rule the audit cannot measure live is a rule it must report as
        UNKNOWN, never as passing or failing. Encode that as the JSON STRING
        "UNKNOWN" in the field's place — not null, not an omitted key, not
        false. Downstream stages test `value == "UNKNOWN"`, so the sentinel has
        to be distinguishable from a measured negative: null and a missing key
        are both indistinguishable from "the audit did not look", and false is
        indistinguishable from "measured, and it failed". Those are three
        different states and only an explicit sentinel separates them.

        Critical measurement rules:
          - capsule_bytes is len(output.encode("utf-8")), NOT len(str). Several
            capsules carry non-ASCII (calendars uses em dashes and arrows).
          - app_id must be READ FROM THE OUTPUT, never assumed from the package
            name. calendars announces "calendar" (singular); apple_music
            announces "apple-music-assistant".
          - separator_equivalent compares main(["--agentic"]) output to
            main(["--","--agentic"]) output for BYTE equality.
          - telemetry is argparse since #341 and has no A3 carve-out. Record
            parser:"argparse" and hold its json_keys to the argparse six like
            any other app; a 5-key schema there is a real A3 violation now, not
            the false positive it was while the CLI was Click-based.

      Step 3 — determine contract adoption, PER FILE not per directory.
        Record, for each app, the exact LIST OF FILES that adopt each of
        AgenticCLIContractMixin, AgenticBuilderContractMixin,
        SeparatorContractMixin and llm_cli_contract — not merely whether the
        directory contains a match.

        A directory-level grep marks an app "adopted" as soon as ONE file
        matches, which hides a sibling file still carrying hand-rolled
        duplicates. Several apps have more than one agentic test file
        (sheets and slides each have a builder file AND a CLI file), so the
        plan needs the file list, not a boolean.

        Also record any file that BOTH adopts a mixin AND still defines its
        own copies of assertions that mixin covers — that is unconsolidated
        duplication and is the specific thing this work exists to remove.

        Test directory names do not always match package names (calendars ->
        tests/calendars_tests). Resolve each by looking, not by assuming.

      Step 4 — run it and write results.
        PYTHONPATH="$PWD/src" python3 {workspace}/validation/audit_cli_standard.py \
          > {workspace}/validation/conformance.json

        Copy the script to {workspace}/validation/ so verify-conformance re-runs
        the BYTE-IDENTICAL script rather than a reimplementation.

      Step 5 — sanity-check the result.
        An audit reporting zero violations across 18 apps is far more likely to
        be a broken audit than a conformant repo.

        These are SHAPE checks, not fixed expected values. Do NOT "correct" the
        audit until it reproduces any specific number below — the tree changes,
        and an audit tuned to match a stale snapshot is worse than no audit.
        Earlier remediation may ALREADY have fixed some of these. Verify the
        audit's MACHINERY works, then trust its output:

          - Capsule sizes must SPAN a wide range (hundreds of bytes to tens of
            KB). If every app reports a near-identical small size, the audit is
            measuring the fallback banner for all of them and is broken.
          - No app may report 0 bytes or a missing capsule while also
            reporting rc=0 — that combination means the measurement failed,
            not that the app is broken.
          - At least one app must report a capsule > 10KB (mail is by far the
            largest). If none does, the audit is truncating.
          - NO app should report parser:"click" — the last one (telemetry) was
            ported in #341. Every app should report the argparse 6-key schema
            {description, epilog, options, prog, subcommands, usage}. Any
            non-6 key set, or any parser:"click", means investigate before
            proceeding.
          - The AppMeta count must equal `ls src/*/meta.py | wc -l`. Run that
            command and compare — do not hardcode the number.
          - EVERY CLIApp app must pass separator_equivalent, telemetry
            included. It was exempt only while Click kept it out of
            normalize_argv; since #341 it routes through the same path as the
            rest. Measured 2026-09-11: main(["--agentic"]) and
            main(["--","--agentic"]) both return rc=0 and are byte-identical.
            A telemetry failure here is now a real violation, not an exemption.

        If a shape check fails, fix the AUDIT. If the shape checks pass but the
        violation list is shorter than you expected, that is a valid result —
        report it rather than manufacturing violations to match a prior belief.
    agent:
      role: researcher
      model: sonnet
      tools: [Bash, Read, Write]
      access: read-write
    outputs:
      - name: conformance
        mode: generate
        description: >
          conformance.json as a SINGLE JSON object with top-level keys
          apps / duplication / summary (not JSON Lines, not a bare list),
          plus the audit script that produced it.
    required: true
    writes_to:
      - validation/audit_cli_standard.py
      - validation/conformance.json

  # ===========================================================================
  # G1: Plan — group violations into disjoint work packages
  # ===========================================================================

  - name: plan-remediation
    kind: propose
    human_gate: true
    depends_on: [audit-conformance]
    reads_from: [audit-conformance]
    description: >
      conformance.json is a single JSON document with top-level keys
      apps / duplication / summary. Read it with
      `json.load(open(path, encoding="utf-8"))` — json.load takes a file
      object, not a path; json.loads takes the string.

      Turn conformance.json into an ordered remediation plan, partitioned so
      parallel agents never touch the same file.

      Write {workspace}/{plan_file} (markdown) and
      {workspace}/design/work-packages.json.

      Partition into exactly these three packages. The partition is by FILE,
      not by app, because the contract mixins are shared files:

        P1 "fix-meta"      — src/<app>/meta.py + the BaseAssistant construction
                             in each non-conformant app's cli.py. Rule S2.
                             Touches src/ ONLY. Skip entirely if
                             fix_source == "false".
        P2 "fix-contracts" — tests/ only: adopt AgenticCLIContractMixin and
                             AgenticBuilderContractMixin where missing, and
                             DELETE the hand-rolled assertions they replace.
        P3 "fix-llm"       — tests/ only: adopt LLMCLIContractMixin where
                             missing (mail is the one gap).
      (There was a P4 "split-click" package that split the CLI contract into a
      parser-agnostic base mixin so a Click-based telemetry could adopt part of
      it. #341 ported telemetry to argparse and it now adopts the whole
      contract, so P4 is retired — do not plan one, and do not reintroduce the
      P2/P4 ordering constraint it required.)

      For each package record: rule IDs addressed, exact file list, apps
      affected, and expected test-count delta.

      Deferral is a legitimate outcome. Explicitly mark as DEFERRED, with
      reasons, anything where the fix is riskier than the inconsistency:
        - (Historical) Converting telemetry from Click to argparse. #341
          completed this, so there is nothing left to defer or migrate —
          telemetry is a normal conformance candidate now. Do not reinstate a
          Click deferral for it.
        - Changing any app's ANNOUNCED app_id — that is a public identifier.
          apple_music announces "apple-music-assistant"; check
          `./bin/llm inventory --stdout` and the llm dispatch registry before
          proposing any change, and default to leaving it alone.
        - Any change to a public CLI flag, subcommand, or exit code. CLAUDE.md
          forbids breaking public CLI compatibility. Rule A7 documents the
          differing no-subcommand exit codes (charts 1, diagrams 0, worker 1,
          workflow 2) as DELIBERATE — do not normalise them.

      Present to the human: violation counts by rule and tier, the three
      packages with file lists, everything deferred with reasons, and the
      expected duplication removed per file. Do NOT promise a net-negative line
      delta: the bulk deletion already happened in PR #320, so adopting
      contracts now ADDS lines on balance. verify-tests measures duplication
      removed, not net lines, and a plan that targets the wrong number sets up
      a false failure.
    agent:
      role: Plan
      model: sonnet
      tools: [Bash, Read, Write]
      access: read-write
    outputs:
      - name: plan
        mode: generate
        description: plan.md and work-packages.json with three disjoint packages.
    required: true
    writes_to:
      - design/plan.md
      - design/work-packages.json

  # ===========================================================================
  # G1.5: Adversarial critique of the plan (Opus critic, Sonnet fact-check)
  # ===========================================================================
  # Injects: pc-validate -> pc-critic -> pc-validate-critique -> pc-consolidate
  #          -> pc-human-gate -> pc-revise
  # Reads {plan_file} and {critic_focus} from THIS workflow's trigger.params.

  # ===========================================================================
  # G2: Remediation — parallel fan-out over disjoint file sets
  # ===========================================================================

  - name: fix-meta
    kind: execute
    # Real guard, not prose: without this the engine dispatches the stage
    # regardless of fix_source and the agent has to decide to no-op.
    # _eval_when supports only "contains" / "does not contain".
    when: '"{fix_source}" contains "true"'
    depends_on: [pc-revise]
    reads_from: [plan-remediation, audit-conformance]
    description: >
      Package P1. Adopt AppMeta (rule S2) in each app the plan lists.
      SKIP THIS STAGE ENTIRELY if fix_source == "false".

      Touch ONLY src/ files. Another agent is editing tests/ concurrently.

      telemetry is a normal P1 candidate like any other app. (It was once
      excluded here to avoid racing the Click migration stream over
      src/telemetry/meta.py; #341 completed that migration and the stream has
      been removed, so no exclusion applies.)

      CHECK FIRST — this package may already be empty. Measured 2026-09-11:
      every app package under src/ has a meta.py (18 of 18; only `core`, which
      is not an app, lacks one). Run

        python3 -c "import pathlib; print([d.name for d in pathlib.Path('src').iterdir() if d.is_dir() and (d/'__init__.py').exists() and not (d/'meta.py').exists()])"

      A meta.py file is NOT sufficient on its own — P1 has two halves, and this
      check only covers the first. Declare P1 done only when ALL THREE hold:
        a. the command above reports nothing but `core`;
        b. the plan and conformance.json record no outstanding S2 work; and
        c. each app's BaseAssistant is actually wired to META.agentic_fallback
           rather than a hand-written literal. Verify PER PACKAGE, not per
           file — a per-file grep false-positives on shims (telemetry/cli.py
           re-exports; the wiring lives in telemetry/cli_sessions.py):

             python3 -c "import pathlib; print([d.name for d in pathlib.Path('src').iterdir() if d.is_dir() and (d/'__init__.py').exists() and d.name != 'core' and not any('agentic_fallback' in p.read_text(errors='replace') for p in d.rglob('*.py'))])"

           Measured 2026-09-11: prints [] — all 18 apps wired. This is a guard
           against a future meta.py landing without its call-site change, not a
           known gap today.
      If all three hold, say so in your report and make no edits. The two
      literals that once needed judgement here — maker's
      FALLBACK_AGENTIC_HEADER and mail's bullet-list fallback — are both
      resolved, and that constant no longer exists in maker/agentic.py.

      If the check DOES find an app without meta.py:
        1. Create src/<app>/meta.py declaring an AppMeta. Model it on
           src/wifi/meta.py. Read src/core/meta_base.py for the field set and
           the derived fallback properties.
        2. Replace the hand-written BaseAssistant fallback literal with
           META.agentic_fallback. Where the existing literal does not match the
           "agentic: <id>\\npurpose: <p>" shape, adopting AppMeta CHANGES the
           emitted fallback text — verify nothing asserts on the old string
           first, and report and defer that app if something does.

      Per project rules: update all call sites directly. Do NOT leave a
      backwards-compatible re-export, alias, or shim behind.

      Verify per app that the capsule is unchanged where it should be:
        python3 -c "import <app>.__main__ as m; m.main(['--agentic'])"
      The fallback only fires on failure, so a correct refactor leaves normal
      output byte-identical. If output CHANGES, you have broken something.
    agent:
      role: code-writer
      model: sonnet
      tools: [Bash, Read, Write, Edit]
      access: read-write
      isolation: worktree
    required: false
    writes_to:
      - outputs/fix-meta-summary.md

  - name: fix-contracts
    kind: execute
    depends_on: [pc-revise]
    reads_from: [plan-remediation, audit-conformance]
    description: >
      Package P2. (A P4 "split-click" package used to run first in this same
      agent, because both touched tests/agentic_cli_contract.py. It split the
      contract into a parser-agnostic base mixin so a Click-based telemetry
      could adopt part of it. #341 ported telemetry to argparse and it now
      adopts the whole contract directly —
      tests/telemetry_tests/test_agentic_cli_contract.py subclasses
      AgenticCLIContractMixin like every other app — so P4 is retired. Do not
      build a parser-agnostic base mixin.)

      Touch ONLY tests/ files.

      P2 — adopt the contracts where missing.
        Read every contract file in tests/ first; match their docstring and
        comment style exactly.

        There are now FOUR shared contracts, not two. Adopt whichever apply:
          - tests/agentic_cli_contract.py      AgenticCLIContractMixin
          - tests/agentic_builder_contract.py  AgenticBuilderContractMixin
          - tests/cli_separator_contract.py    SeparatorContractMixin
          - tests/llm_cli_contract.py          LLMCLIContractMixin  (P3)
        Re-read tests/ and confirm this list before starting — a contract the
        plan does not name is a contract the fix will not adopt.

        For each app the plan lists:
          1. Add the mixin to the test class bases.
          2. DELETE the hand-rolled assertions the mixin now covers. This is
             the entire point — if both remain, nothing was consolidated.
          3. Keep genuinely app-unique assertions.

        Minimal-tier domains (no build_domain_map, no CLI tree) set both
        EXPECT_CLI_TREE = False and EXPECT_DOMAIN_MAP = False.

      Before writing any test, run a throwaway probe that imports each target
      module and prints its ACTUAL values. Assumptions have been wrong here
      before: calendars announces "calendar", and the second parameter of
      emit_agentic_context is named _compact in every domain except mail, which
      uses compact. Do not trust that split either — count it
      (`grep -L _compact src/*/agentic.py | grep -v '^src/core/'`); an earlier
      version of this note said "nine domains" and was stale by eight. The
      core/ filter matters: core.agentic is the shared package, not a domain,
      and it also lacks _compact — counting it makes mail look like one of two
      exceptions rather than the only one.
    agent:
      role: tester
      model: sonnet
      tools: [Bash, Read, Write, Edit]
      access: read-write
      isolation: worktree
    required: true
    writes_to:
      - outputs/fix-contracts-summary.md

  - name: fix-llm
    kind: execute
    depends_on: [pc-revise]
    reads_from: [plan-remediation, audit-conformance]
    description: >
      Package P3. Adopt LLMCLIContractMixin where missing (rules L1-L3).
      Touch ONLY tests/ files, and ONLY the llm_cli test files — not the
      agentic test files another agent is editing.

      Read tests/llm_cli_contract.py first for the required class attributes
      (MODULE_PATH, APP_ID, DOC_SUFFIX, EXPECTED_PROG).

      mail is DOCUMENTED AS EXEMPT, not as a gap — default to leaving it
      alone. `src/mail/llm_cli.py` is a re-export shim of `core.llm_cli` that
      never calls make_domain_llm_module, so it has NO CONFIG — and neither
      does core.llm_cli behind it. Most of the mixin's tests read `mod.CONFIG.*`,
      so adoption fails on the majority of them. Count it rather than trusting a
      figure here — three different numbers have been written into this line,
      because "mentions CONFIG" and "dereferences mod.CONFIG" differ:

        python3 -c "import re,pathlib; t=pathlib.Path('tests/llm_cli_contract.py').read_text(); m=re.findall(r'def (test_\\w+)\\(self[^)]*\\):((?:\\n(?!    def ).*)*)', t); print(sum(1 for _,b in m if re.search(r'mod\\.CONFIG\\.', b)), 'of', len(m))"

      Measured 2026-09-11: 11 of 19 dereference mod.CONFIG. Its derive-all also
      produces no AGENTIC_MAIL.md / DOMAIN_MAP_MAIL.md.
      Adoption would mean INVENTING a domain CONFIG that does not exist, which
      is not a refactor.

      Verify rather than assume: run
        python3 -c "import mail.llm_cli as m; print(hasattr(m,'CONFIG'))"
      If that prints False, the exemption holds — record it and move on.
      Only if it prints True should you reconsider adoption.

      Separately: mail.llm_cli is a LIVE `llm --app mail` dispatch target
      referenced by a string literal. It is not a removable facade despite
      looking like one to an AST scan. Do not delete or restructure it.

      If any OTHER app with an llm_cli.py lacks the contract, adopt it there.
    agent:
      role: tester
      model: sonnet
      tools: [Bash, Read, Write, Edit]
      access: read-write
      isolation: worktree
    required: false
    writes_to:
      - outputs/fix-llm-summary.md


  # ===========================================================================
  # G3: Verify — re-run the identical audit, then the suite
  # ===========================================================================

  - name: verify-conformance
    kind: validate
    depends_on: [fix-meta, fix-contracts, fix-llm]
    reads_from: [audit-conformance, plan-remediation]
    # `description` is REQUIRED by the parser but DISCARDED at dispatch for
    # kind:validate — the prompt is built from validation.criteria ONLY. So
    # this text is for human readers; every instruction lives in criteria.
    description: >
      Re-run the byte-identical audit script and prove conformance improved
      with no regressions. (Contract is in validation.criteria, not here.)
    validation:
      strategy: unit
      criteria:
        - >-
          Re-run the byte-identical audit script:
          PYTHONPATH="$PWD/src" python3 {workspace}/validation/audit_cli_standard.py
          > {workspace}/validation/conformance-after.json
          Do NOT reimplement or edit the script — re-running a DIFFERENT script
          would not be a verification.
        - >-
          Before comparing anything, confirm the audit could actually MEASURE
          each rule. Test for the sentinel exactly: a field equal to the
          string "UNKNOWN". Do not treat null, a missing key, or false as
          equivalent — false means measured-and-failed, which is a real
          violation and must still be counted. If any app reports a
          tier0/tier2/tier3 field as UNKNOWN, or
          the audit derived a field from a hardcoded table rather than live
          import, that rule is UNMEASURED and must not be counted as passing.
          Report it as a gap in the audit and FAIL rather than scoring it. A
          false negative here fails the improvement gate against work that
          actually landed, which is worse than no gate — it teaches the next
          run to distrust a correct result.
        - >-
          COMPLIANCE MUST HAVE IMPROVED, measured numerically. Compute from the
          two JSON files: total violations before, total violations after, and
          the count of fully-conformant apps before and after. Record all four
          numbers explicitly in conformance-diff.md.
          FAIL if total violations after >= total violations before.
          FAIL if fully-conformant apps after <= fully-conformant apps before.
          A run that regressed nothing but fixed nothing is a FAILED run, not a
          passing one — "no regressions" is necessary but NOT sufficient.
        - >-
          The improvement must be REAL, not an artifact of the audit changing.
          The audit script must be byte-identical to the one that produced the
          original conformance.json (diff them and confirm). A violation that
          disappeared because the check was weakened, deleted, or made
          conditional is a FAIL, not an improvement — verify each resolved
          violation corresponds to an actual code or test change in the diff.
        - >-
          The BASELINE must have been non-trivial, or the improvement gates are
          meaningless. A weak audit that only ever checks one rule yields a tiny
          baseline that one edit can "improve". Assert that conformance.json
          actually evaluated the full rule set: every rule ID in
          .llm/CLI_STANDARD.md (S1-S4, A1-A7, B1-B4, L1-L3) must appear as a
          key that was EVALUATED for every applicable app — recorded as passing,
          failing, or explicitly exempt with a reason. A rule that is silently
          absent from the audit for an app counts as NOT evaluated and is a FAIL.
          Report the per-rule evaluation count so a shrunken rule set is visible
          rather than inferred.
        - >-
          Cross-check that the audit was not authored to be trivially
          satisfiable: the same agent wrote both the audit script and the plan,
          and plan-critic reviewed only the PLAN, never the script. Read
          {workspace}/validation/audit_cli_standard.py yourself and confirm each
          rule's check actually executes the app (imports main(), captures
          stdout) rather than returning a constant, reading source text, or
          checking only that a file exists.
        - >-
          Every app that the plan claimed it would bring to full conformance
          must actually BE fully conformant in conformance-after.json. Partial
          progress on a claimed app is a FAIL for that app; list each one.
        - Every violation the plan said it would fix is gone from conformance-after.json
        - No new violation appears for any app that was not present in the original conformance.json
        - >-
          No app's capsule_bytes DECREASED. A drop means a capsule regressed to
          a ~78-byte fallback banner while still returning rc=0 — the exact
          silent failure this standard exists to catch. Treat any decrease as a
          hard FAIL, never as a rounding difference.
        - Every app still returns rc=0 on --agentic
        - >-
          Every app's ANNOUNCED app_id is unchanged from the original audit.
          These are public identifiers (calendars announces "calendar",
          apple_music announces "apple-music-assistant"); a change is a
          breaking change, not an improvement.
        - Every item the plan marked DEFERRED is still deferred and was not silently fixed
        - >-
          Write {workspace}/validation/conformance-diff.md with a per-app table
          of before/after capsule_bytes, violations, and contracts adopted.
        - >-
          FAIL with specific per-app detail if any criterion fails. Do not
          summarise a partial result as a pass.
    agent:
      role: reviewer
      model: sonnet
      tools: [Bash, Read, Write]
      access: read-write
    required: true
    writes_to:
      - validation/conformance-after.json
      - validation/conformance-diff.md

  - name: verify-tests
    kind: validate
    depends_on: [verify-conformance]
    reads_from: [verify-conformance, plan-remediation]
    # `description` is REQUIRED by the parser but DISCARDED at dispatch for
    # kind:validate — the prompt is built from validation.criteria ONLY.
    description: >
      Run the full suite and lint, and confirm duplicated hand-rolled
      assertions were removed from the files that adopted a contract mixin.
      NOT that test code shrank — a growing total is expected here; see the
      criteria. (Contract is in validation.criteria, not here.)
    validation:
      strategy: deliverable
      criteria:
        - >-
          Run exactly: make test > /tmp/cli-std.log 2>&1; echo "EXIT=$?";
          grep -E "^Ran [0-9]+ tests" /tmp/cli-std.log
        - >-
          Exit code 0 is NOT evidence the suite ran. You MUST see the
          "Ran N tests" line. The 2>&1 is required because unittest writes its
          summary to STDERR — redirecting only stdout hides the verdict and
          every failure. No "Ran N tests" line means the suite did not run:
          re-run it, do not report a result.
        - >-
          NEVER run bare `python3 -m unittest`. An inherited PYTHONPATH resolves
          imports to a DIFFERENT checkout and yields a false green that is
          indistinguishable from a real one. If anything looks off, print where
          the module actually loaded from — python3 -c "import wifi;
          print(wifi.__file__)" — and confirm the path is under THIS worktree.
        - >-
          Possible pre-existing failure, NOT caused by this work: the guard-hook
          suite (tests.infra.test_guard_hooks.TestGuardHookSuites.test_block_destructive_bash_suite_passes)
          can time out under parallel-agent load — block-destructive-bash.test.sh
          needs ~196s against the 180s cap at tests/infra/test_guard_hooks.py:125.
          It is LOAD-DEPENDENT, not deterministic: unloaded runs on 2026-09-11
          passed cleanly ("Ran 13121 tests", OK, skipped=16). So a clean run is
          the expected case, not an anomaly — do not go looking for that error.
          If it does appear, treat exactly that one error as expected; ANY other
          failure is caused by this work and must be fixed.
          Do not hardcode the test count: establish the baseline by running the
          suite on main yourself, since it grows with every merge.
        - >-
          Lint the changed files. `make lint` runs ruff ONLY and is NOT
          sufficient — CI also runs bandit and radarlint through qlty. Get the
          file list with `git diff --name-only main...HEAD` (THREE dots — two
          dots diffs against the current tip of main and pulls in every commit
          merged since branching). Write that list to a file, then pass the
          paths explicitly to `~/.qlty/bin/qlty check`; a command substitution
          is rejected by the guard hook in a worktree-isolated session.
        - >-
          CRITICAL — an EMPTY file list is not a clean lint. If the work is
          uncommitted, `main...HEAD` returns NOTHING (the branch may have zero
          commits), qlty is handed no paths, and it exits 0 having scanned
          nothing. That false clean is indistinguishable from a real pass.
          Count the paths first and print the count. If it is 0, fall back to
          `git status --porcelain` to collect modified AND untracked files, and
          lint those. Never report a lint pass without stating how many files
          were actually scanned.
        - >-
          Measure DUPLICATION, not net line count. A growing total is the
          expected and correct outcome here — the bulk deletion already
          happened in PR #320, so the remaining work is adding contracts and
          adopting them, which adds lines on balance. A net-negative target
          would be unmeetable and would only force a justification paragraph.
          The real check: for every file that adopts a contract mixin, confirm
          it does NOT also define its own copies of the assertions that mixin
          covers. Report, per adopting file, the count of hand-rolled
          assertions removed. Any file that both adopts a mixin AND retains
          duplicate assertions is a FAIL — that file consolidated nothing.
        - PASS requires all of the above; report per-criterion, not as a single verdict
    agent:
      role: reviewer
      model: sonnet
      tools: [Bash, Read, Write]
      access: read-write
    required: true
    writes_to:
      - validation/test-results.md

  # ===========================================================================
  # G4: Human gate
  # ===========================================================================

  - name: human-gate
    kind: propose
    human_gate: true
    depends_on: [verify-tests]
    reads_from: [verify-conformance, verify-tests, plan-remediation, audit-conformance]
    description: >
      Present the result and ask how to proceed.

      Read and display:
        {workspace}/{plan_file}                          — approved plan
        {workspace}/validation/conformance.json            — before
        {workspace}/validation/conformance-after.json    — after
        {workspace}/validation/conformance-diff.md       — per-app delta

      Surface:
        - Conformance by rule and tier, before vs after
        - Apps brought to full conformance, and what remains
        - Duplication removed per adopting file (hand-rolled assertions
          deleted). NOT net line delta — a growing total is expected here; see
          verify-tests, which measures duplication rather than line count
        - Capsule byte counts before/after, flagging ANY decrease
        - Everything deferred, with reasons — especially any app_id left alone
        - Test and lint status, naming the known guard-hook timeout explicitly
          so it is not mistaken for a regression

      Ask the user:
        A) Commit and open PR — stage the modified files BY NAME (never
           git add -A) and run /open-pr with title "{pr_title}"
        B) Revise — describe what to change
        C) Stop and leave the working tree as-is
    agent:
      role: doc-writer
      model: sonnet
      tools: [Bash, Read, Write]
      access: read-write
    required: true

include:
  # plan-critic references {plan_file} and {critic_focus} as plain trigger-param
  # placeholders. Fragments share the parent's param namespace — include.params
  # is parsed but NOT wired to substitution (src/workflow/models.py IncludeSpec:
  # "reserved for future use"), so both are declared in trigger.params above.
  - path: workflows/shared/plan-critic.yaml
    prefix: pc
    depends_on: [plan-remediation]
    reads_from: [plan-remediation]
