paths:
  agents: AGENTS.md
priority_rules:
  use_unified_clis_first:
  - assistant
  - mail-assistant
  - calendar-assistant
  - schedule-assistant
familiarize_files:
  - .llm/familiarize.yaml
workflow_for_new_functionality:
  - '0) FIRST: Check for an existing workflow — ./bin/workflow list'
  - '1) Check if unified CLIs already cover it'
  - './bin/assistant <apple-music|calendar|mail|maker|music|phone|resume|schedule|slides|whatsapp|wifi> --help'
  - './bin/mail --help      # Mail (labels, filters, signatures, outlook)'
  - './bin/schedule --help  # Schedules plan/apply (dry-run default)'
  - './bin/calendar --help  # Calendar utilities'
  - '2) SECOND: Add subcommands under existing groups (labels, filters, outlook)'
  - '3) LAST: Add focused helpers in mail/* with small methods and tests'
analytics_tools: []
agentic_schemas_notes:
  - Prefer `--agentic --agentic-format yaml --agentic-compact` over `--help` for token-efficient schemas.
  - `./bin/llm agentic --stdout` emits a compact capsule; use it for discovery.
