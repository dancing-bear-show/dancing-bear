# Unified filter/rule source of truth for Gmail and Outlook.
#
# Schema:
#   match.from    — sender pattern (OR-separated domains or addresses)
#   action.add    — label(s) to add (Gmail: label; Outlook: category hint)
#   action.remove — label(s) to remove (Gmail: INBOX = skip inbox)
#   action.forward — forward to this address
#   action.moveToFolder — Outlook folder path (derived from add[] when omitted)
#   action.keepInInbox — suppress the derived Outlook moveToFolder (stay in inbox)
#
# Derive provider-specific configs:
#   ./bin/mail-assistant config derive.filters --in config/filters_unified.yaml \
#     --out-gmail out/filters.gmail.from_unified.yaml \
#     --out-outlook out/filters.outlook.from_unified.yaml

