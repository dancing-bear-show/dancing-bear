[smells]
mode = "comment"

# file_complexity is the SUM of every function's complexity in a file, so it
# scales with function count, not with how complex any single function is.
# At the default threshold of 50 it flagged 63 files whose median size was only
# 384 lines and whose functions were individually clean — it was measuring
# module cohesion, not complexity. 80 still caught 9 such files, all of them
# cohesive parsers/dispatchers in a tight 81–94 band (max: bin/pr-assistant at
# 94 over 494 lines). Their per-KLOC density is unremarkable; the sum is high
# only because the files are legitimately large and branch-heavy.
# 100 clears that band with headroom while keeping a ceiling that would flag a
# genuinely runaway module. Per-function complexity is the signal we act on and
# is caught by function_complexity, left at its default.
[smells.file_complexity]
threshold = 100

# 7, not 6, and the extra 1 is a tool artifact rather than a looser standard.
#
# The rule counts the bare `*` keyword-only SEPARATOR as a parameter. So
# `ping_target(label, target, *, count, runner, timeout)` — five real
# parameters — reports as six, and `request(self, method, path, *, ...)`
# reports as six after self is excluded. The effect is that the rule
# penalises keyword-only arguments, which are the better design and which
# this codebase deliberately uses.
#
# Measured at threshold 6, via an AST pass counting real parameters
# (posonly + args + kwonly + vararg + kwarg, minus self/cls) against what
# qlty reported:
#
#   31 findings total
#   18 (58%) had exactly 5 real parameters + a bare `*`  -- pure artifact
#   13 were genuinely 6+ real parameters
#
# Suppressing 18 sites with NOSONAR would be honest but buries the signal in
# noise, and leaves the miscount live to misfire on the next keyword-only
# signature anyone writes. 8 was rejected as too loose: it would hide
# _parse_recurring_event (7 real) and both 7-parameter slides parsers, which
# are genuine width problems.
#
# 7 = "6 real parameters, plus the phantom one the tool adds". It clears every
# artifact and leaves SEVEN findings (the count, not a parameter count) as a
# triage backlog. Their real arities vary:
#   9 real -- load_deck_from_csv
#   7 real -- retry, load_deck_from_markdown, _parse_recurring_event,
#             _add_text_to_paragraph
#   6 real -- _set_slide_content, load_deck_from_outline
#             (each reports 7 because of the bare-* miscount)
# All seven are genuinely wide enough to be worth grouping into a dataclass;
# none is a pure artifact.
#
# THIS IS NOT A RELAXED STANDARD. concerns/complexity.md specifies max 5 real
# parameters and is unchanged by this. The threshold sits at 7 only because the
# tool reads one high on keyword-only signatures, so a function reported at 7
# may really be at 6 — still over the written limit of 5. Read the signature
# before acting on the finding; the reported number is not the real arity.
#
# Test fixtures/factories legitimately take wide keyword surfaces
# (_make_session_summary takes 12 kwargs). They are excluded via test_patterns
# above — note that list needed "**/tests/**" added, since the qlty-generated
# default only covered "**/test/**" (singular) and this repo uses tests/.
[smells.function_parameters]
threshold = 7

# Note the key is return_statements, not function_returns. A wrong key does not
# fail the run: qlty prints "WARNING: The `smells.?.function_returns` entry in
# qlty.toml is not part of the supported configuration and will be ignored",
# drops the setting, and applies the default threshold instead. Easy to miss in
# CI output, so verify a threshold change actually moved the finding count.
# 12 findings at the default of 5, and 9 of them sat at exactly 6 returns:
# guard-clause chains, i.e. the early-return pattern our own complexity
# refactors push toward. Flagging those penalizes the fix. 8 excuses the
# guard-clause shape while still catching the 3 real outliers (cmd_reorg at 8,
# and the register_*_commands dispatchers in src/mail/cli/ at 11 and 13).
[smells.return_statements]
threshold = 8

[[source]]
name = "default"
default = true


