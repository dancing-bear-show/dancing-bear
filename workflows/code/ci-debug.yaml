name: ci-debug
version: "1.0"
description: >
  Diagnose and fix Semaphore CI failures. Given a Semaphore URL or PR number,
  fetches failure details (Semaphore + SonarQube in parallel), parses logs to
  identify root cause, applies fixes, verifies locally, runs the full domain
  suite, and reports a structured summary.

  DAG: fetch-failures (G0) → diagnose (G1) → fix (G2) → verify (G3)
       → recheck (G4) → human-gate (G5)

  At least one of semaphore_url or pr_number must be provided. If both are
  given, semaphore_url takes precedence for log fetching; pr_number is used
  for the SonarQube PR-scoped check.

  The sonarqube-fix fragment (prefix=sq) is included after verify to gate
  on SQ quality before the final human report.

metadata:
  author: sre-platform
  created: "2026-05-28"

trigger:
  source: manual
  params:
    semaphore_url: ""    # Semaphore pipeline URL (optional if pr_number given)
    pr_number: ""        # PR number to check (optional if semaphore_url given)
    test_cmd: ""         # Pytest invocation for local verify (e.g. "pytest tests/core/ -x -q")
    source_root: ""      # Source dir for coverage scoping (e.g. "core/")
    min_coverage: "80"   # Minimum new coverage % required by SQ gate

workspace_dir: "{work_dir}/ci-debug-{pr_number}"

stages:
  # ===========================================================================
  # Group 0: Fetch CI failures — Semaphore + SonarQube in parallel
  #
  # Both data sources are independent; run them concurrently. The stage writes
  # raw failure JSON that diagnose reads. If semaphore_url is empty, use
  # pr_number to look up the latest pipeline instead.
  # ===========================================================================

  - name: fetch-failures
    kind: gather
    description: >
      Fetch CI failure details from Semaphore and SonarQube in parallel.

      File access rules: use the Read tool (not cat/head/tail), Grep tool
      (not grep/rg in Bash), Glob tool (not find/ls). Reserve the Bash tool
      for CLI commands only.

      Step 1 — validate inputs:
        At least one of {semaphore_url} or {pr_number} must be non-empty.
        If both are empty, write a failed stage result and exit.

      Step 2 — fetch Semaphore failures:
        If {semaphore_url} is non-empty:
          Use the Bash tool to run:
            ./bin/semaphore url '{semaphore_url}' --show-logs
          Then extract the pipeline ID from the URL and run:
            ./bin/semaphore fail-summary --pipeline-id <PIPELINE_ID> --show-logs
        Else if {pr_number} is non-empty:
          Use the Bash tool to run:
            ./bin/semaphore pr-status -- --pr {pr_number}
          Then extract the pipeline ID from the pr-status output and run:
            ./bin/semaphore fail-summary --pipeline-id <PIPELINE_ID> --show-logs
        Save all output including log lines to {workspace}/outputs/semaphore-raw.txt.
        The fail-summary output provides a structured table of failed jobs; prefer
        it over manual log parsing when extracting per-job failure details.
        If full logs for a specific job are needed, use:
          ./bin/semaphore log-tail <JOB_ID>
        to tail the last N lines of that job's log.

      Step 3 — fetch SonarQube status:
        Use the Bash tool to run:
          ./bin/sonarqube status -- --project cars-sre-utils --format json
        If {pr_number} is non-empty, also run:
          ./bin/sonarqube status -- --project cars-sre-utils --pr {pr_number} --format json
        Save JSON output to {workspace}/outputs/sonarqube-raw.json.

      Step 4 — write combined summary:
        Use the Write tool to create {workspace}/outputs/fetch-summary.json containing:
          {
            "semaphore_url": "{semaphore_url}",
            "pr_number": "{pr_number}",
            "semaphore_output_path": "{workspace}/outputs/semaphore-raw.txt",
            "sonarqube_output_path": "{workspace}/outputs/sonarqube-raw.json",
            "fetch_notes": "<any noteworthy conditions — pipeline still running, SQ 404, etc.>"
          }
    agent:
      role: researcher
      model: sonnet
      tools: [Bash, Read, Write]
      access: read-only
    required: true
    writes_to:
      - outputs/semaphore-raw.txt
      - outputs/sonarqube-raw.json
      - outputs/fetch-summary.json

  # ===========================================================================
  # Group 1: Diagnose — parse logs, identify root cause, write findings.json
  #
  # Reads raw Semaphore and SonarQube output, extracts structured failure
  # records. Handles both entry points: URL-based Semaphore logs and PR-based
  # SonarQube issues. A researcher is correct: this stage only reads and
  # reasons — no source edits happen here.
  # ===========================================================================

  - name: diagnose
    kind: gather
    depends_on: [fetch-failures]
    reads_from: [fetch-failures]
    description: >
      Parse the raw CI output and produce a structured findings.json for the
      fix stage.

      File access rules: use the Read tool (not cat/head/tail), Grep tool
      (not grep/rg in Bash), Glob tool (not find/ls). Reserve the Bash tool
      for CLI commands only.

      Step 1 — read all raw outputs:
        Use the Read tool to load:
          {workspace}/outputs/semaphore-raw.txt
          {workspace}/outputs/sonarqube-raw.json
          {workspace}/outputs/fetch-summary.json

      Step 2 — extract Semaphore failures:
        For each failed job in semaphore-raw.txt, extract:
          - job_name: e.g. "Tests - Core Foundation"
          - test_file: e.g. "tests/core/test_auth.py"
          - test_name: e.g. "test_token_refresh"
          - error_type: AssertionError | AttributeError | ImportError | other
          - error_message: the actual traceback or assertion text
          - likely_cause: one of the common patterns:
              "Namespace missing new arg" → AttributeError: Namespace has no attribute X
              "dispatch table outdated" → AssertionError: X not in Y (dispatch)
              "import path changed" → ModuleNotFoundError
              "mock missing field" → Mock return value missing field
              "dict structure changed" → KeyError: X
              "coveragerc deleted" → FileNotFoundError: .coveragerc.pr

      Step 3 — read the failing test source:
        For each unique test_file found above, use the Bash tool to run:
          git log --oneline -5 -- <test_file>
        Use the Bash tool to run:
          git log --oneline -5 -- <source_module_path>
        (Derive source_module_path by mapping tests/<domain>/ → <domain>/)
        Record what changed recently that aligns with the error.

      Step 4 — extract SonarQube issues:
        From sonarqube-raw.json, identify:
          - quality_gate.status: OK | ERROR
          - Any conditions with status ERROR and their metricKey + actualValue
          - New issues count on changed files

      Step 5 — write findings.json:
        Use the Write tool to create {workspace}/outputs/findings.json:
          {
            "semaphore_failures": [
              {
                "job_name": "...",
                "test_file": "...",
                "test_name": "...",
                "error_type": "...",
                "error_message": "...",
                "likely_cause": "...",
                "recent_changes": "..."
              }
            ],
            "sonarqube": {
              "gate_status": "OK|ERROR",
              "failing_conditions": [...],
              "new_issues_count": N
            },
            "total_failures": N,
            "root_cause_summary": "one-sentence summary"
          }
    agent:
      role: researcher
      model: sonnet
      tools: [Bash, Read, Write, Grep]
      access: read-only
    required: true
    writes_to:
      - outputs/findings.json

  # ===========================================================================
  # Group 2: Fix — code-writer applies targeted fixes
  #
  # Reads findings.json, applies the minimal targeted fix for each failure.
  # Spawns a ci-fixer sub-agent for complex multi-file cases. code-writer is
  # used (not researcher) because source edits happen here.
  # ===========================================================================

  - name: fix
    kind: execute
    depends_on: [diagnose]
    reads_from: [diagnose]
    description: >
      Apply targeted fixes for each failure in findings.json.

      File access rules: use the Read tool (not cat/head/tail), Grep tool
      (not grep/rg in Bash), Glob tool (not find/ls). Reserve the Bash tool
      for CLI commands only.

      Step 1 — read findings:
        Use the Read tool to load {workspace}/outputs/findings.json.

      Step 2 — classify complexity:
        Simple fix (handle inline with Edit tool):
          - Single file changed
          - Error type is one of the known patterns (Namespace missing arg,
            dispatch table outdated, import path changed, mock missing field,
            dict structure changed)

        Complex fix (spawn ci-fixer agent):
          - Three or more files need changes
          - Error requires deep architectural understanding
          - Failures span multiple domains/packages

      Step 3 — apply simple fixes:
        For each simple failure, read the test file and source module with the
        Read tool, then use the Edit tool to apply the minimal targeted change.
        Common fix patterns:
          "Namespace missing new arg" → Add the missing attribute to the test Namespace fixture
          "dispatch table outdated" → Update the assertion in the dispatch table test
          "import path changed" → Update the import statement to the new path
          "mock missing field" → Add the missing field to the Mock return value
          "dict structure changed" → Update the test dict or switch to a factory helper
          "coveragerc deleted" → Use the Bash tool to run:
            git checkout origin/main -- .coveragerc.pr

      Step 4 — handle complex fixes:
        If any complex failures exist, use the Task tool to spawn a ci-fixer agent:
          Task(subagent_type="ci-fixer",
               prompt="Fix CI failures described in {workspace}/outputs/findings.json.
               Apply all fixes in the worktree at {workspace}. Write a fix log to
               {workspace}/outputs/fix-log.json listing each file changed and why.")
        Wait for the ci-fixer agent to complete before proceeding.

      Step 5 — write fix-log.json:
        Use the Write tool to create {workspace}/outputs/fix-log.json:
          {
            "fixes_applied": [
              {
                "failure": "<test_file>::<test_name>",
                "fix_type": "simple|complex",
                "files_changed": ["..."],
                "description": "one-line description of what was changed"
              }
            ],
            "total_fixes": N,
            "coveragerc_restored": true|false
          }
    agent:
      role: code-writer
      model: sonnet
      tools: [Read, Edit, Write, Bash, Task]
      access: read-write
    required: true
    writes_to:
      - outputs/fix-log.json

  # ===========================================================================
  # Group 3: Verify — run the specific failing tests locally
  #
  # Runs only the tests that were failing to confirm the fix landed. Does NOT
  # run the full domain suite here (that's recheck). Uses {test_cmd} if
  # provided; otherwise derives the command from findings.json.
  # ===========================================================================

  - name: verify
    kind: validate
    depends_on: [fix]
    reads_from: [fix, diagnose]
    description: >
      Run the specific failing tests to verify each fix landed.

      File access rules: use the Read tool (not cat/head/tail), Grep tool
      (not grep/rg in Bash), Glob tool (not find/ls). Reserve the Bash tool
      for CLI commands only.

      Step 1 — read inputs:
        Use the Read tool to load:
          {workspace}/outputs/findings.json
          {workspace}/outputs/fix-log.json

      Step 2 — run targeted tests:
        For each failure in findings.json, use the Bash tool to run:
          pytest <test_file>::<test_name> -x -v
        If {test_cmd} is non-empty, also use the Bash tool to run:
          {test_cmd}
        Record exit code and output for each run.

      Step 3 — check .coveragerc.pr:
        Use the Bash tool to run:
          ls -la .coveragerc.pr
        If the file is missing: record it as a critical gap (CI will fail
        even if tests pass).

      Step 4 — write verify-results.json:
        Use the Write tool to create {workspace}/outputs/verify-results.json:
          {
            "test_results": [
              {
                "test": "<test_file>::<test_name>",
                "exit_code": 0,
                "passed": true|false,
                "output_snippet": "..."
              }
            ],
            "coveragerc_present": true|false,
            "all_targeted_passed": true|false
          }
    agent:
      role: code-writer
      model: sonnet
      tools: [Bash, Read, Write]
      access: read-write
    validation:
      strategy: unit
      criteria:
        - All previously-failing tests now pass (exit code 0)
        - .coveragerc.pr exists on disk
      max_revisions: 2
    required: true
    writes_to:
      - outputs/verify-results.json

  # ===========================================================================
  # Group 4: Recheck — full domain suite
  #
  # Runs the full domain test suite to confirm no regressions were introduced.
  # Uses {test_cmd} as the authoritative suite command. Also re-checks
  # SonarQube gate status before the final report.
  # ===========================================================================

  - name: recheck
    kind: validate
    depends_on: [verify]
    reads_from: [verify, diagnose]
    description: >
      Run the full domain test suite and re-check SonarQube.

      File access rules: use the Read tool (not cat/head/tail), Grep tool
      (not grep/rg in Bash), Glob tool (not find/ls). Reserve the Bash tool
      for CLI commands only.

      Step 1 — read inputs:
        Use the Read tool to load:
          {workspace}/outputs/verify-results.json
          {workspace}/outputs/findings.json

      Step 2 — run full domain suite:
        If {test_cmd} is non-empty, use the Bash tool to run:
          {test_cmd}
        Else derive from findings.json (the domain from the first failure's
        test_file): use the Bash tool to run:
          ./bin/test-quality test-failures tests/<domain>/ -x -q
        Record total tests, failures, and exit code.

      Step 3 — re-check SonarQube gate:
        Use the Bash tool to run:
          ./bin/sonarqube status -- --project cars-sre-utils --format json
        Extract quality_gate.status and any new failing conditions.

      Step 4 — write recheck-results.json:
        Use the Write tool to create {workspace}/outputs/recheck-results.json:
          {
            "suite_exit_code": 0,
            "suite_passed": true|false,
            "sonarqube_gate": "OK|ERROR",
            "sonarqube_conditions": [...],
            "regression_detected": true|false
          }
    agent:
      role: code-writer
      model: sonnet
      tools: [Bash, Read, Write]
      access: read-write
    validation:
      strategy: unit
      criteria:
        - Full domain test suite exits 0
        - No new test failures introduced by the fix
        - SonarQube quality gate is OK or was already failing before (no regression)
      max_revisions: 1
    required: true
    writes_to:
      - outputs/recheck-results.json

  # ===========================================================================
  # Group 5: Human gate — report findings and verification result
  #
  # Presents a structured summary before the workflow closes. The human can
  # approve to complete, or reject to loop back and investigate further.
  # ===========================================================================

  - name: human-gate
    kind: validate
    depends_on: [recheck]
    reads_from: [diagnose, fix, verify, recheck]
    human_gate: true
    description: >
      Synthesize all stage outputs into a final CI debug report for human review.

      File access rules: use the Read tool (not cat/head/tail), Grep tool
      (not grep/rg in Bash), Glob tool (not find/ls). Reserve the Bash tool
      for CLI commands only.

      Step 1 — read all stage outputs:
        Use the Read tool to load:
          {workspace}/outputs/findings.json
          {workspace}/outputs/fix-log.json
          {workspace}/outputs/verify-results.json
          {workspace}/outputs/recheck-results.json

      Step 2 — compose the report:
        Present:

          ## CI Debug Report

          **Pipeline**: {semaphore_url} (or PR #{pr_number})

          ### Failures Found: N

          | # | Test | Error Type | Root Cause |
          |---|------|-----------|------------|
          <one row per failure from findings.json>

          ### Fixes Applied: N

          | # | File(s) Changed | Description |
          |---|----------------|-------------|
          <one row per fix from fix-log.json>

          ### Verification
          - Targeted tests: PASS / FAIL (from verify-results.json)
          - Full domain suite: PASS / FAIL (from recheck-results.json)
          - SonarQube gate: OK / ERROR (from recheck-results.json)
          - .coveragerc.pr: present / MISSING

          ### Recommendation
          CLEAR TO MERGE — all tests pass, no regressions, SQ OK.
          OR
          ACTION NEEDED — <describe what still needs attention>.

      Step 3 — write the report:
        Use the Write tool to create {workspace}/outputs/ci-debug-report.md
        with the full report text above.
    agent:
      role: doc-writer
      model: sonnet
      tools: [Read, Write]
      access: read-write
    required: true
    writes_to:
      - outputs/ci-debug-report.md

  # ===========================================================================
  # SonarQube fix fragment — runs if SQ gate is failing after recheck
  #
  # Included after human-gate so SQ issues surface in the report before
  # the fix loop starts. prefix=sq injects sq-check-sonarqube and
  # sq-verify-sonarqube as the final two stages.
  # ===========================================================================

include:
  - path: workflows/shared/sonarqube-fix.yaml
    prefix: sq
    depends_on: [human-gate]
    reads_from: [human-gate, recheck]
