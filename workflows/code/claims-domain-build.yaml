# Build the insurer-specific claim pipeline on top of a merged receipts package.
#
#   src/claims/  -- ledger, eligibility rules, form filling, packet assembly
#
# This is part 2 of 2.  Part 1 (workflows/code/receipts-domain-build.yaml)
# builds src/core/pdf_read.py and src/receipts/ and MUST BE MERGED FIRST.
# The split is deliberate: claims builds against a receipts package that is
# proven and on main, rather than one written minutes earlier in the same run.
#
# This workflow owns the font-size migration -- moving the Sun Life prefixes
# out of core.pdf_forms.DEFAULT_FONT_SIZES into claims/forms.py:CLAIM_FONT_SIZES.
# That edit touches a merged, tested module (PR #349, 30 unit tests + 5
# doctests), which is why it sits here behind an explicit equivalence check
# against a real shipped claim form rather than on the receipts critical path.
#
# Dependency direction enforced throughout:
#   claims -> receipts -> core.pdf_read / core.pdf_forms
#   claims is the ONLY layer that may know about an insurer
#
# Stage graph:
#
#   preflight-check          -- receipts package present and importable
#       |
#   migrate-font-sizes       -- with shipped-form equivalence proof
#       |
#   implement-claims
#       |
#   integration-review
#       |
#   fix-integration
#       |
#   verify                   -- RUNS the code
#       |
#   human-gate

name: claims-domain-build
version: "1.0"
description: >
  Implement src/claims/: the Sun Life claim pipeline -- invoice-level ledger
  deduplication across prior submissions, eligibility rules ($0 patient-pays,
  plan-year windows, credited duplicates), form filling delegated entirely to
  core.pdf_forms, and packet assembly with render verification.

  Also migrates the insurer-specific font-size constants out of
  core.pdf_forms.DEFAULT_FONT_SIZES into claims/forms.py, leaving core generic.

  Part 2 of 2.  Requires workflows/code/receipts-domain-build.yaml to have
  merged first; a preflight stage fails the run if src/receipts/ is absent.

  Nothing is pushed to main or auto-merged.  The branch and worktree location
  are reported at the human gate for review and manual merge.

metadata:
  author: dancing-bear
  created: "2026-09-11"

trigger:
  source: manual
  params:
    run_qlty: "true"

workspace_dir: "{work_dir}/claims-domain-build"

stages:

  # ===========================================================================
  # S0: Preflight -- refuse to run without the receipts foundation
  # ===========================================================================
  #
  # Every stage below assumes src/receipts/ exists and is importable.  Without
  # this gate the failure surfaces deep inside implement-claims as a confusing
  # ImportError, several expensive stages in.

  - name: preflight-check
    kind: gather
    depends_on: []
    description: >
      Confirm the receipts foundation is present before doing any work.

      Step 0 -- install the [pdf] extra in THIS worktree, before anything
        imports fitz.
        `make venv` installs ".[dev]", which does NOT include PyMuPDF --
        core.pdf_forms and core.pdf_read import fitz lazily precisely so the
        core CLIs stay dependency-light.  migrate-font-sizes imports fitz
        directly (blank-template check, equivalence proof), so without this a
        clean worktree dies with ModuleNotFoundError before it can accept or
        reject anything.

          test -x .venv/bin/python || make venv > /tmp/venv-create.log 2>&1
          test -x .venv/bin/python || { tail -20 /tmp/venv-create.log; \
            echo "FATAL: no .venv"; exit 1; }
          .venv/bin/python -m pip install -e ".[pdf,ocr]" > /tmp/pdf-install.log 2>&1
          status=$?; tail -2 /tmp/pdf-install.log; echo "INSTALL_EXIT=$status"
          .venv/bin/python -c "import fitz; print('fitz ok')" 2>&1

        Do not pipe the install into tail: a pipeline reports the LAST
        command's status, so a failed install would hide behind tail's zero
        exit and the STOP below would never trigger.

        Use that same interpreter for every python invocation in this
        workflow.  If INSTALL_EXIT is non-zero, or the fitz import fails,
        STOP and report status failed -- do not continue into stages that
        will fail more confusingly later.

      Step 1 -- confirm the packages exist and import:
        PYTHONPATH="$(pwd)/src" .venv/bin/python -c \
          "from core.pdf_read import PdfDocument, PdfParser; \
           from receipts.models import Receipt; \
           from receipts.extract import extract; \
           print('receipts foundation present')" 2>&1

        If this fails, STOP.  Report status failed with the import error.
        Do not attempt to create the missing modules -- they belong to
        receipts-domain-build.yaml, which must merge first.

      Step 2 -- confirm core.pdf_forms is intact (this workflow will edit it):
        PYTHONPATH="$(pwd)/src" .venv/bin/python -m unittest \
          tests.core_tests.test_core_pdf_forms > /tmp/claims-baseline.log 2>&1
        status=$?; tail -3 /tmp/claims-baseline.log; echo "BASELINE_EXIT=$status"

        Do NOT pipe straight into tail: a pipeline reports the LAST command's
        status, so tail's zero exit hides a failing baseline.

        If BASELINE_EXIT is not 0, STOP.  Write ready: false and report this
        stage's status as "failed".  A broken baseline means the migration
        cannot be shown to preserve anything, so proceeding is worse than
        halting.  Record the passing test count only when the exit was 0.

      Step 3 -- record the Receipt surface claims must build against:
        PYTHONPATH="$(pwd)/src" .venv/bin/python -c \
          "import dataclasses, receipts.models as m; \
           print([f.name for f in dataclasses.fields(m.Receipt)])" 2>&1

      Step 4 -- write {workspace}/outputs/preflight.json:
        {
          "receipts_importable": true,
          "pdf_forms_tests_passing": 0,
          "receipt_fields": [],
          "ready": false
        }

        ready is DERIVED, never a literal.  Set it true only when the venv
        exists, INSTALL_EXIT was 0, the fitz import succeeded, the receipts
        imports succeeded, and BASELINE_EXIT was 0.  If any failed, write
        ready: false AND report this stage's status as "failed" -- otherwise
        migrate-font-sizes proceeds on a foundation that was never verified.
    agent:
      role: researcher
      model: sonnet
      tools: [Read, Bash, Write]
      access: read-write
    outputs:
      - name: preflight
        mode: generate
        description: >
          Foundation readiness report at {workspace}/outputs/preflight.json.
    required: true
    writes_to:
      - outputs/preflight.json


  - name: migrate-font-sizes
    kind: execute
    depends_on: [preflight-check]
    reads_from: [preflight-check]
    description: >
      Migrate insurer-specific font-size constants from core.pdf_forms into
      claims/forms.py, where they belong.

      Step 0 -- ensure fitz is importable in this worktree.
        preflight-check installed ".[pdf,ocr]", but stages run as separate
        agents and a venv may not be shared.  This is idempotent, so just
        confirm and install if needed:

          test -x .venv/bin/python || make venv > /tmp/venv-create.log 2>&1
          test -x .venv/bin/python || { tail -20 /tmp/venv-create.log; \
            echo "FATAL: no .venv"; exit 1; }
          if ! .venv/bin/python -c "import fitz" 2>/dev/null; then
            .venv/bin/python -m pip install -e ".[pdf,ocr]" > /tmp/pdf-install.log 2>&1
            status=$?; tail -2 /tmp/pdf-install.log; echo "INSTALL_EXIT=$status"
          fi
          .venv/bin/python -c "import fitz; print('fitz ok')" 2>&1

        The trailing import is the check that matters -- it must succeed
        before this stage does any work.  Piping the install into tail would
        report success regardless of whether it worked.

        Every python invocation below uses .venv/bin/python.  fitz is used
        directly by the blank-template check and the equivalence proof.

      Step 1 -- read the current state.
        Read src/core/pdf_forms.py in full.
        Confirm DEFAULT_FONT_SIZES contains these insurer-specific prefixes:
          "2.day_phone.", "4.DOB.", "5.date.", "3.total_claimed", "dateOfBirth"
        Run: grep -n "DEFAULT_FONT_SIZES\|font_size_for" src/**/*.py tests/**/*.py \
               bin/* 2>/dev/null | grep -v "^Binary"
        Record every call site.

      Step 2 -- determine the safe residual.
        DEFAULT_FONT_SIZES in core can be EMPTIED ({} or a clearly commented
        generic default dict), since all five prefixes are Sun Life specific.
        FALLBACK_FONT_SIZE (9) stays in core -- it is the mechanism default,
        not insurer-specific.
        font_size_for() stays in core unchanged -- it accepts any sizes dict.

        Check whether any call site passes sizes=DEFAULT_FONT_SIZES explicitly
        or relies on the implicit default.

        EXPECT THE EXISTING TESTS TO BE SUCH CALL SITES, and do NOT stop on
        them.  tests/core_tests/test_core_pdf_forms.py calls font_size_for()
        with no sizes= argument and asserts 7 and 8.  Verified against the
        merged file: exactly THREE test methods break --
          test_narrow_date_and_phone_cells_shrink     (asserts 7)
          test_repeated_row_suffixes_match_by_prefix  (asserts 7)
          test_currency_fields_use_intermediate_size  (asserts 8)
        The fallback tests and the explicit-sizes tests keep passing untouched;
        do not edit those.  font_size_for() does
        `table = DEFAULT_FONT_SIZES if sizes is None else sizes`, so emptying
        the dict makes every one of those return FALLBACK_FONT_SIZE (9) and
        turn red.  That is expected and is fixed in Step 5, not a reason to
        halt: those assertions are migrated in this same stage.

        Stop ONLY if you find a call site in src/ or bin/ (i.e. shipped code,
        not tests) that relies on the implicit default with insurer prefixes.
        That would mean production code depends on core knowing about Sun
        Life, which the migration cannot silently break.

      Step 3 -- make the edit to src/core/pdf_forms.py.
        Replace DEFAULT_FONT_SIZES with an empty dict and update its docstring:
          # Generic mechanism default.  Insurer-specific sizes belong in the
          # caller's own sizes map (e.g. claims/forms.py:CLAIM_FONT_SIZES),
          # passed as the sizes= argument to font_size_for().
          DEFAULT_FONT_SIZES: dict[str, int] = {}
        Use the Edit tool.

      Step 4 -- verify the import smoke check passes.
        PYTHONPATH="$(pwd)/src" .venv/bin/python -c \
          "from core.pdf_forms import DEFAULT_FONT_SIZES, font_size_for, \
           format_da, pdf_string, set_text_field, fill_text_fields, set_checkbox; \
           print('import ok'); \
           print('DEFAULT_FONT_SIZES empty:', DEFAULT_FONT_SIZES == {})"

      Step 5 -- re-run the EXISTING test suite for the file you just edited.
        src/core/pdf_forms.py shipped in PR #349 with 30 passing unit tests and
        5 doctests.  Emptying DEFAULT_FONT_SIZES changes what font_size_for()
        returns for every unmatched field, so those tests are the guard against
        breaking a merged, working module.

        PYTHONPATH="$(pwd)/src" .venv/bin/python -m unittest \
          tests.core_tests.test_core_pdf_forms > /tmp/pdf-forms-tests.log 2>&1
        unit_status=$?; tail -5 /tmp/pdf-forms-tests.log
        PYTHONPATH="$(pwd)/src" .venv/bin/python -m doctest src/core/pdf_forms.py -v \
          > /tmp/pdf-forms-doctest.log 2>&1
        doc_status=$?; tail -3 /tmp/pdf-forms-doctest.log
        echo "UNIT_EXIT=$unit_status DOCTEST_EXIT=$doc_status"

        Neither may be piped into tail directly -- tail's zero exit would mask
        a failure and let existing_pdf_forms_tests record PASS on a red run,
        which is exactly what the migration_safe gate depends on.

        existing_pdf_forms_tests is "PASS" only when BOTH exits are 0.

        THE DOCTEST WILL FAIL UNTIL YOU FIX IT, and that is expected: the
        docstring of font_size_for() in src/core/pdf_forms.py contains

            >>> font_size_for("2.day_phone.area")
            7

        which asserts the very default this migration removes.  Update that
        doctest in the same edit -- pass an explicit sizes map so it still
        demonstrates longest-prefix matching:

            >>> font_size_for("2.day_phone.area", {"2.day_phone.": 7})
            7

        Do not delete the doctest and do not weaken it to assert 9; the point
        of the example is the prefix mechanism, which core still owns.

        Tests asserting the OLD Sun Life prefixes (e.g. font_size_for(
        "2.day_phone.area") == 7) will now fail, because that knowledge has
        moved.  Do NOT delete them, and do NOT weaken them to match the new
        behaviour -- the assertion that a phone cell renders at 7pt is the
        whole point of the original work.

        Because claims/ does not exist yet (implement-claims is four stages
        later), rewrite them IN PLACE in tests/core_tests/test_core_pdf_forms.py
        to pass an explicit local sizes map rather than relying on the removed
        default:

          SUNLIFE_SIZES = {"dateOfBirth": 7, "2.day_phone.": 7, "4.DOB.": 7,
                            "5.date.": 7, "3.total_claimed": 8}
          self.assertEqual(font_size_for("2.day_phone.area", SUNLIFE_SIZES), 7)

        This keeps the mechanism under test in core where it belongs (core owns
        longest-prefix matching; it just no longer owns the insurer's prefixes).
        implement-claims will separately add tests that the REAL
        CLAIM_FONT_SIZES has these values -- record in your manifest which
        assertions you rewrote so that stage can cross-check.

        Every other test must still pass unchanged.

      Step 6 -- prove the migration did not change SHIPPED output.
        This is the check that actually matters: unit tests confirm the
        constants moved, but not that a real form still fills identically.

        ORDERING NOTE: claims/forms.py does not exist yet -- it is written in
        implement-claims, four stages later -- so CLAIM_FONT_SIZES is NOT
        importable here.  Define the map inline in your throwaway verification
        script, using the exact prefixes you just removed from core:

          CLAIM_FONT_SIZES = {
              "dateOfBirth": 7, "2.day_phone.": 7, "4.DOB.": 7,
              "5.date.": 7, "3.total_claimed": 8,
          }

        These same five entries are what implement-claims will later write into
        claims/forms.py; defining them here is not duplication of shipped code,
        it is the verification fixture for this stage.  Do NOT create
        src/claims/forms.py from this stage -- implement-claims owns that file,
        and writing it early would collide.

        PRIVACY BOUNDARY -- do NOT read real claim PDFs.  Files under
        ~/Documents/sunlife-claims/ contain real names, dates of birth, a home
        address, a member ID and claim amounts.  Never open one, never copy one
        into the workspace, and never quote its contents.  The same rule that
        makes the receipt fixtures synthetic applies here.

        The check does not need real data -- it needs the SAME VALUES written
        twice through two code paths.  Build both sides yourself from invented
        values:

          1. Generate the approved BLANK template.  There is exactly one,
             and it is generated rather than found:

               .venv/bin/python tests/receipts_fixtures/build_claim_template.py
               -> tests/receipts_fixtures/blank_claim_template.pdf

             It is a real AcroForm carrying the same field NAMES the size map
             keys on, every widget empty, no personal data.  Field names are
             the form's schema, not personal data.

             Do NOT accept a caller-supplied path, and do NOT search the
             filesystem.  Both were tried in earlier revisions of this stage
             and both are unsound for the same reason: deciding whether a PDF
             is blank means READING ITS PAGE TEXT, so a filled claim form
             would already have been read by the time it was rejected.
             Opening is the disclosure.  A check cannot be the safeguard when
             performing the check is itself the exposure -- the only safe
             input is one that was never a real claim form.

             This also removes the reason a real template was ever wanted:
             the insurer-supplied file on this machine is NOT blank (it
             arrives pre-populated with member ID, name, date of birth and
             address), so it could never have served as a baseline anyway.

             The blank check below still runs on the generated template.  It
             is cheap, and it now catches a broken generator rather than
             vetting an untrusted input.  If it rejects, record
             shipped_form_equivalence: "SKIPPED -- template generator failed"
             and CONTINUE TO STEP 7 to write the manifest.  Do not jump back
             to an earlier step: the skip is recorded here, in Step 6, while
             Step 7 is the only step that writes font-size-migration.json --
             going backwards re-runs the equivalence checks, reaches this
             same branch again, and loops without ever producing the manifest
             a human needs to see why the run stopped.

             A SKIP IS NOT EXPECTED.  The template is generated, so the
             proof should normally run and report PASS or FAIL.  A skip means
             the generator or the blank check failed, which is a defect to
             report -- not a normal outcome, and never a reason to go looking
             for another template.  Step 7 treats any skip as unverified and
             halts the run.

             VERIFY THE GENERATED TEMPLATE IS BLANK.  The check is cheap and
             now guards against a broken generator rather than vetting an
             untrusted input -- there is no caller-supplied path any more.

             Counting filled WIDGETS is not sufficient on its own: a flattened
             or scanned PDF has no AcroForm widgets at all, so it reports zero
             filled fields while its page text still carries every name and
             amount.  Require BOTH:

               a. an intact AcroForm with every text widget empty, AND
               b. page text that contains none of the identifying tokens a
                  filled claim would carry.

               The template path is now a FIXED, repo-relative constant, so
               nothing needs to hand a path to this program: no environment
               variable, no workspace file, no shell interpolation.  That
               closes the injection surface rather than trying to quote it --
               {workspace} itself is derived from a user-overridable
               --workspace/work_dir, so interpolating it into a `python -c`
               string would be shell source too.

               PYTHONPATH="$(pwd)/src" .venv/bin/python -c "
               import pathlib, re, fitz
               cand = 'tests/receipts_fixtures/blank_claim_template.pdf'
               if not pathlib.Path(cand).is_file():
                   raise SystemExit('REJECT: generator did not produce ' + cand)
               d = fitz.open(cand)
               widgets = [w for pno in range(d.page_count)
                          for w in (d[pno].widgets() or [])]
               text_widgets = [w for w in widgets
                               if w.field_type_string in ('Text','ComboBox')]
               filled = [w.field_name for w in text_widgets
                         if (w.field_value or '').strip()]
               page_text = ' '.join(p.get_text() for p in d)
               d.close()
               # A blank template is a FORM: it must have text widgets.
               if not text_widgets:
                   raise SystemExit('REJECT: no AcroForm text widgets -- '
                                    'flattened or scanned, not a blank template')
               if filled:
                   raise SystemExit(f'REJECT: {len(filled)} filled field(s)')
               # Belt and braces: a blank form carries LABELS, not data.
               # These patterns are a backstop, NOT a proof of blankness --
               # they cannot enumerate every way a name or amount can appear.
               # The real guarantee is the widget check above plus the
               # approved-source rule below.
               import itertools
               PATTERNS = [
                   r'\b\d{3}[-. ]\d{3}[-. ]\d{4}\b',      # phone, any sep
                   r'\b(19|20)\d{2}-\d{2}-\d{2}\b',        # ISO date
                   r'\b\d{1,2}/\d{1,2}/(19|20)\d{2}\b',    # slashed date
                   r'\$\s?\d[\d,]*\.\d{2}',                # currency amount
                   r'\b[A-Z]\d[A-Z]\s?\d[A-Z]\d\b',        # CA postal code
               ]
               hits = [pat for pat in PATTERNS if re.search(pat, page_text)]
               if hits:
                   raise SystemExit(f'REJECT: page text matches {len(hits)} '
                                    'data pattern(s) -- not a blank template')
               print('BLANK OK')"

             On BLANK OK, record the path as blank_template_path in your
             manifest (it is the fixed generated path, but recording it keeps
             verify from having to know the convention).  verify reads it from there rather than searching
             again -- re-discovering a template in a later stage could pick a
             different file than the one validated here, which would make the
             approval meaningless.

             The path reaches Python through that workspace file only.  Do
             not pass it via a TEMPLATE environment variable and do not
             interpolate it into the command text: resolve_params does a
             plain str.replace with no shell quoting, so a path containing a
             quote, $() or a backtick would execute.

             THE PATTERNS ARE A BACKSTOP, NOT A GUARANTEE.  They cannot
             enumerate every way personal data can appear -- a form whose
             static text carries a name, a member ID, or a space-separated
             phone number can still slip past.  So the rule is source-based
             first and pattern-based second:

               ACCEPT exactly ONE path, hard-coded:

                 tests/receipts_fixtures/blank_claim_template.pdf

               produced by build_claim_template.py in this same step.  There
               is no second approved source and no override.  A
               user-identified path reopens the untrusted-input problem this
               section exists to close -- the blank check cannot vet it,
               because running the check means reading the page text, and a
               filled claim would be read before it was rejected.

               Note the file is NOT committed: *.pdf is gitignored, so the
               generator is the source of truth and the PDF is rebuilt each
               run.  "A fixture committed to this repo" would be the wrong
               rule to write down, because no such file exists.

             Anything else -- a caller-supplied path, a filesystem search
             result, a file that merely looks clean -- is rejected without
             being opened.

             On ANY reject, STOP -- do not open it further, do not copy it, do
             not quote its contents.  Record shipped_form_equivalence:
             "SKIPPED -- candidate template was not blank" and CONTINUE TO
             STEP 7 to write the manifest.  Do not jump back: Step 4 precedes
             the equivalence proof, so returning there repeats it and can
             loop indefinitely without ever reaching the manifest.

             Never search under ~/Documents/sunlife-claims/ or any directory
             holding real claims.  The template is generated, so there is
             nothing to look for.

             THE PROOF IS NOW EXPECTED TO RUN, not to skip.  Earlier
             revisions of this stage searched for a template and were told to
             expect nothing -- verified on the author's machine, the
             insurer-supplied file in ~/Downloads is NOT blank (Sun Life
             pre-populates member ID, full name, date of birth and home
             address), so it carries PII before anyone fills a claim and the
             check correctly rejects it.

             Generating a synthetic template removes that dead end: the
             equivalence proof should normally produce PASS or FAIL.  A SKIP
             now means the GENERATOR failed, which is a defect worth
             reporting rather than a normal outcome.

             Do NOT relax the check, strip fields to manufacture a blank, or
             fall back to a real insurer form under any circumstances.

          2. Fill a copy using SYNTHETIC values only -- the same "Pat Doe"
             placeholder style as tests/receipts_fixtures/build_fixtures.py:
               lastName "Doe", firstName "Pat", dateOfBirth 1990-01-01,
               phone 555 555 0100, address "1 Test Street", amounts 45.00 /
               200.00 / 245.00, member id "000000000".
             Path A: the PRE-migration code path (git stash your edit, or use
             `git show HEAD:src/core/pdf_forms.py` in a scratch module) with no
             sizes= argument.
             Path B: the POST-migration path passing the inline map as sizes=.

          3. Compare the two generated PDFs field-by-field:

               for each text widget in both PDFs:
                   assert field_value matches
                   assert the /DA string matches EXACTLY (font and point size)

        A /DA mismatch means the migration changed RENDERING even though the
        values are right -- exactly the class of bug that reading values back
        cannot see.  Any mismatch is BLOCKING: report it and stop rather than
        proceeding.

        This is strictly stronger than diffing against a shipped form: it
        controls both sides, so a difference can only come from the migration
        itself rather than from a form that was generated months ago under
        different inputs.

      Step 7 -- write {workspace}/outputs/font-size-migration.json.

        migration_safe is a DERIVED value, not a default.  Set it true ONLY
        when the equivalence proof actually ran and passed:

          migration_safe = (existing_pdf_forms_tests == "PASS"
                            and import_smoke_check   == "PASS"
                            and shipped_form_equivalence == "PASS")

        A SKIPPED equivalence check means the migration is UNVERIFIED, which
        is not the same as safe.  Writing migration_safe: true on a skip would
        let implement-claims build on an unproven edit to a merged module --
        the precise failure this stage exists to prevent.

          {
            "call_sites_found": [],
            "call_sites_outside_claims": [],
            "migration_safe": false,
            "core_pdf_forms_edited": true,
            "import_smoke_check": "PASS|FAIL",
            "existing_pdf_forms_tests": "PASS|FAIL",
            "tests_rewritten_in_core": [],
            "shipped_form_equivalence": "PASS|FAIL|SKIPPED -- <reason>",
            "blank_template_path": null,
            "da_mismatches": []
          }

        If migration_safe is false, report this stage's status as "failed".

        Be clear about what that does, because it is NOT a pause at the human
        gate: _any_required_failed in src/workflow/orchestrator.py:220-222
        returns immediately when a required stage fails, so the run STOPS
        here.  implement-claims, verify and human-gate never execute, and
        there is no gate report.

        That is the intended outcome, and it is the right one -- continuing
        would build the claims package on an edit to a merged, tested module
        that was never shown to preserve rendering.  But it means this
        manifest IS the record: a human reads
        {workspace}/outputs/font-size-migration.json to see why the run
        stopped, so shipped_form_equivalence must carry a specific reason
        ("SKIPPED -- template generator failed", "FAIL -- 3 /DA mismatches")
        rather than a bare status.  Nothing downstream will summarise it for
        them.

        Resuming: a human fixes whatever made the proof fail and re-runs.
        Do not weaken this to a warning so the pipeline can continue.
    agent:
      role: code-writer
      model: sonnet
      tools: [Read, Edit, Bash, Write]
      access: read-write
    outputs:
      - name: font-size-migration
        mode: generate
        description: >
          Edit to src/core/pdf_forms.py: DEFAULT_FONT_SIZES emptied.
          Migration report at {workspace}/outputs/font-size-migration.json.
    required: true
    writes_to:
      - outputs/font-size-migration.json

  # ===========================================================================
  # S3a: Implement core/pdf_read.py -- PdfDocument + PdfParser ABC
  # ===========================================================================

  - name: implement-claims
    kind: execute
    depends_on: [migrate-font-sizes]
    reads_from:
      - migrate-font-sizes
      - preflight-check
    description: >
      Implement src/claims/ -- ledger, rules, forms, packet, CLI, and bin wrapper.

      Step 1 -- read:
        There is no design/ directory in THIS workspace: design-interfaces
        belongs to receipts-domain-build.yaml and wrote into its own,
        separate workspace.  Do not read those paths -- they do not exist
        here, and a stage that blocks on a missing required input fails
        confusingly.

        The consumer contract for src/claims/ is in the merged receipts
        workflow instead.  Read it from the repo:

          grep -n "Consumer contract" -A 60 \
            workflows/code/receipts-domain-build.yaml

        That section pins Claim (including plan_year_start_month), the
        ClaimLedger signatures (invoice_id is str | None), RuleResult, and
        the rules this package must implement.  The concrete specifications
        below are authoritative where the two differ -- report any conflict
        rather than silently choosing one.
        Read src/core/pdf_forms.py (fill_text_fields, set_checkbox, font_size_for).
        Read src/core/pdf_read.py (PdfDocument.render_png for packet.py).
        Read src/receipts/models.py (Receipt for claims/models.py).
        Read src/wifi/cli.py for CLIApp pattern.
        Read bin/_wrappers.yaml for registration syntax.

      Step 2 -- write src/claims/__init__.py (empty).
        Register "claims*" in pyproject.toml packages.find include list.

      Step 3 -- write src/claims/models.py.
        @dataclass Claim:
          receipt: Receipt
          claimant: str
          plan_year: int              # the year the window STARTS in
          plan_year_start_month: int = 1   # 1-12; not every plan runs Jan-Dec
          submitted: bool = False

        plan_year_start_month is a field rather than a lookup because this
        workflow introduces no claims configuration file, and inventing an
        implicit config source would be a hidden dependency.  The caller
        already knows which plan it is filing against.  Default 1 keeps the
        common calendar-year case ergonomic.
        from receipts.models import Receipt  (import at module level is fine here --
        receipts is a declared dependency of claims, not core).

      Step 4 -- write src/claims/ledger.py.
        ClaimLedger with these exact signatures -- note invoice_id is
        OPTIONAL on both, because Costco receipts have no invoice number and
        the contract below explicitly requires passing None:

          def __init__(self, ledger_path: str | Path) -> None: ...
          def is_duplicate(self, invoice_id: str | None) -> bool: ...
          def record(self, invoice_id: str | None, claimant: str,
                     amount: float, submitted_at: str) -> None: ...
          def load(self) -> list[dict]: ...
          def save(self) -> None: ...

        Typing invoice_id as bare `str` while documenting is_duplicate(None)
        makes the documented call invalid at the type boundary and would show
        up as a mypy regression under make typecheck-changed.

        Ledger file: JSON list of dicts.
        is_duplicate checks ALL entries, not just the current plan_year --
        a receipt claimed in submission 2 must still be caught in submission 5.
        Costco receipts (invoice_id=None): is_duplicate(None) returns False
        always (cannot deduplicate what has no id).
        record() is a no-op if invoice_id is None (no ledger entry for Costco).

      Step 5 -- write src/claims/rules.py.
        @dataclass RuleResult: eligible: bool; reason: str | None
        apply_rules(claim: Claim, ledger: ClaimLedger) -> RuleResult:
          if claim.receipt.total is None:
            return RuleResult(eligible=False, reason="no amount parsed")
          if claim.receipt.total == 0.0:
            return RuleResult(eligible=False, reason="$0 patient-pays: provider direct-billed")
          if not in_plan_year(claim.receipt.date, claim.plan_year,
                              claim.plan_year_start_month):
            return RuleResult(eligible=False, reason="outside plan year")
          if claim.receipt.invoice_id and ledger.is_duplicate(claim.receipt.invoice_id):
            return RuleResult(eligible=False, reason="duplicate: already submitted")
          return RuleResult(eligible=True, reason=None)

        in_plan_year(service_date: str | None, plan_year: int,
                     start_month: int = 1) -> bool:
          The window is [start, start + 1 year), where start is
          date(plan_year, start_month, 1).  start_month comes from
          Claim.plan_year_start_month -- an explicit argument, NOT a config
          lookup, since no claims config file exists and introducing one
          implicitly would be a hidden dependency.

          Call it as:
            in_plan_year(claim.receipt.date, claim.plan_year,
                         claim.plan_year_start_month)

          Return True when service_date is None -- an unparsed date is not
          evidence the receipt is out of window, and the $0/None checks above
          already catch unusable receipts.

          Required because a service date can fall outside the plan whose
          form it is being submitted on, and a receipt claimed against the
          wrong plan year is rejected by the insurer rather than silently
          ignored.  Note the ledger deliberately checks ALL prior
          submissions, not just the current plan year, so the two rules are
          independent: this one bounds the SERVICE date, the ledger bounds
          resubmission.

      Step 6 -- write src/claims/forms.py.
        CLAIM_FONT_SIZES = {
          "2.day_phone.": 7,
          "4.DOB.": 7,
          "5.date.": 7,
          "3.total_claimed": 8,
          "dateOfBirth": 7,
        }
        # These were previously in core.pdf_forms.DEFAULT_FONT_SIZES.
        # They are Sun Life EHC-specific and belong here, not in core.

        VERIFY THE REAL SIGNATURE BEFORE WRITING THIS.  Run:
          PYTHONPATH="$(pwd)/src" .venv/bin/python -c \
            "import inspect, core.pdf_forms as f; \
             print(inspect.signature(f.fill_text_fields)); \
             print(inspect.signature(f.set_checkbox))"

        As merged in PR #349 it is:
          fill_text_fields(doc: fitz.Document, values: Mapping[str, str], *,
                           sizes=None, require_all=True) -> dict[str, int]

        Note what that means: it takes an OPEN fitz.Document, NOT a path, and
        it does NOT save -- there is no out_path parameter.  Opening the
        template and saving the result is the CALLER's job.  A call shaped
        fill_text_fields(template_path, fields, out_path, ...) is a TypeError:
        a str where a Document is expected, and a third positional past a
        keyword-only boundary.

        fill_claim_form(template_path: str, receipt: Receipt, claimant: str,
                        out_path: str) -> None:
          import shutil
          import fitz
          from core.pdf_forms import fill_text_fields, set_checkbox

          shutil.copy(template_path, out_path)   # never mutate the template
          doc = fitz.open(out_path)
          try:
              fields = {...}  # build from Receipt + claimant
              fill_text_fields(doc, fields, sizes=CLAIM_FONT_SIZES)
              # checkboxes: one call per field name, per-xref internally
              doc.save(out_path, incremental=True,
                       encryption=fitz.PDF_ENCRYPT_KEEP)
          finally:
              doc.close()

        The incremental save with PDF_ENCRYPT_KEEP is required: a full rewrite
        of an AcroForm template can drop the field appearance dictionaries.

        CRITICAL: every field VALUE and CHECKBOX write must go through
        core.pdf_forms (fill_text_fields / set_checkbox) with
        sizes=CLAIM_FONT_SIZES.  fitz is used here only to open and save the
        document -- never to set a field value, a /DA string, or a widget
        state directly.  Those three are exactly what pdf_forms exists to get
        right (parenthesized /DA, escaped values, per-xref checkbox writes).

      Step 7 -- write src/claims/packet.py.
        build_packet(claim: Claim, template_path: str, out_dir: str | Path) -> Path:
          1. Call fill_claim_form() to produce a filled form PDF.
          2. Open the filled form with PdfDocument; merge with receipt PDF.
          3. Write merged PDF to out_dir/packet.pdf.
          4. RENDER VERIFICATION: for each key field region in the form, call
             PdfDocument.render_png() and write to out_dir/verify_<field>.png.
             This is required -- reading field values back is NOT sufficient.
             The null-/DA bug was invisible to value inspection and visible only
             in a render.
          5. Return Path(out_dir) / "packet.pdf".

      Step 8 -- write src/claims/cli.py.
        CLIApp "claims". Subcommands:
          fill   --template <path> --receipt <pdf> [--claimant NAME]
                 [--out-dir <dir>] [--dry-run]
          check  --receipt <pdf>
          ledger show|add
        run_with_assistant() for agentic schema.

      Step 9 -- write src/claims/__main__.py (mirror wifi pattern).

      Step 10 -- register in bin/_wrappers.yaml:
          claims: {module: claims, doc: "Insurance claim pipeline (EHC/HSA form fill, ledger, rules)."}
        Run: make bin-wrappers
        Verify: ls -la bin/claims

      Step 11 -- import smoke check:
        PYTHONPATH="$(pwd)/src" .venv/bin/python -c \
          "from claims.ledger import ClaimLedger; \
           from claims.rules import apply_rules; \
           from claims.forms import fill_claim_form, CLAIM_FONT_SIZES; \
           print('ok')" 2>&1

      Step 12 -- write {workspace}/outputs/claims-manifest.json:
        {
          "files_written": [
            "src/claims/__init__.py", "src/claims/models.py",
            "src/claims/ledger.py", "src/claims/rules.py",
            "src/claims/forms.py", "src/claims/packet.py",
            "src/claims/cli.py", "src/claims/__main__.py"
          ],
          "bin_wrapper": "bin/claims",
          "font_sizes_in_claims": true,
          "font_sizes_in_core": false,
          "render_verification_in_packet": true,
          "import_smoke_check": "PASS|FAIL"
        }
    agent:
      role: code-writer
      model: sonnet
      tools: [Read, Write, Edit, Bash]
      access: read-write
    outputs:
      - name: claims
        mode: generate
        description: >
          src/claims/ (all files) and bin/claims wrapper.
          Manifest at {workspace}/outputs/claims-manifest.json.
    required: true
    writes_to:
      - outputs/claims-manifest.json

  # ===========================================================================
  # S7: Integration review -- cross-check all packages for API consistency
  # ===========================================================================

  - name: integration-review
    kind: gather
    depends_on: [implement-claims]
    reads_from:
      - implement-claims
      - migrate-font-sizes
      - preflight-check
    description: >
      Cross-check the implemented packages for API consistency, dependency
      direction violations, and pdf_forms core-invariant compliance.

      Step 1 -- read all source files:
        src/core/pdf_read.py
        src/core/pdf_forms.py
        src/receipts/models.py
        src/receipts/sidecar.py
        src/receipts/parsers/jane.py
        src/receipts/parsers/costco.py
        src/receipts/parsers/generic.py
        src/receipts/extract.py
        src/receipts/cli.py
        src/claims/models.py
        src/claims/ledger.py
        src/claims/rules.py
        src/claims/forms.py
        src/claims/packet.py
        src/claims/cli.py

      Step 2 -- dependency direction check.
        Run:
          grep -n "^from claims\|^import claims" src/receipts/*.py \
            src/receipts/parsers/*.py src/core/pdf_read.py src/core/pdf_forms.py 2>/dev/null
        Any hit is a BLOCKING violation.
          grep -n "^from receipts\|^import receipts" src/core/pdf_read.py \
            src/core/pdf_forms.py 2>/dev/null
        Any hit is a BLOCKING violation.

      Step 3 -- verify CLAIM_FONT_SIZES is in claims/forms.py, NOT in
        core/pdf_forms.DEFAULT_FONT_SIZES.
        grep -n "DEFAULT_FONT_SIZES" src/core/pdf_forms.py
        grep -n "CLAIM_FONT_SIZES" src/claims/forms.py
        grep -n "sizes=CLAIM_FONT_SIZES" src/claims/forms.py
        Confirm fill_text_fields is called with sizes= kwarg.

      Step 4 -- verify lazy fitz import in pdf_read.py.
        grep -n "^import fitz\|^from fitz" src/core/pdf_read.py
        Any hit is BLOCKING.

      Step 5 -- verify PdfParser ABC is minimal.
        grep -n "abstractmethod\|@abc.abstractmethod" src/core/pdf_read.py
        Count abstract methods.  More than 2 (matches + parse) is a BLOCKING violation.

      Step 6 -- verify $0 handling in rules.py.
        grep -n "total.*0.0\|0\.0.*total\|== 0" src/claims/rules.py
        Confirm $0 -> eligible=False, reason="$0 patient-pays...".

      Step 7 -- verify render-verification in packet.py.
        grep -n "render_png\|verify_" src/claims/packet.py
        Confirm at least one render_png() call writes to out_dir.

      Step 8 -- verify sidecar is last resort in extract.py.
        grep -n "sidecar\|load_sidecar" src/receipts/extract.py
        Confirm sidecar is only invoked AFTER all PARSERS have declined.

      Step 9 -- verify agentic schema in the claims CLI.
        grep -n "run_with_assistant\|agentic" src/claims/cli.py
        (src/receipts/cli.py shipped with receipts-domain-build and is not
        modified here; the full-suite run is its regression guard.)

      Step 9b -- read the migration verdict.  Do NOT assume it.
        Read {workspace}/outputs/font-size-migration.json and take
        migration_safe and shipped_form_equivalence from it verbatim.

        migration_safe is itself derived in migrate-font-sizes from three
        checks, and is false whenever the equivalence proof was SKIPPED --
        which now indicates the template generator failed -- the proof is
        expected to run and produce PASS or FAIL.  "Unverified" is not "verified": report it as a blocking
        finding here rather than letting fix-integration branch on a
        hard-coded true.

      Step 10 -- write {workspace}/outputs/integration-review.json:
        {
          "dependency_direction_violations": [],
          "font_size_migration_verified": false,
          "migration_safe": false,
          "shipped_form_equivalence": "PASS|FAIL|SKIPPED",
          "lazy_fitz_violations": [],
          "pdfparser_abc_method_count": 2,
          "zero_dollar_rule_present": true,
          "render_verification_present": true,
          "sidecar_last_resort_verified": true,
          "agentic_wired": {"claims": true},
          "blocking_count": 0,
          "overall": "PASS|ISSUES"
        }

        font_size_migration_verified MUST equal migration_safe as read in
        Step 9b -- never a literal.  If it is false, count it in
        blocking_count and set overall to "ISSUES".

      Write {workspace}/outputs/integration-review.md with a human-readable
      summary of any issues and recommended fixes.
    agent:
      role: reviewer
      model: sonnet
      tools: [Read, Bash, Write]
      access: read-write
    outputs:
      - name: integration-review
        mode: generate
        description: >
          Integration review results at {workspace}/outputs/integration-review.json
          and {workspace}/outputs/integration-review.md.
    required: true
    writes_to:
      - outputs/integration-review.json
      - outputs/integration-review.md

  # ===========================================================================
  # S8: Fix integration -- repair issues found in integration-review
  # ===========================================================================

  - name: fix-integration
    kind: execute
    depends_on: [integration-review]
    reads_from: [integration-review, preflight-check]
    description: >
      Apply fixes for every BLOCKING issue in the integration review.
      If overall=="PASS" and blocking_count==0, write a sentinel and exit.

      Step 1 -- read:
        Read {workspace}/outputs/integration-review.json.
        Read {workspace}/outputs/integration-review.md.
        If overall == "PASS" and blocking_count == 0:
          Write {workspace}/outputs/fix-integration-sentinel.md:
            "no fixes needed -- integration review passed"
          Exit.

      Step 2 -- fix dependency direction violations.
        For each violation in dependency_direction_violations:
          Remove the cross-layer import.
          Refactor to pass the data as a parameter instead.

      Step 3 -- font-size migration: distinguish BROKEN from UNVERIFIED.
        If font_size_migration_verified == false, read
        shipped_form_equivalence before changing anything.

        a. shipped_form_equivalence == "FAIL"
             The migration genuinely changed rendering.  Fix it:
             ensure DEFAULT_FONT_SIZES is {} in src/core/pdf_forms.py,
             CLAIM_FONT_SIZES exists in src/claims/forms.py, and
             fill_text_fields is called with sizes=CLAIM_FONT_SIZES.

        b. shipped_form_equivalence startswith "SKIPPED"
             The template generator failed, so the proof could not run.  This is NOT a code defect and there is nothing here to
             fix.  Do NOT edit files to make the flag flip, and do NOT
             re-run the check against a non-approved template.  Leave the
             finding standing, record it in your results as
             "unverified -- template generator failed", and let the human
             gate decide.  Silently converting an unverified migration into
             a verified one is the exact failure this chain exists to
             prevent.

      Step 4 -- fix lazy fitz violations.
        For each hit in lazy_fitz_violations:
          Move the top-level fitz import inside the calling function.

      Step 5 -- fix PdfParser ABC if over 2 abstract methods.
        Remove any abstract methods beyond matches() and parse().

      Step 6 -- re-run import smoke checks after fixes:
        PYTHONPATH="$(pwd)/src" .venv/bin/python -c \
          "from core.pdf_read import PdfDocument, PdfParser; \
           from receipts.extract import extract; \
           from claims.ledger import ClaimLedger; \
           from claims.forms import fill_claim_form; print('all ok')" 2>&1

      Step 7 -- write {workspace}/outputs/fix-integration-results.json:
        {
          "fixes_applied": [],
          "sentinel": false,
          "import_smoke_check": "PASS|FAIL"
        }
    agent:
      role: code-writer
      model: sonnet
      tools: [Read, Edit, Write, Bash]
      access: read-write
    outputs:
      - name: fix-integration
        mode: generate
        description: >
          Integration fixes. Results at {workspace}/outputs/fix-integration-results.json.
    required: true
    writes_to:
      - outputs/fix-integration-results.json

  # ===========================================================================
  # S9: Verify -- RUN the code, not just read it
  # ===========================================================================
  #
  # This repo has a documented lesson: review and execution find disjoint defects.
  # Five review rounds missed 3 bugs one dry run caught in minutes.

  - name: verify
    kind: gather
    depends_on: [fix-integration]
    reads_from: [fix-integration, implement-claims]
    description: >
      Full verification pass: RUNS the code (tests, CLI smoke, render check).
      Do not skip execution in favour of reading.

      Step 0 -- install, then regenerate the shared fixtures.
        Install the [pdf] extra BEFORE generating anything.  `make venv`
        installs ".[dev]", which does not include PyMuPDF -- fitz lives in the
        [pdf] extra -- so running the builder first fails with
        ModuleNotFoundError.  The CI install does not help an agent worktree.

          test -x .venv/bin/python || make venv > /tmp/venv-create.log 2>&1
          test -x .venv/bin/python || { tail -20 /tmp/venv-create.log; \
            echo "FATAL: no .venv"; exit 1; }
          .venv/bin/python -m pip install -e ".[pdf,ocr]" > /tmp/pdf-install.log 2>&1
          status=$?; tail -2 /tmp/pdf-install.log; echo "INSTALL_EXIT=$status"

        INSTALL_EXIT must be 0 before continuing -- do not pipe straight into
        tail, which would hide a failed install behind its own zero exit.

          .venv/bin/python tests/receipts_fixtures/build_fixtures.py

        The generated PDFs are gitignored (*.pdf), so a fresh checkout has the
        builder but not its output.  The full-suite run in Step 3 re-executes
        the receipts tests, which read these files -- without this step they
        fail with FileNotFoundError and it looks like a receipts regression.

        This workflow does not WRITE receipts tests (they merged with
        receipts-domain-build.yaml); it only needs their fixtures present.

          jane_clinic.pdf      "Invoice #NNNNN-PNN" + "Payer Total  $190.00"
          jane_zero.pdf        same shape, "$0.00" -- direct-billed; MUST parse
                               as 0.00, never None
          invoice_total.pdf    "Total" only, NO "Payer Total" -- this exact gap
                               once understated a real claim by $190
          speech_aim.pdf       "Total Amount" -- a third spelling
          costco_pharmacy.pdf  OCR-degraded scan: "!Patient Pays: 88.21 j",
                               no "$", garbled header text
          costco_optical.pdf   text layer present but NO total label and NO "$"
                               amount -- the genuine sidecar case
          image_only.pdf       no text layer at all -- the OCR-fallback trigger

        Note for the parser stages: Costco receipts are NOT blank scans.  They
        carry a dirty OCR layer, so a parser that tests "is there text?" to
        decide whether to OCR will mis-handle them.  Optical is the only shape
        with genuinely nothing to extract.

      Step 1 -- write tests for the new packages.
        Tests must assert BEHAVIOUR -- both happy paths (normal use) and sad paths
        (error conditions, boundary values, missing dependencies).  Do NOT write
        import-only tests or tests whose only assertion is that a constructor runs.

        Every parser test MUST run against the fixtures above, not against a
        PDF built inline in setUp.  A parser that passes only on an idealised
        receipt it was written alongside proves nothing about the label
        variance that actually breaks parsing.

        Do NOT write tests/core_tests/test_pdf_read.py -- core.pdf_read and
        its tests ship with receipts-domain-build.yaml, already merged.

        Do NOT write or rewrite tests under tests/receipts_tests/.  The
        receipts package and its parser/extract/sidecar tests ship with
        receipts-domain-build.yaml, which has already merged by the time this
        workflow runs.  Re-creating them here would duplicate coverage and
        risk overwriting the fixture-driven versions with weaker inline ones.
        The full-suite run in a later step re-executes them as a regression
        guard, which is the only coverage this workflow needs of them.

        Write tests/claims_tests/__init__.py (empty).
        Write tests/claims_tests/test_rules.py:
          HAPPY:
          - apply_rules on a valid $25.00 unseen claim returns eligible=True.
          SAD:
          - apply_rules on a $0.00 claim returns eligible=False with reason
            containing "$0".
          - apply_rules on a claim whose service date falls OUTSIDE the plan
            year returns eligible=False with reason containing "plan year"
            (use a date one day before the window start, and one day after
            the window end -- both must be rejected).
          - apply_rules on a claim whose service date is the FIRST day of the
            plan year returns eligible=True (the window is inclusive at the
            start), and the day before the next window starts is also
            eligible.
          - a NON-January plan year works: with plan_year=2026 and
            plan_year_start_month=8, a 2026-08-01 service date is eligible,
            2026-07-31 is not, 2027-07-31 is eligible, and 2027-08-01 is not.
            This is the case a Jan-Dec assumption silently gets wrong.
          - apply_rules on a claim whose receipt.date is None returns
            eligible=True on that basis alone: an unparsed date must not be
            treated as out-of-window.
          - apply_rules on a claim whose invoice_id is already in the ledger
            returns eligible=False with reason containing "duplicate".
          - apply_rules on a claim with invoice_id=None and total>0 returns
            eligible=True (Costco receipts have no invoice_id but should be claimable).

        Write tests/claims_tests/test_ledger.py:
          HAPPY:
          - is_duplicate returns False for a fresh ledger with an unseen invoice_id.
          - After record("INV-001", ...), is_duplicate("INV-001") returns True.
          - load() after save() round-trips the ledger entries correctly.
          SAD:
          - is_duplicate(None) returns False always (Costco; no id to deduplicate).
          - record(None, ...) is a no-op: load() still returns an empty list.
          - is_duplicate on a ledger whose file is missing (path does not exist)
            returns False (does not raise -- fresh ledger is valid).

        Write tests/claims_tests/test_forms.py:
          HAPPY:
          - CLAIM_FONT_SIZES["2.day_phone."] == 7.
          - CLAIM_FONT_SIZES["3.total_claimed"] == 8.
          SAD (migration regression guard):
          - core.pdf_forms.DEFAULT_FONT_SIZES is empty (== {}). This test fails
            if someone accidentally re-adds Sun Life prefixes to core.
          - CLAIM_FONT_SIZES is NOT the same object as
            core.pdf_forms.DEFAULT_FONT_SIZES (import both and assert they are
            distinct dicts).

      Step 2 -- run the new tests:
        A pipeline reports the LAST command's status, so
        `unittest ... | grep | head` returns 0 even when the tests fail --
        a red suite would be recorded as a pass.  Capture the status first:

        PYTHONPATH="$(pwd)/src" .venv/bin/python -m unittest discover \
          -s tests -t . -p "test_*.py" -v > /tmp/claims-new-tests.log 2>&1; status=$?
        grep -E "test_rules|test_ledger|test_forms|test_packet|OK|FAIL|ERROR" \
          /tmp/claims-new-tests.log | head -60
        echo "UNITTEST_EXIT=$status"

        UNITTEST_EXIT must be 0.  Any other value means this stage FAILED:
        set "status": "failed" in your completion JSON and set all_green to
        false.  Recording the number while reporting success is not enough --
        the completion template pre-fills "success", so you must override it
        explicitly or a red test run reaches the human gate looking green.

      Step 3 -- run the FULL test suite (regression guard):
        make test > /tmp/receipt-claims-verify.log 2>&1; suite=$?
        grep -E "^Ran [0-9]+ tests" /tmp/receipt-claims-verify.log; ran=$?
        echo "SUITE_EXIT=$suite RAN_LINE=$ran"

        BOTH conditions are required for full_suite: "PASS":
          SUITE_EXIT must be 0  -- a suite with failing tests STILL prints
            "Ran N tests", so the line's presence alone proves only that the
            suite executed, not that it passed.
          RAN_LINE must be 0    -- no such line means the suite did not run
            at all, which a zero exit can also accompany (see CLAUDE.md on
            the make venv race).

        Neither alone is sufficient.  If either fails, full_suite is "FAIL".

      Step 4 -- CLI --help smoke tests:
        Capture each status; `cmd | head` reports head's exit, not the CLI's,
        so a broken CLI would smoke green.

          ./bin/claims --help > /tmp/c1.log 2>&1; c1=$?; head -3 /tmp/c1.log
          ./bin/claims fill --help > /tmp/c2.log 2>&1; c2=$?; head -3 /tmp/c2.log
          ./bin/claims --agentic --agentic-format json --agentic-compact \
            > /tmp/c3.log 2>&1; c3=$?
          python3 -c "import sys,json; json.load(open('/tmp/c3.log')); print('agentic JSON ok')"; c4=$?
          echo "CLAIMS_HELP_EXITS=$c1,$c2,$c3,$c4"

        All four must be 0.  Any non-zero is a FAIL: set cli_smoke fields to
        "FAIL", all_green to false, and this stage's status to "failed".

        ./bin/receipts shipped with receipts-domain-build; the full-suite run
        is its regression guard, so it is not re-smoked here.

      Step 5 -- qlty lint (if run_qlty == "true"):
        ~/.qlty/bin/qlty check \
          src/core/pdf_read.py src/core/pdf_forms.py \
          src/receipts/models.py src/receipts/extract.py \
          src/receipts/sidecar.py src/receipts/cli.py \
          src/receipts/parsers/jane.py src/receipts/parsers/costco.py \
          src/receipts/parsers/generic.py \
          src/claims/models.py src/claims/ledger.py src/claims/rules.py \
          src/claims/forms.py src/claims/packet.py src/claims/cli.py 2>&1
        If auto-fixable issues, run: ~/.qlty/bin/qlty check --fix <file>
        Re-run once to confirm clean.

      Step 6 -- render-verification of a FILLED CLAIM, not just a receipt.
        Rendering a receipt fixture only exercises PdfDocument.render_png; it
        proves nothing about fill_claim_form() or build_packet(), which are
        what this workflow actually adds.  A broken fill/merge/render path
        would sail through such a check.

        Build a synthetic claim end to end and inspect the result:

          1. Build the Receipt from a FIXTURE FILE, not from thin air:
               extract("tests/receipts_fixtures/jane_clinic.pdf")
             build_packet() merges the receipt's PAGES into the packet, so a
             Receipt with source_path=None has nothing to merge and the page
             assertion in step 3 cannot mean anything.  The fixture is
             synthetic, so this stays within the privacy boundary.

          2. Wrap it in a Claim -- build_packet(claim, template_path, out_dir)
             takes a Claim, not a Receipt:
               Claim(receipt=<from step 1>, claimant="Pat Doe",
                     plan_year=2026, plan_year_start_month=1)

          3. Call build_packet() against the fixed generated template
             (tests/receipts_fixtures/blank_claim_template.pdf), NOT against
             a path read from the manifest -- see the note below.  Do NOT
             re-search, and never fall back to a personalised form.
          4. Assert on the produced packet:
             - page_count == form pages + receipt pages
             - the claimant-row region renders non-blank:
                 pix.color_topusage() returns a (ratio, colour) tuple;
                 assert ratio < 0.99 (a blank region returns exactly 1.0)
             - the PNG decodes and its dimensions match the requested clip

        Use the fixed generated template directly:

          tests/receipts_fixtures/blank_claim_template.pdf

        Regenerate it first if absent (build_claim_template.py is idempotent).

        Do NOT take the path from blank_template_path in the manifest and
        pass it to build_packet() unchecked.  A stale or wrong manifest would
        then send this stage at an arbitrary PDF -- possibly a real
        prefilled claim -- with no blank check in front of it, which is the
        privacy boundary reopened through a data channel rather than a
        parameter.  The manifest value is useful only as a cross-check:

          if manifest["blank_template_path"] not in
             (None, "tests/receipts_fixtures/blank_claim_template.pdf"):
              record packet_render_check: "FAIL -- manifest names an
              unexpected template" and do not open it.

        Do NOT search for a template, and do NOT substitute a receipt render
        and call it a packet check; that is the substitution this step exists
        to prevent.

        If the generator cannot produce the template, record
        packet_render_check: "SKIPPED -- template generator failed".  That is
        a defect worth reporting, not a normal outcome: migrate-font-sizes
        reports status failed in the same situation, and the orchestrator
        skips downstream stages of a failed required stage, so this branch is
        reached mainly when a human resumes a halted run.

        Report byte counts and page counts only -- never log PDF content or
        field values.

      Step 7 -- write {workspace}/outputs/verify-results.json:
        {
          "new_tests_written": [],
          "new_tests_passed": "PASS|FAIL",
          "full_suite": "PASS|FAIL",
          "full_suite_ran_count": 0,
          "cli_smoke": {
            "receipts_help": "PASS|FAIL",
            "receipts_agentic": "PASS|FAIL",
            "claims_help": "PASS|FAIL",
            "claims_agentic": "PASS|FAIL"
          },
          "qlty_status": "PASS|ISSUES|SKIPPED",
          "packet_render_check": "PASS|FAIL|SKIPPED",
          "all_green": false
        }

        all_green is DERIVED, never a literal.  Set it true only when every
        one of these holds:
          new_tests_passed == "PASS"  (UNITTEST_EXIT was 0)
          full_suite       == "PASS"  (SUITE_EXIT 0 AND the Ran line present)
          every cli_smoke field       == "PASS"
          qlty_status      in ("PASS", "SKIPPED")
          packet_render_check         == "PASS"
        SKIPPED does NOT count as green here.  qlty may be skipped by a
        parameter, but a skipped packet render means this workflow's own
        merge-and-render path was never exercised -- the one thing it adds.
        A resumed run that still has no approved template must not reach the
        human gate claiming a green verification.
        If any is false, set all_green false AND report this stage's status as
        "failed".  The completion template pre-fills "success", so a red run
        reaches the human gate looking green unless you override it.
    agent:
      role: code-writer
      model: sonnet
      tools: [Read, Write, Edit, Bash]
      access: read-write
    outputs:
      - name: verify
        mode: generate
        description: >
          Verification results at {workspace}/outputs/verify-results.json.
    required: true
    writes_to:
      - outputs/verify-results.json

  # ===========================================================================
  # S10: Human gate -- final review before Brian merges
  # ===========================================================================

  - name: human-gate
    kind: propose
    human_gate: true
    depends_on: [verify]
    reads_from: [verify, integration-review, preflight-check]
    description: >
      Present the full build summary and confirm the branch location before
      Brian decides to merge.  Nothing is pushed to main; nothing is auto-merged.

      Step 1 -- collect results:
        Read {workspace}/outputs/verify-results.json.
        Read {workspace}/outputs/integration-review.json.
        Read {workspace}/outputs/claims-manifest.json.
        Read {workspace}/outputs/preflight.json.
        Read {workspace}/outputs/font-size-migration.json -- in particular
        migration_safe and shipped_form_equivalence, so the gate reports
        whether the migration was PROVEN or merely unverified.

        (There is no validation/critique.md in this workflow: the interface
        critique belongs to receipts-domain-build, which has already merged.)

      Step 2 -- identify branch and worktree:
        git worktree list 2>&1
        git branch --show-current 2>&1

      Step 3 -- write {workspace}/outputs/human-gate-summary.md:

        ## Receipt/Claims Domain Build -- Final Summary

        ### What Was Built
        - src/core/pdf_read.py      -- PdfDocument + PdfParser ABC (OCR fallback)
        - src/core/pdf_forms.py     -- MIGRATED: DEFAULT_FONT_SIZES emptied;
                                       Sun Life constants moved to claims/forms.py
        - src/receipts/models.py    -- Receipt, LineItem dataclasses
        - src/receipts/sidecar.py   -- .amount.json fallback (last resort)
        - src/receipts/parsers/     -- jane, costco, generic
        - src/receipts/extract.py   -- dispatch (jane -> costco -> generic -> sidecar)
        - src/receipts/cli.py       -- CLIApp with agentic schema
        - src/claims/ledger.py      -- dedup by invoice_id across all submissions
        - src/claims/rules.py       -- $0 exclusion, duplicate detection, plan-year
        - src/claims/forms.py       -- CLAIM_FONT_SIZES + fill_claim_form
        - src/claims/packet.py      -- merge + render-verification PNGs
        - src/claims/cli.py         -- CLIApp with agentic schema
        - bin/receipts, bin/claims  -- registered in _wrappers.yaml

        ### Core Invariants Preserved
        - pdf_forms /DA written as parenthesized string (pdf_string/format_da)
        - pdf_forms checkbox written per-xref, not by field name
        - Field values escaped with pdf_string() before writing

        ### Font-Size Migration
        (confirm CLAIM_FONT_SIZES in claims/forms.py; DEFAULT_FONT_SIZES = {} in core)

        ### Test / Lint Status
        (from verify-results.json)

        ### Integration Review
        (blocking count; all resolved?)

        ### Branch and Worktree
        (from Step 2)
        To merge: git checkout <your-branch> && git merge <this-branch>
        To open a PR: /open-pr from the branch above

      Present the summary and ask:
        A) Looks good -- I will merge the branch manually
        B) Something needs fixing -- describe the issue
        C) Abandon -- the branch and worktree remain available

      Write the decision to {workspace}/outputs/human-gate-decision.md.
    agent:
      role: doc-writer
      model: sonnet
      tools: [Read, Bash, Write]
      access: read-write
    required: true
    writes_to:
      - outputs/human-gate-summary.md
      - outputs/human-gate-decision.md
