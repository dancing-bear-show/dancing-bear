meta:
  name: mail_familiarize
  version: 2

# capsule-only familiarize policy
identity:
  name: Mail Assistant
  summary: Gmail/Outlook CLI for labels, filters/rules, signatures

familiarize_policy: capsule_only

read_order:
  - mail/.llm/DOMAIN_MAP.md

capsules_optional:
  - mail/.llm/CONTEXT.md
  - .llm/PR_POLICIES.yaml

unified_clis:
  - mail-assistant
  - llm

auth_pointer:
  file: .llm/CONTEXT.md
  section: Development Rules (do)

imperatives_quickstart:
  - ./bin/mail-assistant --agentic
  - ./bin/llm domain-map --write .llm/DOMAIN_MAP.md

directory_map:
  core: mail
  bin: bin

notes:
  - Use profiles in ~/.config/credentials.ini (avoid --credentials/--token)
  - Unified filters at ~/.config/dancing-bear/filters_unified.yaml (outside checkout; config/filters_unified.example.yaml is the tracked template); derive provider configs, do not hand-edit outputs
  - Plan → Apply → Verify for both Gmail and Outlook flows
